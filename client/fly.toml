# Fly-конфиг веб-аппы: ОДИН nginx на двух клиентов — старый (v1) на «/», новый (client2) на «/v2/».
# Образ приезжает готовым из GHCR, собирать Fly ничего не должен:
#
#   scripts/deploy.sh web                        # последний образ с main
#   IMAGE_TAG=sha-abc1234 scripts/deploy.sh web  # конкретная сборка (она же — откат)
#
# Раньше здесь лежали [build.args] с адресом сервера, и из-за них образ был привязан к
# окружению: выкатить тот же артефакт на стенд означало пересобрать его, то есть выкатить
# другой. Теперь адрес приезжает в рантайме через [env] ниже (client/src/runtimeConfig.ts),
# а образ один на все окружения. Побочный эффект: порядок «сервер раньше клиента» больше
# не обязателен — вшивать в бандл нечего.
#
# Секция [build] пустая намеренно: без неё flyctl идёт искать Dockerfile в контексте.

app = "crusade-deck-client"
primary_region = "fra"

[build]

[env]
  # Их читает deploy/runtime-config.sh и кладёт в /config.js при старте контейнера.
  # wss:// и https:// без исключений: HTTPS-страница не откроет незащищённый сокет.
  APP_SERVER_URL = "wss://crusade-deck-server.fly.dev"
  APP_HTTP_URL = "https://crusade-deck-server.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
