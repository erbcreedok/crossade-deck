# SPA-фоллбэк: ссылки-приглашения вида /r/КОД должны отдавать index.html при
# прямой загрузке, а не 404 — без этого перезагрузка страницы в комнате падает.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Адрес сервера в рантайме (client/src/runtimeConfig.ts). В ЭТОТ образ (docker-compose)
    # entrypoint не кладётся — сюда попадает пустая заглушка из public/, и адрес остаётся
    # вшитым через VITE_*. Правило всё равно нужно: файл подменяем монтированием, а
    # закэшированная копия означала бы поход на старый адрес после переезда сервера.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
