<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Crossade — hub</title>
    <!--
      The FONTS are declared here and nowhere else. This is a declaration, not an interface: the hub
      itself is drawn entirely by the engine, and a face has to be announced to the page before
      anything can measure or draw it.

      All three carry Kazakh (Әә Ғғ Ққ Ңң Өө Ұұ Үү Һһ Іі). The `text=` half of the query is not
      decoration either — a font service ships subsets by codepoint range, so asking without naming
      the letters fetches Latin alone and everything else falls back in silence.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Handjet&family=Press+Start+2P&family=Tiny5&display=swap"
      rel="stylesheet"
    />
    <style>
      /* NO SYSTEM SELECTION ANYWHERE ON THE PAGE. A long press on the canvas is a drag or a throw,
         never a text selection — iOS answers a held finger with its own magnifier loupe unless told
         otherwise, and that loupe fired on every card carried in the hub, the lobby and Klondike
         alike (one page, one shell — see the region comment below). */
      html, body {
        margin: 0; height: 100%; background: #173d2d; overflow: hidden;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      /*
        TWO REGIONS, AND THE HUB'S NEVER CHANGES SIZE.

        `#chrome` is the hub's own canvas and stays the full viewport for the whole session;
        `#stage` is the running game's and covers everything below the bar. The game sits ON TOP of
        the hub's lower part, which leaves the top strip — the bar — visible and clickable.

        Sizing it this way is not a preference. A host measures its container with
        `getBoundingClientRect`, and a container that changes size behind CSS can report the OLD
        rectangle: the hub then draws its bar to one geometry and hit-tests against another, so the
        control is visible and dead. Nothing here resizes, so nothing can disagree.

        `data-mode` therefore toggles ONE thing — whether the game's region exists at all. With it
        gone, presses reach the shelf; with it there, they reach the game, except in the strip.
      */
      #shell { position: absolute; inset: 0; }
      #chrome { position: absolute; inset: 0; touch-action: none; }
      #stage { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; touch-action: none; }
      #shell[data-mode="hub"] #stage { display: none; }

      /* Only inside a Telegram webview, only over a running table — a Mini App is not registered
         yet, so the plain link a player tapped opened here instead of a real browser. */
      #tg-banner {
        display: none;
        position: absolute; left: 0; right: 0; top: 56px; z-index: 5;
        align-items: center; justify-content: space-between; gap: 8px;
        padding: 6px 10px; background: #0b241a; color: #f4e8c1;
        font: 13px/1.3 system-ui, sans-serif;
      }
      #shell[data-telegram="1"][data-mode="play"] #tg-banner { display: flex; }
      #tg-banner button {
        flex: none; border: none; border-radius: 6px; padding: 4px 10px;
        background: #f4e8c1; color: #0b241a; font: inherit; font-weight: 600;
      }

      /*
        THE FIRST THING ON THE SCREEN, AND THE CHEAPEST — a red line running the path of a cross.

        It lives HERE, in the document, and not in a module, and that is the whole of why it works:
        this is a few hundred bytes of markup the browser already has when it paints the first frame.
        A loading screen shipped as JavaScript cannot appear until the JavaScript has arrived, which
        is most of what it exists to cover — and the hub's own card faces are 52 files, so the
        heaviest thing on this page would be waiting on the wire for its own waiting screen.

        Nothing here is fetched: no font, no image, one inline path. `pathLength="1"` lets the dash
        be written in fractions of the outline instead of in user units, so the line's speed does
        not change the day the cross is redrawn a different size.
      */
      #boot {
        position: absolute; inset: 0; z-index: 10;
        display: grid; place-items: center;
        background: #173d2d; transition: opacity 220ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot svg { width: 96px; height: 96px; }
      /*
        ONE LINE AND NOTHING UNDER IT. There was a faint green outline beneath, so the line had a
        path to run along; the owner's answer was that the path is what the line is FOR — a track
        drawn under it gives the shape away before the line has earned it.
      */
      #boot .line {
        fill: none; stroke: #e0483f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 0.05 1; animation: crusade 800ms infinite;
      }
      /*
        A STROKE THAT GROWS, TRAVELS, AND GATHERS ITSELF IN — three moves, not one.

        BOTH ENDS MOVE, which is why both the dash and its offset are animated: the dash is HOW LONG
        the stroke is, the offset is WHERE ALONG THE OUTLINE it currently lies. Everything is written
        in fractions of the outline (`pathLength="1"`), so `0.4` is two fifths of the cross whatever
        size it is drawn at, and the gap is a whole outline wide so only ever one stroke shows.

          0 → 45%   the head runs ahead and the tail stays home: the stroke grows to two fifths;
         45 → 80%   it keeps that length and travels, the head reaching the end of the outline;
         80 → 100%  the head is home, the tail comes in after it — down to a twentieth.

        THE GROWING IS THE SLOW PART, and it is slow by ARITHMETIC rather than by feel: the head
        covers 0.35 of the outline while growing and 0.60 while travelling, in 45% and 35% of the
        loop — so it moves better than twice as fast once the stroke is up to length. Rebalancing
        the phases is what makes that true; an easing curve alone only borrows speed from one end of
        a phase and pays it back at the other.

        AND THE NEXT TURN STARTS AT A TWENTIETH, not at nothing: the stroke never disappears, it is
        back at the crown already the length it ended at, which is what makes the loop read as one
        line going round and round rather than a line being drawn again and again.

        Each phase carries its own easing, and they are real curves rather than the CSS keywords:
        the growth eases in AND out (it is the move the eye follows, so it starts and ends softly),
        the travel is dead steady, and the gathering eases to a stop. One timing function over the
        whole 800ms would rush the first move and drag the last.
      */
      @keyframes crusade {
        0%   { stroke-dasharray: 0.05 1; stroke-dashoffset: 0;     animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
        45%  { stroke-dasharray: 0.40 1; stroke-dashoffset: 0;     animation-timing-function: linear; }
        80%  { stroke-dasharray: 0.40 1; stroke-dashoffset: -0.60; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
        100% { stroke-dasharray: 0.05 1; stroke-dashoffset: -0.95; }
      }
      /* A player who asked for stillness gets the cross, drawn, and no drawing of it. */
      @media (prefers-reduced-motion: reduce) {
        #boot .line { animation: none; stroke-dasharray: none; }
      }
    </style>
  </head>
  <body>
    <!-- Removed by `main.ts` once the shelf has actually been painted — never on a timer of its own.
         The cross is the one in the name: Crossade, a crusade's cross, traced by a red line. -->
    <div id="boot">
      <!--
        THE CROSS PATTÉE FROM THE DESIGN PROJECT — the crusader's cross, arms flaring out to their
        tips, not a plus. There it is drawn as two overlapping octagons (a vertical arm and a
        horizontal one) with a half-size `a`, a waist `w = .16s` and a flared tip `f = .30s`; a line
        has to run the OUTLINE of the two together, so the same numbers are written here as the
        points of their union, clockwise.

        IT STARTS AT THE TOP, IN THE MIDDLE. The outline's own first corner is the top-LEFT of the
        upper arm, and a line growing from there begins off to one side and finishes by creeping
        back at it — lopsided at both ends. So the top edge is cut in half at (50,0): the line
        leaves the crown, goes all the way round, and the closing stroke brings it home to the
        same point it left from.
      -->
      <svg viewBox="-8 -8 116 116" aria-hidden="true">
        <path class="line" pathLength="1" d="M50 0 L80 0 L66 34 L100 20 L100 80 L66 66 L80 100 L20 100 L34 66 L0 80 L0 20 L34 34 L20 0 Z" />
      </svg>
    </div>
    <div id="shell" data-mode="hub">
      <div id="chrome"></div>
      <div id="stage"></div>
      <div id="tg-banner">
        <span>Открой в Safari/Chrome — там удобнее</span>
        <button id="tg-banner-open" type="button">Открыть</button>
      </div>
    </div>
    <!-- Harmless outside Telegram: it defines `window.Telegram.WebApp` when the page is opened as
         a Mini App and does nothing at all in a plain browser tab. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
