<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Песочница 3D</title>
  <style>
    /* Чёлка: у браузера — `env`, у Telegram во весь экран — его переменные (своя шапка поверх чёлки). */
    :root { --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px)); --safe-top: calc(max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px)); }
    html, body { margin: 0; height: 100%; overscroll-behavior: none; background: #0a1511; color: #f5ead0; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
    .screen { position: fixed; inset: 0; }
    .screen.off { visibility: hidden; pointer-events: none; }
    .stage { position: absolute; inset: 0; touch-action: none; }
    /* Окно «глазами другого»: тот экран, которым сейчас не управляю, — рядом с моим, только смотреть. */
    .screen.aside { inset: auto; top: calc(64px + var(--safe-top)); right: 8px; width: 38vw; height: 38vh; z-index: 20; overflow: hidden; pointer-events: none;
      border-radius: 12px; border: 3px solid var(--who, #888); box-shadow: 0 6px 0 rgba(11,7,4,.5); background: #0a1511; }
    .screen.aside > :not(.stage) { display: none; }
    .screen.aside::before { content: attr(data-who); position: absolute; left: 6px; top: 6px; z-index: 5; padding: 3px 7px; border-radius: 7px;
      font: 400 11px 'Tiny5', monospace; color: #0b0704; background: var(--who, #888); }
    #note { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
    #note[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="screens"></div>
  <!-- Экран загрузки — разметкой, чтобы он был виден до первого скрипта; тот же, что `loader3dMarkup` в src/loader.ts (сверяет loader-check.mjs). -->
  <style id="crossade-loader3d">
.crossade-loader3d { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: #173d2d; transition: opacity 220ms ease; touch-action: none; }
.crossade-loader3d.gone { opacity: 0; pointer-events: none; }
.crossade-loader3d canvas { width: 132px; height: 132px; display: block; }
.crossade-loader3d .said { font: 600 13px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #cdb98f; }
</style><div class="crossade-loader3d" data-baked><svg class="slot" viewBox="-27 -27 154 154" width="132" height="132" aria-hidden="true"><path d="M50 0 L80 0 L66 34 L100 20 L100 80 L66 66 L80 100 L20 100 L34 66 L0 80 L0 20 L34 34 L20 0 Z" fill="#e0483f"/></svg><div class="said">Стол собирается</div></div>
  <div id="note" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
