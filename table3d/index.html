<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Песочница 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1511; color: #f5ead0; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #hud button { font: inherit; font-size: 13px; color: #f5ead0; background: rgba(20,30,26,.85); border: 1px solid #3c5245; border-radius: 999px; padding: 6px 12px; }
    #hud .crew summary { list-style: none; cursor: pointer; font-size: 13px; background: rgba(20,30,26,.85); border: 1px solid #3c5245; border-radius: 999px; padding: 6px 12px; }
    #hud .crew summary::-webkit-details-marker { display: none; }
    #hud .crew[open] > div { position: absolute; left: 12px; right: 12px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(10,21,17,.95); border: 1px solid #3c5245; border-radius: 12px; }
    #hud .said { align-self: center; color: #9aa3a1; font-size: 12px; }
    #note { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
    #note[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud"></div>
  <div id="note">Стол собирается…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
