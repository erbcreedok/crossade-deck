<!--
  Тот же Handjet, что подключает index.html приложения. Без него канвас молча врёт: Pixi печёт
  текст в текстуру ОДИН раз при создании, ensureFonts() ждёт document.fonts.load("16px Handjet"),
  а если объявления шрифта на странице нет — ждать нечего, и все подписи запекаются фолбэком с
  чужими метриками. Каталог, который показывает не ту типографику, хуже отсутствующего.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Handjet&display=swap" rel="stylesheet" />

<!--
  ФОН СТРАНИЦЫ — «прозрачность» шахматкой, как в редакторах картинок.

  Раньше он был того же цвета, что сукно внутри канваса (#2f3d34), и это скрывало ровно то, что
  нужно видеть: где канвас кончается. Витрина, обрезанная по краю, выглядела точно так же, как
  витрина, которой просто много места, — и обрезку на телефоне заметить было нечем.

  Шахматка живёт на <html>, а не на <body>: аддон «backgrounds» пишет фон инлайном в body, и
  выбранный там «transparent» гасит только цветовой слой — картинка снизу остаётся видна.
-->
<!--
  OVERSCROLL — гасим навигацию браузера «назад/вперёд» двупальцевым горизонтальным жестом тачпада.
  Без этого край жеста над стеком уходит в историю браузера: спред-пан на ноуте дёргается, потому
  что браузер отъедает часть движения под свой rubber-band/свайп. `overscroll-behavior` на КОРНЕ
  ифрейма обрывает цепочку overscroll к родителю — свайп-навигация не запускается. Ставится на
  превью, а не на канвас: жест ловит документ ифрейма раньше, чем канвас.
-->
<style>
  html, body {
    overscroll-behavior: none;
  }
  html {
    background-color: #e9e9e9;
    background-image:
      linear-gradient(45deg, #c9c9c9 25%, transparent 25%, transparent 75%, #c9c9c9 75%),
      linear-gradient(45deg, #c9c9c9 25%, transparent 25%, transparent 75%, #c9c9c9 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }
  @media (prefers-color-scheme: dark) {
    html { background-color: #2b2b2b; background-image:
      linear-gradient(45deg, #3a3a3a 25%, transparent 25%, transparent 75%, #3a3a3a 75%),
      linear-gradient(45deg, #3a3a3a 25%, transparent 25%, transparent 75%, #3a3a3a 75%); }
  }
</style>
