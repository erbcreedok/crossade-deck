# Статика сторибука. SPA-фоллбэка тут НЕТ намеренно: Storybook маршрутизируется query-строкой
# (/?path=/story/...), все реальные адреса — существующие файлы (index.html, iframe.html, ассеты).
# Фоллбэк только маскировал бы опечатку в пути под пустую страницу вместо честного 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Хэш в имени файла — можно кэшировать навсегда; index.html и iframe.html хэша не имеют,
    # и без этого правила браузер показывал бы вчерашний каталог после выкатки.
    location ~* \.(js|css|woff2?|png|svg|jpg|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
