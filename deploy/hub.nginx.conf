# Статика хаба. SPA-фоллбэка НЕТ намеренно: у хаба один адрес — корень, а игры он подгружает
# ленивыми чанками, то есть настоящими файлами с хэшем в имени. Фоллбэк маскировал бы опечатку
# в пути под пустую страницу вместо честного 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Хэш в имени файла — кэшируется навсегда; index.html хэша не имеет, и без этого правила
    # браузер показывал бы вчерашний хаб после выкатки.
    location ~* \.(js|css|woff2?|png|svg|jpg|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
