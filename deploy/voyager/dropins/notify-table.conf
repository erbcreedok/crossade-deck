# Voyager сам говорит хозяину, когда стол включился и выключился. Ставится как ~/.config/systemd/user/crossade-table.service.d/notify.conf
[Service]
ExecStartPost=-%h/.local/node/bin/node %h/repo/scripts/node-notify.mjs Voyager "стол включён"
ExecStopPost=-%h/.local/node/bin/node %h/repo/scripts/node-notify.mjs Voyager "стол выключен"
