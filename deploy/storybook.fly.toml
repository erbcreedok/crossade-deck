# Fly-конфиг каталога UI-kit. Приложение создаётся один раз руками (образ уже готов, собирать
# Fly ничего не должен):
#   fly apps create crossade-deck-storybook
#   scripts/deploy.sh storybook
#
# Тома нет — сторибук чисто статический, переживать перезапуск нечему.

app = "crossade-deck-storybook"
primary_region = "fra"

# Секция пустая намеренно: образ приезжает готовым из GHCR (fly deploy --image), собирать
# на стороне Fly больше нечего. Без неё flyctl начинает искать Dockerfile в контексте.
[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Здоровье статики — это «nginx отвечает на корень». Отдельного /health заводить не за чем:
# отдать index.html он может ровно тогда же, когда и любой другой файл.
[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"
