# Раздача двух клиентов на одном домене:
#   /v2/*  → новый клиент (client2), SPA-фоллбэк на /v2/index.html;
#   /*     → старый клиент (client), SPA-фоллбэк на /index.html (в т.ч. ссылки-приглашения /r/КОД).
# Порядок важен: правило /v2/ должно стоять ДО общего /.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Адрес сервера в рантайме. Кэшировать НЕЛЬЗЯ: файл пишется при старте контейнера, и
    # закэшированная копия означала бы, что после переезда сервера браузер месяц ходит на
    # старый адрес, а образ при этом «правильный».
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Без завершающего слэша сабрут не подхватится общим правилом — редиректим на /v2/.
    location = /v2 {
        return 301 /v2/;
    }
    location /v2/ {
        try_files $uri $uri/ /v2/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
