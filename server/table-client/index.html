<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Стол</title>
<!-- ШРИФТ — СВОЙ И С НАШЕГО АДРЕСА: чужого начертания не видно ни мига. Пока Tiny5 не пришёл, текст не рисуется
     вовсе (`fonts-ok` ставится, когда оба файла загружены); стол ждёт его без потолка (`main.ts`). boot.test.ts. -->
<link rel="preload" href="fonts/tiny5-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/tiny5-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Tiny5; src: url(fonts/tiny5-cyrillic.woff2) format("woff2"); font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Tiny5; src: url(fonts/tiny5-latin.woff2) format("woff2"); font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  html:not(.fonts-ok) body, html:not(.fonts-ok) body * { color: transparent !important; -webkit-text-fill-color: transparent !important; text-shadow: none !important; }
</style>
<script>
  window.__fonts = Promise.all([document.fonts.load("16px Tiny5", "Ж"), document.fonts.load("16px Tiny5", "A")])
    .catch(function () {})
    .then(function () { document.documentElement.classList.add("fonts-ok"); });
</script>
<!-- SDK Telegram — в фоне: зависший на телефоне telegram.org иначе держит всю страницу (boot.test.ts). -->
<script>
  window.__tg = new Promise(function (done) {
    var s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-web-app.js";
    s.onload = s.onerror = function () { done(); };
    document.head.appendChild(s);
  });
</script>
<style>
  /*
    СТРАНИЦА НЕ ЕДЕТ НИКУДА: ни прокрутки, ни резинки, ни жестов браузера. В Mini App тянуть страницу
    вниз — значит закрыть приложение, а палец за столом тянет карту, стол или камеру, и никогда — окно.
  */
  /*
    `touch-action` СЧИТАЕТСЯ ПО ВСЕЙ ЦЕПОЧКЕ ПРЕДКОВ: `none` на body запрещал бы прокрутку и внутри окон
    поверх стола. Поэтому здесь `pan-y` — прокручивать нечего (страница без переполнения), зато окно
    настроек прокручивается пальцем; а стол ниже оставляет себе `none`, и карта тянется, как тянулась.
  */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0704; overscroll-behavior: none; touch-action: pan-y; }
  body { font: 400 13px Tiny5, monospace; color: #f5ead0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  /* Холсту CSS-размер нужен явно: без него он берёт ширину из атрибута — пиксели устройства. */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; }
  #note { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 16px; color: #cdb98f; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas></canvas>
  <div id="over"></div>
</div>
<div id="note" hidden></div>
<!-- ЗАГРУЗКА — В САМОЙ СТРАНИЦЕ: пока скрипт стола едет (туннель, холодный телефон), виден крест, а не
     чёрный фон. Строка — ровно `loadingMarkup("Загружаю стол")` из `look`; `boot.test.ts` сверяет её, скрипт подхватывает. -->
<style id="crossade-loading">
.crossade-loading {
  position: absolute; inset: 0; z-index: 7;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  background: #173d2d; transition: opacity 220ms ease;
  pointer-events: auto; touch-action: none;
}
.crossade-loading.gone { opacity: 0; pointer-events: none; }
.crossade-loading svg { width: 96px; height: 96px; }
.crossade-loading .line {
  fill: none; stroke: #e0483f; stroke-width: 5;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 0 1; animation: crusade 1000ms infinite;
}
.crossade-loading .said {
  font: 600 13px/1.2 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .14em; text-transform: uppercase; color: #cdb98f;
}
@keyframes crusade {
  0%    { stroke-dasharray: 0 1; stroke-dashoffset: 0;  stroke-opacity: 1; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
  40%   { stroke-dasharray: 1 1; stroke-dashoffset: 0;  animation-timing-function: linear; }
  50%   { stroke-dasharray: 1 1; stroke-dashoffset: 0;  animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
  89.5% { stroke-opacity: 1; }
  90%   { stroke-dasharray: 0 1; stroke-dashoffset: -1; stroke-opacity: 0; animation-timing-function: linear; }
  100%  { stroke-dasharray: 0 1; stroke-dashoffset: -1; stroke-opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .crossade-loading .line { animation: none; stroke-dasharray: none; }
}
</style><div class="crossade-loading" data-baked><svg viewBox="-8 -8 116 116" aria-hidden="true"><path class="line" pathLength="1" d="M50 0 L80 0 L66 34 L100 20 L100 80 L66 66 L80 100 L20 100 L34 66 L0 80 L0 20 L34 34 L20 0 Z"/></svg><div class="said">Загружаю стол</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
