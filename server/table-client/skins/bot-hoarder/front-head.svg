<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 38 82 L 62 82 L 60 92 L 40 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="87" x2="56" y2="87" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Bank Safe / Vault Head Main Body (#b3221f) -->
  <path d="M 22 18 L 78 18 L 84 24 L 84 76 L 78 82 L 22 82 L 16 76 L 16 24 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Recessed Safe Door Panel (#1d4f80) -->
  <rect x="22" y="24" width="56" height="52" rx="3" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <rect x="24" y="26" width="52" height="48" rx="2" fill="none" stroke="#f2c14e" stroke-width="1.4"/>

  <!-- Heavy Brass Corner Reinforcing Brackets with Rivets (#f2c14e) -->
  <polygon points="16,24 28,18 28,26 22,26 22,32 16,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="84,24 72,18 72,26 78,26 78,32 84,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="16,76 28,82 28,74 22,74 22,68 16,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="78" r="1.3" fill="#0b0704"/>
  <polygon points="84,76 72,82 72,74 78,74 78,68 84,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="78" r="1.3" fill="#0b0704"/>

  <!-- Brass Coin Slot («щель для монет») at Forehead (#f2c14e) -->
  <rect x="34" y="28" width="32" height="8" rx="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>
  <rect x="38" y="30.5" width="24" height="3" rx="1" fill="#0b0704"/>
  <!-- Gold Coin Peeking Out of Slot (#f2c14e) -->
  <path d="M 44 30.5 C 44 26, 56 26, 56 30.5 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="50" cy="28.5" r="1" fill="#b3221f"/>

  <!-- Squinting Miser Eyes («прищур») -->
  <!-- Left Squint Visor -->
  <polygon points="26,44 45,46 44,52 26,48" fill="#0b0704" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="28" y1="46" x2="43" y2="48" stroke="#f2c14e" stroke-width="2" stroke-linecap="round"/>
  <!-- Right Squint Visor -->
  <polygon points="74,44 55,46 56,52 74,48" fill="#0b0704" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="72" y1="46" x2="57" y2="48" stroke="#f2c14e" stroke-width="2" stroke-linecap="round"/>

  <!-- Vault Combination Dial (Center Face) -->
  <circle cx="50" cy="62" r="10" fill="#5d666e" stroke="#0b0704" stroke-width="2"/>
  <circle cx="50" cy="62" r="8" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="50" cy="62" r="5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <!-- Dial Numbers / Tick Marks -->
  <line x1="50" y1="54" x2="50" y2="56" stroke="#0b0704" stroke-width="1.4"/>
  <line x1="50" y1="68" x2="50" y2="70" stroke="#0b0704" stroke-width="1.4"/>
  <line x1="42" y1="62" x2="44" y2="62" stroke="#0b0704" stroke-width="1.4"/>
  <line x1="56" y1="62" x2="58" y2="62" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="50" cy="62" r="2" fill="#b3221f"/>

  <!-- Miniature Brass Padlock («замочек») hanging on Door Hasp -->
  <!-- Padlock Steel Shackle (#5d666e) -->
  <path d="M 64 68 C 64 62, 72 62, 72 68 L 72 73 L 64 73 Z" fill="none" stroke="#5d666e" stroke-width="2" stroke-linejoin="round"/>
  <!-- Padlock Brass Body (#f2c14e) -->
  <rect x="62" y="72" width="12" height="10" rx="1.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="68" cy="75.5" r="1.3" fill="#0b0704"/>
  <polygon points="67.5,75.5 68.5,75.5 69,79 67,79" fill="#0b0704"/>

  <!-- Woodcut Iron Texture Hatches -->
  <path d="M 18 38 L 22 36 M 17 48 L 22 46 M 18 58 L 22 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 82 38 L 78 36 M 83 48 L 78 46 M 82 58 L 78 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 28 76 L 34 74 M 40 76 L 46 74" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
</svg>
