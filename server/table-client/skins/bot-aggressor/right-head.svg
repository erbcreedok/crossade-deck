<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 40 82 L 62 82 L 60 92 L 42 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="87" x2="56" y2="87" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Backward-Swept Horn-Antenna («рога-антенны») -->
  <!-- Base (#1d4f80) swept from Temple back & up to Sharp Gold Tip (#f2c14e) -->
  <polygon points="46,30 24,14 28,10 52,24" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="24,14 16,6 22,8 28,10" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Aggressive Head Profile with Sloped Brow («скошенный лоб») (#b3221f) -->
  <!-- Forehead slopes steeply from (32,20) down to (82,42) -->
  <path d="M 30 20 L 82 42 L 84 52 L 78 70 L 58 84 L 28 78 L 20 54 L 22 28 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Gold Brow Ridge Trim on the Sloped Forehead (#f2c14e) -->
  <line x1="32" y1="20" x2="82" y2="42" stroke="#f2c14e" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Forehead Armor Facet (#1d4f80) -->
  <polygon points="38,26 72,40 68,48 38,36" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="50,30 64,37 58,41 46,34" fill="#f2c14e"/>

  <!-- Angry Red Visor Slit («злой красный визор») in Profile (x=72..84, y=44..52) -->
  <polygon points="72,44 84,43 84,52 70,52" fill="#0b0704" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="74,45 83,44 83,50 73,50" fill="#b3221f"/>
  <circle cx="78" cy="47.5" r="2" fill="#f2c14e"/>

  <!-- Sharp Predatory Jaw Wedge & Intake Teeth (#1d4f80 & #5d666e) -->
  <polygon points="68,56 82,54 78,70 60,82 56,66" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <!-- Chevron Intake Vent Gills (#5d666e & #f7f1e6) -->
  <line x1="72" y1="60" x2="80" y2="58" stroke="#f7f1e6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="70" y1="65" x2="78" y2="63" stroke="#f7f1e6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="66" y1="70" x2="74" y2="68" stroke="#f7f1e6" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Rear Exhaust Thruster Port in Profile (x=20..30, y=44..62) -->
  <polygon points="20,44 32,46 30,62 18,60" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="20" y1="52" x2="30" y2="54" stroke="#f2c14e" stroke-width="1.8"/>

  <!-- Temple Armor Pivot Boss (#f2c14e) -->
  <circle cx="48" cy="46" r="4.5" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="48" cy="46" r="2" fill="#f2c14e"/>

  <!-- Woodcut Texture Hatches on Angular Plates -->
  <path d="M 28 36 L 34 40 M 27 46 L 33 50 M 28 66 L 34 70" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 52 74 L 58 77 M 54 80 L 60 83" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
</svg>
