<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 40 80 L 60 80 L 58 92 L 42 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="86" x2="56" y2="86" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Horn-Antennas («рога-антенны») extending diagonally up -->
  <!-- Left Horn Base (#1d4f80) & Sharp Tip (#f2c14e) -->
  <polygon points="26,28 14,12 20,10 32,24" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="14,12 8,6 18,8 20,10" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Right Horn Base (#1d4f80) & Sharp Tip (#f2c14e) -->
  <polygon points="74,28 86,12 80,10 68,24" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="86,12 92,6 82,8 80,10" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Aggressive Wedge Head Silhouette (#b3221f) -->
  <path d="M 32 18 L 68 18 L 84 32 L 82 62 L 50 84 L 18 62 L 16 32 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Sloped Brow Plate («скошенный лоб») cutting down in acute V-shape -->
  <polygon points="32,18 68,18 78,32 50,42 22,32" fill="#b3221f" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Gold Hazard / Accent Chevron on Forehead (#f2c14e) -->
  <polygon points="40,22 60,22 50,34" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="44,22 56,22 50,29" fill="#1d4f80"/>

  <!-- Angry Frowning Brow Rim (#f2c14e) -->
  <polyline points="20,38 50,45 80,38" fill="none" stroke="#f2c14e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Angry Red Visor Cavity («злой красный визор») (#0b0704) -->
  <polygon points="22,40 50,48 78,40 74,52 50,58 26,52" fill="#0b0704" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Glowing Furious Red Visor Beams (#b3221f) -->
  <!-- Left Eye Slit -->
  <polygon points="26,43 48,49 46,54 28,50" fill="#b3221f" stroke="#b3221f" stroke-width="1"/>
  <!-- Right Eye Slit -->
  <polygon points="74,43 52,49 54,54 72,50" fill="#b3221f" stroke="#b3221f" stroke-width="1"/>

  <!-- Intense Golden Focal Core Nodes (#f2c14e) in the Slits -->
  <circle cx="36" cy="47" r="2.2" fill="#f2c14e"/>
  <circle cx="64" cy="47" r="2.2" fill="#f2c14e"/>

  <!-- Angular Cheek Armor Plates (#1d4f80) -->
  <polygon points="18,52 28,52 34,68 20,62" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="24" cy="58" r="1.3" fill="#f2c14e"/>
  <polygon points="82,52 72,52 66,68 80,62" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="76" cy="58" r="1.3" fill="#f2c14e"/>

  <!-- Acute Predatory Jaw & Intake Grille Teeth (#5d666e & #1d4f80) -->
  <polygon points="34,64 66,64 50,82" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Chevron Intake Vent Teeth (#f7f1e6 & #0b0704) -->
  <polygon points="40,66 60,66 50,72" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <line x1="43" y1="67" x2="49" y2="70" stroke="#f7f1e6" stroke-width="1.6"/>
  <line x1="57" y1="67" x2="51" y2="70" stroke="#f7f1e6" stroke-width="1.6"/>
  <polygon points="44,73 56,73 50,78" fill="#5d666e" stroke="#0b0704" stroke-width="1.2"/>
  <line x1="46" y1="74" x2="50" y2="76" stroke="#f7f1e6" stroke-width="1.4"/>
  <line x1="54" y1="74" x2="50" y2="76" stroke="#f7f1e6" stroke-width="1.4"/>

  <!-- Woodcut Hatches -->
  <path d="M 22 28 L 26 24 M 20 34 L 25 31" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 78 28 L 74 24 M 80 34 L 75 31" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 28 64 L 34 68 M 72 64 L 66 68" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
