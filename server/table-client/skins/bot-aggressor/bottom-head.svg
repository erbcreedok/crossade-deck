<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Horn-Antenna Tips visible at Bottom Corners («рога-антенны») -->
  <polygon points="18,52 8,82 14,84 24,56" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>
  <polygon points="8,82 6,90 14,88 14,84" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <polygon points="82,52 92,82 86,84 76,56" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>
  <polygon points="92,82 94,90 86,88 86,84" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Aggressive Head Silhouette from Below (#b3221f) -->
  <!-- Top = Acute Jaw / Chin Tip (y~18), Bottom = Back / Nape (y~82) -->
  <path d="M 50 18 L 76 38 L 82 58 L 68 82 L 32 82 L 18 58 L 24 38 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Underside of Acute Jaw & Intake Gills at Top (y=18..36) (#1d4f80) -->
  <polygon points="50,18 70,36 30,36" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <!-- Chevron Intake Vent Gills (#5d666e & #f7f1e6) -->
  <polygon points="50,22 62,34 38,34" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <line x1="43" y1="28" x2="57" y2="28" stroke="#f7f1e6" stroke-width="1.6"/>
  <line x1="40" y1="32" x2="60" y2="32" stroke="#f7f1e6" stroke-width="1.6"/>

  <!-- Armored Cheek Flanges (#1d4f80) -->
  <polygon points="20,44 32,40 30,68 18,62" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <polygon points="80,44 68,40 70,68 82,62" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>

  <!-- Central Neck Connector Hub for Mounting to Body Collar -->
  <circle cx="50" cy="54" r="16" fill="#5d666e" stroke="#0b0704" stroke-width="2.5"/>
  <circle cx="50" cy="54" r="13" fill="none" stroke="#f2c14e" stroke-width="1.8"/>
  <!-- Central Void Socket (#0b0704) -->
  <circle cx="50" cy="54" r="8" fill="#0b0704"/>
  <rect x="48.5" y="44" width="3" height="4" fill="#0b0704"/>

  <!-- Gold Anchor Screws (#f2c14e) -->
  <circle cx="39" cy="43" r="1.5" fill="#f2c14e"/>
  <circle cx="61" cy="43" r="1.5" fill="#f2c14e"/>
  <circle cx="39" cy="65" r="1.5" fill="#f2c14e"/>
  <circle cx="61" cy="65" r="1.5" fill="#f2c14e"/>

  <!-- Nape Armor Flange at Bottom (y=74..82) (#5d666e) -->
  <polygon points="34,74 66,74 62,82 38,82" fill="#5d666e" stroke="#0b0704" stroke-width="1.6"/>

  <!-- Woodcut Hatches -->
  <path d="M 24 50 L 30 48 M 22 58 L 28 56 M 24 66 L 30 64" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 76 50 L 70 48 M 78 58 L 72 56 M 76 66 L 70 64" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round"/>
</svg>
