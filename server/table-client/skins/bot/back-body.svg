  <path d="M 38 18 C 44 14, 76 14, 82 18 L 86 28 C 76 34, 44 34, 34 28 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 44 20 C 52 23, 68 23, 76 20" stroke="#f2c14e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Mechanical Spine / Exhaust Heat-Sink Panel (#1d4f80) -->
