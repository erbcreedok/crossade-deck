  <path d="M 112 34 L 104 38 L 102 52 L 110 50 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Gold Sleeve Garters (#f2c14e) -->
  <rect x="9" y="44" width="10" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <rect x="101" y="44" width="10" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>

