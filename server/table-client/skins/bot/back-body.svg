  <circle cx="50" cy="32" r="1.5" fill="#f2c14e"/>
  <circle cx="50" cy="66" r="1.5" fill="#f2c14e"/>
  <circle cx="70" cy="32" r="1.5" fill="#f2c14e"/>
  <circle cx="70" cy="66" r="1.5" fill="#f2c14e"/>

