  <line x1="55" y1="40" x2="65" y2="40" stroke="#0b0704" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="55" y1="46" x2="65" y2="46" stroke="#0b0704" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="55" y1="52" x2="65" y2="52" stroke="#0b0704" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="55" y1="58" x2="65" y2="58" stroke="#0b0704" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="55" y1="64" x2="65" y2="64" stroke="#0b0704" stroke-width="2.2" stroke-linecap="round"/>

