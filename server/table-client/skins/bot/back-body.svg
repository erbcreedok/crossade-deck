  <circle cx="18" cy="28" r="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="102" cy="28" r="7" fill="#5d666e" stroke="#0b0704" stroke-width="2"/>
  <circle cx="102" cy="28" r="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

