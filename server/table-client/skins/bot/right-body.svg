<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Back Jacket Drape / Coat Tail (#b3221f) -->
  <path d="M 50 18 L 28 32 L 24 100 L 60 100 L 58 38 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Back Coat Tail Gold Border (#f2c14e) & Blue Lining (#1d4f80) -->
  <path d="M 28 32 L 24 100 L 32 100 L 38 38 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <path d="M 50 18 L 28 32 L 24 100" fill="none" stroke="#f2c14e" stroke-width="2.4"/>

  <!-- Mechanical Spine Heat Sink on Back Profile (#1d4f80) -->
  <path d="M 36 34 L 44 32 L 40 68 L 32 70 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="33" y1="40" x2="41" y2="39" stroke="#0b0704" stroke-width="2"/>
  <line x1="32" y1="48" x2="40" y2="47" stroke="#0b0704" stroke-width="2"/>
  <line x1="31" y1="56" x2="39" y2="55" stroke="#0b0704" stroke-width="2"/>
  <line x1="30" y1="64" x2="38" y2="63" stroke="#0b0704" stroke-width="2"/>

  <!-- Front Torso / Vest Profile (#b3221f) -->
  <path d="M 52 24 L 74 22 L 94 44 C 98 56, 94 76, 92 100 L 52 100 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Gold Hem on Vest Front -->
  <path d="M 74 22 L 94 44 L 92 100" fill="none" stroke="#f2c14e" stroke-width="2.4"/>

  <!-- White Shirt Bib peeking in Profile (#f7f1e6) -->
  <polygon points="72,24 82,24 88,40 76,38" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Right Wing of Bow Tie in Profile (#1d4f80, #f2c14e) -->
  <polygon points="76,28 86,25 84,33" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="76" cy="29" r="2.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Neck Collar Profile (#5d666e) -->
  <path d="M 44 18 C 54 14, 72 14, 80 18 L 82 26 C 74 30, 54 30, 44 26 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 50 20 C 58 23, 70 23, 76 20" stroke="#f2c14e" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Cummerbund / Croupier Belt in Profile (#1d4f80) -->
  <path d="M 52 68 L 94 68 L 93 76 L 52 76 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>
  <rect x="80" y="66" width="12" height="12" rx="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="86" cy="72" r="3" fill="#5d666e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Right Arm & Croupier Dealing Hand -->
  <!-- Shoulder Sphere (#5d666e) & Trim (#1d4f80, #f2c14e) -->
  <circle cx="56" cy="30" r="10" fill="#5d666e" stroke="#0b0704" stroke-width="2.2"/>
  <path d="M 47 26 C 52 22, 60 22, 65 26" stroke="#f2c14e" stroke-width="2" fill="none"/>
  <circle cx="56" cy="30" r="4" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Upper Arm Sleeve (#b3221f) -->
  <path d="M 48 36 L 64 36 L 66 52 L 48 50 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2"/>
  <!-- Gold Sleeve Garter (#f2c14e) -->
  <rect x="47" y="44" width="19" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Articulated Elbow Joint (#5d666e) -->
  <circle cx="56" cy="54" r="5" fill="#5d666e" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Forearm reaching forward (#1d4f80) -->
  <path d="M 58 52 L 76 60 L 73 68 L 54 58 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>

  <!-- White Croupier Cuff (#f7f1e6) & Gold Link (#f2c14e) -->
  <polygon points="74,59 82,63 79,71 71,67" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="76.5" cy="65" r="1.5" fill="#f2c14e"/>

  <!-- Robotic Dealing Hand (#5d666e) -->
  <path d="M 81 63 C 86 61, 92 64, 94 70 C 90 74, 82 72, 79 70 Z" fill="#5d666e" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Dealt Playing Card held between robotic fingers (#f7f1e6) -->
  <polygon points="90,62 104,66 100,78 86,74" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.5"/>
  <polygon points="95,67 98,70 95,73 92,70" fill="#b3221f"/>

  <!-- Woodcut Hatch Lines -->
  <!-- Back Coat Folds Hatches -->
  <path d="M 32 58 L 40 54 M 30 68 L 38 64 M 32 78 L 40 74 M 30 88 L 38 84" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Front Flank Hatches -->
  <path d="M 82 84 L 74 81 M 84 92 L 76 89" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
