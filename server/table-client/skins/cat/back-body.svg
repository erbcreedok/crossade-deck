  <path d="M 110 32 L 94 18 L 84 28 L 98 100 L 114 100 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2"/>

  <!-- Gold Shoulder Trim -->
  <path d="M 26 18 C 32 20, 36 26, 38 34 L 28 32 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>
  <path d="M 94 18 C 88 20, 84 26, 82 34 L 92 32 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Central Gold Queen Brocade Motif on Mantle Back -->
