  <polygon points="60,40 68,48 60,56 52,48" fill="#b3221f" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="60" cy="48" r="2.5" fill="#1d4f80"/>

  <!-- Lower Back Drapery Diamond (y=70..98) -->
