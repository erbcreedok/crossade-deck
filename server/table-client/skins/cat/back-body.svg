  <path d="M 44 10 L 50 16 L 60 8 L 70 16 L 76 10" stroke="#f2c14e" stroke-width="2" fill="none"/>

  <!-- Woodcut Drapery Hatch Lines -->
  <path d="M 12 70 L 20 66 M 10 78 L 18 74 M 108 70 L 100 66 M 110 78 L 102 74" stroke="#0b0704" stroke-width="2" stroke-linecap="round"/>
  <path d="M 38 88 L 44 85 M 39 94 L 45 91 M 82 88 L 76 85 M 81 94 L 75 91" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
