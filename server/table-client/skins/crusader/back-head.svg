<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Chainmail Aventail / Coif draping over Nape (#5d666e) -->
  <path d="M 24 64 C 22 78, 26 94, 50 94 C 74 94, 78 78, 76 64 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Chainmail Texture Rings on Nape -->
  <path d="M 32 76 C 42 80, 58 80, 68 76 M 34 82 C 44 86, 56 86, 66 82 M 38 88 C 45 91, 55 91, 62 88" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Back of Great Helm Silhouette (Steel Barrel) -->
  <!-- Left Side (Light Steel) -->
  <path d="M 50 12 L 28 14 C 24 24, 22 42, 22 62 C 22 74, 32 82, 50 86 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Right Side (Shaded Steel Facet) -->
  <path d="M 50 12 L 72 14 C 76 24, 78 42, 78 62 C 78 74, 68 82, 50 86 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Top Crown Plate Seam & Rivets -->
  <path d="M 26 20 C 34 18, 66 18, 74 20" stroke="#0b0704" stroke-width="1.8" fill="none"/>
  <circle cx="32" cy="19" r="1.3" fill="#0b0704"/>
  <circle cx="41" cy="18" r="1.3" fill="#0b0704"/>
  <circle cx="50" cy="18" r="1.3" fill="#0b0704"/>
  <circle cx="59" cy="18" r="1.3" fill="#0b0704"/>
  <circle cx="68" cy="19" r="1.3" fill="#0b0704"/>

  <!-- Central Vertical Riveted Seam -->
  <line x1="50" y1="12" x2="50" y2="86" stroke="#0b0704" stroke-width="2.2"/>
  <circle cx="50" cy="26" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="34" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="60" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="68" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="76" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="82" r="1.2" fill="#0b0704"/>

  <!-- Horizontal Gold Reinforcing Band across Back of Head (#f2c14e) -->
  <path d="M 22 44 L 78 44 L 78 52 L 22 52 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Gold Band Rivets & Center Ornament -->
  <circle cx="28" cy="48" r="1.3" fill="#0b0704"/>
  <circle cx="38" cy="48" r="1.3" fill="#0b0704"/>
  <polygon points="50,44 54,48 50,52 46,48" fill="#b3221f" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="62" cy="48" r="1.3" fill="#0b0704"/>
  <circle cx="72" cy="48" r="1.3" fill="#0b0704"/>

  <!-- Lower Edge Steel Rim Band -->
  <path d="M 24 72 C 34 78, 66 78, 76 72" stroke="#0b0704" stroke-width="2" fill="none"/>

  <!-- Woodcut Texture Lines on Cranium -->
  <!-- Left Side Hatches -->
  <path d="M 28 30 L 35 33 M 27 36 L 34 39 M 29 58 L 36 61 M 30 65 L 37 68" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right Side Hatches -->
  <path d="M 72 30 L 65 33 M 73 36 L 66 39 M 71 58 L 64 61 M 70 65 L 63 68" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Top Dome Curve Lines -->
  <path d="M 38 24 C 44 26, 56 26, 62 24" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
