<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Outer Cloak Silhouette (Red #b3221f) -->
  <path d="M 24 18 L 8 32 L 4 100 L 116 100 L 112 32 L 96 18 L 78 24 C 68 28, 52 28, 42 24 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cloak Gold Hem & Shoulder Borders -->
  <path d="M 24 18 L 8 32 L 14 100" fill="none" stroke="#f2c14e" stroke-width="2.5"/>
  <path d="M 96 18 L 112 32 L 106 100" fill="none" stroke="#f2c14e" stroke-width="2.5"/>

  <!-- Chainmail Aventail at Collar Top (#5d666e) -->
  <path d="M 38 18 C 44 14, 76 14, 82 18 L 78 24 C 68 28, 52 28, 42 24 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 46 20 C 54 23, 66 23, 74 20" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Shield Guige Strap running from Right Shoulder to Left Flank (Blue Leather & Gold Buckle) -->
  <path d="M 34 18 L 40 18 L 94 76 L 88 78 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <rect x="58" y="42" width="7" height="9" rx="1.5" transform="rotate(-40 61 46)" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Center Mantle Pleat (Deep Royal Blue #1d4f80) -->
  <path d="M 46 26 L 74 26 L 82 100 L 38 100 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2.6"/>

  <!-- Gold Trim Borders on Central Pleat -->
  <path d="M 40 28 L 46 26 L 38 100 L 32 100 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2"/>
  <path d="M 74 26 L 80 28 L 88 100 L 82 100 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2"/>

  <!-- Gold Diamond Border Accents on Trim -->
  <polygon points="37,46 40,50 37,54 34,50" fill="#0b0704"/>
  <polygon points="36,70 39,74 36,78 33,74" fill="#0b0704"/>
  <polygon points="83,46 86,50 83,54 80,50" fill="#0b0704"/>
  <polygon points="84,70 87,74 84,78 81,74" fill="#0b0704"/>

  <!-- Large Back Crusader Cross (Cross Pattée) in Gold (#f2c14e) & Red (#b3221f) -->
  <path d="M 54 36 L 66 36 L 63 48 L 76 44 L 78 54 L 65 56 L 68 68 L 52 68 L 55 56 L 42 54 L 44 44 L 57 48 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="60,45 65,51 60,57 55,51" fill="#b3221f" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Lower Mantle Ornament (y=78..96) -->
  <polygon points="60,78 70,88 60,98 50,88" fill="#f2c14e" stroke="#0b0704" stroke-width="2.2"/>
  <polygon points="60,83 65,88 60,93 55,88" fill="#b3221f" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Woodcut Drapery Hatch Lines -->
  <!-- Left Side Cloak Folds -->
  <path d="M 16 54 L 26 50 M 14 64 L 24 60 M 16 74 L 26 70 M 14 84 L 24 80" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right Side Cloak Folds -->
  <path d="M 104 54 L 94 50 M 106 64 L 96 60 M 104 74 L 94 70 M 106 84 L 96 80" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center Pleat Shading -->
  <path d="M 50 82 L 56 79 M 48 90 L 55 87 M 70 82 L 64 79 M 72 90 L 65 87" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
