<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Запись партии</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f0e; color: #e8e4d9; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      /* ЗАПИСЬ НЕ ТРОГАЮТ. Кнопки стола в ней живые с виду, но не делают ничего — палец должен это
         почувствовать сразу, а не после третьего тычка. Управление проигрывателя лежит ниже и работает. */
      #stage { position: absolute; inset: 0 0 132px 0; pointer-events: none; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #over { position: absolute; inset: 0; }
      #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: #16191a; border-top: 1px solid #2a2f30; padding: 10px 14px; box-sizing: border-box; }
      #row { display: flex; align-items: center; gap: 10px; }
      button { background: #262b2c; color: #e8e4d9; border: 1px solid #39403f; border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer; }
      button:hover { background: #303637; }
      #bar { width: 100%; margin: 10px 0 6px; }
      #now { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9aa3a1; white-space: nowrap; }
      #deed { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hurt { color: #e8836f; }
      #note { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #9aa3a1; }
      /* СКРЫТОЕ НЕ ЛОВИТ ПАЛЕЦ. `display: grid` выше перебивает атрибут «скрыт», и пустая плашка
         накрывала всю страницу невидимым стеклом: ни одна кнопка не нажималась. */
      #note[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas></canvas><div id="over"></div></div>
    <div id="panel">
      <div id="row">
        <button id="play">▶</button>
        <button id="back">◀</button>
        <button id="fwd">▶|</button>
        <span id="now">—</span>
      </div>
      <input id="bar" type="range" min="0" max="0" value="0" />
      <div id="deed">—</div>
    </div>
    <div id="note" hidden></div>
    <script type="module" src="replay.js"></script>
  </body>
</html>
