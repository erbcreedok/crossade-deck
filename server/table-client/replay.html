<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Запись партии</title>
    <style>
      :root { --panel: 150px; }
      html, body { margin: 0; height: 100%; background: #0d0f0e; color: #e8e4d9; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      /* ЗАПИСЬ НЕ ТРОГАЮТ. Кнопки стола в ней живые с виду, но не делают ничего — палец должен это
         почувствовать сразу, а не после третьего тычка. Управление проигрывателя лежит ниже и работает. */
      #stage { position: absolute; inset: 0 0 var(--panel) 0; pointer-events: none; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #over { position: absolute; inset: 0; }
      #panel { position: absolute; left: 0; right: 0; bottom: 0; height: var(--panel); background: #16191a; border-top: 1px solid #2a2f30; padding: 10px 14px; box-sizing: border-box; }
      #row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
      #eyes { max-width: 150px; }
      button { background: #262b2c; color: #e8e4d9; border: 1px solid #39403f; border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer; }
      button:hover { background: #303637; }
      #bar { width: 100%; margin: 10px 0 6px; }
      select { background: #262b2c; color: #e8e4d9; border: 1px solid #39403f; border-radius: 7px; padding: 5px 8px; font: inherit; }
      #now { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9aa3a1; white-space: nowrap; }
      /* СОБЫТИЕ МГНОВЕНИЯ — словами, в две строки; целиком и с подробностями — в панели «Подробнее». */
      #deedRow { display: flex; align-items: center; gap: 8px; }
      #deed { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      #more { flex: none; padding: 6px 10px; font-size: 13px; }
      .who { color: #e8c34e; font-weight: 600; }
      .card { display: inline-block; font-weight: 600; background: #f3ecdc; color: #1b1b1b; border-radius: 4px; padding: 0 4px; margin: 0 1px; font-size: 12px; line-height: 17px; }
      .card.red { color: #9c2f2a; }
      .card.back { background: #3b2a1b; color: #cdb98f; font-weight: 400; }
      .unknown { color: #9aa3a1; font-style: italic; }
      .hurt { color: #e8836f; }
      /* ПАНЕЛЬ ПОДРОБНОСТЕЙ — снизу, как лист на телефоне: палец рядом, содержимое прокручивается само. */
      #sheet { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.5); }
      #sheet[hidden] { display: none; }
      #sheetBox { width: 100%; max-width: 640px; max-height: 78vh; display: flex; flex-direction: column; background: #16191a; border: 1px solid #2a2f30; border-bottom: 0; border-radius: 14px 14px 0 0; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom); }
      #sheetHead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #2a2f30; }
      #sheetTitle { flex: 1; font-size: 14px; color: #9aa3a1; font-variant-numeric: tabular-nums; }
      #sheetBody { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 14px 18px; font-size: 15px; line-height: 1.5; }
      #sheetBody .line { padding: 6px 0; border-bottom: 1px solid #22282a; }
      #sheetBody .line:last-of-type { border-bottom: 0; }
      #sheetBody .card { font-size: 14px; line-height: 20px; padding: 0 5px; }
      details { margin-top: 14px; }
      summary { cursor: pointer; color: #9aa3a1; font-size: 13px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 8px 0; color: #9aa3a1; }
      dd { margin: 0; color: #e8e4d9; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
      pre { margin: 0; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #0d0f0e; border: 1px solid #2a2f30; border-radius: 8px; padding: 10px; overflow: auto; max-height: 40vh; white-space: pre; }
      button:focus-visible, summary:focus-visible { outline: 2px solid #e8c34e; outline-offset: 2px; }
      #note { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #9aa3a1; }
      /* СКРЫТОЕ НЕ ЛОВИТ ПАЛЕЦ. `display: grid` выше перебивает атрибут «скрыт», и пустая плашка
         накрывала всю страницу невидимым стеклом: ни одна кнопка не нажималась. */
      #note[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas></canvas><div id="over"></div></div>
    <div id="panel">
      <div id="row">
        <button id="play">▶</button>
        <button id="back">◀</button>
        <button id="fwd">▶|</button>
        <select id="mode" title="Как идёт запись" aria-label="Как идёт запись"><option value="time">реальное время</option><option value="step">пошагово</option></select>
        <select id="speed" title="Скорость" aria-label="Скорость"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select>
        <select id="eyes" title="Чьими глазами смотреть"></select>
        <span id="now">—</span>
      </div>
      <input id="bar" type="range" min="0" max="0" value="0" />
      <div id="deedRow"><div id="deed">—</div><button id="more" aria-haspopup="dialog">Подробнее</button></div>
    </div>
    <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div id="sheetBox">
        <div id="sheetHead">
          <button id="sheetBack" aria-label="Предыдущее событие">◀</button>
          <span id="sheetTitle">—</span>
          <button id="sheetFwd" aria-label="Следующее событие">▶</button>
          <button id="sheetClose" aria-label="Закрыть">✕</button>
        </div>
        <div id="sheetBody"></div>
      </div>
    </div>
    <div id="note" hidden></div>
    <script type="module" src="replay.js"></script>
  </body>
</html>
