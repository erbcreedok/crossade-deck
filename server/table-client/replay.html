<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Запись партии</title>
    <!-- ШРИФТ — СВОЙ И С НАШЕГО АДРЕСА: чужого начертания не видно ни мига. Пока Tiny5 не пришёл, текст не рисуется
         вовсе (`fonts-ok` ставится, когда оба файла загружены); стол ждёт его без потолка (`main.ts`). boot.test.ts. -->
    <link rel="preload" href="fonts/tiny5-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/tiny5-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face { font-family: Tiny5; src: url(fonts/tiny5-cyrillic.woff2) format("woff2"); font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: Tiny5; src: url(fonts/tiny5-latin.woff2) format("woff2"); font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      html:not(.fonts-ok) body, html:not(.fonts-ok) body * { color: transparent !important; -webkit-text-fill-color: transparent !important; text-shadow: none !important; }
    </style>
    <script>
      window.__fonts = Promise.all([document.fonts.load("16px Tiny5", "Ж"), document.fonts.load("16px Tiny5", "A")])
        .catch(function () {})
        .then(function () { document.documentElement.classList.add("fonts-ok"); });
    </script>
    <style>
      :root { --panel: 218px; }
      html, body { margin: 0; height: 100%; background: #0d0f0e; color: #e8e4d9; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      /* ЗАПИСЬ НЕ ИГРАЮТ, А СМОТРЯТ. Палец по сукну — камера и окна стульев (экран в режиме «смотреть»);
         кнопки стола, которые что-то делают с игрой, не ловят палец вовсе. Живыми остаются только те,
         что меняют взгляд: компас, настройки, журнал, закрытие окна стула. */
      #stage { position: absolute; inset: 0 0 var(--panel) 0; touch-action: none; }
      #over, #over * { pointer-events: none !important; }
      #over [data-home], #over [data-home] *, #over [data-settings], #over [data-settings] *, #over [data-journal], #over [data-journal] *,
      #over [data-shut], #over [data-scroll], #over [data-scroll] * { pointer-events: auto !important; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #over { position: absolute; inset: 0; }
      #panel { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: #16191a; border-top: 1px solid #2a2f30; padding: 10px 14px; box-sizing: border-box; }
      .row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 6px; }
      #now { margin-left: auto; }
      #cam { font-size: 13px; padding: 6px 10px; }
      #cam[data-free] { border-color: #e8c34e; color: #e8c34e; }
      /* ШКАЛА С МЕТКАМИ: метки над ползунком, по номеру мгновения — там же, где его ручка. */
      #track { position: relative; margin: 2px 0 4px; }
      #marks { position: relative; height: 22px; margin: 0 8px; }
      .mark { position: absolute; top: 0; transform: translateX(-50%); width: 22px; height: 22px; padding: 0; border: 0; background: none; display: grid; place-items: center; }
      .mark i { display: block; width: 8px; height: 14px; border-radius: 3px; }
      .mark.deal i { background: #e8c34e; } .mark.close i { background: #e8836f; } .mark.sweep i { background: #6fb3e8; } .mark.end i { background: #f5ead0; }
      .mark.group i { width: 12px; height: 16px; border-radius: 4px; background: #9aa3a1; color: #0d0f0e; font: 700 10px/16px system-ui; font-style: normal; text-align: center; }
      #eventsBody .ev { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 6px; border: 0; border-bottom: 1px solid #22282a; border-radius: 0; background: none; font-size: 16px; }
      #eventsBody .ev.now { background: #22282a; }
      #eventsBody .ev time { font-variant-numeric: tabular-nums; color: #9aa3a1; font-size: 14px; min-width: 56px; }
      #eventsBody .ev b { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 999px; color: #0d0f0e; white-space: nowrap; }
      .kind-deal { background: #e8c34e; } .kind-close { background: #e8836f; } .kind-sweep { background: #6fb3e8; } .kind-end { background: #f5ead0; }
      #eyes { max-width: 150px; }
      button { background: #262b2c; color: #e8e4d9; border: 1px solid #39403f; border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer; }
      button:hover { background: #303637; }
      #bar { width: 100%; margin: 0; }
      select { background: #262b2c; color: #e8e4d9; border: 1px solid #39403f; border-radius: 7px; padding: 5px 8px; font: inherit; }
      #now { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9aa3a1; white-space: nowrap; }
      /* СОБЫТИЕ МГНОВЕНИЯ — словами, в две строки; целиком и с подробностями — в панели «Подробнее». */
      #deedRow { display: flex; align-items: center; gap: 8px; }
      #deed { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      #more { flex: none; padding: 6px 10px; font-size: 13px; }
      .who { color: #e8c34e; font-weight: 600; }
      .card { display: inline-block; font-weight: 600; background: #f3ecdc; color: #1b1b1b; border-radius: 4px; padding: 0 4px; margin: 0 1px; font-size: 12px; line-height: 17px; }
      .card.red { color: #9c2f2a; }
      .card.back { background: #3b2a1b; color: #cdb98f; font-weight: 400; }
      .unknown { color: #9aa3a1; font-style: italic; }
      .hurt { color: #e8836f; }
      /* ПАНЕЛЬ ПОДРОБНОСТЕЙ — снизу, как лист на телефоне: палец рядом, содержимое прокручивается само. */
      #sheet, #events { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.5); }
      #sheet[hidden], #events[hidden] { display: none; }
      #sheetBox, #eventsBox { width: 100%; max-width: 640px; max-height: 78vh; display: flex; flex-direction: column; background: #16191a; border: 1px solid #2a2f30; border-bottom: 0; border-radius: 14px 14px 0 0; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom); }
      #sheetHead, #eventsHead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #2a2f30; }
      #sheetTitle, #eventsTitle { flex: 1; font-size: 14px; color: #9aa3a1; font-variant-numeric: tabular-nums; }
      #sheetBody, #eventsBody { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 14px 18px; font-size: 15px; line-height: 1.5; }
      #sheetBody .line { padding: 6px 0; border-bottom: 1px solid #22282a; }
      #sheetBody .line:last-of-type { border-bottom: 0; }
      #sheetBody .card { font-size: 14px; line-height: 20px; padding: 0 5px; }
      details { margin-top: 14px; }
      summary { cursor: pointer; color: #9aa3a1; font-size: 13px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 8px 0; color: #9aa3a1; }
      dd { margin: 0; color: #e8e4d9; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
      pre { margin: 0; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #0d0f0e; border: 1px solid #2a2f30; border-radius: 8px; padding: 10px; overflow: auto; max-height: 40vh; white-space: pre; }
      button:focus-visible, summary:focus-visible { outline: 2px solid #e8c34e; outline-offset: 2px; }
      #note { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #9aa3a1; }
      /* СКРЫТОЕ НЕ ЛОВИТ ПАЛЕЦ. `display: grid` выше перебивает атрибут «скрыт», и пустая плашка
         накрывала всю страницу невидимым стеклом: ни одна кнопка не нажималась. */
      #note[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas></canvas><div id="over"></div></div>
    <div id="panel">
      <div class="row">
        <button id="play" aria-label="Играть">▶</button>
        <button id="back" aria-label="Шаг назад">◀</button>
        <button id="fwd" aria-label="Шаг вперёд">▶|</button>
        <button id="prevMark" aria-label="К прошлому важному событию">◆◀</button>
        <button id="nextMark" aria-label="К следующему важному событию">▶◆</button>
        <button id="eventsOpen" aria-haspopup="dialog">События</button>
      </div>
      <div class="row">
        <select id="mode" title="Как идёт запись" aria-label="Как идёт запись"><option value="time">реальное время</option><option value="step">пошагово</option></select>
        <select id="speed" title="Скорость" aria-label="Скорость"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select>
        <select id="eyes" title="Чьими глазами смотреть"></select>
        <button id="cam" aria-pressed="false" title="Камера">камера игрока</button>
        <span id="now">—</span>
      </div>
      <div id="track"><div id="marks"></div><input id="bar" type="range" min="0" max="0" value="0" aria-label="Мгновение записи" /></div>
      <div id="deedRow"><div id="deed">—</div><button id="more" aria-haspopup="dialog">Подробнее</button></div>
    </div>
    <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div id="sheetBox">
        <div id="sheetHead">
          <button id="sheetBack" aria-label="Предыдущее событие">◀</button>
          <span id="sheetTitle">—</span>
          <button id="sheetFwd" aria-label="Следующее событие">▶</button>
          <button id="sheetClose" aria-label="Закрыть">✕</button>
        </div>
        <div id="sheetBody"></div>
      </div>
    </div>
    <div id="events" hidden role="dialog" aria-modal="true" aria-labelledby="eventsTitle">
      <div id="eventsBox">
        <div id="eventsHead">
          <span id="eventsTitle">События</span>
          <button id="eventsClose" aria-label="Закрыть">✕</button>
        </div>
        <div id="eventsBody"></div>
      </div>
    </div>
    <div id="note" hidden></div>
    <script type="module" src="replay.js"></script>
  </body>
</html>
