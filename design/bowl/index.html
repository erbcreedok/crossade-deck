<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Чаша руки — стенд</title>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #0d2118; --panel: #3a2a1d; --well: #1c120b; --ink: #f5ead0; --dim: #cdb98f; --gold: #f2c14e; --black: #0b0704; --wood: #6b4d2c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07100b; color: var(--dim); font: 400 12px/1.3 'Tiny5', monospace; overflow: hidden; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
  #stage { position: relative; height: 100%; aspect-ratio: 390 / 844; max-width: 100%; background: #0a1a12; overflow: hidden; touch-action: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: var(--well); border: 0; padding: 8px 9px; box-shadow: inset 0 0 0 2px var(--wood); cursor: pointer; }
  button.on { color: var(--black); background: linear-gradient(#f8d885, #b08a26); box-shadow: inset 0 0 0 2px #f8d885; }
  #views { position: absolute; left: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 5; }
  #hint { position: absolute; left: 8px; right: 8px; top: calc(52px + env(safe-area-inset-top)); z-index: 5; color: var(--dim); text-shadow: 0 1px 0 #000; pointer-events: none; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(#25321f, #16210f); box-shadow: 0 -2px 0 #0b0704, inset 0 2px 0 var(--wood); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); max-height: 46%; overflow: auto; }
  #panel.shut { max-height: 34px; overflow: hidden; }
  #panel h4 { margin: 0 0 6px; font-weight: 400; color: var(--gold); display: flex; justify-content: space-between; cursor: pointer; }
  .k { display: grid; grid-template-columns: 96px 1fr 38px; gap: 6px; align-items: center; margin: 4px 0; }
  .k input[type=range] { width: 100%; accent-color: #f2c14e; }
  .grp { margin: 6px 0 2px; color: var(--dim); }
  .grp + .row { margin-bottom: 6px; }
  b { color: var(--gold); font-weight: 400; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl"></canvas>
  <div id="views" class="row"></div>
  <div id="hint"></div>
  <div id="panel"><h4 id="ptitle"><span>Ручки</span><span>▾</span></h4><div id="knobs"></div></div>
</div></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ЧАША РУКИ — стенд механики. Зона «в руку» — не полоса на экране и не пунктир на сукне, а ЧАША ВОКРУГ ИГРОКА: часть сферы с центром у груди, края которой лежат на неподвижной
// «плоскости полюса». Камера вверх-вниз её не двигает; рука стоит на чаше впереди; карту выше плоскости не поднять; смотришь вверх — руки не видно, чтобы увидеть, смотри ниже.
// Все числа в единицах стола (ширина карты ≈ 0.7). Стол — диск радиуса 6.4, игрок сидит у его края и смотрит в центр.

const TABLE_R = 6.4, SEAT = { x: 0, z: 5.6 };
const P = { view: "head", hand: "yaw", style: "frame", R: 3.4, rim: 3.2, elev: -38, cards: 9, fov: 85, yaw: 0, pitch: -18, carry: false, lift: 6, cap: true, eye: 6, show: true };

const canvas = document.getElementById("gl"), stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1a12);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(3, 10, 4); scene.add(sun);

// ——— стол, стул, тело ———
const felt = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R, TABLE_R, 0.3, 64), new THREE.MeshLambertMaterial({ color: 0x14402a }));
felt.position.y = -0.15; scene.add(felt);
const rimMesh = new THREE.Mesh(new THREE.TorusGeometry(TABLE_R, 0.25, 8, 64), new THREE.MeshLambertMaterial({ color: 0x5a3f22 }));
rimMesh.rotation.x = Math.PI / 2; scene.add(rimMesh);
const body = new THREE.Group(); scene.add(body);
const wood = new THREE.MeshLambertMaterial({ color: 0xb08a26 });
const chair = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 1.6), wood); chair.position.set(SEAT.x, 2.2, SEAT.z + 0.7); body.add(chair);
const back = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.2, 0.2), wood); back.position.set(SEAT.x, 3.3, SEAT.z + 1.5); body.add(back);
const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3, 8), wood); spine.position.set(SEAT.x, 3.7, SEAT.z + 0.7); body.add(spine);
const shoulders = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.2, 8), wood); shoulders.rotation.z = Math.PI / 2; shoulders.position.set(SEAT.x, 5.2, SEAT.z + 0.7); body.add(shoulders);
const headBall = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), new THREE.MeshLambertMaterial({ color: 0xf2c14e })); body.add(headBall);
// Для сравнения — колода и пара карт на сукне.
const cardTex = (label, red, up = true) => {
  const c = document.createElement("canvas"); c.width = 64; c.height = 90;
  const g = c.getContext("2d"); g.fillStyle = up ? "#f5ead0" : "#8a6a3a"; g.fillRect(0, 0, 64, 90); g.strokeStyle = "#0b0704"; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 61, 87);
  if (up) { g.fillStyle = red ? "#c33" : "#111"; g.font = "bold 26px monospace"; g.fillText(label, 8, 34); g.font = "bold 40px monospace"; g.fillText(red ? "♥" : "♠", 14, 72); }
  else { g.strokeStyle = "#cdb98f"; for (let i = -90; i < 90; i += 10) { g.beginPath(); g.moveTo(0, i); g.lineTo(64, i + 64); g.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};
const RANKS = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
const cardGeo = new THREE.PlaneGeometry(0.7, 1.0);
const mkCard = (i, up = true) => { const m = new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: cardTex(RANKS[i % 13], i % 2 === 0, up), side: THREE.DoubleSide })); return m; };
for (let i = 0; i < 4; i++) { const c = mkCard(i + 3, i % 2 === 0); c.rotation.x = -Math.PI / 2; c.rotation.z = i * 0.7; c.position.set(-1.5 + i * 1.1, 0.02, -1 + (i % 2)); scene.add(c); }
const deck = mkCard(0, false); deck.rotation.x = -Math.PI / 2; deck.position.set(0, 0.05, -4.2); scene.add(deck);

// ——— камеры ———
const headCam = new THREE.PerspectiveCamera(P.fov, 390 / 844, 0.05, 200);
const orbitCam = new THREE.PerspectiveCamera(50, 390 / 844, 0.1, 200);
orbitCam.position.set(8, 11, 17);
const topCam = new THREE.PerspectiveCamera(48, 390 / 844, 0.1, 200);
topCam.position.set(0, 21, 3.2); topCam.up.set(0, 0, -1); topCam.lookAt(0, 0, 2.2);
scene.add(headCam);
const orbit = new OrbitControls(orbitCam, canvas);
orbit.target.set(0, 1.2, 3); orbit.enableDamping = true; orbit.update();
const eyeAt = () => new THREE.Vector3(SEAT.x, P.eye, SEAT.z + 0.7);
const centre = () => new THREE.Vector3(SEAT.x, P.rim, SEAT.z + 0.2);

// ——— ЧАША ———
const bowl = new THREE.Group(); scene.add(bowl);
let lit = false;
const dashed = (pts, color, dash = 0.18, gap = 0.14) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color, dashSize: dash, gapSize: gap, transparent: true, opacity: 0.9, depthWrite: false })); l.computeLineDistances(); return l; };
function buildBowl() {
  bowl.clear();
  if (!P.show) return;
  const c = centre(), col = lit ? 0xf2c14e : 0x7fd1b9, R = P.R;
  // Нижняя часть сферы: от плоскости полюса (край чаши, на высоте rim) вниз до стола.
  const phiTop = Math.PI / 2; // край — на экваторе: центр чаши лежит в плоскости полюса
  const lowest = Math.max(-Math.PI / 2, -Math.asin(Math.min(1, c.y / R)));
  const ring = (lat, n = 64) => { const pts = []; for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2; pts.push(new THREE.Vector3(c.x + Math.cos(lat) * R * Math.sin(a), c.y + Math.sin(lat) * R, c.z + Math.cos(lat) * R * Math.cos(a))); } return pts; };
  const meridian = (a, n = 20) => { const pts = []; for (let i = 0; i <= n; i++) { const lat = lowest * (i / n); pts.push(new THREE.Vector3(c.x + Math.cos(lat) * R * Math.sin(a), c.y + Math.sin(lat) * R, c.z + Math.cos(lat) * R * Math.cos(a))); } return pts; };
  if (P.style === "frame" || P.style === "wire") {
    bowl.add(dashed(ring(0), col, 0.22, 0.14));
    const lats = P.style === "wire" ? [-0.25, -0.5, -0.75, -1.0, -1.25].map((l) => l).filter((l) => l > lowest) : [];
    for (const l of lats) bowl.add(dashed(ring(l), col, 0.12, 0.2));
    const n = P.style === "wire" ? 16 : 8;
    for (let i = 0; i < n; i++) bowl.add(dashed(meridian((i / n) * Math.PI * 2), col, 0.16, 0.2));
  }
  if (P.style === "shell" || P.style === "wire") {
    const shell = new THREE.Mesh(new THREE.SphereGeometry(R, 40, 18, 0, Math.PI * 2, Math.PI / 2, Math.abs(lowest)), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: lit ? 0.22 : 0.1, side: THREE.DoubleSide, depthWrite: false }));
    shell.position.copy(c); bowl.add(shell);
  }
  if (P.style === "flat") {
    // Прежний вариант для сравнения: плоское кольцо на сукне перед игроком.
    const rr = Math.sqrt(Math.max(0.01, R * R - c.y * c.y));
    const pts = []; for (let i = 0; i <= 64; i++) { const a = (i / 64) * Math.PI * 2; pts.push(new THREE.Vector3(c.x + rr * Math.sin(a), 0.03, c.z + rr * Math.cos(a))); }
    bowl.add(dashed(pts, col, 0.22, 0.14));
  }
  // Плоскость полюса — прозрачный диск: видно, выше чего карты не поднимаются.
  const disc = new THREE.Mesh(new THREE.CircleGeometry(R, 48), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2; disc.position.copy(c); if (P.style !== "flat") bowl.add(disc);
}

// ——— РУКА ———
const hand = new THREE.Group(); scene.add(hand);
let handCards = [];
let frozenYaw = 0;
function buildHand() {
  for (const c of handCards) hand.remove(c);
  handCards = [];
  for (let i = 0; i < P.cards; i++) { const c = mkCard(i); handCards.push(c); hand.add(c); }
}
const yawOf = () => (P.yaw * Math.PI) / 180;
function placeHand() {
  const n = handCards.length, c = centre(), e = eyeAt(), R = P.R, el = (P.elev * Math.PI) / 180;
  handCards.forEach((card, i) => {
    const k = n === 1 ? 0 : i / (n - 1) - 0.5, spread = Math.min(0.9, n * 0.11);
    if (P.hand === "head") {
      // КАК СЕЙЧАС: карты привязаны к камере головы — идут за любым её движением, и вверх тоже.
      card.parent !== headCam && headCam.add(card);
      const d = 2.4, tan = Math.tan((P.fov * Math.PI) / 360);
      card.position.set(k * 2 * tan * d * 0.82, -tan * d * 0.78 + Math.abs(k) * -0.12, -d);
      card.rotation.set(0.25, 0, -k * 0.35);
    } else {
      card.parent !== hand && hand.add(card);
      const az = (P.hand === "world" ? frozenYaw : -yawOf()) + k * spread * 2;
      const dir = new THREE.Vector3(Math.sin(az) * -1, 0, -Math.cos(az));
      card.position.set(c.x + dir.x * R * Math.cos(el), c.y + Math.sin(el) * R, c.z + dir.z * R * Math.cos(el));
      card.lookAt(e);
      card.rotateZ(-k * 0.2);
    }
  });
}

// ——— НЕСОМАЯ КАРТА ———
const carried = mkCard(0); carried.visible = false; scene.add(carried);
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(0, 0);
let pointerDown = false;
function placeCarried() {
  carried.visible = P.carry;
  if (!P.carry) { lit = false; return; }
  const cam = activeCam(); ray.setFromCamera(ptr, cam);
  const maxY = P.cap ? Math.min(P.lift, P.rim) : P.lift;
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -maxY), hit = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, hit)) return;
  carried.position.copy(hit); carried.lookAt(cam.position);
  const c = centre(), inside = hit.distanceTo(c) < P.R && hit.y <= c.y + 0.01;
  if (inside !== lit) { lit = inside; buildBowl(); }
  carried.material.opacity = 1;
}

// ——— вид и кадр ———
const activeCam = () => (P.view === "head" ? headCam : P.view === "orbit" ? orbitCam : topCam);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  for (const c of [headCam, orbitCam, topCam]) { c.aspect = w / h; c.updateProjectionMatrix(); }
}
addEventListener("resize", resize); resize();
function frame() {
  const e = eyeAt();
  headCam.position.copy(e); headCam.rotation.order = "YXZ"; headCam.rotation.set((P.pitch * Math.PI) / 180, -yawOf(), 0);
  headCam.fov = P.fov; headCam.updateProjectionMatrix();
  headBall.position.copy(e).add(new THREE.Vector3(0, -0.35, 0.1)); headBall.visible = P.view !== "head";
  placeHand(); placeCarried();
  orbit.enabled = P.view === "orbit"; if (P.view === "orbit") orbit.update();
  renderer.render(scene, activeCam());
  requestAnimationFrame(frame);
}

// ——— ввод: в голове палец вертит взглядом (вбок — поворот, вверх-вниз — наклон); с «несу карту» — ведёт карту ———
let last = null;
canvas.addEventListener("pointerdown", (e) => { pointerDown = true; last = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); });
canvas.addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  if (P.carry && pointerDown) ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  else if (pointerDown && P.view === "head" && last) {
    P.yaw = Math.max(-180, Math.min(180, P.yaw + (e.clientX - last.x) * 0.25));
    P.pitch = Math.max(-80, Math.min(80, P.pitch - (e.clientY - last.y) * 0.25));
    sync();
  }
  last = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointerup", () => { pointerDown = false; });

// ——— ручки ———
const views = document.getElementById("views"), knobs = document.getElementById("knobs"), hint = document.getElementById("hint");
const VIEWS = [["head", "Голова"], ["orbit", "Вокруг"], ["top", "Сверху"]];
const HANDS = [["head", "К голове (сейчас)"], ["yaw", "На чаше, за взглядом"], ["world", "На чаше, на месте"]];
const STYLES = [["frame", "Рамка"], ["wire", "Сетка"], ["shell", "Оболочка"], ["flat", "Плоское (было)"]];
const SLIDERS = [["R", "Радиус чаши", 1.5, 6, 0.1], ["rim", "Плоскость полюса", 1, 6, 0.1], ["elev", "Рука: наклон", -70, -5, 1], ["cards", "Карт в руке", 1, 15, 1], ["fov", "Угол обзора", 55, 100, 1], ["eye", "Высота глаза", 4, 9, 0.1], ["yaw", "Взгляд: поворот", -180, 180, 1], ["pitch", "Взгляд: наклон", -80, 80, 1], ["lift", "Палец: высота", 0, 9, 0.1]];
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d; };
function buildUi() {
  views.innerHTML = VIEWS.map(([k, t]) => `<button data-view="${k}" class="${P.view === k ? "on" : ""}">${t}</button>`).join("");
  const seg = (title, list, key) => `<div class="grp">${title}</div><div class="row">${list.map(([k, t]) => `<button data-set="${key}:${k}" class="${P[key] === k ? "on" : ""}">${t}</button>`).join("")}</div>`;
  knobs.innerHTML = seg("Рука", HANDS, "hand") + seg("Чаша", STYLES, "style")
    + `<div class="row" style="margin-top:6px"><button data-tog="show" class="${P.show ? "on" : ""}">Чаша видна</button><button data-tog="carry" class="${P.carry ? "on" : ""}">Нести карту (тяни по экрану)</button><button data-tog="cap" class="${P.cap ? "on" : ""}">Потолок = плоскость полюса</button><button data-reset>Оставить руку здесь</button></div>`
    + SLIDERS.map(([k, t, lo, hi, st]) => `<div class="k"><span>${t}</span><input type="range" data-k="${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}"><b data-v="${k}">${P[k]}</b></div>`).join("");
  hint.textContent = P.view === "head" ? "Тяни по экрану — вертишь головой. Смотри вверх: рука на чаше остаётся внизу, в кадр не лезет." : P.view === "orbit" ? "Свободная камера: чаша стоит вокруг игрока на столе, рука лежит на ней." : "Сверху: чаша — круг вокруг твоего стула; плоскость полюса — его заливка.";
}
function sync() { for (const [k] of SLIDERS) { const i = knobs.querySelector(`[data-k="${k}"]`); if (i) { i.value = P[k]; knobs.querySelector(`[data-v="${k}"]`).textContent = Math.round(P[k] * 10) / 10; } } }
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { P.view = b.dataset.view; buildUi(); }
  else if (b.dataset.set) { const [k, v] = b.dataset.set.split(":"); P[k] = v; if (k === "hand" && v === "world") frozenYaw = -yawOf(); buildUi(); buildBowl(); }
  else if (b.dataset.tog) { P[b.dataset.tog] = !P[b.dataset.tog]; buildUi(); buildBowl(); }
  else if (b.dataset.reset !== undefined) frozenYaw = -yawOf();
});
document.addEventListener("input", (e) => {
  const i = e.target.closest("[data-k]"); if (!i) return;
  P[i.dataset.k] = Number(i.value); knobs.querySelector(`[data-v="${i.dataset.k}"]`).textContent = Math.round(P[i.dataset.k] * 10) / 10;
  if (i.dataset.k === "cards") buildHand(); else buildBowl();
});
document.getElementById("ptitle").addEventListener("click", () => document.getElementById("panel").classList.toggle("shut"));
// Адрес задаёт начальное состояние: ?view=orbit&hand=world&style=wire&pitch=40 — для скринов.
for (const [k, v] of new URLSearchParams(location.search)) if (k in P) P[k] = typeof P[k] === "number" ? Number(v) : typeof P[k] === "boolean" ? v === "1" : v;
if (new URLSearchParams(location.search).has("shut")) document.getElementById("panel").classList.add("shut");
frozenYaw = -yawOf();
buildUi(); buildHand(); buildBowl(); frame();
window.__bowl = { P, set(k, v) { P[k] = v; buildUi(); buildBowl(); buildHand(); } };
</script>
</body>
</html>
