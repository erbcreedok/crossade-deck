<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Чаша руки — стенд</title>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #0d2118; --panel: #3a2a1d; --well: #1c120b; --ink: #f5ead0; --dim: #cdb98f; --gold: #f2c14e; --black: #0b0704; --wood: #6b4d2c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07100b; color: var(--dim); font: 400 12px/1.3 'Tiny5', monospace; overflow: hidden; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
  #stage { position: relative; height: 100%; aspect-ratio: 390 / 844; max-width: 100%; background: #0a1a12; overflow: hidden; touch-action: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: var(--well); border: 0; padding: 8px 9px; box-shadow: inset 0 0 0 2px var(--wood); cursor: pointer; }
  button.on { color: var(--black); background: linear-gradient(#f8d885, #b08a26); box-shadow: inset 0 0 0 2px #f8d885; }
  #views { position: absolute; left: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 5; }
  #hint { position: absolute; left: 8px; right: 56px; top: calc(52px + env(safe-area-inset-top)); z-index: 5; color: var(--dim); text-shadow: 0 1px 0 #000; pointer-events: none; }
  #strip { position: absolute; left: 0; right: 0; z-index: 4; border-top: 2px dashed rgba(127,209,185,.7); pointer-events: none; display: none; }
  #strip span { position: absolute; left: 8px; top: 3px; color: #7fd1b9; opacity: .8; }
  /* Открыватель сбоку: язычок на правом краю, панель выезжает поверх сцены. */
  #opener { position: absolute; right: 0; top: 38%; z-index: 8; width: 30px; height: 96px; padding: 0; writing-mode: vertical-rl; letter-spacing: 1px; box-shadow: inset 0 0 0 2px var(--wood); }
  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(300px, 82%); z-index: 7; background: linear-gradient(#25321f, #16210f); box-shadow: -2px 0 0 #0b0704, inset 2px 0 0 var(--wood); padding: 12px 12px calc(12px + env(safe-area-inset-bottom)) 12px; overflow: auto; transform: translateX(105%); transition: transform .18s steps(4); }
  #stage.open #drawer { transform: none; }
  #stage.open #opener { right: min(300px, 82%); }
  .k { display: grid; grid-template-columns: 100px 1fr 34px; gap: 6px; align-items: center; margin: 5px 0; }
  .k input[type=range] { width: 100%; accent-color: #f2c14e; }
  .grp { margin: 8px 0 3px; color: var(--gold); }
  b { color: var(--gold); font-weight: 400; }
  small { display: block; margin-top: 8px; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl"></canvas>
  <div id="strip"><span>В руку (сейчас: полоса на экране)</span></div>
  <div id="views" class="row"></div>
  <div id="hint"></div>
  <button id="opener" aria-label="Ручки">ручки ◂</button>
  <div id="drawer"><div id="knobs"></div></div>
</div></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ЧАША РУКИ — стенд механики на НАСТОЯЩИХ размерах стола 3D (`table3d/src/scene.ts`, `server/src/table/bodies.ts`, `ring.ts`):
//   стол        радиус 6.4 + кант 0.45, верх сукна на y = 0, толщина 0.6; карта 1.17 × 1.638;
//   стул        на радиусе 7.9 от середины, сиденье 3.4 × 3.4 на y = −3.3, спинка 3.8, пол на −7; весь стул и тело уменьшены в «размер людей» (0.8);
//   плечи       на радиусе 7.4, высота 4 сидя; голова (она же камера) — на 2 выше плеч, плюс «высота обзора» (на телефоне +3);
//   камера      угол 85, наклон −40; рука на камере: (0, −0.92, −2.3), карта 0.486 × 0.7 (размер карт на телефоне) × поправка на угол.
// Что нового здесь одно: ЧАША. Вокруг головы сфера, по которой лежит рука; край чаши — неподвижная «плоскость полюса».
// Рука на чаше стоит там, где она стоит в мире: наклон камеры её не двигает; карту выше плоскости не поднять.

const TABLE_R = 6.4, RIM = 0.45, THICK = 0.6, CARD_W = 1.17, CARD_H = 1.638, SHOULDERS = TABLE_R + 1, CHAIR_R = 7.9;
const CAMHAND = { x: 0, y: -0.92, z: -2.3, card: 0.486 }, REF_PITCH = -40, DEG = Math.PI / 180;
const CHAIR = { seat: 3.4, thick: 0.35, seatY: -3.3, back: 3.8, leg: 0.32, floor: -7 };
const P = { view: "head", hand: "cap", cap: true, capElev: -41, style: "frame", R: 1.8, anchor: "head", ay: 0, hx: 0, hy: 0, hz: 0, moveHand: false, sq: 0.85, cut: 50, cards: 9, fov: 85, yaw: -7.92, pitch: -32.67, carry: false, lift: 4, viewH: 0, doll: 0.8, show: true, axis: true, size: 0.7 };

const canvas = document.getElementById("gl"), stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1a12);
scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(6, 16, 8); scene.add(sun);

// ——— стол ———
const feltMat = new THREE.MeshLambertMaterial({ color: 0x14402a });
const top = new THREE.Mesh(new THREE.CircleGeometry(TABLE_R + RIM, 96), feltMat); top.rotation.x = -Math.PI / 2; scene.add(top);
const under = new THREE.Mesh(new THREE.CircleGeometry(TABLE_R + RIM, 64), new THREE.MeshBasicMaterial({ color: 0x0b0704 })); under.rotation.x = Math.PI / 2; under.position.y = -THICK; scene.add(under);
const side = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R + RIM, TABLE_R + RIM, THICK, 96, 1, true), new THREE.MeshBasicMaterial({ color: 0x3a2716, side: THREE.DoubleSide })); side.position.y = -THICK / 2; scene.add(side);
const edge = new THREE.Mesh(new THREE.RingGeometry(TABLE_R, TABLE_R + RIM, 96), new THREE.MeshBasicMaterial({ color: 0x5a3f22 })); edge.rotation.x = -Math.PI / 2; edge.position.y = 0.01; scene.add(edge);

// ——— стулья и тела, как в игре ———
const outline = new THREE.MeshBasicMaterial({ color: 0x0b0704, side: THREE.BackSide });
function makeChair(color) {
  const g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color });
  const part = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat), o = new THREE.Mesh(new THREE.BoxGeometry(w + 0.16, h + 0.16, d + 0.16), outline); m.position.set(x, y, z); o.position.copy(m.position); g.add(o, m); };
  const { seat, thick, seatY, back, leg, floor } = CHAIR, half = seat / 2 - leg / 2 - 0.1, legH = seatY - thick / 2 - floor;
  part(seat, thick, seat, 0, seatY, 0); part(seat, back, leg, 0, seatY + thick / 2 + back / 2, seat / 2 - leg / 2);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) part(leg, legH, leg, sx * half, floor + legH / 2, sz * half);
  return g;
}
const stick = (a, b, r, mat) => { const len = a.distanceTo(b), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat); m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); return m; };
const seats = [];
function seatAt(angleDeg, color, ink, withBody) {
  const a = angleDeg * DEG, dirx = Math.sin(a), dirz = Math.cos(a), g = new THREE.Group();
  const chair = makeChair(color); chair.position.set(dirx * CHAIR_R, 0, dirz * CHAIR_R); chair.rotation.y = a; chair.userData.base = chair.position.clone(); g.add(chair);
  g.userData = { a, dirx, dirz, ink, withBody, chair };
  scene.add(g); seats.push(g); return g;
}
const mine = seatAt(0, 0x7fd1b9, 0x7fd1b9, true);
seatAt(90, 0x7d8a86, 0, false); seatAt(180, 0x7d8a86, 0, false); seatAt(270, 0x7d8a86, 0, false);
const bodyG = new THREE.Group(); scene.add(bodyG);
const headBall = new THREE.Mesh(new THREE.SphereGeometry(0.75, 18, 14), new THREE.MeshLambertMaterial({ color: 0x7fd1b9 }));
let neck = null;
function buildBody() {
  bodyG.clear();
  const k = P.doll, mat = new THREE.MeshLambertMaterial({ color: 0x7fd1b9 });
  const S = new THREE.Vector3(0, 4 * k, SHOULDERS), base = new THREE.Vector3(0, -7 * k, SHOULDERS), bar = 1.4 * k, r = 0.21 * k;
  bodyG.add(stick(base, S, r, mat), stick(S.clone().add(new THREE.Vector3(-bar, 0, 0)), S.clone().add(new THREE.Vector3(bar, 0, 0)), r, mat));
  for (const sx of [-1, 1]) { const b = new THREE.Mesh(new THREE.SphereGeometry(r * 1.1, 10, 8), mat); b.position.copy(S).add(new THREE.Vector3(sx * bar, 0, 0)); bodyG.add(b); }
  const E = eyeAt(); neck = stick(S, E.clone().add(new THREE.Vector3(0, -0.5, 0)), r, mat); bodyG.add(neck);
  mine.userData.chair.scale.setScalar(k); mine.userData.chair.position.set(0, 0, CHAIR_R);
  for (const s of seats) { if (s !== mine) { s.userData.chair.scale.setScalar(k); } }
  // Напротив — второй игрок, для масштаба.
  const m2 = new THREE.MeshLambertMaterial({ color: 0xf2c14e }), S2 = new THREE.Vector3(0, 4 * k, -SHOULDERS), H2 = new THREE.Vector3(0, 6 * k, -SHOULDERS + 0.6);
  bodyG.add(stick(new THREE.Vector3(0, -7 * k, -SHOULDERS), S2, r, m2), stick(S2.clone().add(new THREE.Vector3(-bar, 0, 0)), S2.clone().add(new THREE.Vector3(bar, 0, 0)), r, m2), stick(S2, H2, r, m2));
  const h2 = new THREE.Mesh(new THREE.SphereGeometry(0.75 * k + 0.1, 14, 10), m2); h2.position.copy(H2); bodyG.add(h2);
  scene.children.find((c) => c.userData.alia)?.removeFromParent();
  bodyG.add(headBall);
}
// Карты.
const cardTex = (label, red, up = true) => {
  const c = document.createElement("canvas"); c.width = 117; c.height = 164;
  const g = c.getContext("2d"); g.fillStyle = up ? "#f5ead0" : "#8a6a3a"; g.fillRect(0, 0, 117, 164); g.strokeStyle = "#0b0704"; g.lineWidth = 4; g.strokeRect(2, 2, 113, 160);
  if (up) { g.fillStyle = red ? "#c33" : "#111"; g.font = "bold 40px monospace"; g.fillText(label, 10, 48); g.font = "bold 62px monospace"; g.fillText(red ? "♥" : "♠", 26, 124); }
  else { g.strokeStyle = "#cdb98f"; g.lineWidth = 2; for (let i = -164; i < 164; i += 14) { g.beginPath(); g.moveTo(0, i); g.lineTo(117, i + 117); g.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
};
const RANKS = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
const cardGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
const mkCard = (i, up = true) => new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: cardTex(RANKS[i % 13], i % 2 === 0, up), side: THREE.DoubleSide }));
for (const [i, x, z, rot, up] of [[3, -2.4, -1.2, 0.2, true], [4, 0.6, 0.4, -0.5, false], [5, 2.2, -1.8, 0.9, true], [6, -0.8, 2.0, 0.1, false]]) { const c = mkCard(i, up); c.rotation.x = -Math.PI / 2; c.rotation.z = rot; c.position.set(x, 0.02, z); scene.add(c); }
const deck = mkCard(0, false); deck.rotation.x = -Math.PI / 2; deck.position.set(0, 0.06, -3.4); scene.add(deck);

// ——— камеры ———
const aspect = 390 / 844;
const headCam = new THREE.PerspectiveCamera(P.fov, aspect, 0.05, 300);
const orbitCam = new THREE.PerspectiveCamera(50, aspect, 0.1, 300); orbitCam.position.set(10, 15, 24);
const topCam = new THREE.PerspectiveCamera(50, aspect, 0.1, 300); topCam.up.set(0, 0, -1); topCam.position.set(0, 26, 4); topCam.lookAt(0, 0, 3);
scene.add(headCam);
const orbit = new OrbitControls(orbitCam, canvas); orbit.target.set(0, 1, 3); orbit.enableDamping = true; orbit.update();
/** Голова — она же камера: на 2 выше плеч позы плюс «высота обзора». */
const eyeAt = () => new THREE.Vector3(0, 4 * 1 + 2 + P.viewH, SHOULDERS);

// ——— ЧАША ———
const bowl = new THREE.Group(); scene.add(bowl);
let lit = false, bowlSig = "";
const dashed = (pts, color, dash = 0.2, gap = 0.14) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color, dashSize: dash, gapSize: gap, transparent: true, opacity: 0.95, depthWrite: false })); l.computeLineDistances(); return l; };
/** Ось руки и чаши — не обязательно голова: плечи, таз или сама кисть; плюс высота якоря. Вокруг этой точки рука качается при повороте и наклоне, и её же центр у чаши. */
const ANCHORS = { head: () => eyeAt(), chest: () => new THREE.Vector3(0, 4 * P.doll, SHOULDERS), hip: () => new THREE.Vector3(0, -2.5 * P.doll + 1.2, SHOULDERS), hand: () => handWorld() };
const yawNow = () => (P.hand === "world" ? frozenYaw : -yawOf());
const pitchNow = () => (P.hand === "head" ? P.pitch * DEG : P.hand === "cap" ? Math.min(P.pitch * DEG, P.capElev * DEG - latOffset) : REF_PITCH * DEG);
/** Где кисть сейчас: перед виртуальной головой на CAMHAND плюс смещение, которое двигают ручками или пальцем. Якорь «Кисть» — это она самая, каждый кадр. */
const handWorld = () => eyeAt().add(new THREE.Vector3(CAMHAND.x + P.hx, CAMHAND.y + P.hy, CAMHAND.z + P.hz).multiplyScalar(P.hand === "head" ? 1 : P.R / HAND_DIST).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(pitchNow(), yawNow(), 0, "YXZ"))));
const centre = () => ANCHORS[P.anchor]().add(new THREE.Vector3(0, P.ay, 0));
/** Верхний срез чаши: широта края. Чаша — часть эллипсоида от самого дна вверх на `cut`% его высоты: 50% — полусфера, меньше — мельче, дно то же. */
const latTop = () => -Math.asin(Math.max(-1, Math.min(1, 1 - 2 * (P.cut / 100))));
const poleY = () => { const c = centre(); return c.y + Math.sin(latTop()) * P.R * P.sq; };
function buildBowl() {
  bowl.clear();
  if (!P.show || P.style === "strip") return;
  const c = centre(), col = lit ? 0xf2c14e : 0x7fd1b9, R = P.R, Ry = P.R * P.sq, top = latTop(), bottom = -Math.PI / 2;
  const at = (lat, a) => new THREE.Vector3(c.x + Math.cos(lat) * R * Math.sin(a), c.y + Math.sin(lat) * Ry, c.z + Math.cos(lat) * R * Math.cos(a));
  const ring = (lat, n = 72) => { const pts = []; for (let i = 0; i <= n; i++) pts.push(at(lat, (i / n) * Math.PI * 2)); return pts; };
  const meridian = (a, n = 20) => { const pts = []; for (let i = 0; i <= n; i++) pts.push(at(top + (bottom - top) * (i / n), a)); return pts; };
  if (P.style === "frame" || P.style === "wire") {
    bowl.add(dashed(ring(top), col, 0.24, 0.16));
    const n = P.style === "wire" ? 16 : 8;
    if (P.style === "wire") for (const l of [-0.3, -0.6, -0.9, -1.2].filter((l) => l < top && l > bottom)) bowl.add(dashed(ring(l), col, 0.14, 0.2));
    for (let i = 0; i < n; i++) bowl.add(dashed(meridian((i / n) * Math.PI * 2), col, 0.18, 0.22));
  }
  if (P.style === "shell" || P.style === "wire") {
    const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 18, 0, Math.PI * 2, Math.PI / 2 - top, Math.PI / 2 + top), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: lit ? 0.24 : 0.1, side: THREE.DoubleSide, depthWrite: false }));
    shell.scale.set(R, Ry, R); shell.position.copy(c); bowl.add(shell);
  }
  // Плоскость полюса — на высоте среза: выше неё карту не поднять.
  const disc = new THREE.Mesh(new THREE.CircleGeometry(R * Math.cos(top), 56), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2; disc.position.set(c.x, c.y + Math.sin(top) * Ry, c.z); bowl.add(disc);
}

// ——— ОСЬ: центр чаши — он же точка, вокруг которой качается рука; вертикаль через него; линия к руке ———
const axisG = new THREE.Group(); scene.add(axisG);
const onTop = (m) => { m.depthTest = false; m.transparent = true; return m; };
let axisSig = "";
function drawAxis() {
  axisG.visible = P.axis;
  if (!P.axis) return;
  const c = centre(), Ry = P.R * P.sq, pole = poleY(), mid = handCards[Math.floor(handCards.length / 2)];
  const h = mid ? mid.getWorldPosition(new THREE.Vector3()) : c;
  void h;
  const sig = [c.x, c.y, c.z, Ry, pole, h.x, h.y, h.z].map((v) => Math.round(v * 50)).join();
  if (sig === axisSig) return;
  axisSig = sig; axisG.clear();
  const line = (a, b, color, dash) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), dash ? new THREE.LineDashedMaterial({ color, dashSize: 0.18, gapSize: 0.12 }) : new THREE.LineBasicMaterial({ color })); onTop(l.material); l.computeLineDistances(); l.renderOrder = 10; return l; };
  // Вертикаль от дна до верха эллипсоида.
  axisG.add(line(new THREE.Vector3(c.x, c.y - Ry, c.z), new THREE.Vector3(c.x, c.y + Ry + 1.5, c.z), 0xff4d4d, false));
  // Центр: шар и крест по горизонтали.
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 10), onTop(new THREE.MeshBasicMaterial({ color: 0xff4d4d }))); dot.position.copy(c); dot.renderOrder = 11; axisG.add(dot);
  const r = Math.min(0.9, P.R * 0.5);
  axisG.add(line(new THREE.Vector3(c.x - r, c.y, c.z), new THREE.Vector3(c.x + r, c.y, c.z), 0xff4d4d, false), line(new THREE.Vector3(c.x, c.y, c.z - r), new THREE.Vector3(c.x, c.y, c.z + r), 0xff4d4d, false));
  // От оси к руке: плечо рычага, на котором карты качаются.
  axisG.add(line(c, h, 0xf2c14e, true));
  // Плоскость полюса: короткая засечка у оси.
  axisG.add(line(new THREE.Vector3(c.x - 0.5, pole, c.z), new THREE.Vector3(c.x + 0.5, pole, c.z), 0xf2c14e, false));
}

// ——— РУКА ———
let handCards = [], frozenYaw = 0;
function buildHand() { for (const c of handCards) c.removeFromParent(); handCards = []; for (let i = 0; i < P.cards; i++) handCards.push(mkCard(i)); }
const yawOf = () => P.yaw * DEG;
/** Карта в руке на телефоне ≈ 150 px высотой при размере 70% и экране 844 px: во столько же она выходит на расстоянии руки (2.3) от камеры. */
const HAND_DIST = Math.hypot(CAMHAND.y, CAMHAND.z), CARD_STEP = 0.16;
const cardScale = () => ((150 * (P.size / 0.7)) / stage.clientHeight) * (2 * HAND_DIST * Math.tan((P.fov * DEG) / 2)) / CARD_H;
const latOffset = -Math.atan2(-CAMHAND.y, -CAMHAND.z);
/**
 * Рука — всегда «головная»: карты стоят перед виртуальной головой так же, как перед камерой в игре. Режимы отличаются только тем, КАК эта голова повёрнута:
 *   К голове        — как камера (карты едут и вверх тоже);
 *   Не выше потолка — как камера, но наклон вверх ограничен: поднял взгляд выше — рука остаётся на потолке и уходит из кадра;
 *   Только поворот  — поворот как у камеры, наклон закреплён на обычном (−40°);
 *   На месте        — и поворот, и наклон закреплены.
 */
const rig = new THREE.Group(), inner = new THREE.Group(); rig.add(inner); scene.add(rig);
function placeHand() {
  const n = handCards.length, sc = cardScale(), yawEff = yawNow(), pitchEff = pitchNow();
  // Ось поворота — якорь, а не голова. Карты стоят там, где они стояли бы перед головой при обычном наклоне (−40°), а вокруг якоря качаются при любом другом.
  // Якорь «Кисть» — сама рука: ось в центре карт, она едет с рукой.
  const A = centre(), E = eyeAt(), onHand = P.anchor === "hand";
  const refQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(REF_PITCH * DEG, yawEff, 0, "YXZ"));
  rig.position.copy(onHand ? handWorld() : A); rig.rotation.order = "YXZ"; rig.rotation.set(pitchEff, yawEff, 0);
  inner.position.copy(onHand ? new THREE.Vector3() : E.clone().sub(A).applyQuaternion(refQ.clone().invert()));
  inner.scale.setScalar(P.hand === "head" ? 1 : P.R / HAND_DIST);
  const base = onHand ? new THREE.Vector3(0, 0, 0) : new THREE.Vector3(CAMHAND.x + P.hx, CAMHAND.y + P.hy, CAMHAND.z + P.hz);
  handCards.forEach((card, i) => {
    const k = n === 1 ? 0 : i - (n - 1) / 2;
    card.parent !== inner && inner.add(card);
    card.position.set(base.x + k * CARD_STEP, base.y - 0.012 * k * k, base.z);
    card.rotation.set(0.2, 0, -k * 0.05); card.scale.setScalar(sc);
  });
}

// ——— РУКИ ТЕЛА: левая тянется к картам, правая лежит на столе перед плечом (как в игре) ———
const armsG = new THREE.Group(); scene.add(armsG);
let armSig = "";
/** Рука с локтем: два равных сегмента чуть длиннее половины расстояния — никогда не в струну; локоть уведён наружу и вниз (`armParts` в игре). */
function arm(shoulder, hand, side, r, mat) {
  const d = Math.max(1e-3, shoulder.distanceTo(hand)), seg = Math.max(d * 0.505, 1.1 * P.doll), axis = hand.clone().sub(shoulder).divideScalar(d);
  const pole = new THREE.Vector3(side, -0.7, 0); pole.addScaledVector(axis, -pole.dot(axis)); pole.normalize();
  const elbow = shoulder.clone().addScaledVector(axis, d / 2).addScaledVector(pole, Math.sqrt(Math.max(0, seg * seg - (d / 2) ** 2)));
  const out = new THREE.Group(), ball = (at, rr) => { const b = new THREE.Mesh(new THREE.SphereGeometry(rr, 12, 10), mat); b.position.copy(at); return b; };
  out.add(stick(shoulder, elbow, r, mat), stick(elbow, hand, r, mat), ball(elbow, r * 1.25), ball(hand, 0.32 * P.doll));
  return out;
}
function drawArms() {
  const k = P.doll, bar = 1.4 * k, S = new THREE.Vector3(0, 4 * k, SHOULDERS);
  const mid = handCards[Math.floor(handCards.length / 2)];
  // Кисть — под рядом карт и чуть за ними, а не на них: карты остаются видны.
  const L = P.anchor === "hand" ? handWorld() : mid ? inner.localToWorld(new THREE.Vector3(0, CAMHAND.y - 0.5, CAMHAND.z - 0.4)) : S.clone();
  const R = new THREE.Vector3(1.15 * bar, 0.3, SHOULDERS - 2.4 * k);
  const sig = [k, L.x, L.y, L.z].map((v) => Math.round(v * 20)).join();
  if (sig === armSig) return;
  armSig = sig; armsG.clear();
  const mat = new THREE.MeshLambertMaterial({ color: 0x7fd1b9 }), r = 0.13 * k;
  armsG.add(arm(S.clone().add(new THREE.Vector3(-bar, 0, 0)), L, -1, r, mat), arm(S.clone().add(new THREE.Vector3(bar, 0, 0)), R, 1, r, mat));
}

// ——— НЕСОМАЯ КАРТА ———
const carried = mkCard(0); carried.visible = false; carried.scale.setScalar(0.62); scene.add(carried);
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(0, 0);
let pointerDown = false;
function placeCarried() {
  carried.visible = P.carry;
  if (!P.carry) { if (lit) { lit = false; buildBowl(); } return; }
  const cam = activeCam(); ray.setFromCamera(ptr, cam);
  const pole = poleY(), maxY = P.cap ? Math.min(P.lift, pole) : P.lift;
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -maxY), hit = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, hit)) return;
  carried.position.copy(hit); carried.lookAt(cam.position);
  const c0 = centre(), Ry = P.R * P.sq, inside = (((hit.x - c0.x) ** 2 + (hit.z - c0.z) ** 2) / P.R ** 2 + ((hit.y - c0.y) / Ry) ** 2) < 1 && hit.y <= pole + 0.01;
  if (inside !== lit) { lit = inside; buildBowl(); }
}

// ——— вид и кадр ———
const activeCam = () => (P.view === "head" ? headCam : P.view === "orbit" ? orbitCam : topCam);
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); for (const c of [headCam, orbitCam, topCam]) { c.aspect = w / h; c.updateProjectionMatrix(); } }
addEventListener("resize", resize); resize();
const strip = document.getElementById("strip");
function frame() {
  const e = eyeAt();
  headCam.position.copy(e); headCam.rotation.order = "YXZ"; headCam.rotation.set(P.pitch * DEG, -yawOf(), 0);
  headCam.fov = P.fov; headCam.updateProjectionMatrix();
  headBall.position.copy(e); headBall.visible = P.view !== "head";
  const cs = [...centre().toArray(), P.R, P.sq, P.cut].map((v) => Math.round(v * 50)).join();
  if (cs !== bowlSig) { bowlSig = cs; buildBowl(); }
  drawArms(); drawAxis();
  if (neck) neck.visible = P.view !== "head";
  const H = new URLSearchParams(location.search).get("hide") ?? ""; armsG.visible = !H.includes("arms"); bodyG.visible = !H.includes("body"); mine.userData.chair.visible = !H.includes("chair");
  placeHand(); placeCarried();
  orbit.enabled = P.view === "orbit"; if (P.view === "orbit") orbit.update();
  // «Полоса сейчас» — прежняя зона: горизонталь на экране на высоте верха руки; едет с кадром (экран), а не с миром.
  strip.style.display = P.style === "strip" && P.view === "head" ? "block" : "none";
  strip.style.top = `${(1 - 0.27) * 100 - 21}%`;
  renderer.render(scene, activeCam());
  requestAnimationFrame(frame);
}

// ——— ввод ———
let last = null;
const ptrOf = (e) => { const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
canvas.addEventListener("pointerdown", (e) => { pointerDown = true; last = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); ptrOf(e); });
canvas.addEventListener("pointermove", (e) => {
  if (P.carry && pointerDown) ptrOf(e);
  else if (P.moveHand && pointerDown && last) { P.hx = Math.max(-3, Math.min(3, P.hx + (e.clientX - last.x) * 0.012)); P.hy = Math.max(-3, Math.min(3, P.hy - (e.clientY - last.y) * 0.012)); sync(); }
  else if (pointerDown && P.view === "head" && last) {
    P.yaw = Math.max(-180, Math.min(180, P.yaw + (e.clientX - last.x) * 0.25));
    P.pitch = Math.max(-85, Math.min(15, P.pitch - (e.clientY - last.y) * 0.25));
    sync();
  }
  last = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointerup", () => { pointerDown = false; });

// ——— ручки ———
const views = document.getElementById("views"), knobs = document.getElementById("knobs"), hint = document.getElementById("hint");
const VIEWS = [["head", "Голова"], ["orbit", "Вокруг"], ["top", "Сверху"]];
const HANDS = [["head", "К голове (сейчас)"], ["cap", "К голове, не выше потолка"], ["yaw", "Только за поворотом"], ["world", "На месте"]];
const ANCHOR_BTNS = [["head", "Голова"], ["chest", "Плечи"], ["hip", "Таз"], ["hand", "Кисть"]];
const STYLES = [["strip", "Полоса (сейчас)"], ["frame", "Рамка"], ["wire", "Сетка"], ["shell", "Оболочка"]];
const SLIDERS = [["capElev", "Потолок руки, °", -85, 0, 1], ["R", "Радиус чаши", 1, 6, 0.1], ["cut", "Чаша: высота, %", 10, 50, 1], ["sq", "Чаша: сжатие дна ×", 0.2, 1.6, 0.05], ["ay", "Якорь: высота ±", -6, 6, 0.1], ["cards", "Карт в руке", 1, 15, 1], ["size", "Размер карт", 0.5, 1.2, 0.05], ["fov", "Угол обзора", 55, 100, 1], ["viewH", "Высота обзора", 0, 9, 0.5], ["doll", "Размер людей", 0.4, 1.4, 0.05], ["hx", "Кисть: вбок", -3, 3, 0.05], ["hy", "Кисть: вверх", -3, 3, 0.05], ["hz", "Кисть: от себя", -3, 3, 0.05], ["yaw", "Взгляд: поворот", -180, 180, 1], ["pitch", "Взгляд: наклон", -85, 15, 1], ["lift", "Палец: высота", 0, 9, 0.1]];
function buildUi() {
  views.innerHTML = VIEWS.map(([k, t]) => `<button data-view="${k}" class="${P.view === k ? "on" : ""}">${t}</button>`).join("");
  const seg = (title, list, key) => `<div class="grp">${title}</div><div class="row">${list.map(([k, t]) => `<button data-set="${key}:${k}" class="${P[key] === k ? "on" : ""}">${t}</button>`).join("")}</div>`;
  knobs.innerHTML = seg("Рука", HANDS, "hand") + seg("Ось руки и чаши", ANCHOR_BTNS, "anchor") + seg("Зона «в руку»", STYLES, "style")
    + `<div class="grp">Палец</div><div class="row"><button data-tog="carry" class="${P.carry ? "on" : ""}">Нести карту</button><button data-tog="cap" class="${P.cap ? "on" : ""}">Потолок = полюс</button></div>`
    + `<div class="row" style="margin-top:6px"><button data-tog="show" class="${P.show ? "on" : ""}">Чаша видна</button><button data-tog="axis" class="${P.axis ? "on" : ""}">Ось видна</button><button data-tog="moveHand" class="${P.moveHand ? "on" : ""}">Двигать кисть пальцем</button><button data-reset>Оставить руку здесь</button></div>`
    + `<div class="grp">Числа</div>` + SLIDERS.map(([k, t, lo, hi, st]) => `<div class="k"><span>${t}</span><input type="range" data-k="${k}" min="${lo}" max="${hi}" step="${st}" value="${P[k]}"><b data-v="${k}">${Math.round(P[k] * 100) / 100}</b></div>`).join("")
    + `<small>Нести карту: тяни по экрану, карта идёт за пальцем. Сейчас: вид «${VIEWS.find((v) => v[0] === P.view)[1]}».</small>`;
  hint.textContent = P.view === "head" ? "Тяни по экрану — вертишь головой. Рука идёт за взглядом, но выше потолка не поднимается: взгляд вверх — рука остаётся внизу." : P.view === "orbit" ? "Свободная камера: чаша вокруг головы игрока, рука на ней." : "Сверху: чаша — круг вокруг головы над стулом.";
}
function sync() { for (const [k] of SLIDERS) { const i = knobs.querySelector(`[data-k="${k}"]`); if (i) { i.value = P[k]; knobs.querySelector(`[data-v="${k}"]`).textContent = Math.round(P[k] * 100) / 100; } } }
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "opener") { stage.classList.toggle("open"); return; }
  if (b.dataset.view) { P.view = b.dataset.view; buildUi(); }
  else if (b.dataset.set) { const [k, v] = b.dataset.set.split(":"); P[k] = v; if (k === "hand" && v === "world") frozenYaw = -yawOf(); buildUi(); buildBowl(); }
  else if (b.dataset.tog) { P[b.dataset.tog] = !P[b.dataset.tog]; buildUi(); buildBowl(); }
  else if (b.dataset.reset !== undefined) frozenYaw = -yawOf();
});
document.addEventListener("input", (e) => {
  const i = e.target.closest("[data-k]"); if (!i) return;
  P[i.dataset.k] = Number(i.value); knobs.querySelector(`[data-v="${i.dataset.k}"]`).textContent = Math.round(P[i.dataset.k] * 100) / 100;
  if (i.dataset.k === "cards") buildHand(); else if (i.dataset.k === "doll" || i.dataset.k === "viewH") { buildBody(); buildBowl(); } else buildBowl();
});
for (const [k, v] of new URLSearchParams(location.search)) if (k in P) P[k] = typeof P[k] === "number" ? Number(v) : typeof P[k] === "boolean" ? v === "1" : v;
if (new URLSearchParams(location.search).has("open")) stage.classList.add("open");
frozenYaw = -yawOf();
buildUi(); buildBody(); buildHand(); buildBowl(); frame();
window.__bowl = { probe() { const box = new THREE.Box3().setFromObject(bowl), bc = box.getCenter(new THREE.Vector3()), mid = handCards[Math.floor(handCards.length / 2)]; return { centre: centre().toArray(), bowl: [bc.x, box.max.y, bc.z], wrist: handWorld().toArray(), cards: mid.getWorldPosition(new THREE.Vector3()).toArray() }; }, P, set(k, v) { P[k] = v; buildUi(); buildBody(); buildBowl(); buildHand(); } };
</script>
</body>
