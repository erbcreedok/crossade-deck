<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Хаб: первая страница — стенд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet&family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<script src="shelf.js?v=09120021"></script>
<style>
  body { margin: 0; background: #0d2118; color: #cdb98f; font: 400 16px/1.45 'Handjet', monospace; }
  .page { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; padding: 32px; }
  .phone { flex: none; width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 44px; background: #173d2d; box-shadow: inset 0 0 0 3px #0b0704; }
  .phone canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { flex: 1; min-width: 320px; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font: 400 26px/1.2 'Tiny5', monospace; color: #f2c14e; }
  .sec { padding: 12px 14px; background: #123527; box-shadow: inset 0 0 0 3px #0b0704, inset 0 0 0 5px #3a2a1d; display: flex; flex-direction: column; gap: 6px; }
  .sec h2 { margin: 0 0 4px; font: 400 16px/1.2 'Tiny5', monospace; color: #f2c14e; }
  .row { display: grid; grid-template-columns: 160px 1fr 56px; align-items: center; gap: 8px; }
  .row label { color: #f5ead0; }
  .row input[type=range] { width: 100%; }
  .row select, .row input[type=checkbox] { justify-self: start; }
  .row .val { color: #f2c14e; text-align: right; font: 400 14px 'Press Start 2P', monospace; }
  .nums { font-size: 15px; }
  .nums b { color: #f2c14e; font-weight: 400; }
  .bad { color: #e0483f; }
  button.reset { align-self: flex-start; font: inherit; color: #f2c14e; background: none; border: 2px solid #f2c14e; padding: 4px 10px; cursor: pointer; }
  .knob { display: none; }
  @media (max-width: 700px), (pointer: coarse) and (max-width: 1000px) {
    body { overflow: hidden; }
    .page { padding: 0; gap: 0; }
    .phone { position: fixed; inset: 0; width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; max-width: none; max-height: 72dvh; overflow: auto; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); box-sizing: border-box;
      background: #0d2118; box-shadow: 0 -3px 0 #0b0704, 0 -6px 0 #3a2a1d; transform: translateY(100%); transition: transform .22s cubic-bezier(.2,.85,.25,1); z-index: 30; }
    .panel.open { transform: none; }
    .knob { display: flex; position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 40; width: 46px; height: 46px; border-radius: 8px; align-items: center; justify-content: center;
      background: linear-gradient(#25321f, #16210f); box-shadow: inset 0 0 0 3px #0b0704, inset 0 0 0 5px #6b4d2c, 0 4px 0 rgba(11,7,4,.6); color: #f2c14e; font: 400 9px 'Tiny5', monospace; }
    h1 { font-size: 20px; }
    .row { grid-template-columns: 130px 1fr 44px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="phone" id="phone"><canvas id="shelf"></canvas><div id="over"></div></div>
  <div class="knob" id="knob">РУЧКИ</div>
  <div class="panel" id="panel">
    <h1>Хаб: первая страница — стенд</h1>
    <div>Полка — холст, как в продукте. Профиль — то, что над ней. Кнопки входа здесь нет: игрока не встречают авторизацией. Подталкивает к ней само имя — его выдаёт стол, и жить с ним не хочется. Состояние ручек живёт в адресе.</div>
    <div id="controls"></div>
    <div class="nums" id="nums"></div>
    <button class="reset" id="reset">сбросить к дизайну</button>
  </div>
</div>
<script>
(function () {
  const T = window.HubStand.T;
  const phone = document.getElementById("phone");
  const over = document.getElementById("over");
  const real = () => matchMedia("(max-width: 700px), (pointer: coarse) and (max-width: 1000px)").matches;
  const glass = () => ({ W: phone.clientWidth || 390, H: phone.clientHeight || 844 });

  const SPEC = [
    ["Кто ты", [
      ["who", "состояние", "enum", "гость", ["гость", "вошёл"]],
      ["seed", "перекатить имя гостя", "int", 0, 0, 399],
      ["profile", "профиль", "enum", "аватар + имя + уровень", ["аватар + имя + уровень", "аватар + имя", "только аватар", "нет"]],
      ["av", "аватар, px", "int", 34, 22, 52],
      ["profileSide", "где профиль", "enum", "справа", ["справа", "слева"]],
    ]],
    ["Экран профиля", [
      ["open", "открыт", "bool", false],
      ["sheet", "как открывается", "enum", "лист снизу", ["лист снизу", "во весь экран"]],
      ["offer", "телеграм предлагает своё", "enum", "нет", ["нет", "имя", "аватар"]],
      ["mine", "своё имя", "text", ""],
      ["emoji", "свой аватар", "text", ""],
      ["colour", "любимый цвет", "int", 0, 0, 7],
    ]],
    ["Куда зайти", [
      ["seats", "твоих столов", "int", 1, 0, 3],
      ["turn", "где-то твой ход", "bool", true],
      ["mates", "стол с друзьями", "bool", true],
    ]],
    ["Полоса", [
      ["h", "высота полосы, px", "int", 44, 0, 96],
      ["side", "боковое поле, px", "int", 12, 0, 40],
      ["gap", "зазор, px", "int", 8, 0, 24],
      ["radius", "скругление, px", "int", 8, 0, 28],
      ["fill", "подложка", "enum", "нет", ["нет", "стекло", "дерево", "тёмная", "градиент вниз"]],
      ["notch", "чёлка (на маке), px", "int", 0, 0, 64],
    ]],
    ["Полка", [
      ["title", "заголовок Crossade", "bool", true],
      ["titleSize", "заголовок, px", "int", 22, 12, 36],
      ["columns", "колонок", "int", 2, 1, 2],
      ["tileGap", "зазор плиток, px", "int", 16, 6, 40],
      ["margin", "поле полки, px", "int", 20, 6, 48],
    ]],
  ];
  const DEFAULTS = {};
  for (const [, rows] of SPEC) for (const [key, , , def] of rows) DEFAULTS[key] = def;

  const readHash = () => {
    const out = { ...DEFAULTS };
    const h = location.hash.replace(/^#/, "");
    if (!h) return out;
    for (const pair of h.split("&")) {
      const [k, v] = pair.split("=").map(decodeURIComponent);
      if (!(k in DEFAULTS)) continue;
      const def = DEFAULTS[k];
      out[k] = typeof def === "number" ? Number(v) : typeof def === "boolean" ? v === "1" : v;
    }
    return out;
  };
  const writeHash = (P) => {
    const parts = [];
    for (const k in DEFAULTS) if (P[k] !== DEFAULTS[k]) parts.push(`${encodeURIComponent(k)}=${encodeURIComponent(typeof P[k] === "boolean" ? (P[k] ? "1" : "0") : P[k])}`);
    history.replaceState(null, "", parts.length ? `#${parts.join("&")}` : location.pathname);
  };
  let P = readHash();

  const controls = document.getElementById("controls");
  const build = () => {
    controls.innerHTML = "";
    for (const [title, rows] of SPEC) {
      const sec = document.createElement("div");
      sec.className = "sec";
      sec.innerHTML = `<h2>${title}</h2>`;
      for (const [key, label, kind, , a, b] of rows) {
        const row = document.createElement("div");
        row.className = "row";
        const lab = document.createElement("label");
        lab.textContent = label;
        row.appendChild(lab);
        const val = document.createElement("span");
        val.className = "val";
        let input;
        if (kind === "int") {
          input = document.createElement("input");
          input.type = "range"; input.min = a; input.max = b; input.step = 1; input.value = P[key];
          val.textContent = P[key];
          input.oninput = () => { P[key] = Number(input.value); val.textContent = input.value; apply(); };
        } else if (kind === "enum") {
          input = document.createElement("select");
          for (const opt of a) { const o = document.createElement("option"); o.value = opt; o.textContent = opt; o.selected = P[key] === opt; input.appendChild(o); }
          input.onchange = () => { P[key] = input.value; apply(); };
        } else if (kind === "text") {
          input = document.createElement("input");
          input.type = "text"; input.value = P[key];
          input.oninput = () => { P[key] = input.value; apply(); };
        } else {
          input = document.createElement("input");
          input.type = "checkbox"; input.checked = !!P[key];
          input.onchange = () => { P[key] = input.checked; apply(); };
        }
        row.appendChild(input); row.appendChild(val);
        sec.appendChild(row);
      }
      controls.appendChild(sec);
    }
  };
  document.getElementById("reset").onclick = () => { P = { ...DEFAULTS }; build(); apply(); };
  const panel = document.getElementById("panel");
  document.getElementById("knob").onclick = () => panel.classList.toggle("open");

  const ICON = {
    person: '<circle cx="12" cy="8.5" r="3.4"/><path d="M5 20c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/>',
  };

  // ИМЯ ГОСТЯ — НЕ «Гость 4821», А КЛИЧКА, КОТОРУЮ ХОЧЕТСЯ СМЕНИТЬ.
  //
  // Номерное имя ничего с человеком не делает: он его не читает и не помнит. Кличка, выданная
  // столом, работает как приглашение — назваться самому или войти через телегу и принести своё имя.
  // Это единственный толчок к авторизации на первой странице; кнопки входа здесь нет.
  //
  // Список лежит двумя массивами и правится в одну строку — он ещё будет расти.
  const GUEST_ADJ = [
    "Оранжевый", "Золотой", "Синий", "Бешеный", "Потный", "Грязный", "Пьяный", "Наглый",
    "Липкий", "Кривой", "Дохлый", "Тухлый", "Мятый", "Драный", "Вонючий", "Дерзкий",
    "Голый", "Жирный", "Хмурый", "Скользкий",
  ];
  const GUEST_NOUN = [
    "сутенёр", "дождь", "барыга", "алкаш", "шулер", "валет", "гопник", "утюг",
    "веник", "чебурек", "таракан", "огурец", "батон", "жлоб", "хряк", "тапок",
    "шакал", "кабан", "носок", "бомж",
  ];
  // Ползунок перебирает ВСЕ пары, а не каждую двадцатую: прилагательное крутится быстрым
  // разрядом, существительное медленным. При общем множителе пары повторялись бы каждые двадцать
  // делений, и половина списка никогда бы не показалась.
  /** Любимый цвет — восемь, а не колесо: цвет должен быть узнаваем за столом, а не подобран. */
  /**
   * КУДА ЗАЙТИ — не список, а две-три подсказки на первой странице, до выбора игры.
   *
   * Человек чаще ВОЗВРАЩАЕТСЯ, чем выбирает: у него уже есть стол, где держится его место, и стол,
   * за которым сидят друзья. Полка отвечает на вопрос «во что», а этот ряд — на вопрос «куда», и у
   * вернувшегося он первый.
   *
   * Ряд пропадает целиком, когда предлагать нечего: пустая полоса «пока ничего» занимает место и
   * не говорит ничего.
   */
  const COMEBACK = [
    { code: "2781", game: "Карты", sign: "\u2660" },
    { code: "2918", game: "Нарды", sign: "\uD83C\uDFB2" },
    { code: "1685", game: "Шахматы", sign: "\u265E" },
  ];

  const PALETTE = ["#f2c14e", "#7fd1b9", "#e08b3f", "#b98fe0", "#8fb4e0", "#e0483f", "#a8e08f", "#e08fb4"];

  const guestName = (seed) => `${GUEST_ADJ[seed % GUEST_ADJ.length]} ${GUEST_NOUN[Math.floor(seed / GUEST_ADJ.length) % GUEST_NOUN.length]}`;
  const svg = (body, size, color, w) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  const apply = () => {
    writeHash(P);
    const { W, H } = glass();
    const inset = real() ? "env(safe-area-inset-top, 0px)" : P.notch + "px";
    const h = P.h, r = P.radius, gap = P.gap;
    const guest = P.who === "гость";
    /** Имя ЕГО — назвался сам или принял телеграмное. Иначе на нём висит кличка стола. */
    const named = !!P.mine;

    const FILLS = {
      "нет": "",
      "стекло": `background:rgba(11,7,4,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);`,
      "дерево": `background:linear-gradient(#3a2a1d,#241a11);`,
      "тёмная": `background:${T.well};`,
      "градиент вниз": `background:linear-gradient(rgba(11,7,4,.9), rgba(11,7,4,0));`,
    };

    // ПРОФИЛЬ. У гостя он тоже есть — потому что гость у нас не «никто», а аккаунт без привязанных
    // дверей: имя, цвет и прогресс копятся с первого касания. Разница в том, что имя ему выдал
    // стол, а не он сам, — и это единственное, что на первой странице подталкивает назваться или
    // войти. Кнопки входа здесь нет: она живёт там, где без личности действительно нет ответа.
    const av = P.av;
    // ЧЬЁ ИМЯ СЕЙЧАС НА ЭКРАНЕ: своё, если назвался или принял телеграмное; иначе выданное столом.
    // Привязка телеграма сама по себе имени не меняет — см. «Привязать» ниже.
    const name = P.mine || guestName(P.seed);
    const ink = named ? PALETTE[P.colour] : T.well;
    const faceOf = (size) => P.emoji
      ? `<span style="font-size:${Math.round(size * 0.56)}px;line-height:1">${esc(P.emoji)}</span>`
      : named
        ? `<span style="font:400 ${Math.round(size * 0.42)}px 'Tiny5',monospace;color:${T.black}">${esc(name[0] || "?")}</span>`
        : svg(ICON.person, Math.round(size * 0.62), T.inkDim);
    const ballOf = (size, ring) => `<span style="flex:none;width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;`
      + `background:${P.emoji ? T.well : ink};box-shadow:inset 0 0 0 3px ${T.black}${ring ? `,0 0 0 ${ring}px ${ink}` : ""}">${faceOf(size)}</span>`;
    const avatar = ballOf(av, named ? 2 : 0);
    const words = P.profile === "только аватар" || !name ? "" :
      `<span style="display:flex;flex-direction:column;line-height:1.1">`
      + `<span style="font:400 ${Math.max(11, Math.round(av * 0.42))}px 'Tiny5',monospace;color:${T.ink};white-space:nowrap">${esc(name)}</span>`
      + (P.profile === "аватар + имя + уровень" ? `<span style="font:400 ${Math.max(8, Math.round(av * 0.3))}px 'Tiny5',monospace;color:${T.inkDim}">${guest ? "гость" : "уровень 7"}</span>` : "")
      + `</span>`;
    const profile = P.profile === "нет" ? ""
      : `<div data-g="profile" style="display:flex;align-items:center;gap:${Math.max(6, gap)}px;cursor:pointer">${avatar}${words}</div>`;

    // ---- ЭКРАН ПРОФИЛЯ ----
    //
    // Открывается нажатием на профиль и больше ниоткуда: это не раздел меню, а «вот я» — потому
    // туда же и попадают, ткнув в себя.
    //
    // ВВОД ИМЕНИ НЕ ЖИВЁТ НА ХОЛСТЕ. В продукте поле спрашивает внешний слой (в MiniApp — телега,
    // в браузере — окно ввода), потому что своя клавиатура на канвасе это отдельный проект с
    // автодополнением, эмодзи и выделением. Здесь, на стенде, это `prompt` — тот же договор:
    // экран просит строку у кого-то ещё и получает её готовой.
    const line = (inner, top) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;`
      + `${top ? `box-shadow:inset 0 3px 0 -1px rgba(11,7,4,.55);` : ""}">${inner}</div>`;
    const label = (t) => `<span style="font:400 14px 'Tiny5',monospace;color:${T.inkDim}">${t}</span>`;
    const value = (t) => `<span style="font:400 15px 'Tiny5',monospace;color:${T.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t}</span>`;
    const act = (id, t, kind) => `<button data-do="${id}" style="flex:none;font:400 13px 'Tiny5',monospace;cursor:pointer;border:0;border-radius:${r}px;padding:8px 12px;`
      + (kind === "gold"
        ? `background:linear-gradient(#f8d885 0%,#f2c14e 48%,#b08a26 100%);box-shadow:inset 0 0 0 3px ${T.black},0 2px 0 rgba(11,7,4,.6);color:${T.black};`
        : kind === "quiet"
          ? `background:transparent;box-shadow:inset 0 0 0 2px ${T.wood};color:${T.inkDim};`
          : `background:linear-gradient(#25321f,#16210f);box-shadow:inset 0 0 0 3px ${T.black},inset 0 0 0 5px ${T.wood},0 3px 0 rgba(11,7,4,.55);color:${T.ink};`)
      + `">${t}</button>`;

    const swatches = PALETTE.map((c, i) => `<button data-do="colour:${i}" style="width:30px;height:30px;border:0;border-radius:50%;cursor:pointer;background:${c};`
      + `box-shadow:inset 0 0 0 3px ${T.black}${i === P.colour ? `,0 0 0 3px ${T.ink}` : ""}"></button>`).join("");

    // ПРЕДЛОЖЕНИЕ ИЗ ТЕЛЕГРАМА — по одному за раз: сначала имя, потом аватар. Два вопроса разом
    // читаются как «прими всё или ничего», а человек чаще хочет чужое имя и своё лицо.
    const offerCard = (what) => `<div style="background:${T.well};box-shadow:inset 0 0 0 3px ${T.black},inset 0 0 0 5px ${T.wood};border-radius:${r + 4}px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">`
      + `<span style="font:400 14px 'Tiny5',monospace;color:${T.ink};line-height:1.5">`
      + (what === "имя" ? `В Telegram тебя зовут <b style="color:${T.gold}">Ербол</b>. Взять это имя сюда?` : `Взять аватар из Telegram?`)
      + `</span><div style="display:flex;gap:8px;align-items:center">`
      + (what === "аватар" ? `<span style="flex:none;width:34px;height:34px;border-radius:50%;background:${T.gold};box-shadow:inset 0 0 0 3px ${T.black};display:flex;align-items:center;justify-content:center;font:400 14px 'Tiny5',monospace;color:${T.black}">Е</span>` : "")
      + act(what === "имя" ? "take-name" : "take-face", "Взять", "gold") + act("skip-offer", "Оставить своё", "quiet") + `</div></div>`;

    const tgRow = guest
      ? line(label("Telegram") + act("tg", "Привязать", "gold"))
      : line(label("Telegram") + value("@erbol") + act("tg-off", "Отвязать", "quiet"), true);

    const body = `<div style="display:flex;flex-direction:column;gap:0;padding:0 18px 22px">`
      + `<div style="display:flex;align-items:center;gap:14px;padding:6px 0 16px">`
      + ballOf(64, named ? 3 : 0)
      + `<div style="display:flex;flex-direction:column;gap:4px;min-width:0">`
      + `<span style="font:400 19px 'Tiny5',monospace;color:${T.ink};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>`
      + `<span style="font:400 12px 'Tiny5',monospace;color:${named ? T.inkDim : T.gold}">${named ? (guest ? "гость" : "уровень 7") : "имя выдал стол"}</span>`
      + `</div></div>`
      + (P.offer !== "нет" ? offerCard(P.offer) + `<div style="height:14px"></div>` : "")
      + line(label("Имя") + value(esc(name)) + act("name", P.mine || !guest ? "Сменить" : "Назваться", P.mine || !guest ? "" : "gold"), true)
      + line(label("Аватар") + act("emoji", P.emoji ? "Сменить эмодзи" : "Эмодзи", "") + act("picture", "Картинка", "quiet"), true)
      + line(`<div style="display:flex;flex-direction:column;gap:9px;width:100%">${label("Любимый цвет")}<div style="display:flex;gap:8px;flex-wrap:wrap">${swatches}</div></div>`, true)
      + tgRow
      // ССЫЛКА — ЭТО «ЗАБЕРИ СЕБЯ», А НЕ «ПОДЕЛИСЬ». Её показывают на своём экране и открывают на
      // своём же втором устройстве; в чужой чат такое не кладут, и текст обязан это говорить.
      + line(`<div style="display:flex;flex-direction:column;gap:7px;width:100%">`
        + label("Открыть на другом устройстве")
        + `<span style="font:400 12px 'Tiny5',monospace;color:${T.inkDim};line-height:1.5">Ссылка переносит СЕБЯ, а не приглашает: никому не отправляй.</span>`
        + `<div style="display:flex;gap:8px;align-items:center">${act("link", "Показать ссылку", "")}${act("qr", "QR", "quiet")}</div></div>`, true)
      + `</div>`;

    const asSheet = P.sheet === "лист снизу";
    const screen = P.open
      ? `<div data-g="screen" style="position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:${asSheet ? "flex-end" : "stretch"};`
        + `background:rgba(11,7,4,${asSheet ? ".55" : "0"})">`
        + `<div style="background:${T.felt};box-shadow:inset 0 0 0 3px ${T.black},inset 0 0 0 5px ${T.panel};`
        + (asSheet ? `border-radius:${r + 10}px ${r + 10}px 0 0;max-height:82%;` : `flex:1;`)
        + `overflow:auto;padding-top:${asSheet ? "0" : inset}">`
        + `<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px">`
        + `<span style="font:400 16px 'Tiny5',monospace;color:${T.gold};letter-spacing:.08em">ПРОФИЛЬ</span>`
        + act("close", "Закрыть", "quiet") + `</div>${body}</div></div>`
      : "";

    const cards = [];
    for (let i = 0; i < P.seats; i += 1) {
      const c = COMEBACK[i];
      cards.push({ ...c, said: i === 0 && P.turn ? "твой ход" : i === 1 ? "все вышли · ждёт" : "твой стул", hot: i === 0 && P.turn });
    }
    if (P.mates) cards.push({ code: "1137", game: "Карты", sign: "\u2660", said: "Марат и Алия", hot: false });

    const card = (c) => `<button data-do="go:${c.code}" style="flex:none;width:172px;text-align:left;cursor:pointer;border:0;border-radius:12px;padding:10px 11px;`
      + `background:${T.well};box-shadow:inset 0 0 0 3px ${T.black},inset 0 0 0 5px ${c.hot ? T.gold : T.wood};display:flex;align-items:center;gap:10px">`
      + `<span style="flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${T.black};font-size:17px">${c.sign}</span>`
      + `<span style="display:flex;flex-direction:column;gap:3px;min-width:0">`
      + `<span style="font:400 11px 'Press Start 2P',monospace;color:${T.gold}">${c.code}</span>`
      + `<span style="font:400 10px 'Tiny5',monospace;color:${c.hot ? T.gold : T.inkDim};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.game} · ${c.said}</span>`
      + `</span></button>`;

    // ПОД ЗАГОЛОВКОМ, А НЕ НАД НИМ. «Crossade» — это имя места, и оно должно встречать первым;
    // подсказки «куда зайти» идут следом, между именем и полкой, где их и ищут глазами.
    const comeback = !cards.length ? "" :
      `<div data-g="comeback" style="position:absolute;left:0;right:0;top:calc(${inset} + ${h + 18 + (P.title ? P.titleSize + 12 : 0)}px);z-index:8;display:flex;flex-direction:column;gap:7px">`
      + `<span style="font:400 10px 'Tiny5',monospace;letter-spacing:.1em;color:${T.inkDim};opacity:.75;padding:0 ${P.side}px">КУДА ЗАЙТИ</span>`
      + `<div style="display:flex;gap:8px;overflow:auto;padding:0 ${P.side}px 2px">${cards.map(card).join("")}</div></div>`;

    const band = `padding-top:${inset};${FILLS[P.fill]}`;
    const rowIn = `display:flex;align-items:center;justify-content:${P.profileSide === "слева" ? "flex-start" : "flex-end"};height:${h}px;padding:0 ${P.side}px;box-sizing:border-box`;

    // ШАПКА — ОДИН БЛОК В ПОТОКЕ, и это не косметика: холст обязан начать полку под ней, а её
    // высота складывается из полосы и чёлки. Пока шапка была тремя absolute-кусками, заголовок
    // «Crossade» лежал под тем, что висело ниже полосы.
    over.innerHTML = `<div data-g="head" style="position:absolute;left:0;right:0;top:0;z-index:9">`
      + `<div style="${band}"><div style="${rowIn}">${profile}</div></div></div>` + comeback + screen;

    // ДЕЙСТВИЯ. Экран пересобирается целиком на каждую правку, поэтому слушатели вешаются после
    // сборки — это дешевле, чем держать узлы живыми ради одного обработчика.
    for (const el of over.querySelectorAll('[data-do^="go:"]')) {
      el.onclick = (e) => { e.stopPropagation(); alert("Наружу уходит «войти в комнату " + el.getAttribute("data-do").slice(3) + "»"); };
    }

    const profileEl = over.querySelector('[data-g="profile"]');
    if (profileEl) profileEl.onclick = () => { P.open = true; build(); apply(); };
    for (const el of over.querySelectorAll("[data-do]")) {
      el.onclick = () => {
        const does = el.getAttribute("data-do");
        if (does.startsWith("colour:")) P.colour = Number(does.slice(7));
        else if (does === "close") P.open = false;
        else if (does === "name") { const got = prompt("Как тебя звать?", P.mine || name); if (got !== null) P.mine = got.trim(); }
        else if (does === "emoji") { const got = prompt("Эмодзи для аватара", P.emoji || "🃏"); if (got !== null) P.emoji = got.trim(); }
        else if (does === "picture") alert("Картинка — выбор файла, на стенде не нужен");
        else if (does === "tg") {
          // ВХОД ЧЕРЕЗ ТЕЛЕГРАМ С НУЛЯ — ИМЯ И ЛИЦО СТЯГИВАЮТСЯ МОЛЧА: спрашивать «взять ли твоё
          // имя» у того, у кого имени ещё нет, незачем. Спрашиваем, только если своё уже есть, и
          // тогда по одному вопросу за раз — сначала имя, потом аватар.
          P.who = "вошёл";
          if (!P.mine && !P.emoji) { P.mine = "Ербол"; P.emoji = "🙂"; P.offer = "нет"; }
          else P.offer = P.mine ? "имя" : "аватар";
        }
        else if (does === "tg-off") { P.who = "гость"; P.offer = "нет"; }
        else if (does === "take-name") { P.mine = "Ербол"; P.offer = P.emoji ? "аватар" : "нет"; }
        else if (does === "take-face") { P.emoji = "🙂"; P.offer = "нет"; }
        else if (does === "skip-offer") P.offer = P.offer === "имя" && P.emoji ? "аватар" : "нет";
        else if (does === "link" || does === "qr") alert("Ссылка/QR — на стенде не рисуем");
        build();
        apply();
      };
    }

    // ---- ЧИСЛА ----
    const widthOf = (g) => { const el = over.querySelector(`[data-g="${g}"]`); return el ? Math.round(el.getBoundingClientRect().width) : 0; };
    const heightOf = (g) => { const el = over.querySelector(`[data-g="${g}"]`); return el ? Math.round(el.getBoundingClientRect().height) : 0; };
    const insetPx = Math.round(parseFloat(getComputedStyle(over.firstElementChild.firstElementChild).paddingTop)) || 0;
    const wProfile = widthOf("profile");
    const headTop = heightOf("head");
    document.getElementById("nums").innerHTML =
      `экран <b>${W}×${H}</b> · шапка <b>${headTop}</b> px, из них чёлка <b>${insetPx}</b> · полке остаётся <b>${H - headTop}</b> px<br>`
      + `профиль <b>${wProfile}</b> px с полями из <b>${W}</b><br>`
      + (wProfile + 2 * P.side > W ? `<span class="bad">не влезает: ${wProfile + 2 * P.side - W} px лишних</span><br>` : "")
      + (cards.length ? `куда зайти: <b>${cards.length}</b> · полке остаётся <b>${H - headTop}</b> px<br>` : `куда зайти: ряда нет — предлагать нечего<br>`)
      + (guest ? `имя выдано столом: <b>${esc(guestName(P.seed))}</b> — оно и есть приглашение назваться` : `вошёл: имя своё, менять нечего`);

    window.HubStand.draw(document.getElementById("shelf"), {
      W, H, top: headTop, afterTitle: heightOf("comeback"),
      title: P.title, titleSize: P.titleSize, columns: P.columns, tileGap: P.tileGap, margin: P.margin,
    });
  };

  build();
  apply();
  addEventListener("hashchange", () => { P = readHash(); build(); apply(); });
  addEventListener("resize", apply);
  addEventListener("orientationchange", apply);
})();
</script>
</body>
</html>
