<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стенд жеста — стол, рука, два тултипа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0704; overscroll-behavior: none; }
  body { font: 400 13px Tiny5, monospace; color: #f5ead0; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
  /*
    ХОЛСТУ CSS-РАЗМЕР НУЖЕН ЯВНО. Без него абсолютно позиционированный canvas берёт свою
    СОБСТВЕННУЮ ширину — ту, что стоит в атрибуте, а там пиксели устройства. На ноутбуке, где их
    один к одному, не видно ничего; на телефоне холст становится вдвое-втрое больше стекла и
    прилипает к левому верхнему углу — стол уезжает вниз-вправо и вырастает ровно во столько же раз.
  */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; }
</style>
</head>
<body>
<!--
  СТЕНД ЖЕСТА — дубликат `/table`, раздетый до того, ради чего он заводится.
  ЧТО ЗДЕСЬ ЕСТЬ: стол (по настоящим правилам — `felt.js`), МОЯ рука внизу — тот самый нижний HUD,
  что стоит в продукте, — и два бота, у каждого свой тултип с его рукой.
  ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ: списка «за столом», экрана комнаты, профиля и таблицы прав. Они уже
  сделаны и здесь только мешают: стенд отвечает на один вопрос, иначе он отвечает на все сразу плохо.
-->
<div id="stage">
  <canvas id="felt"></canvas>
  <div id="over"></div>
</div>
<script src="felt.js"></script>
<script>
(function () {
  const T = {
    black: "#0b0704", ink: "#f5ead0", inkDim: "#cdb98f", gold: "#f2c14e",
    well: "#1c120b", panel: "#3a2a1d", panelLight: "#4a3627", wood: "#6b4d2c",
  };
  /** Кнопка бара, её цвета — содержание, как и дерево стула (`BAR_LOOK`). */
  const BAR_LOOK = { plateHi: "#25321f", plateLo: "#16210f", rim: "#6b4d2c", goldHi: "#f8d885", goldLo: "#b08a26" };

  /**
   * НИЖНИЙ БАР И ПОЛОСА РУКИ — числа продукта, до последней доли (`handBar.BAR`, `handHud`).
   * Единица здесь НЕ единица сукна: HUD живёт на стекле и меряется своей (`HUD_UNIT_FRACTION`).
   */
  const BAR = { size: 0.6, gap: 0.08, margin: 0.22, pad: 0.11, radius: 0.11, line: 0.04, tuck: 0.24, fade: 1 };
  const HUD_FAN = { radius: 7, apart: 1.06, shut: 0.14, edge: 0.1 };
  const HUD_CARDS = 6, HUD_GAP = 0.06, HUD_MARGIN = 0.14, HAND_PAD = 0.16, TUCK_TIP = 0.45;
  /**
   * НА СКОЛЬКО НЕСОМАЯ КАРТА ВИСИТ ВЫШЕ ТОГО МЕСТА, КУДА ОНА ЛЕТИТ (`CARRY_CLEAR`).
   *
   * Держимое, нарисованное ПОВЕРХ контура, закрывает единственное, ради чего контур и есть: куда
   * это едет. Доля от высоты самой карты, а не пиксели, — тогда карта расчищает карту, а стопка
   * расчищает стопку.
   */
  const CARRY_CLEAR = 0.32;
  /** Комната под рядом — под язычок, которым руку поднимают целиком (`handRoom`). */
  const HAND_ROOM = 0.6 / 4 + 0.06;
  const HUD_UNIT_FRACTION = 0.25;
  const CARD = { w: 1, h: 1.4 };

  const RIGHTS = ["pin", "lock", "hide"];
  const FOLDS = ["fan", "shrink", "tuck"];
  const POSES = ["flip", ...FOLDS];
  /** Значки — те же, что рисует продукт (`GLYPHS` в `handBar.ts`). */
  const GLYPH = {
    pin: '<path d="M9 3h6l-1 6h2l1 5H7l1-5h2L9 3z"/><path d="M12 14v7"/>',
    lock: '<path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M5 11h14v10H5z"/>',
    hide: '<path d="M3 3l18 18"/><path d="M10.6 6.2A9 9 0 0 1 22 12s-1.5 2.6-4.3 4.5"/><path d="M6.4 7.6C3.9 9.3 2 12 2 12s4 7 10 7c1.5 0 2.9-.3 4.1-.9"/>',
    flip: '<rect x="7.5" y="4" width="9" height="16" rx="1.5"/><path d="M4 9.5A9 9 0 0 1 8.2 4.4"/><path d="M8.6 2.2 8.2 4.4l2.2.5"/><path d="M20 14.5A9 9 0 0 1 15.8 19.6"/><path d="M15.4 21.8l.4-2.2-2.2-.5"/>',
    fan: '<rect x="9" y="5" width="6" height="12" rx="1" transform="rotate(-28 12 20)"/><rect x="9" y="5" width="6" height="12" rx="1"/><rect x="9" y="5" width="6" height="12" rx="1" transform="rotate(28 12 20)"/>',
    shrink: '<rect x="8" y="5" width="8" height="14" rx="1"/><path d="M2 12h4"/><path d="M4 9.5 6.5 12 4 14.5"/><path d="M22 12h-4"/><path d="M20 9.5 17.5 12l2.5 2.5"/>',
    tuck: '<rect x="8" y="3" width="8" height="11" rx="1"/><path d="M3 18h18"/><path d="M12 14v-4"/><path d="M9.5 12.5 12 15l2.5-2.5"/>',
  };

  const SUITS = { s: ["♠", "#1b1b1b"], h: ["♥", "#9c2f2a"], d: ["♦", "#9c2f2a"], c: ["♣", "#1b1b1b"] };
  const RANKS = ["A", "K", "Q", "J", "10", "9", "8", "7", "6"];

  const deck = (n, seed) => Array.from({ length: n }, (_, i) => ({
    id: `${seed}${i}`,
    rank: RANKS[(i * 3 + seed.length) % RANKS.length],
    suit: ["s", "h", "d", "c"][(i + seed.length) % 4],
  }));

  /**
   * КТО ЗА СТОЛОМ. Двое ботов и я — больше стенду не нужно: тултип открывается у каждого из двух,
   * и этого хватает, чтобы увидеть и свой жест, и чужой.
   */
  const P = {
    people: [
      { key: "me", name: "Ye", ink: "#f2c14e", mine: true, cards: 0, face: "me" },
      { key: "alia", name: "Алия", ink: "#7fd1b9", cards: 5, hand: deck(5, "a") },
      { key: "timur", name: "Тимур", ink: "#e08b3f", cards: 3, hand: deck(3, "t") },
    ],
    mine: deck(7, "me"),
    pose: { fan: true, shrink: false, tuck: false },
    on: { pin: false, lock: false, hide: false },
    /** Что лежит на сукне — то, что вынесли из рук. В единицах стола, как всё на нём. */
    table: [],
    /** Колода по центру. С неё тянется только верхняя карта — стопку целиком не поднимают. */
    deck: deck(12, "d"),
    /** Чей тултип открыт. Пусто — ничей. */
    tip: null,
  };

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("felt");
  const over = document.getElementById("over");
  const images = {};

  /** Лицо владельца — то же, что стоит у него в профиле; бот обходится буквами. */
  (function loadFace() {
    const img = new Image();
    img.onload = () => draw();
    img.src = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#3d4a3a"/>` +
      `<circle cx="48" cy="38" r="17" fill="#cdb98f"/><path d="M14 96c0-19 15-30 34-30s34 11 34 30z" fill="#cdb98f"/></svg>`,
    );
    images.me = img;
  })();

  /** Ширина и высота стекла — стенд меряется телефоном в портрете, как и продукт. */
  const glass = () => ({ w: stage.clientWidth, h: stage.clientHeight });

  /** ЕДИНИЦА HUD — та же доля стекла, что берёт движок, когда игра не назвала своей. */
  const hudUnit = () => {
    const g = glass();
    return Math.max(1, Math.round(Math.min(g.w, g.h) * HUD_UNIT_FRACTION));
  };

  /** Высота полосы кнопок — сами кнопки и дерево вокруг них (`barHeight`). */
  const barHeight = () => BAR.size + 2 * BAR.pad;

  /**
   * ГДЕ СТОИТ КАЖДАЯ КАРТА РУКИ НА СТЕКЛЕ (`handPlan`) — на дуге, если веер, и в ряд, если нет.
   * Дуга подбирается в три прохода: край считается по УГЛУ наклонной карты, а не по её середине.
   */
  function handPlan(pose, n, w, h, roomU) {
    const apart = (pose.shrink ? HUD_FAN.shut : HUD_FAN.apart) * w;
    const mid = (n - 1) / 2;
    if (!pose.fan) {
      const step = n > 1 ? Math.min(apart, Math.max(0, roomU - 2 * (w / 2 + HUD_FAN.edge * w)) / (n - 1)) : 0;
      return Array.from({ length: n }, (_, i) => ({ x: (i - mid) * step, y: 0, angle: 0 }));
    }
    const R = HUD_FAN.radius * h;
    const deg = (rad) => (rad * 180) / Math.PI;
    const most = deg(2 * Math.asin(Math.min(1, apart / (2 * R))));
    let step = 0;
    if (n > 1) {
      let reach = w / 2;
      for (let pass = 0; pass < 3; pass += 1) {
        const chord = Math.max(0, Math.min(1, (roomU - 2 * (reach + HUD_FAN.edge * w)) / (2 * R)));
        step = Math.min(most, deg(2 * Math.asin(chord)) / (n - 1));
        const outer = ((step * (n - 1)) / 2 / 180) * Math.PI;
        reach = (w / 2) * Math.cos(outer) + (h / 2) * Math.sin(outer);
      }
    }
    return Array.from({ length: n }, (_, i) => {
      const angle = (i - mid) * step;
      const rad = (angle * Math.PI) / 180;
      return { x: R * Math.sin(rad), y: R * (1 - Math.cos(rad)), angle };
    });
  }

  /**
   * ВСЁ, ЧТО НУЖНО ЗНАТЬ О ПОЛОСЕ РУКИ: её масштаб, её коробка и её место на стекле.
   *
   * `count` — на СКОЛЬКО карт её раскладывать. Пока одна из них в воздухе, рука считается на то
   * число, которое будет после того, как её положат: иначе соседки дёргаются дважды — сперва
   * сходятся на освободившееся место, потом расходятся обратно.
   */
  function handBox(count = P.mine.length) {
    const u = hudUnit();
    const g = glass();
    const inset = 0;
    const room = g.w / u - 2 * HUD_MARGIN;
    const scale = Math.min(1, room / (HUD_CARDS * CARD.w * (1 + HUD_GAP)));
    const wide = Math.max(1, g.w / u / scale);
    const plan = handPlan(P.pose, count, CARD.w, CARD.h, wide);
    const drop = plan.reduce((m, p) => Math.max(m, p.y), 0);
    const high = CARD.h + drop + 2 * HAND_PAD + HAND_ROOM;
    const barTop = g.h - inset - barHeight() * u;
    const shown = P.pose.tuck ? TUCK_TIP : Math.max(0, (high - HAND_ROOM) * scale - BAR.tuck);
    const cardsBottom = barTop + BAR.tuck * u + (P.pose.tuck ? Math.max(0, (high - HAND_ROOM) * scale * u - TUCK_TIP * u) : 0);
    // Середина полосы: от нижнего края карт вверх на полкоробки, минус комната под язычок.
    const mid = cardsBottom + (HAND_ROOM - high / 2) * scale * u;
    return { u, scale, wide, plan, high, barTop, mid, shown };
  }

  /** Карта разметкой — её же рисует и холст, но эту можно взять пальцем. */
  function cardHtml(c, shown, w) {
    const h = Math.round(w * 1.4);
    const [sign, colour] = SUITS[c.suit];
    const face = `<span style="position:absolute;left:${w * 0.1}px;top:${w * 0.06}px;font:400 ${w * 0.3}px Tiny5,monospace;color:${colour}">${c.rank}</span>`
      + `<span style="position:absolute;left:0;right:0;top:${h * 0.33}px;text-align:center;font:400 ${w * 0.45}px Tiny5,monospace;color:${colour}">${sign}</span>`;
    const back = `<span style="position:absolute;inset:${w * 0.08}px;border-radius:3px;background:repeating-linear-gradient(45deg,${T.wood} 0 4px,${T.panel} 4px 8px);opacity:.9"></span>`;
    return `<span style="position:absolute;inset:0;border-radius:${w * 0.12}px;background:${shown ? T.ink : T.panelLight};`
      + `box-shadow:inset 0 0 0 ${Math.max(2, w * 0.05)}px ${T.black},0 2px 0 rgba(11,7,4,.55)">${shown ? face : back}</span>`;
  }

  /** Кнопка нижнего бара — золотая, когда включена, тёмная, когда нет (`control` в `handBar.ts`). */
  function barButton(what, lit, px) {
    const side = Math.round(px);
    return `<button data-bar="${what}" style="position:relative;width:${side}px;height:${side}px;border:0;padding:0;`
      + `border-radius:${Math.round(side * BAR.radius / BAR.size)}px;cursor:pointer;display:flex;align-items:center;justify-content:center;`
      + (lit
        ? `background:linear-gradient(${BAR_LOOK.goldHi},${BAR_LOOK.goldLo});box-shadow:inset 0 0 0 3px ${T.black};`
        : `background:linear-gradient(${BAR_LOOK.plateHi},${BAR_LOOK.plateLo});box-shadow:inset 0 0 0 3px ${T.black},inset 0 0 0 5px ${BAR_LOOK.rim};`)
      + `">`
      + `<svg viewBox="0 0 24 24" width="${Math.round(side * 0.5)}" height="${Math.round(side * 0.5)}" fill="none" `
      + `stroke="${lit ? T.black : "white"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${GLYPH[what]}</svg></button>`;
  }

  /**
   * КОНТУР — КАРТИНКА МЕСТА, А НЕ КАРТЫ. Ни заливки, ни тени: сквозь него видно то, на что вещь
   * ляжет. Пунктир в приглушённых чернилах — те же числа, что и у продукта (`MARK_SURFACE`).
   *
   * И ЭТО НЕ ПРИЗРАК. Призрак — полупрозрачная копия карты, и читается он как «карта уже там»; а
   * пока палец не отпущен, там ещё ничего нет. Контур говорит только одно: вот это место.
   */
  function markHtml(w, h, angle, x, y, z) {
    const line = Math.max(1.5, w * 0.04);
    return `<div data-g="mark" style="position:absolute;width:${w}px;height:${h}px;`
      + `left:${x - w / 2}px;top:${y - h / 2}px;transform:rotate(${angle}deg);z-index:${z};pointer-events:none;`
      // ЧЁРНАЯ ОБВОДКА ВОКРУГ ПУНКТИРА, и она не украшение: в руке контур ложится НА соседнюю
      // карту, а карта кремовая — кремовый пунктир на ней пропадает начисто. На сукне он читается,
      // и потому беда эта не видна ровно до того дня, когда контур впервые встаёт между картами.
      + `border-radius:${w * 0.12}px;border:${line}px dashed ${T.ink};opacity:.9;`
      + `box-shadow:0 0 0 ${Math.max(1, line * 0.6)}px ${T.black}, inset 0 0 0 ${Math.max(1, line * 0.6)}px ${T.black};`
      + `transition:left .16s ease-out, top .16s ease-out, transform .16s ease-out"></div>`;
  }

  /**
   * ГЕОМЕТРИЯ МОЕЙ РУКИ — где стоит каждое гнездо, в пикселях экрана, для РОВНО такого числа карт.
   *
   * Спрашивается «на сколько», а не «сколько сейчас»: пока карта в воздухе, рука раскладывается на
   * то число, которое будет ПОСЛЕ того, как её положат, — иначе соседи дёргаются дважды, сначала
   * сдвигаясь на освободившееся место, потом обратно.
   */
  function mineGeom(count) {
    const { u, scale, wide, barTop, mid } = handBox(count);
    const g = glass();
    const plan = handPlan(P.pose, count, CARD.w, CARD.h, wide);
    const w = CARD.w * scale * u;
    const h = CARD.h * scale * u;
    return {
      which: "mine", mirror: false, w, h, barTop,
      slots: plan.map((p) => ({ x: g.w / 2 + p.x * scale * u, y: mid + p.y * scale * u, angle: p.angle })),
    };
  }

  /** Коробка тултипа — считается ДО разметки, потому что по ней же ищут гнёзда его веера. */
  function tipBox(who, spot) {
    const g = glass();
    const w = Math.min(g.w - 16, 292);
    const cw = 46, ch = Math.round(cw * 1.4);
    const rowH = ch + 24;
    const height = 12 + 30 + 8 + 16 + rowH + 12;
    const left = Math.max(8, Math.min(g.w - w - 8, spot.x - w / 2));
    const below = spot.y < g.h * 0.45;
    const top = below
      ? Math.min(g.h - height - 8, spot.y + spot.r + 12)
      : Math.max(8, spot.y - spot.r - 12 - height);
    return { left, top, w, height, cw, ch, rowH, rowTop: top + 12 + 30 + 8 + 16, inner: w - 24 };
  }

  /**
   * ГЕОМЕТРИЯ ЧУЖОЙ РУКИ. Веер зеркален: его левая карта — моя правая, — поэтому гнездо, ближайшее
   * к моему левому краю, принадлежит ПОСЛЕДНЕЙ его карте, и порядок в списке считается наоборот.
   */
  function tipGeom(who, spot, count) {
    const box = tipBox(who, spot);
    const plan = handPlan({ fan: true, shrink: false, tuck: false }, count, 1, 1.4, box.inner / box.cw);
    return {
      which: who.key, mirror: true, w: box.cw, h: box.ch, box,
      slots: plan.map((p) => ({
        x: box.left + 12 + box.inner / 2 + p.x * box.cw,
        y: box.rowTop + 8 + box.ch / 2 + p.y * box.cw,
        angle: p.angle,
      })),
    };
  }

  /** Рука по имени — та самая, что и рисуется; не копия. */
  const handOf = (which) => (which === "mine" ? P.mine : P.people.find((one) => one.key === which).hand);

  /**
   * В КАКОЕ ГНЕЗДО ЦЕЛИТСЯ ПАЛЕЦ — по числу гнёзд ЛЕВЕЕ него, и только по ним: карта в веере лежит
   * под соседкой, и спрашивать «над какой картой палец» значит спрашивать про верхнюю из двух.
   */
  function slotAt(geom, x, room) {
    const left = geom.slots.filter((s) => s.x < x).length;
    const j = Math.max(0, Math.min(room, left));
    return geom.mirror ? room - j : j;
  }

  /** Карта разметкой, стоящая в своём гнезде. */
  function slotCard(c, shown, geom, slot, z, attr, held) {
    return `<div ${attr}="${c.id}" style="position:absolute;width:${geom.w}px;height:${geom.h}px;`
      + `left:${slot.x - geom.w / 2}px;top:${slot.y - geom.h / 2}px;transform:rotate(${slot.angle}deg);`
      + `z-index:${z};touch-action:none;cursor:grab;${held ? "opacity:0;" : ""}`
      + `transition:left .16s ease-out, top .16s ease-out, transform .16s ease-out">${cardHtml(c, shown, geom.w)}</div>`;
  }

  /**
   * РУКА, РАЗЛОЖЕННАЯ ВМЕСТЕ С МЕСТОМ ПОД КАРТУ В ВОЗДУХЕ.
   *
   * Пока палец несёт карту НАД этой рукой, рука раскладывается так, будто карта уже в ней, а её
   * гнездо занимает контур. Отсюда и `z` контура: он ровно тот, что достанется карте, — соседки
   * справа накрывают его так же, как накроют её.
   */
  function layHand(which, geom, cards, mark, shown, attr) {
    const list = mark === null ? cards : [...cards.slice(0, mark), null, ...cards.slice(mark)];
    return list.map((c, i) => {
      const slot = geom.slots[geom.mirror ? list.length - 1 - i : i];
      if (!slot) return "";
      if (c === null) return markHtml(geom.w, geom.h, slot.angle, slot.x, slot.y, i + 1);
      return slotCard(c, shown, geom, slot, i + 1, attr, false);
    }).join("");
  }

  /**
   * МОЙ НИЖНИЙ HUD — полоса кнопок на дне стекла и веер, стоящий на ней.
   *
   * Семь кнопок двумя группами: права прижаты к левому краю, позы — к правому, и обе ужимаются
   * ОДИНАКОВО, когда на стекле им тесно (`fitBar`): иначе на телефоне два ряда въезжают друг в друга.
   */
  function hudHtml() {
    const g = glass();
    const cards = P.mine;
    const mark = drag && drag.target.kind === "hand" && drag.target.which === "mine" ? drag.target.index : null;
    const geom = mineGeom(cards.length + (mark === null ? 0 : 1));
    const u = hudUnit();
    const need = (3 * BAR.size + 2 * BAR.gap) + (4 * BAR.size + 3 * BAR.gap) + 2 * BAR.margin + BAR.gap;
    const fit = g.w / u > 0 && need > g.w / u ? Math.max(0.5, g.w / u / need) : 1;
    const side = BAR.size * u * fit;
    const gap = BAR.gap * u * fit;
    const margin = BAR.margin * u * fit;

    return `<div style="position:absolute;left:0;right:0;top:${geom.barTop - BAR.fade * u}px;height:${BAR.fade * u}px;`
      + `background:linear-gradient(to top, rgba(11,7,4,.85), rgba(11,7,4,0));pointer-events:none"></div>`
      + layHand("mine", geom, cards, mark, !P.on.hide, "data-card")
      // ПОЛОСА — ПОВЕРХ КАРТ, как спина поверх того, что под неё подоткнули: карты уходят под её
      // край на `BAR.tuck`, и если она окажется под ними, подоткнуть будет некуда. Порядок в
      // разметке этого не решает: у карт свой z, и он поднимает их над соседом без него.
      + `<div style="position:absolute;left:0;right:0;top:${geom.barTop}px;height:${barHeight() * u}px;z-index:${P.mine.length + 10};`
      + `background:linear-gradient(${T.panel},${T.well});box-shadow:inset 0 3px 0 -1px ${T.black};display:flex;align-items:center">`
      + `<div style="position:absolute;left:${margin}px;display:flex;gap:${gap}px">`
      + RIGHTS.map((what) => barButton(what, P.on[what], side)).join("") + `</div>`
      + `<div style="position:absolute;right:${margin}px;display:flex;gap:${gap}px">`
      + POSES.map((what) => barButton(what, what !== "flip" && P.pose[what], side)).join("") + `</div>`
      + `</div>`;
  }

  /**
   * ТУЛТИП НАД ЧУЖИМ АВАТАРОМ — его рука, и больше ничего. Прав здесь нет намеренно: они сделаны
   * и живут в листе «за столом», а этот стенд про жест.
   *
   * ЕГО ВЕЕР ЗЕРКАЛЕН: его левая карта — моя правая, и рубашками ко мне.
   */
  function tipHtml(who, spot) {
    const cards = who.hand;
    const mark = drag && drag.target.kind === "hand" && drag.target.which === who.key ? drag.target.index : null;
    const geom = tipGeom(who, spot, cards.length + (mark === null ? 0 : 1));
    const box = geom.box;
    return `<div data-g="tip" style="position:absolute;left:${box.left}px;top:${box.top}px;`
      // ТУЛТИП — ПОВЕРХ ВСЕГО, полосы кнопок в том числе: его открыли последним, и он про то, о чём
      // спросили прямо сейчас.
      + `width:${box.w}px;box-sizing:border-box;z-index:40;background:${T.well};`
      + `box-shadow:inset 0 0 0 3px ${T.black},inset 0 0 0 5px ${T.wood},0 6px 0 rgba(11,7,4,.5);border-radius:12px;padding:12px">`
      + `<div style="display:flex;align-items:center;gap:9px;padding-bottom:8px">`
      + `<span style="flex:none;width:30px;height:30px;border-radius:50%;background:${who.ink};box-shadow:inset 0 0 0 3px ${T.black};`
      + `display:flex;align-items:center;justify-content:center;font:400 14px Tiny5,monospace;color:${T.black}">${who.name[0]}</span>`
      + `<span style="font:400 14px Tiny5,monospace;color:${T.ink}">${who.name}</span></div>`
      + `<span style="font:400 10px Tiny5,monospace;letter-spacing:.1em;color:${T.inkDim};opacity:.7">ЕГО РУКА · ${cards.length}</span>`
      + `<div style="position:relative;height:${box.rowH}px"></div></div>`
      // КАРТЫ ЕГО ВЕЕРА — НЕ ВНУТРИ КОРОБКИ, А НАД НЕЙ, в тех же экранных координатах, что и моя
      // рука: карту вытаскивают ИЗ тултипа на стол, и обрезанная его краем она пропадала бы ровно в
      // тот миг, когда на неё смотрят.
      + `<div style="position:absolute;inset:0;z-index:41;pointer-events:none">`
      + `<div style="position:absolute;inset:0;pointer-events:auto">`
      + layHand(who.key, geom, cards, mark, false, "data-tip-card") + `</div></div>`;
  }

  let spots = [];
  let view = null;
  /** Что сейчас несёт палец. Пусто — ничего. */
  let drag = null;

  /** Сколько пикселей дна занято рукой и её полосой (`floorNow` в `handHud.ts`). */
  function hudFloor() {
    const { u, shown } = handBox();
    return (barHeight() + shown + HUD_MARGIN) * u;
  }

  function draw() {
    const g = glass();
    view = Felt.draw(canvas, {
      W: g.w, H: g.h, people: P.people, images, table: P.table, deck: P.deck,
      // ЦЕНТР СТОЛА — В СЕРЕДИНЕ ТОГО, ЧТО ОТ СТЕКЛА ОСТАЛОСЬ: рука занимает дно и стол на него не
      // налезает. Считается от самой руки (`floorNow`), а не подбирается глазами, — иначе позы,
      // которые двигают дно, каждый раз уводили бы стол.
      free: g.h - hudFloor(),
      centre: (g.h - hudFloor()) / 2,
    });
    spots = view.spots;
    const tip = P.tip ? P.people.find((one) => one.key === P.tip) : undefined;
    const spot = tip ? spots.find((s) => s.key === tip.key) : undefined;
    over.innerHTML = hudHtml() + (tip && spot ? tipHtml(tip, spot) : "") + feltMarkHtml() + carryHtml();
    wire();
  }

  /** Контур на сукне — карта ляжет туда своим размером, а он ВТРОЕ меньше, чем она в руке. */
  function feltMarkHtml() {
    if (!drag || drag.target.kind !== "felt") return "";
    const w = Felt.CARD.w * view.U;
    const h = Felt.CARD.h * view.U;
    return markHtml(w, h, 0, view.centre.x + drag.target.at.x * view.U, view.centre.y + drag.target.at.y * view.U, 30);
  }

  /** Карта в воздухе — под пальцем и над всем остальным. Своей руки размер, пока её не отпустили. */
  function carryHtml() {
    if (!drag) return "";
    return `<div data-g="carry" style="position:fixed;width:${drag.w}px;height:${drag.h}px;`
      + `left:${drag.x - drag.gx}px;top:${drag.y - drag.gy - drag.h * CARRY_CLEAR}px;z-index:60;pointer-events:none;`
      + `filter:drop-shadow(0 ${Math.round(drag.h * 0.12)}px 0 rgba(11,7,4,.45))">`
      + cardHtml(drag.card, drag.shown, drag.w) + `</div>`;
  }

  /** Куда целится палец: в чьё-то гнездо или на сукно. */
  function aimAt(x, y) {
    const tip = P.tip ? P.people.find((one) => one.key === P.tip) : undefined;
    if (tip) {
      const spot = spots.find((s) => s.key === tip.key);
      const room = tip.hand.length + (drag.from === tip.key ? 0 : 0);
      const geom = tipGeom(tip, spot, room + 1);
      const box = geom.box;
      if (x >= box.left && x <= box.left + box.w && y >= box.top && y <= box.top + box.height) {
        return { kind: "hand", which: tip.key, index: slotAt(geom, x, room) };
      }
    }
    const mineRoom = P.mine.length;
    const geom = mineGeom(mineRoom + 1);
    const top = geom.slots.reduce((m, s) => Math.min(m, s.y - geom.h / 2), Infinity);
    if (y >= top && x >= 0 && x <= glass().w) {
      return { kind: "hand", which: "mine", index: slotAt(geom, x, mineRoom) };
    }
    // НА СУКНО — В ТОЧКУ, ГДЕ СЕЙЧАС СЕРЕДИНА НЕСОМОЙ КАРТЫ, а не где палец: за неё и держат.
    return { kind: "felt", at: { x: (x - drag.gx + drag.w / 2 - view.centre.x) / view.U, y: (y - drag.gy + drag.h / 2 - view.centre.y) / view.U } };
  }

  const sameAim = (a, b) =>
    a.kind === b.kind && (a.kind === "felt" ? true : a.which === b.which && a.index === b.index);

  /**
   * ЧТО ЛЕЖИТ ПОД ПАЛЬЦЕМ НА СУКНЕ. Сверху вниз: сперва то, что лежит поверх, — карта, брошенная
   * последней, лежит НА той, что легла раньше, и пальцу достаётся именно она.
   *
   * С КОЛОДЫ ТЯНЕТСЯ ТОЛЬКО ВЕРХНЯЯ. Колода — стопка, а стопку целиком не поднимают: за неё берутся
   * и получают верхнюю карту, как берут её рукой со стола.
   */
  function feltPick(x, y) {
    if (!view) return null;
    const ux = (x - view.centre.x) / view.U;
    const uy = (y - view.centre.y) / view.U;
    const over = (at) => Math.abs(ux - at.x) <= Felt.CARD.w / 2 && Math.abs(uy - at.y) <= Felt.CARD.h / 2;
    for (let i = P.table.length - 1; i >= 0; i -= 1) if (over(P.table[i].at)) return { where: "table", index: i };
    const top = P.deck.length - 1;
    if (top >= 0 && over(Felt.deckAt(top, P.deck.length))) return { where: "deck", index: top };
    return null;
  }

  /** Поднять со стола (или снять с колоды) — тот же жест, что и из руки, только карта уже своя. */
  function grabFromFelt(e, pick) {
    const list = pick.where === "table" ? P.table : P.deck;
    const one = list[pick.index];
    const at = pick.where === "table" ? one.at : Felt.deckAt(pick.index, P.deck.length);
    list.splice(pick.index, 1);
    const w = Felt.CARD.w * view.U;
    const h = Felt.CARD.h * view.U;
    const left = view.centre.x + (at.x - Felt.CARD.w / 2) * view.U;
    const top = view.centre.y + (at.y - Felt.CARD.h / 2) * view.U;
    drag = {
      from: pick.where, card: one, id: one.id,
      // СНЯТАЯ С КОЛОДЫ ИДЁТ РУБАШКОЙ: её ещё не смотрели. Лицом она станет в руке, потому что
      // рука и есть то место, где на карту смотрят.
      shown: pick.where === "table" ? one.shown === true : false,
      w, h,
      gx: e.clientX - left, gy: e.clientY - top,
      x: e.clientX, y: e.clientY,
      target: { kind: "felt", at },
    };
    draw();
  }

  /** Размер карты в этой руке — спрашивается у геометрии, а не у элемента (см. `startDrag`). */
  function sizeOf(which) {
    if (which === "mine") return mineGeom(P.mine.length);
    const who = P.people.find((one) => one.key === which);
    return tipGeom(who, spots.find((s) => s.key === which), who.hand.length);
  }

  function startDrag(e, which, id) {
    const hand = handOf(which);
    const index = hand.findIndex((c) => c.id === id);
    if (index < 0) return;
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    // РАЗМЕР БЕРЁТСЯ У ГЕОМЕТРИИ, А СЕРЕДИНА — У ЭЛЕМЕНТА. Карта в веере ПОВЁРНУТА, и её рамка на
    // экране шире самой карты тем больше, чем сильнее наклон: взятая за рамку, карта прыгала из-под
    // пальца в сторону, и тем дальше, чем с краю её брали. Середина поворота не меняет — её и берём.
    const geom = sizeOf(which);
    const centre = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    const card = hand[index];
    hand.splice(index, 1);
    drag = {
      from: which, card, id,
      shown: which === "mine" ? !P.on.hide : false,
      w: geom.w, h: geom.h,
      gx: e.clientX - (centre.x - geom.w / 2), gy: e.clientY - (centre.y - geom.h / 2),
      x: e.clientX, y: e.clientY,
      target: { kind: "hand", which, index },
    };
    // ЗАХВАТ УКАЗАТЕЛЯ — ПОПЫТКА, А НЕ ТРЕБОВАНИЕ: палец, которого уже нет (или которого не было —
    // событие из скрипта), роняет весь жест на ровном месте, а движение всё равно слушает окно.
    try { el.setPointerCapture?.(e.pointerId); } catch { /* пальца нет — и не надо */ }
    draw();
  }

  function moveDrag(e) {
    if (!drag) return;
    drag.x = e.clientX;
    drag.y = e.clientY;
    const aim = aimAt(e.clientX, e.clientY);
    const carry = over.querySelector('[data-g="carry"]');
    if (carry) {
      carry.style.left = `${drag.x - drag.gx}px`;
      carry.style.top = `${drag.y - drag.gy - drag.h * CARRY_CLEAR}px`;
    }
    if (sameAim(aim, drag.target) && aim.kind !== "felt") return;
    drag.target = aim;
    // НА СУКНЕ ДВИГАЕТСЯ ОДИН КОНТУР, А НЕ ВЕСЬ ЭКРАН: рука за пальцем по сукну не перекладывается,
    // и перерисовывать её шестьдесят раз в секунду не за чем.
    const mark = over.querySelector('[data-g="mark"]');
    if (aim.kind === "felt" && mark && drag.markKind === "felt") {
      const w = Felt.CARD.w * view.U;
      const h = Felt.CARD.h * view.U;
      mark.style.left = `${view.centre.x + aim.at.x * view.U - w / 2}px`;
      mark.style.top = `${view.centre.y + aim.at.y * view.U - h / 2}px`;
      return;
    }
    drag.markKind = aim.kind;
    draw();
  }

  function endDrag() {
    if (!drag) return;
    const aim = drag.target;
    if (aim.kind === "hand") handOf(aim.which).splice(aim.index, 0, drag.card);
    // ВЫНЕСЕННАЯ НА СТОЛ КАРТА ЛОЖИТСЯ ТУДА, ГДЕ СТОЯЛ КОНТУР, и своим размером на сукне: контур
    // обещал ровно это место и ровно этот размер, и обещание проверяется глазом на месте.
    else P.table.push({ ...drag.card, at: aim.at, shown: drag.shown });
    drag = null;
    draw();
  }

  function wire() {
    for (const el of over.querySelectorAll("[data-bar]")) {
      el.onclick = (e) => {
        e.stopPropagation();
        const what = el.dataset.bar;
        if (RIGHTS.includes(what)) P.on[what] = !P.on[what];
        else if (what === "flip") P.mine.reverse();
        else P.pose[what] = !P.pose[what];
        draw();
      };
    }
    for (const el of over.querySelectorAll("[data-card]")) {
      el.onpointerdown = (e) => { e.preventDefault(); startDrag(e, "mine", el.dataset.card); };
    }
    for (const el of over.querySelectorAll("[data-tip-card]")) {
      el.onpointerdown = (e) => { e.preventDefault(); startDrag(e, P.tip, el.dataset.tipCard); };
    }
  }

  addEventListener("pointermove", moveDrag, { passive: true });
  addEventListener("pointerup", endDrag);
  addEventListener("pointercancel", endDrag);

  // ТАП ПО ДИСКУ НА СУКНЕ ОТКРЫВАЕТ ЕГО ТУЛТИП: аватар — это и есть человек, и спрашивают про него
  // там, где он лежит. Мимо — закрывает.
  //
  // «МИМО» — ЭТО ПО СУКНУ, А НЕ ПО ЧЕМУ УГОДНО. Всё, что нарисовано НАД стеклом — сам тултип, его
  // карты, моя рука и полоса кнопок, — не «мимо»: рука, опущенная на чужой веер, пришла за картой,
  // а не закрыть окно. Спрашивается это одним вопросом — попал ли палец в холст, — потому что
  // список исключений устаревает на первой же новой кнопке.
  stage.addEventListener("pointerdown", (e) => {
    if (e.target !== canvas || drag) return;
    const x = e.clientX, y = e.clientY;
    // КАРТА НА СУКНЕ БЕРЁТСЯ РАНЬШЕ, ЧЕМ ОТКРЫВАЕТСЯ ТУЛТИП: палец, опущенный на карту, пришёл за
    // ней. Диски и карты на столе не спорят за одно место — они лежат в разных местах.
    const pick = feltPick(x, y);
    if (pick) {
      e.preventDefault();
      return grabFromFelt(e, pick);
    }
    const hit = spots.find((s) => s.key !== "me" && Math.hypot(x - s.x, y - s.y) <= s.r + 6);
    const next = hit ? (P.tip === hit.key ? null : hit.key) : null;
    if (next === P.tip) return;
    P.tip = next;
    draw();
  });

  addEventListener("resize", draw);
  addEventListener("orientationchange", draw);
  document.fonts?.ready.then(draw);
  draw();
})();
</script>
</body>
</html>
