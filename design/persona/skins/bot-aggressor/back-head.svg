<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 40 80 L 60 80 L 58 92 L 42 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="86" x2="56" y2="86" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Horn-Antennas from Behind -->
  <!-- Left Horn Base (#1d4f80) & Sharp Tip (#f2c14e) -->
  <polygon points="26,28 14,12 20,10 32,24" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="14,12 8,6 18,8 20,10" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Right Horn Base (#1d4f80) & Sharp Tip (#f2c14e) -->
  <polygon points="74,28 86,12 80,10 68,24" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="86,12 92,6 82,8 80,10" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Aggressive Wedge Head Silhouette from Behind (#b3221f) -->
  <path d="M 32 18 L 68 18 L 84 32 L 82 62 L 50 84 L 18 62 L 16 32 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Rear Cranium Plate (#b3221f) -->
  <polygon points="32,18 68,18 78,34 50,44 22,34" fill="#b3221f" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Central Armored Spine Ridge (#1d4f80) -->
  <polygon points="46,20 54,20 56,76 44,76" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <line x1="50" y1="20" x2="50" y2="76" stroke="#f2c14e" stroke-width="1.8"/>

  <!-- Gold Spine Rivets (#f2c14e) -->
  <circle cx="50" cy="28" r="1.5" fill="#f2c14e"/>
  <circle cx="50" cy="42" r="1.5" fill="#f2c14e"/>
  <circle cx="50" cy="56" r="1.5" fill="#f2c14e"/>
  <circle cx="50" cy="70" r="1.5" fill="#f2c14e"/>

  <!-- Twin Aggressive Exhaust Thrusters / Heat Ports (#1d4f80 & #0b0704) -->
  <!-- Left Thruster Port -->
  <polygon points="24,44 42,42 40,60 22,58" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="26,46 40,44 38,58 24,56" fill="#0b0704"/>
  <line x1="28" y1="51" x2="38" y2="51" stroke="#f2c14e" stroke-width="1.5"/>
  <!-- Right Thruster Port -->
  <polygon points="76,44 58,42 60,60 78,58" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="74,46 60,44 62,58 76,56" fill="#0b0704"/>
  <line x1="72" y1="51" x2="62" y2="51" stroke="#f2c14e" stroke-width="1.5"/>

  <!-- Nape Armor Flange at Base (#5d666e) -->
  <polygon points="34,70 66,70 50,82" fill="#5d666e" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Woodcut Hatches -->
  <path d="M 22 36 L 28 32 M 20 44 L 26 40" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 78 36 L 72 32 M 80 44 L 74 40" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 26 66 L 34 70 M 74 66 L 66 70" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
