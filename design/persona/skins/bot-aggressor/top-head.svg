<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Horn-Antennas swept back toward Top Edges («рога-антенны») -->
  <!-- Left Horn Tip (#f2c14e) & Base (#1d4f80) -->
  <polygon points="26,42 16,14 22,12 32,38" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="16,14 10,8 18,7 22,12" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Right Horn Tip (#f2c14e) & Base (#1d4f80) -->
  <polygon points="74,42 84,14 78,12 68,38" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="84,14 90,8 82,7 78,12" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Aggressive Head Wedge from Above (#b3221f) -->
  <!-- Top = Back / Nape (y~22), Bottom = Predatory Sloped Prow / Brow (y~82) -->
  <path d="M 34 22 L 66 22 L 82 40 L 76 60 L 50 84 L 24 60 L 18 40 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Rear Exhaust Thruster Ports from Above at Top (y=24..34) (#1d4f80) -->
  <rect x="36" y="24" width="11" height="8" rx="1.5" fill="#1d4f80" stroke="#0b0704" stroke-width="1.5"/>
  <rect x="38" y="26" width="7" height="4" fill="#0b0704"/>
  <rect x="53" y="24" width="11" height="8" rx="1.5" fill="#1d4f80" stroke="#0b0704" stroke-width="1.5"/>
  <rect x="55" y="26" width="7" height="4" fill="#0b0704"/>

  <!-- Central Sharp Forehead Ridge Line («скошенный лоб») (#f2c14e) -->
  <line x1="50" y1="24" x2="50" y2="82" stroke="#f2c14e" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Sloped Brow Facets (#1d4f80) -->
  <polygon points="50,44 72,56 50,78 28,56" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="50,50 64,58 50,70 36,58" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="50" cy="58" r="2.5" fill="#b3221f"/>

  <!-- Forward-Jutting Brow V-Overhang at Bottom (y=74..84) -->
  <polyline points="28,66 50,82 72,66" fill="none" stroke="#f2c14e" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Woodcut Texture Hatches -->
  <path d="M 28 32 L 36 34 M 26 42 L 34 44 M 28 54 L 35 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 72 32 L 64 34 M 74 42 L 66 44 M 72 54 L 65 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
