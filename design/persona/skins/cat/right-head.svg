  <path d="M 48 22 L 48 14 L 54 18 L 60 10 L 64 16 L 64 22 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="56" cy="16" r="2" fill="#b3221f" stroke="#0b0704" stroke-width="1.2"/>

