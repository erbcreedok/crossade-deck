<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bank Safe Top Roof Plate (#b3221f) -->
  <!-- Top = Back (y~18), Bottom = Front / Safe Face (y~82) -->
  <path d="M 22 18 L 78 18 L 84 24 L 84 76 L 78 82 L 22 82 L 16 76 L 16 24 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Left Flank Vault Hinges from Above (#1d4f80, #f2c14e) -->
  <rect x="13" y="28" width="5" height="10" rx="1" fill="#1d4f80" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="15.5" cy="33" r="1.5" fill="#f2c14e"/>
  <rect x="13" y="62" width="5" height="10" rx="1" fill="#1d4f80" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="15.5" cy="67" r="1.5" fill="#f2c14e"/>

  <!-- Top Reinforced Panel (#1d4f80) -->
  <rect x="22" y="24" width="56" height="52" rx="3" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <rect x="25" y="27" width="50" height="46" rx="2" fill="none" stroke="#f2c14e" stroke-width="1.4"/>

  <!-- 4 Corner Brass Brackets (#f2c14e) with Rivets -->
  <polygon points="16,24 28,18 28,26 22,26 22,32 16,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="84,24 72,18 72,26 78,26 78,32 84,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="16,76 28,82 28,74 22,74 22,68 16,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="78" r="1.3" fill="#0b0704"/>
  <polygon points="84,76 72,82 72,74 78,74 78,68 84,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="78" r="1.3" fill="#0b0704"/>

  <!-- Center Safe Vault Heavy Ring / Boss (#5d666e & #f2c14e) -->
  <circle cx="50" cy="40" r="10" fill="#5d666e" stroke="#0b0704" stroke-width="2"/>
  <circle cx="50" cy="40" r="6" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="50" cy="40" r="2.5" fill="#0b0704"/>

  <!-- Prominent Brass Coin Slot («щель для монет») near Front Edge (#f2c14e) -->
  <rect x="32" y="58" width="36" height="12" rx="3" fill="#f2c14e" stroke="#0b0704" stroke-width="2"/>
  <rect x="36" y="62" width="28" height="4" rx="1.5" fill="#0b0704"/>
  <!-- Gold Coin Peeking Out of Slot (#f2c14e) -->
  <rect x="42" y="59" width="16" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>
  <circle cx="50" cy="61" r="1" fill="#b3221f"/>

  <!-- Front Dial Knob & Padlock Top Curve peeking forward (down) -->
  <!-- Combination Dial Top -->
  <path d="M 44 82 L 56 82 L 54 87 L 46 87 Z" fill="#5d666e" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="46" y1="87" x2="54" y2="87" stroke="#f2c14e" stroke-width="2"/>
  <!-- Padlock Shackle Top -->
  <path d="M 64 82 C 64 86, 72 86, 72 82" stroke="#5d666e" stroke-width="2.5" fill="none"/>

  <!-- Woodcut Hatches -->
  <path d="M 28 32 L 34 30 M 66 32 L 72 30" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 28 50 L 33 50 M 67 50 L 72 50" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
</svg>
