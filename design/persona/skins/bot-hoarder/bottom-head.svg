<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bank Safe Bottom Plate (#b3221f) -->
  <!-- Top = Front / Safe Face (y~18), Bottom = Back / Nape (y~82) -->
  <path d="M 22 18 L 78 18 L 84 24 L 84 76 L 78 82 L 22 82 L 16 76 L 16 24 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Underside Recessed Chassis Panel (#1d4f80) -->
  <rect x="22" y="24" width="56" height="52" rx="3" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <rect x="25" y="27" width="50" height="46" rx="2" fill="none" stroke="#f2c14e" stroke-width="1.4"/>

  <!-- 4 Corner Brass Brackets (#f2c14e) with Rivets -->
  <polygon points="16,24 28,18 28,26 22,26 22,32 16,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="84,24 72,18 72,26 78,26 78,32 84,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="16,76 28,82 28,74 22,74 22,68 16,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="78" r="1.3" fill="#0b0704"/>
  <polygon points="84,76 72,82 72,74 78,74 78,68 84,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="78" r="1.3" fill="#0b0704"/>

  <!-- Padlock Bottom Edge peeking at Front Edge (Top, y=14..22, x=62..74) -->
  <rect x="62" y="14" width="12" height="8" rx="1.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <line x1="68" y1="14" x2="68" y2="18" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Underside Vault Locking Bar Channels (#5d666e & #0b0704) -->
  <rect x="30" y="24" width="6" height="52" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <rect x="64" y="24" width="6" height="52" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Central Neck Connector Hub for Mounting to Body Collar -->
  <circle cx="50" cy="50" r="16" fill="#5d666e" stroke="#0b0704" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="13" fill="none" stroke="#f2c14e" stroke-width="1.8"/>
  <!-- Central Void Socket (#0b0704) -->
  <circle cx="50" cy="50" r="8" fill="#0b0704"/>
  <!-- Keyway Alignment Notch -->
  <rect x="48.5" y="40" width="3" height="4" fill="#0b0704"/>

  <!-- Gold Hub Anchor Screws (#f2c14e) -->
  <circle cx="39" cy="39" r="1.5" fill="#f2c14e"/>
  <circle cx="61" cy="39" r="1.5" fill="#f2c14e"/>
  <circle cx="39" cy="61" r="1.5" fill="#f2c14e"/>
  <circle cx="61" cy="61" r="1.5" fill="#f2c14e"/>

  <!-- Woodcut Hatches -->
  <path d="M 20 40 L 25 38 M 20 50 L 25 48 M 20 60 L 25 58" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 80 40 L 75 38 M 80 50 L 75 48 M 80 60 L 75 58" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round"/>
</svg>
