<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 38 82 L 62 82 L 60 92 L 40 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="87" x2="56" y2="87" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Bank Safe / Vault Head Main Body from Behind (#b3221f) -->
  <path d="M 22 18 L 78 18 L 84 24 L 84 76 L 78 82 L 22 82 L 16 76 L 16 24 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Corner Brass Reinforcing Brackets (#f2c14e) with Rivets -->
  <polygon points="16,24 28,18 28,26 22,26 22,32 16,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="84,24 72,18 72,26 78,26 78,32 84,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="16,76 28,82 28,74 22,74 22,68 16,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="20" cy="78" r="1.3" fill="#0b0704"/>
  <polygon points="84,76 72,82 72,74 78,74 78,68 84,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="80" cy="78" r="1.3" fill="#0b0704"/>

  <!-- Heavy Vault Hinges on Flank (#1d4f80 & #f2c14e) -->
  <!-- Top Hinge Bracket -->
  <rect x="13" y="30" width="8" height="12" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="17" cy="36" r="2.2" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>
  <!-- Bottom Hinge Bracket -->
  <rect x="13" y="58" width="8" height="12" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="17" cy="64" r="2.2" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>

  <!-- Rear Maintenance Safe Panel (#1d4f80) -->
  <rect x="26" y="24" width="48" height="52" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>

  <!-- Heavy Diagonal Cross-Bracing Ribs (#f2c14e) -->
  <line x1="28" y1="26" x2="72" y2="74" stroke="#f2c14e" stroke-width="2.5"/>
  <line x1="28" y1="74" x2="72" y2="26" stroke="#f2c14e" stroke-width="2.5"/>

  <!-- Central Locking Hub on Rear Panel (#5d666e & #f2c14e) -->
  <circle cx="50" cy="50" r="7" fill="#5d666e" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="3.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="1.3" fill="#0b0704"/>

  <!-- Rear Coin Slot Lip visible on Top (#f2c14e) -->
  <rect x="36" y="16" width="28" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <line x1="40" y1="18" x2="60" y2="18" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Rear Plate Rivets -->
  <circle cx="32" cy="28" r="1.3" fill="#0b0704"/>
  <circle cx="68" cy="28" r="1.3" fill="#0b0704"/>
  <circle cx="32" cy="72" r="1.3" fill="#0b0704"/>
  <circle cx="68" cy="72" r="1.3" fill="#0b0704"/>

  <!-- Woodcut Hatches -->
  <path d="M 80 34 L 75 32 M 81 44 L 75 42 M 80 54 L 75 52 M 81 64 L 75 62" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 24 48 L 20 50 M 24 54 L 20 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
