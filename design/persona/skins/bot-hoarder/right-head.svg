<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 38 82 L 62 82 L 60 92 L 40 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="87" x2="56" y2="87" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Bank Safe Profile Main Body (#b3221f) -->
  <!-- Left = Back (x~16), Right = Front Safe Door (x~84) -->
  <path d="M 22 18 L 76 18 L 84 26 L 84 76 L 76 82 L 22 82 L 16 76 L 16 26 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Side Recessed Armored Panel (#1d4f80) -->
  <rect x="24" y="26" width="46" height="48" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <rect x="28" y="30" width="38" height="40" rx="1.5" fill="none" stroke="#f2c14e" stroke-width="1.4"/>
  <polygon points="47,38 57,50 47,62 37,50" fill="#5d666e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="47" cy="50" r="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>

  <!-- Corner Brass Brackets (#f2c14e) with Rivets -->
  <polygon points="16,26 26,18 26,26 22,26 22,32 16,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="20" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="16,76 26,82 26,74 22,74 22,68 16,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="20" cy="78" r="1.3" fill="#0b0704"/>
  <polygon points="84,26 74,18 74,26 78,26 78,32 84,32" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="80" cy="22" r="1.3" fill="#0b0704"/>
  <polygon points="84,76 74,82 74,74 78,74 78,68 84,68" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="80" cy="78" r="1.3" fill="#0b0704"/>

  <!-- Coin Slot Profile on Top Brow (#f2c14e) -->
  <path d="M 52 18 L 74 18 L 74 24 L 54 24 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <!-- Gold Coin Peeking Out in Profile -->
  <ellipse cx="64" cy="18" rx="6" ry="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Right Squinting Eye Visor in Profile (x=74..84, y=44..50) -->
  <polygon points="72,44 84,43 84,51 72,50" fill="#0b0704" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="74" y1="47" x2="83" y2="47" stroke="#f2c14e" stroke-width="2" stroke-linecap="round"/>

  <!-- Vault Combination Dial in Profile (x=80..86, y=58..66) -->
  <path d="M 80 58 L 86 60 L 86 64 L 80 66 Z" fill="#5d666e" stroke="#0b0704" stroke-width="1.6"/>
  <line x1="86" y1="60" x2="86" y2="64" stroke="#f2c14e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Miniature Brass Padlock hanging from Front Door Latch (#f2c14e) -->
  <path d="M 76 68 C 76 64, 82 64, 82 68 L 82 72 L 76 72 Z" fill="none" stroke="#5d666e" stroke-width="2"/>
  <rect x="74" y="72" width="10" height="9" rx="1.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="79" cy="75.5" r="1.2" fill="#0b0704"/>
  <line x1="79" y1="75.5" x2="79" y2="78.5" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Woodcut Texture Hatches on Iron Plates -->
  <path d="M 20 40 L 25 43 M 19 50 L 24 53 M 20 60 L 25 63" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 72 32 L 76 34 M 72 62 L 76 64" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
</svg>
