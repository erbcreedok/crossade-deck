<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Croupier Jacket Silhouette (#b3221f) -->
  <path d="M 24 18 L 8 34 L 12 100 L 108 100 L 112 34 L 96 18 C 84 24, 36 24, 24 18 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Blue Sleeve Facing & Cuff Trim (#1d4f80) -->
  <path d="M 8 34 L 16 38 L 18 52 L 10 50 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 112 34 L 104 38 L 102 52 L 110 50 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Gold Sleeve Garters / Armbands (#f2c14e) -->
  <rect x="9" y="44" width="10" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <rect x="101" y="44" width="10" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Articulated Shoulder Spheres (#5d666e) with Gold Pivot Boss (#f2c14e) -->
  <circle cx="18" cy="28" r="7" fill="#5d666e" stroke="#0b0704" stroke-width="2"/>
  <circle cx="18" cy="28" r="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="102" cy="28" r="7" fill="#5d666e" stroke="#0b0704" stroke-width="2"/>
  <circle cx="102" cy="28" r="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Neck Collar Mounting Ring for Heads (#5d666e) -->
  <path d="M 38 18 C 44 14, 76 14, 82 18 L 86 28 C 76 34, 44 34, 34 28 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Head Socket Void (#0b0704) -->
  <ellipse cx="60" cy="20" rx="16" ry="6" fill="#0b0704" stroke="#f2c14e" stroke-width="1.5"/>

  <!-- Robot Croupier White Shirt Bib (#f7f1e6) -->
  <polygon points="44,28 76,28 72,70 48,70" fill="#f7f1e6" stroke="#0b0704" stroke-width="2.5"/>

  <!-- Shirt Collar Flaps (#f7f1e6) -->
  <polygon points="44,24 57,28 48,36" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>
  <polygon points="76,24 63,28 72,36" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Croupier Bow Tie (#1d4f80) & Gold Knot (#f2c14e) -->
  <polygon points="60,30 46,24 48,36" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="60,30 74,24 72,36" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="60" cy="30" r="3.2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Gold Dial Rivet Buttons (#f2c14e) down Shirt Front -->
  <circle cx="60" cy="42" r="2.2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="60" cy="52" r="2.2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="60" cy="62" r="2.2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Tuxedo Vest Lapels (#b3221f) with Gold Edge Trim (#f2c14e) -->
  <!-- Left Lapel -->
  <polygon points="38,26 48,28 38,68 28,48" fill="#b3221f" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="48" y1="28" x2="38" y2="68" stroke="#f2c14e" stroke-width="2"/>
  <!-- Right Lapel -->
  <polygon points="82,26 72,28 82,68 92,48" fill="#b3221f" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="72" y1="28" x2="82" y2="68" stroke="#f2c14e" stroke-width="2"/>

  <!-- Breast Pocket with Playing Card (Viewer Left) -->
  <rect x="26" y="52" width="13" height="3.5" rx="1" fill="#1d4f80" stroke="#0b0704" stroke-width="1.4"/>
  <rect x="28" y="44" width="9" height="9" rx="1" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.4"/>
  <polygon points="32.5,46 35,48.5 32.5,51 30,48.5" fill="#b3221f"/>

  <!-- Cummerbund / Croupier Dealer Belt (#1d4f80) -->
  <rect x="28" y="70" width="64" height="13" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="2.4"/>
  <line x1="30" y1="74" x2="90" y2="74" stroke="#0b0704" stroke-width="1.2"/>
  <line x1="30" y1="79" x2="90" y2="79" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Central Gold Card/Chip Meter Buckle (#f2c14e) -->
  <rect x="52" y="68" width="16" height="17" rx="3" fill="#f2c14e" stroke="#0b0704" stroke-width="2"/>
  <circle cx="60" cy="76.5" r="5" fill="#5d666e" stroke="#0b0704" stroke-width="1.5"/>
  <line x1="60" y1="76.5" x2="63" y2="73.5" stroke="#f2c14e" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="60" cy="76.5" r="1.5" fill="#b3221f"/>

  <!-- Dealer Cuffs & Articulated Hands at Flanks -->
  <!-- Left Cuff & Hand (Viewer Left) -->
  <rect x="11" y="68" width="7" height="12" rx="1" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="14.5" cy="74" r="1.5" fill="#f2c14e"/>
  <path d="M 12 80 C 10 88, 16 94, 20 88 L 18 80 Z" fill="#5d666e" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Right Cuff & Hand (Viewer Right) -->
  <rect x="102" y="68" width="7" height="12" rx="1" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="105.5" cy="74" r="1.5" fill="#f2c14e"/>
  <path d="M 108 80 C 110 88, 104 94, 100 88 L 102 80 Z" fill="#5d666e" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Lower Pelvic Chassis & Coat Split (y=83..100) -->
  <polygon points="46,83 74,83 70,100 50,100" fill="#5d666e" stroke="#0b0704" stroke-width="2.2"/>
  <!-- Card Dispenser Slot in Pelvis -->
  <rect x="53" y="88" width="14" height="3" rx="1" fill="#0b0704" stroke="#f2c14e" stroke-width="1"/>
  <line x1="55" y1="95" x2="65" y2="95" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Jacket Tails Hem & Gold Trim -->
  <path d="M 12 100 L 46 100 L 44 83" fill="none" stroke="#f2c14e" stroke-width="2.2"/>
  <path d="M 108 100 L 74 100 L 76 83" fill="none" stroke="#f2c14e" stroke-width="2.2"/>

  <!-- Woodcut Texture Hatch Lines -->
  <!-- Left Flank Shading -->
  <path d="M 15 60 L 22 56 M 14 70 L 21 66 M 15 82 L 23 78" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right Flank Shading -->
  <path d="M 105 60 L 98 56 M 106 70 L 99 66 M 105 82 L 97 78" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Waist Shading -->
  <path d="M 34 88 L 40 85 M 33 94 L 39 91 M 86 88 L 80 85 M 87 94 L 81 91" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
