<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Croupier Jacket Silhouette from Below (#b3221f) -->
  <!-- Top = Front / Chest (y~16), Bottom = Back / Tails (y~95) -->
  <path d="M 24 18 C 36 14, 84 14, 96 18 L 114 34 L 116 100 L 4 100 L 6 34 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Blue Coat Lining at Hem & Flanks (#1d4f80) -->
  <path d="M 6 82 C 14 76, 26 78, 32 88 L 30 100 L 4 100 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 114 82 C 106 76, 94 78, 88 88 L 90 100 L 116 100 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Gold Brocade Border along Hem (#f2c14e) -->
  <path d="M 24 18 L 8 34 L 6 82 C 14 76, 26 78, 32 88 L 30 100" fill="none" stroke="#f2c14e" stroke-width="2.5"/>
  <path d="M 96 18 L 112 34 L 114 82 C 106 76, 94 78, 88 88 L 90 100" fill="none" stroke="#f2c14e" stroke-width="2.5"/>

  <!-- Front Belt / Cummerbund Underside at Top (y=20..36, #1d4f80) -->
  <path d="M 32 20 L 88 20 L 84 36 L 36 36 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>
  <rect x="52" y="18" width="16" height="18" rx="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="60" y1="18" x2="60" y2="36" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Pelvic Chassis Mounting Base (#5d666e) -->
  <!-- Heavy Central Cast Aluminum / Steel Pelvic Core -->
  <path d="M 38 34 L 82 34 L 78 78 L 42 78 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Lower Mount Socket / Leg Connector Well (#0b0704) -->
  <ellipse cx="60" cy="54" rx="16" ry="14" fill="#0b0704" stroke="#f2c14e" stroke-width="1.8"/>
  <!-- Internal Gear Spline / Pivot Teeth (#5d666e) -->
  <circle cx="60" cy="54" r="8" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="60" cy="54" r="3.5" fill="#f2c14e"/>

  <!-- Gold Chassis Anchor Bolts (#f2c14e) -->
  <circle cx="44" cy="40" r="1.8" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>
  <circle cx="76" cy="40" r="1.8" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>
  <circle cx="46" cy="72" r="1.8" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>
  <circle cx="74" cy="72" r="1.8" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>

  <!-- Rear Coat Tails Split at Bottom (y=78..100) -->
  <polygon points="60,76 46,100 74,100" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>
  <polygon points="60,82 52,100 68,100" fill="#0b0704"/>
  <line x1="46" y1="100" x2="74" y2="100" stroke="#f2c14e" stroke-width="2"/>

  <!-- Armpit Underside Joint Panels (#5d666e) -->
  <ellipse cx="22" cy="44" rx="8" ry="12" fill="#5d666e" stroke="#0b0704" stroke-width="1.8"/>
  <ellipse cx="98" cy="44" rx="8" ry="12" fill="#5d666e" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Woodcut Texture Hatch Lines -->
  <!-- Left Side Hatches -->
  <path d="M 12 52 L 20 48 M 10 64 L 18 60 M 12 76 L 20 72 M 10 88 L 18 84" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right Side Hatches -->
  <path d="M 108 52 L 100 48 M 110 64 L 102 60 M 108 76 L 100 72 M 110 88 L 102 84" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Chassis Flank Hatches -->
  <path d="M 36 60 L 42 57 M 35 68 L 41 65 M 84 60 L 78 57 M 85 68 L 79 65" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
