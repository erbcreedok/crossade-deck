<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Croupier Jacket Silhouette from Above (#b3221f) -->
  <!-- Top = Back / Spine (y~16), Bottom = Front / Chest (y~95) -->
  <path d="M 24 20 C 38 14, 82 14, 96 20 L 114 36 L 112 100 L 8 100 L 6 36 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Back Spine Casing & Radiator Vents from Above (#1d4f80) -->
  <rect x="52" y="16" width="16" height="20" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="55" y1="21" x2="65" y2="21" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="55" y1="26" x2="65" y2="26" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="55" y1="31" x2="65" y2="31" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="50" cy="22" r="1.3" fill="#f2c14e"/>
  <circle cx="70" cy="22" r="1.3" fill="#f2c14e"/>

  <!-- Articulated Shoulder Armor Spheres (#5d666e) & Trim (#1d4f80, #f2c14e) -->
  <!-- Left Shoulder (Viewer Left) -->
  <circle cx="20" cy="34" r="11" fill="#5d666e" stroke="#0b0704" stroke-width="2.2"/>
  <circle cx="20" cy="34" r="5" fill="#1d4f80" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="20" cy="34" r="2.2" fill="#f2c14e"/>
  <rect x="10" y="44" width="18" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>
  <!-- Right Shoulder (Viewer Right) -->
  <circle cx="100" cy="34" r="11" fill="#5d666e" stroke="#0b0704" stroke-width="2.2"/>
  <circle cx="100" cy="34" r="5" fill="#1d4f80" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="100" cy="34" r="2.2" fill="#f2c14e"/>
  <rect x="92" y="44" width="18" height="4" rx="1" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Neck Collar Rim from Above (#5d666e) -->
  <ellipse cx="60" cy="42" rx="20" ry="14" fill="#5d666e" stroke="#0b0704" stroke-width="2.5"/>
  <ellipse cx="60" cy="42" rx="18" ry="12" fill="none" stroke="#f2c14e" stroke-width="1.6"/>
  <!-- Dark Socket Cavity for Head Mounting (#0b0704) -->
  <ellipse cx="60" cy="42" rx="12" ry="7" fill="#0b0704"/>
  <!-- Socket Mounting Key-Nodes -->
  <circle cx="52" cy="42" r="1.5" fill="#f2c14e"/>
  <circle cx="68" cy="42" r="1.5" fill="#f2c14e"/>

  <!-- White Croupier Shirt Bib sloping forward (#f7f1e6) -->
  <path d="M 44 48 C 50 52, 70 52, 76 48 L 74 86 L 46 86 Z" fill="#f7f1e6" stroke="#0b0704" stroke-width="2.2"/>

  <!-- Shirt Collar Flaps pointing forward (down) -->
  <polygon points="45,46 54,49 48,58" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.5"/>
  <polygon points="75,46 66,49 72,58" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.5"/>

  <!-- Robotic Bow Tie protruding forward (#1d4f80, #f2c14e) -->
  <polygon points="60,60 48,53 50,65" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <polygon points="60,60 72,53 70,65" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="60" cy="60" r="3" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Vest Lapels sloping forward / downward (#b3221f & #f2c14e) -->
  <path d="M 38 46 L 46 52 L 38 88 L 28 66 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <line x1="46" y1="52" x2="38" y2="88" stroke="#f2c14e" stroke-width="2"/>
  <path d="M 82 46 L 74 52 L 82 88 L 92 66 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <line x1="74" y1="52" x2="82" y2="88" stroke="#f2c14e" stroke-width="2"/>

  <!-- Chest Sloping Surface & Cummerbund Buckle at bottom edge (y=84..98) -->
  <rect x="36" y="86" width="48" height="10" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <rect x="54" y="84" width="12" height="12" rx="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="60" cy="90" r="3.5" fill="#5d666e" stroke="#0b0704" stroke-width="1"/>

  <!-- Woodcut Hatch Lines -->
  <!-- Left Shoulder Hatches -->
  <path d="M 16 58 L 24 54 M 14 68 L 22 64 M 16 78 L 24 74 M 14 88 L 22 84" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right Shoulder Hatches -->
  <path d="M 104 58 L 96 54 M 106 68 L 98 64 M 104 78 L 96 74 M 106 88 L 98 84" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
</svg>
