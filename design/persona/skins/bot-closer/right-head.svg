<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 38 82 L 62 82 L 60 92 L 40 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="87" x2="56" y2="87" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Head Profile Main Body (#b3221f) -->
  <!-- Left = Back (x~16), Right = Face (x~84) -->
  <path d="M 22 18 L 74 18 L 84 26 L 84 74 L 74 82 L 22 82 L 16 74 L 16 26 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Gold Top Bezel (#f2c14e) -->
  <path d="M 22 22 L 78 22 L 78 25 L 22 25 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Rear Radiator Louvre Profile at Left (#1d4f80) -->
  <path d="M 18 30 L 26 30 L 26 66 L 18 66 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="18" y1="38" x2="26" y2="38" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="18" y1="46" x2="26" y2="46" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="18" y1="54" x2="26" y2="54" stroke="#0b0704" stroke-width="1.8"/>
  <line x1="18" y1="62" x2="26" y2="62" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Sliding Deadbolt / Latch Profile at Brow (x=74..86, y=24..34) (#f2c14e) -->
  <rect x="74" y="24" width="8" height="11" rx="1.5" fill="#5d666e" stroke="#0b0704" stroke-width="1.5"/>
  <rect x="78" y="26" width="7" height="7" rx="1.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="81.5" cy="29.5" r="1.5" fill="#b3221f"/>

  <!-- Front Visor-Shutter Louvres in Profile (x=76..84, y=38..58) -->
  <polygon points="76,38 84,38 84,58 76,58" fill="#0b0704" stroke="#0b0704" stroke-width="1.8"/>
  <!-- Louvre Blades angled in Profile (#1d4f80 & #f7f1e6) -->
  <line x1="77" y1="42" x2="84" y2="41" stroke="#1d4f80" stroke-width="2.5"/>
  <line x1="77" y1="47" x2="84" y2="46" stroke="#1d4f80" stroke-width="2.5"/>
  <line x1="77" y1="52" x2="84" y2="51" stroke="#1d4f80" stroke-width="2.5"/>
  <!-- Calm Eye Glow through Blinds (#f7f1e6) -->
  <line x1="78" y1="46" x2="83" y2="46" stroke="#f7f1e6" stroke-width="1.8"/>

  <!-- Angular Executive Jaw in Profile (#1d4f80) -->
  <polygon points="68,64 84,64 82,76 68,76" fill="#1d4f80" stroke="#0b0704" stroke-width="2"/>
  <line x1="72" y1="70" x2="82" y2="70" stroke="#f2c14e" stroke-width="1.6"/>

  <!-- Ear Spool Dial on Temple (Center Side) (#1d4f80, #f2c14e, #5d666e) -->
  <circle cx="48" cy="48" r="13" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <circle cx="48" cy="48" r="10" fill="none" stroke="#f2c14e" stroke-width="1.6"/>
  <circle cx="48" cy="48" r="6" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="48" cy="48" r="2.5" fill="#f2c14e"/>

  <!-- Woodcut Hatches -->
  <path d="M 28 32 L 34 35 M 28 42 L 34 45 M 28 54 L 34 57 M 28 66 L 34 69" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 66 32 L 72 34 M 64 78 L 70 80" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
</svg>
