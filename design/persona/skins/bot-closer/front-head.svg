<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 38 82 L 62 82 L 60 92 L 40 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="87" x2="56" y2="87" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Ear Spool Dials at Temples (#1d4f80, #f2c14e) -->
  <rect x="11" y="38" width="6" height="16" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="14" cy="46" r="2" fill="#f2c14e"/>
  <rect x="83" y="38" width="6" height="16" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="86" cy="46" r="2" fill="#f2c14e"/>

  <!-- Businesslike Head Main Chassis (#b3221f) -->
  <path d="M 24 16 L 76 16 L 84 26 L 84 74 L 76 82 L 24 82 L 16 74 L 16 26 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Gold Brow Frame & Top Bezel (#f2c14e) -->
  <path d="M 20 22 L 80 22 L 80 25 L 20 25 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Sliding Deadbolt / Latch Assembly («щеколда/засов») at Brow -->
  <!-- Steel Slide Guide Track (#5d666e) -->
  <rect x="22" y="24" width="56" height="11" rx="2" fill="#5d666e" stroke="#0b0704" stroke-width="1.8"/>
  <!-- Keeper Catch Bracket on Left (#1d4f80) -->
  <rect x="20" y="23" width="9" height="13" rx="1.5" fill="#1d4f80" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="24.5" cy="29.5" r="1.2" fill="#f2c14e"/>
  <!-- Right Guide Bracket (#1d4f80) -->
  <rect x="71" y="23" width="9" height="13" rx="1.5" fill="#1d4f80" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="75.5" cy="29.5" r="1.2" fill="#f2c14e"/>
  <!-- Heavy Gold Sliding Deadbolt Bar («засов») (#f2c14e) Engaged to Left Keeper -->
  <rect x="24" y="26.5" width="46" height="6" rx="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <!-- Cylindrical Handle Knob on the Bolt -->
  <rect x="52" y="24.5" width="8" height="10" rx="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1.5"/>
  <circle cx="56" cy="29.5" r="2" fill="#b3221f"/>

  <!-- Visor-Shutter Aperture Frame («визор-шторка») (#0b0704) -->
  <rect x="20" y="38" width="60" height="20" rx="3" fill="#0b0704" stroke="#0b0704" stroke-width="2.2"/>

  <!-- Calm Direct Gaze behind Shutter (White/Gold Optical Bars #f7f1e6 / #f2c14e) -->
  <!-- Left Eye Slit -->
  <rect x="26" y="44" width="18" height="6" rx="1.5" fill="#f7f1e6" stroke="#f2c14e" stroke-width="1"/>
  <circle cx="35" cy="47" r="1.8" fill="#1d4f80"/>
  <!-- Right Eye Slit -->
  <rect x="56" y="44" width="18" height="6" rx="1.5" fill="#f7f1e6" stroke="#f2c14e" stroke-width="1"/>
  <circle cx="65" cy="47" r="1.8" fill="#1d4f80"/>

  <!-- Horizontal Visor Shutter Louvre Blinds (Шторка) (#1d4f80) -->
  <rect x="22" y="40" width="56" height="3" fill="#1d4f80" stroke="#0b0704" stroke-width="1.2"/>
  <rect x="22" y="45.5" width="56" height="3" fill="#1d4f80" stroke="#0b0704" stroke-width="1.2"/>
  <rect x="22" y="51" width="56" height="3" fill="#1d4f80" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Calm Executive Jaw Plate (#1d4f80) -->
  <polygon points="26,62 74,62 70,76 30,76" fill="#1d4f80" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <!-- Gold Closure Seam Bar (#f2c14e) -->
  <line x1="34" y1="67" x2="66" y2="67" stroke="#f2c14e" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="67" x2="66" y2="67" stroke="#0b0704" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Status Indicator Jewels on Jaw (#f2c14e) -->
  <circle cx="34" cy="72" r="1.6" fill="#f2c14e" stroke="#0b0704" stroke-width="0.8"/>
  <circle cx="66" cy="72" r="1.6" fill="#f2c14e" stroke="#0b0704" stroke-width="0.8"/>

  <!-- Woodcut Precision Hatch Lines -->
  <path d="M 18 32 L 22 30 M 17 64 L 22 62 M 18 72 L 23 70" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 82 32 L 78 30 M 83 64 L 78 62 M 82 72 L 77 70" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 40 79 L 46 79 M 54 79 L 60 79" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round"/>
</svg>
