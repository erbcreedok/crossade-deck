<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Head Bottom Plate (#b3221f) -->
  <!-- Top = Face / Chin (y~18), Bottom = Back / Nape (y~82) -->
  <path d="M 24 18 L 76 18 L 84 26 L 84 74 L 76 82 L 24 82 L 16 74 L 16 26 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Ear Spool Dials Underside on Sides (#1d4f80, #f2c14e) -->
  <rect x="11" y="40" width="6" height="18" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="14" cy="49" r="2" fill="#f2c14e"/>
  <rect x="83" y="40" width="6" height="18" rx="2" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="86" cy="49" r="2" fill="#f2c14e"/>

  <!-- Underside Recessed Chassis (#1d4f80) -->
  <rect x="22" y="24" width="56" height="52" rx="3" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <rect x="25" y="27" width="50" height="46" rx="2" fill="none" stroke="#f2c14e" stroke-width="1.4"/>

  <!-- Executive Chin Underside Block at Top (y=16..30) -->
  <polygon points="28,16 72,16 68,30 32,30" fill="#5d666e" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="36" y1="22" x2="64" y2="22" stroke="#f2c14e" stroke-width="1.8"/>

  <!-- Central Precision Neck Connector Hub for Mounting to Body Collar -->
  <circle cx="50" cy="52" r="16" fill="#5d666e" stroke="#0b0704" stroke-width="2.5"/>
  <circle cx="50" cy="52" r="13" fill="none" stroke="#f2c14e" stroke-width="1.8"/>
  <!-- Central Void Socket (#0b0704) -->
  <circle cx="50" cy="52" r="8" fill="#0b0704"/>
  <!-- Alignment Keyway -->
  <rect x="48.5" y="42" width="3" height="4" fill="#0b0704"/>

  <!-- Gold Anchor Screws (#f2c14e) -->
  <circle cx="39" cy="41" r="1.5" fill="#f2c14e"/>
  <circle cx="61" cy="41" r="1.5" fill="#f2c14e"/>
  <circle cx="39" cy="63" r="1.5" fill="#f2c14e"/>
  <circle cx="61" cy="63" r="1.5" fill="#f2c14e"/>

  <!-- Rear Heat Exhaust Underside Ports at Bottom (y=72..78) -->
  <rect x="32" y="73" width="10" height="3" rx="1" fill="#0b0704"/>
  <rect x="45" y="73" width="10" height="3" rx="1" fill="#0b0704"/>
  <rect x="58" y="73" width="10" height="3" rx="1" fill="#0b0704"/>

  <!-- Woodcut Hatches -->
  <path d="M 20 38 L 25 36 M 20 48 L 25 46 M 20 58 L 25 56" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 80 38 L 75 36 M 80 48 L 75 46 M 80 58 L 75 56" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round"/>
</svg>
