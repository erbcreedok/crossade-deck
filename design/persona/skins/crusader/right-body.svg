<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Back Cloak Drape (Red #b3221f) -->
  <path d="M 52 18 L 30 28 L 24 100 L 56 100 L 54 36 Z" fill="#b3221f" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Cloak Inner Lining (Deep Blue #1d4f80) & Gold Border Trim (#f2c14e) -->
  <path d="M 30 28 L 24 100 L 30 100 L 36 34 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <path d="M 52 18 L 30 28 L 24 100" fill="none" stroke="#f2c14e" stroke-width="2.4"/>

  <!-- Heater Shield Strapped on Back (Slung over Left Shoulder) -->
  <path d="M 28 26 C 36 24, 46 25, 48 30 L 46 64 C 42 74, 34 82, 30 88 C 28 82, 24 68, 24 58 Z" fill="#f7f1e6" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Gold Rim on Shield -->
  <path d="M 28 26 C 36 24, 46 25, 48 30 L 46 64 C 42 74, 34 82, 30 88 C 28 82, 24 68, 24 58 Z" fill="none" stroke="#f2c14e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 28 26 C 36 24, 46 25, 48 30 L 46 64 C 42 74, 34 82, 30 88 C 28 82, 24 68, 24 58 Z" fill="none" stroke="#0b0704" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Red Cross visible on Shield -->
  <path d="M 34 26 L 40 27 L 36 80 L 32 78 Z" fill="#b3221f" stroke="#0b0704" stroke-width="1.2"/>
  <path d="M 26 44 L 47 46 L 46 51 L 25 49 Z" fill="#b3221f" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Front Torso / Surcoat (White Paper #f7f1e6) -->
  <path d="M 52 26 L 76 24 L 94 44 C 98 58, 94 80, 92 100 L 52 100 Z" fill="#f7f1e6" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Gold Hem on Surcoat Front -->
  <path d="M 76 24 L 94 44 L 92 100" fill="none" stroke="#f2c14e" stroke-width="2.4"/>

  <!-- Red Crusader Cross on Chest (Profile Perspective) (#b3221f) -->
  <path d="M 76 34 L 88 34 L 92 44 L 82 46 L 84 58 L 74 58 L 75 46 L 68 44 L 70 38 L 78 40 Z" fill="#b3221f" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Chainmail Aventail at Collar (#5d666e) -->
  <path d="M 44 18 C 54 14, 72 14, 80 18 L 84 28 C 74 32, 54 32, 44 26 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 50 22 C 58 25, 70 25, 76 22" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Leather Waist Belt (#1d4f80) with Gold Buckle (#f2c14e) -->
  <path d="M 52 68 L 94 68 L 93 74 L 52 74 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <rect x="76" y="66" width="10" height="10" rx="1.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.8"/>
  <rect x="78" y="68" width="6" height="6" fill="#1d4f80" stroke="#0b0704" stroke-width="1.2"/>
  <line x1="81" y1="66" x2="81" y2="76" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Sword Scabbard hanging at Right Flank (Deep Blue #1d4f80 with Gold Chape #f2c14e) -->
  <path d="M 64 68 L 54 98 L 48 97 L 58 68 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <polygon points="54,98 48,97 50,91 56,92" fill="#f2c14e" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Sword Pommel & Crossguard -->
  <circle cx="68" cy="62" r="3.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <path d="M 62 67 L 74 67 L 73 70 L 63 70 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Right Arm in Chainmail (#5d666e) & Steel Spaulder (#9aa3ab) -->
  <!-- Steel Spaulder (Shoulder Armor) -->
  <path d="M 46 22 C 54 18, 66 18, 70 24 C 70 32, 64 36, 52 36 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 46 22 C 54 18, 66 18, 70 24" stroke="#f2c14e" stroke-width="2" fill="none"/>
  <!-- Chainmail Arm & Gauntlet resting near Hilt -->
  <path d="M 52 36 C 46 48, 50 60, 58 66 C 66 70, 72 66, 74 60 L 70 50 C 64 52, 58 48, 56 38 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.2"/>
  <!-- Steel Gauntlet (#9aa3ab) on Hilt -->
  <path d="M 64 56 C 68 52, 76 54, 76 60 C 74 66, 68 66, 62 62 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Woodcut Drapery Hatch Lines -->
  <!-- Cloak Folds Hatches -->
  <path d="M 32 60 L 40 56 M 30 70 L 38 66 M 32 80 L 40 76 M 30 90 L 38 86" stroke="#0b0704" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Surcoat Flank Hatches -->
  <path d="M 82 84 L 74 82 M 84 92 L 76 90" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
