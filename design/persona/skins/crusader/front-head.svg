<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Chainmail Coif / Camail (Neck base under helmet) -->
  <path d="M 28 72 C 26 84, 30 94, 50 94 C 70 94, 74 84, 72 72 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Chainmail Texture Rings -->
  <path d="M 36 82 C 43 85, 57 85, 64 82 M 38 87 C 44 90, 56 90, 62 87" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Great Helm Silhouette (Steel Barrel) -->
  <!-- Left Half (Light Steel) -->
  <path d="M 50 12 L 28 14 C 24 24, 22 42, 22 62 C 22 74, 32 84, 50 90 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Right Half (Shaded Steel Facet) -->
  <path d="M 50 12 L 72 14 C 76 24, 78 42, 78 62 C 78 74, 68 84, 50 90 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Helm Top Plate Seam / Rivet Band -->
  <path d="M 26 20 C 34 18, 66 18, 74 20" stroke="#0b0704" stroke-width="1.8" fill="none"/>
  <circle cx="32" cy="19" r="1.3" fill="#0b0704"/>
  <circle cx="41" cy="18" r="1.3" fill="#0b0704"/>
  <circle cx="50" cy="18" r="1.3" fill="#0b0704"/>
  <circle cx="59" cy="18" r="1.3" fill="#0b0704"/>
  <circle cx="68" cy="19" r="1.3" fill="#0b0704"/>

  <!-- Central Vertical Ridge Line -->
  <line x1="50" y1="12" x2="50" y2="90" stroke="#0b0704" stroke-width="2.2"/>

  <!-- Brass Reinforcing Cross Faceplate (Gold) -->
  <!-- Horizontal Brow Band (with flared ends) -->
  <path d="M 22 43 L 78 43 L 79 53 L 21 53 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Vertical Nasal / Chin Bar (with flared ends) -->
  <path d="M 44 24 L 56 24 L 56 86 L 44 86 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Brass Cross Center Boss & Enamel Red Diamond -->
  <polygon points="50,28 54,34 50,40 46,34" fill="#b3221f" stroke="#0b0704" stroke-width="1.4"/>
  <polygon points="50,43 55,48 50,53 45,48" fill="#1d4f80" stroke="#0b0704" stroke-width="1.4"/>

  <!-- Brass Plate Rivets -->
  <!-- Horizontal Band Rivets -->
  <circle cx="25" cy="48" r="1.2" fill="#0b0704"/>
  <circle cx="75" cy="48" r="1.2" fill="#0b0704"/>
  <!-- Vertical Band Rivets -->
  <circle cx="50" cy="26" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="62" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="74" r="1.2" fill="#0b0704"/>
  <circle cx="50" cy="83" r="1.2" fill="#0b0704"/>

  <!-- Eye Slits (Ocularium) - Deep Black Voids -->
  <!-- Left Eye Slit -->
  <rect x="26" y="46" width="16" height="4" rx="1.5" fill="#0b0704" stroke="#0b0704" stroke-width="1.2"/>
  <!-- Right Eye Slit -->
  <rect x="58" y="46" width="16" height="4" rx="1.5" fill="#0b0704" stroke="#0b0704" stroke-width="1.2"/>

  <!-- Ventilation Breathing Holes (Aspiracula) -->
  <!-- Left Cheeks Piercings -->
  <circle cx="32" cy="60" r="1.4" fill="#0b0704"/>
  <circle cx="38" cy="60" r="1.4" fill="#0b0704"/>
  <circle cx="30" cy="66" r="1.4" fill="#0b0704"/>
  <circle cx="36" cy="66" r="1.4" fill="#0b0704"/>
  <circle cx="42" cy="66" r="1.4" fill="#0b0704"/>
  <circle cx="32" cy="72" r="1.4" fill="#0b0704"/>
  <circle cx="38" cy="72" r="1.4" fill="#0b0704"/>
  <circle cx="36" cy="78" r="1.4" fill="#0b0704"/>

  <!-- Right Cheeks Piercings -->
  <circle cx="62" cy="60" r="1.4" fill="#0b0704"/>
  <circle cx="68" cy="60" r="1.4" fill="#0b0704"/>
  <circle cx="58" cy="66" r="1.4" fill="#0b0704"/>
  <circle cx="64" cy="66" r="1.4" fill="#0b0704"/>
  <circle cx="70" cy="66" r="1.4" fill="#0b0704"/>
  <circle cx="62" cy="72" r="1.4" fill="#0b0704"/>
  <circle cx="68" cy="72" r="1.4" fill="#0b0704"/>
  <circle cx="64" cy="78" r="1.4" fill="#0b0704"/>

  <!-- Woodcut Texture Hatch Lines -->
  <!-- Steel Left Light Plate -->
  <path d="M 26 28 L 32 31 M 25 34 L 31 37 M 26 40 L 30 42" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Steel Right Shaded Plate -->
  <path d="M 74 28 L 68 31 M 75 34 L 69 37 M 74 40 L 70 42" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Lower Visor Curve Hatches -->
  <path d="M 28 80 L 34 78 M 72 80 L 66 78" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
