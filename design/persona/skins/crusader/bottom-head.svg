<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Chainmail Aventail / Coif draping below Helmet Rim (#5d666e) -->
  <path d="M 24 16 C 14 30, 12 50, 14 68 C 16 80, 24 90, 50 94 C 76 90, 84 80, 86 68 C 88 50, 86 30, 76 16 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Chainmail Rings Texture on Rim Skirt -->
  <path d="M 16 46 C 14 56, 17 66, 24 74 M 84 46 C 86 56, 83 66, 76 74 M 32 86 C 42 90, 58 90, 68 86" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Lower Steel Helmet Rim (Barrel Base from Below) -->
  <!-- Left Half Rim (Light Steel #9aa3ab) -->
  <path d="M 50 16 C 34 16, 22 26, 20 48 C 18 64, 28 78, 50 86 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Right Half Rim (Shaded Steel #5d666e) -->
  <path d="M 50 16 C 66 16, 78 26, 80 48 C 82 64, 72 78, 50 86 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Neck Opening into Helmet Interior (Dark Void #0b0704 & Chainmail Throat) -->
  <ellipse cx="50" cy="44" rx="20" ry="18" fill="#0b0704" stroke="#0b0704" stroke-width="2"/>
  <!-- Chainmail Throat lining inside the opening (#5d666e) -->
  <ellipse cx="50" cy="44" rx="14" ry="12" fill="#5d666e" stroke="#0b0704" stroke-width="1.6"/>
  <ellipse cx="50" cy="44" rx="8" ry="7" fill="#0b0704"/>
  <path d="M 40 44 C 44 47, 56 47, 60 44 M 42 48 C 46 51, 54 51, 58 48" stroke="#0b0704" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Underside of Chin & Lower Visor Plate (Protruding Forward/Down to y=86) -->
  <!-- Chin Faceplate Left Facet (#9aa3ab) -->
  <path d="M 32 58 C 36 72, 44 82, 50 86 L 50 62 C 44 62, 36 60, 32 58 Z" fill="#9aa3ab" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>
  <!-- Chin Faceplate Right Facet (#5d666e) -->
  <path d="M 68 58 C 64 72, 56 82, 50 86 L 50 62 C 56 62, 64 60, 68 58 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2" stroke-linejoin="round"/>

  <!-- Central Chin Seam -->
  <line x1="50" y1="62" x2="50" y2="86" stroke="#0b0704" stroke-width="2"/>

  <!-- Bottom Tip of Brass Reinforcing Cross (#f2c14e) wrapping under Chin -->
  <path d="M 45 62 L 55 62 L 54 86 L 46 86 Z" fill="#f2c14e" stroke="#0b0704" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="50,66 53,70 50,74 47,70" fill="#b3221f" stroke="#0b0704" stroke-width="1.2"/>
  <circle cx="50" cy="78" r="1.3" fill="#0b0704"/>
  <circle cx="50" cy="83" r="1.3" fill="#0b0704"/>

  <!-- Breathing Holes (Aspiracula) visible on Underside of Visor -->
  <circle cx="38" cy="68" r="1.3" fill="#0b0704"/>
  <circle cx="42" cy="72" r="1.3" fill="#0b0704"/>
  <circle cx="40" cy="78" r="1.3" fill="#0b0704"/>
  <circle cx="62" cy="68" r="1.3" fill="#0b0704"/>
  <circle cx="58" cy="72" r="1.3" fill="#0b0704"/>
  <circle cx="60" cy="78" r="1.3" fill="#0b0704"/>

  <!-- Outer Rim Reinforcing Rivets -->
  <circle cx="28" cy="24" r="1.3" fill="#0b0704"/>
  <circle cx="22" cy="38" r="1.3" fill="#0b0704"/>
  <circle cx="22" cy="56" r="1.3" fill="#0b0704"/>
  <circle cx="26" cy="70" r="1.3" fill="#0b0704"/>
  <circle cx="72" cy="24" r="1.3" fill="#0b0704"/>
  <circle cx="78" cy="38" r="1.3" fill="#0b0704"/>
  <circle cx="78" cy="56" r="1.3" fill="#0b0704"/>
  <circle cx="74" cy="70" r="1.3" fill="#0b0704"/>
  <circle cx="50" cy="18" r="1.3" fill="#0b0704"/>

  <!-- Woodcut Texture Hatch Lines -->
  <!-- Left Rim Hatches -->
  <path d="M 24 30 L 30 34 M 23 42 L 29 45 M 24 54 L 30 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right Rim Hatches -->
  <path d="M 76 30 L 70 34 M 77 42 L 71 45 M 76 54 L 70 56" stroke="#0b0704" stroke-width="1.6" stroke-linecap="round"/>
</svg>
