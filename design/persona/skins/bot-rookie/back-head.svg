  <circle cx="13" cy="47" r="2" fill="#f2c14e"/>
  <rect x="84" y="38" width="6" height="18" rx="3" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8"/>
  <circle cx="87" cy="47" r="2" fill="#f2c14e"/>

  <!-- Spring Antenna from Behind -->
  <path d="M 44 20 C 44 16, 56 16, 56 20 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <path d="M 50 17 Q 56 15, 50 13 Q 44 11, 52 9 Q 58 7, 54 5" fill="none" stroke="#5d666e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 50 17 Q 56 15, 50 13 Q 44 11, 52 9 Q 58 7, 54 5" fill="none" stroke="#0b0704" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="55" cy="6" r="4.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="53.5" cy="4.5" r="1.3" fill="#f7f1e6"/>

