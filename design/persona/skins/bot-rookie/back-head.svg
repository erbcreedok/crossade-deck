  <path d="M 78 32 C 74 36, 70 38, 66 38" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 26 70 C 32 74, 40 76, 46 76" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round" fill="none"/>
