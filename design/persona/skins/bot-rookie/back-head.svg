  <path d="M 32 23 C 42 19, 58 19, 68 23" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Round Battery / Maintenance Port (#1d4f80) -->
  <circle cx="50" cy="48" r="17" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <circle cx="50" cy="48" r="14" fill="none" stroke="#f2c14e" stroke-width="1.5"/>

  <!-- Center Steel Core with Winding / Charging Slot (#5d666e & #0b0704) -->
