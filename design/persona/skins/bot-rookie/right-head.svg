<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Neck Connector Post (#5d666e) -->
  <path d="M 38 80 L 62 80 L 60 92 L 40 92 Z" fill="#5d666e" stroke="#0b0704" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="86" x2="56" y2="86" stroke="#0b0704" stroke-width="1.8"/>

  <!-- Spring Antenna in Profile («пружинка-антенна») -->
  <!-- Base (#1d4f80) -->
  <path d="M 44 20 C 44 16, 56 16, 56 20 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.6"/>
  <!-- Coiled Wire bouncing forward/up (#5d666e) -->
  <path d="M 50 17 Q 56 15, 52 12 Q 46 10, 54 8 Q 60 6, 56 5" fill="none" stroke="#5d666e" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Gold Top Ball (#f2c14e) -->
  <circle cx="56" cy="6" r="4.5" fill="#f2c14e" stroke="#0b0704" stroke-width="1.6"/>
  <circle cx="54.5" cy="4.5" r="1.3" fill="#f7f1e6"/>

  <!-- Round Head Profile Silhouette (#b3221f) -->
  <!-- Left = Back (x~16), Right = Face (x~84) -->
  <path d="M 24 22 C 34 16, 62 16, 74 22 C 86 30, 88 64, 76 78 C 66 86, 36 86, 24 78 C 14 64, 14 30, 24 22 Z" fill="#b3221f" stroke="#0b0704" stroke-width="3" stroke-linejoin="round"/>

  <!-- Big Round Eye Bulging in Profile (x=72..84, y=36..58) -->
  <!-- Eye Casing Bezel (#1d4f80) -->
  <path d="M 68 36 C 78 34, 86 42, 84 52 C 82 58, 76 62, 68 60 Z" fill="#1d4f80" stroke="#0b0704" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- White Eye Bulge (#f7f1e6) -->
  <ellipse cx="76" cy="47" rx="8" ry="10" fill="#f7f1e6" stroke="#0b0704" stroke-width="1.8"/>
  <!-- Golden Iris (#f2c14e) & Pupil (#0b0704) -->
  <ellipse cx="78" cy="47" rx="4.5" ry="6" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>
  <ellipse cx="79.5" cy="46" rx="2.2" ry="3" fill="#0b0704"/>
  <circle cx="78.5" cy="44.5" r="1" fill="#f7f1e6"/>

  <!-- Confused / Sheepish Mouth Notch on Right Edge (x=72..80, y=66..74) -->
  <path d="M 70 68 Q 78 66, 77 74 Q 72 75, 68 72 Z" fill="#0b0704" stroke="#0b0704" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="71" y1="69" x2="76" y2="70" stroke="#f7f1e6" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ear Muff Dial on Temple (Center Side) (#1d4f80, #f2c14e, #5d666e) -->
  <circle cx="46" cy="48" r="13" fill="#1d4f80" stroke="#0b0704" stroke-width="2.2"/>
  <circle cx="46" cy="48" r="10" fill="none" stroke="#f2c14e" stroke-width="1.6"/>
  <circle cx="46" cy="48" r="6" fill="#5d666e" stroke="#0b0704" stroke-width="1.4"/>
  <circle cx="46" cy="48" r="2.5" fill="#f2c14e"/>

  <!-- Blushing Cheek Rivet (#f2c14e) -->
  <circle cx="62" cy="58" r="2" fill="#f2c14e" stroke="#0b0704" stroke-width="1"/>

  <!-- Woodcut Hatches -->
  <path d="M 26 34 C 30 38, 34 40, 38 40" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 26 62 C 30 66, 34 68, 38 68" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 52 76 C 58 78, 64 78, 68 76" stroke="#0b0704" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
