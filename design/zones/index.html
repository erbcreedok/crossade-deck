<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Зоны, язычки, контуры — стенд</title>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<script src="icons.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  /* ПАЛИТРА — та же, что у стола (`look/src/palette.ts`): ни одного нового цвета. */
  :root { --felt: #173d2d; --feltDark: #0f2e22; --panel: #3a2a1d; --panelLight: #4a3627; --well: #1c120b; --ink: #f5ead0; --inkDim: #cdb98f; --gold: #f2c14e; --goldLight: #f8d885; --goldDark: #b08a26; --danger: #e0483f; --black: #0b0704; --wood: #6b4d2c; --mine: #7fd1b9; --alia: #f2c14e; --timur: #e06c75; --free: #8d9a94; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0d2118; color: var(--inkDim); font: 400 13px/1.3 'Tiny5', monospace; }
  .page { width: min(100vw, 480px); margin: 0 auto; padding: 14px 12px 60px; }
  h1 { margin: 4px 2px 12px; font-weight: 400; font-size: 18px; color: var(--ink); }
  .plate { background: linear-gradient(var(--panel), var(--well)); color: var(--ink); margin: 0 0 22px; padding: 12px 10px 10px;
    box-shadow: 0 -2px 0 0 var(--black), 0 2px 0 0 var(--black), -2px 0 0 0 var(--black), 2px 0 0 0 var(--black), inset 0 0 0 2px var(--wood), 0 6px 0 0 rgba(11,7,4,.6); }
  .head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .head .n { width: 22px; height: 22px; background: linear-gradient(var(--goldLight), var(--goldDark)); color: var(--black); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--black); }
  .head .t { font-size: 15px; color: var(--ink); letter-spacing: .3px; }
  .badge { margin-left: auto; padding: 2px 7px; font-size: 11px; color: var(--black); }
  .badge.have { background: var(--mine); } .badge.plan { background: var(--gold); } .badge.new { background: #c9a0e8; }
  .shots { display: flex; gap: 8px; }
  .shot { flex: 1; min-width: 0; }
  .view { position: relative; height: 112px; overflow: hidden; border-radius: 10px; background: radial-gradient(circle at 50% 30%, #1b4835, var(--felt) 60%, var(--feltDark)); box-shadow: 0 0 0 3px var(--wood), 0 0 0 5px var(--black); }
  .cap { margin-top: 9px; text-align: center; font-size: 12px; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chip { display: inline-block; padding: 1px 6px; font-size: 11px; color: var(--black); }
  .c-no { background: #5a5448; color: var(--inkDim); } .c-yes { background: var(--mine); } .c-hot { background: var(--gold); } .c-bad { background: var(--danger); color: var(--ink); }
  /* зона и стопка */
  .zone { position: absolute; left: 50%; top: calc(50% - 4px); width: 64px; height: 96px; margin: -48px 0 0 -32px; border-radius: 9px; --ink: var(--mine); }
  .zone.hint { border: 2px dashed var(--ink); opacity: .8; }
  .zone.hot { border: 3px solid var(--ink); background: color-mix(in srgb, var(--ink) 28%, transparent); }
  .zone.ask { border: 2px dashed var(--gold); animation: pulse 1s steps(2) infinite; }
  .zone.decline { border: 3px solid var(--danger); background: color-mix(in srgb, var(--danger) 25%, transparent); animation: shake .5s steps(6) infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .stack { position: absolute; left: 50%; top: calc(50% - 8px); width: 44px; height: 62px; margin: -31px 0 0 -22px; }
  .stack img { position: absolute; width: 44px; height: 62px; box-shadow: 0 0 0 1.5px var(--black); }
  .tab { position: absolute; right: 2px; top: 50%; margin-top: -9px; height: 18px; padding: 0 5px; display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink);
    background: linear-gradient(var(--goldLight), var(--goldDark)); color: var(--black); box-shadow: 0 0 0 2px var(--black); }
  .tab .ic { width: 12px; height: 12px; }
  .lockic { position: absolute; left: 50%; top: calc(50% + 34px); margin-left: -12px; }
  .view.gv { background: #0a1511; } .gvimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tabc { position: absolute; left: 50%; top: calc(50% + 31px); width: 37px; height: 18.5px; margin-left: -18.5px; image-rendering: auto; }
  .seat { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--black); box-shadow: 0 0 0 2px var(--black); }
  .carry { position: absolute; width: 31px; height: 43px; box-shadow: 0 0 0 1.5px var(--black), 0 4px 0 rgba(11,7,4,.5); animation: bob 1.4s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .arrow { position: absolute; font-size: 18px; color: var(--gold); text-shadow: 0 2px 0 var(--black); }
  .p-i { fill: var(--ink); } .p-a { fill: var(--gold); } .p-d { fill: var(--inkDim); fill-opacity: .55; } .p-r { fill: var(--danger); } .p-bg { fill: var(--well); }
  .tab .p-i { fill: var(--black); } .tab .p-a { fill: var(--panel); }
  .ic { display: block; image-rendering: pixelated; }
  .eq { align-self: center; font-size: 20px; color: var(--gold); flex: none; }
  .bowl { position: absolute; left: 8px; right: 8px; bottom: 6px; height: 40px; border-top: 2px dashed var(--ink); border-radius: 50% 50% 0 0 / 100% 100% 0 0; background: color-mix(in srgb, var(--ink) 10%, transparent); --ink: var(--mine); }
  .hand { position: absolute; bottom: 4px; left: 50%; width: 80px; margin-left: -40px; height: 40px; }
  .hand img { position: absolute; bottom: 0; width: 30px; height: 42px; box-shadow: 0 0 0 1.5px var(--black); }
</style>
</head>
<body>
<div class="page">
  <h1>ЗОНЫ · ЯЗЫЧКИ · КОНТУРЫ</h1>
  <div id="slides"></div>
</div>
<script type="module">
import * as THREE from "three";
const I = (n, s = 1) => PixelIcons.icon(n, s);
const C = { mine: "var(--mine)", alia: "var(--alia)", timur: "var(--timur)", free: "var(--free)", gold: "var(--gold)" };

/** Одна картинка-сцена: зона (состояние), стопка, язычок или замок, значок места, несомое. */
function scene({ ink = "mine", zone = "none", n = 5, tab = true, tabLit = false, lock = false, seat = "", extra = "", hand = false, bowl = false, stack = true }) {
  const cards = Array.from({ length: Math.min(4, Math.ceil(n / 2)) }, (_, i) => `<img src="cards/back.webp" style="left:${i * 1.2}px;top:${-i * 1.2}px">`).join("");
  const z = zone === "none" ? "" : `<div class="zone ${zone}" style="--ink:${C[ink]}"></div>`;
  const t = lock ? `<div class="lockic">${I("lock", 2)}</div>` : tab ? `<canvas class="tabc" data-n="${n}" data-lit="${tabLit ? 1 : 0}" width="148" height="74"></canvas>` : "";
  const s = seat ? `<div class="seat" style="background:${C[ink]}">${seat}</div>` : "";
  const st = stack ? `<div class="stack">${cards}</div>` : "";
  const h = hand ? `<div class="hand"><img src="cards/club-A.webp" style="left:6px;transform:rotate(-10deg)"><img src="cards/diamond-10.webp" style="left:25px"><img src="cards/club-K.webp" style="left:44px;transform:rotate(10deg)"></div>` : "";
  const b = bowl ? `<div class="bowl" style="--ink:${C[ink]}"></div>` : "";
  return `<div class="view">${s}${z}${st}${t}${b}${h}${extra}</div>`;
}

// ——— КАРТИНКА ИЗ ТЕХ ЖЕ ДЕТАЛЕЙ, ЧТО В ИГРЕ: настоящие размеры (карта 1.17×1.638, шаг стопки 0.012, язычок 1×0.5 плашмя у нижней кромки), рубашка plaid, язычок рисуется тем же `drawTab`. ———
const CARD_W = 1.17, CARD_H = 1.638, STEP = 0.012, TAB = { w: 1, l: 0.5 };
const GV = { w: 300, h: 300, renderer: null, back: null };
function gvInit() {
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(2); r.setSize(GV.w, GV.h, false); GV.renderer = r;
  GV.back = new THREE.TextureLoader().load("cards/back.webp", () => GV.onBack && GV.onBack()); GV.back.colorSpace = THREE.SRGBColorSpace; GV.back.anisotropy = 8;
}
/** Снимок сцены: стопка из `n` карт на сукне, язычок (если есть) плашмя у нижней кромки; вид — как у свободной камеры игры, сверху-сзади. */
function gvShot({ n = 6, tab = true, lit = false }) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a1511);
  const felt = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x14402a })); felt.rotation.x = -Math.PI / 2; scene.add(felt);
  const h = n * STEP, body = new THREE.Mesh(new THREE.BoxGeometry(CARD_W * 0.985, h, CARD_H * 0.985), new THREE.MeshBasicMaterial({ color: 0xd1c6ab })); body.position.y = h / 2; scene.add(body);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), new THREE.MeshBasicMaterial({ map: GV.back })); top.rotation.x = -Math.PI / 2; top.position.y = h + 0.002; scene.add(top);
  if (tab) {
    const cv = document.createElement("canvas"); cv.width = 340; cv.height = 170; cv.dataset.n = n; cv.dataset.lit = lit ? 1 : 0; drawTab(cv);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(TAB.w, TAB.l), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05 }));
    m.rotation.x = -Math.PI / 2; m.position.set(0, 0.004, CARD_H / 2 + TAB.l / 2); scene.add(m);
  }
  const cam = new THREE.PerspectiveCamera(36, GV.w / GV.h, 0.1, 100); cam.position.set(0, 3.7, 2.9); cam.lookAt(0, 0, 0.62);
  GV.renderer.render(scene, cam);
  return GV.renderer.domElement.toDataURL("image/png");
}
/** Шот по описанию: картинка из игровых деталей плюс значок места и (если нужен) значок замка поверх. */
const gvView = ({ ink = "mine", seat = "", lock = false, ...spec }) => `<div class="view gv"><img class="gvimg" data-gv='${JSON.stringify(spec)}'>${seat ? `<div class="seat" style="background:${C[ink]}">${seat}</div>` : ""}${lock ? `<div class="lockic">${I("lock", 2)}</div>` : ""}</div>`;
window.__gv = (spec) => { if (!GV.renderer) gvInit(); return gvShot(spec); };
const chip = (txt, cls) => `<span class="chip ${cls}">${txt}</span>`;
const shot = (sceneHtml, cap, c) => `<div class="shot">${sceneHtml}<div class="cap">${cap}${c ? chip(c[0], c[1]) : ""}</div></div>`;
const slide = (n, title, badge, body) => `<div class="plate"><div class="head"><div class="n">${n}</div><div class="t">${title}</div><div class="badge ${badge[1]}">${badge[0]}</div></div>${body}</div>`;
const carry = (x, y, img = "club-K") => `<img class="carry" src="cards/${img}.webp" style="left:${x}px;top:${y}px">`;
const have = ["в игре", "have"], plan = ["план", "plan"], upd = ["меняем", "new"];

const slides = [
  slide(1, "ЯЗЫЧОК", upd, `<div class="shots">
    ${shot(gvView({ ink: "alia", seat: "А", n: 25, tab: true }), "нет замка", ["язычок есть", "c-yes"])}
    ${shot(gvView({ ink: "timur", seat: "Т", n: 12, tab: false, lock: true }), "замок", ["язычка нет", "c-no"])}
    ${shot(gvView({ ink: "free", seat: "·", n: 9, tab: true }), "бесхозный", ["язычок есть", "c-yes"])}
  </div>`),
  slide(2, "КОНТУР = ПРИЁМКА", upd, `<div class="shots">
    ${shot(scene({ ink: "alia", seat: "А", zone: "hint", extra: carry(4, 62) }), "несу рядом", ["подсказка", "c-yes"])}
    ${shot(scene({ ink: "alia", seat: "А", zone: "hot", extra: carry(36, 28) }), "над зоной", ["горит", "c-hot"])}
    ${shot(scene({ ink: "timur", seat: "Т", extra: carry(36, 28) }), "не принимает", ["нет контура", "c-no"])}
  </div>`),
  slide(3, "ЗОНА ОДНА У ВСЕХ", upd, `<div class="shots">
    ${shot(scene({ ink: "mine", seat: "Я", zone: "hint" }), "моя", ["цвет мой", "c-no"])}
    ${shot(scene({ ink: "timur", seat: "Т", zone: "hint" }), "чужая", ["цвет его", "c-no"])}
    ${shot(scene({ ink: "free", seat: "·", zone: "hint" }), "пустая", ["серая", "c-no"])}
  </div>`),
  slide(4, "МОЯ РУКА", have, `<div class="shots">
    ${shot(scene({ ink: "mine", zone: "hot", stack: false, hand: true, bowl: true, extra: carry(50, 8) }), "первое лицо", ["чаша", "c-yes"])}
    <div class="eq">=</div>
    ${shot(scene({ ink: "mine", seat: "Я", zone: "hot", extra: carry(36, 28) }), "свободная", ["зона на столе", "c-yes"])}
  </div>`),
  slide(5, "ЗАМОК ≠ НЕ ПРИНИМАЕТ", upd, `<div class="shots">
    ${shot(scene({ ink: "alia", seat: "А", tab: false, lock: true, zone: "hint", extra: carry(4, 62) }), "замок", ["контур, без язычка", "c-no"])}
    ${shot(scene({ ink: "alia", seat: "А", extra: carry(4, 62) }), "не принимает", ["язычок, без контура", "c-no"])}
    ${shot(scene({ ink: "alia", seat: "А", tab: false, lock: true, extra: carry(4, 62) }), "оба", ["пусто", "c-no"])}
  </div>`),
  slide(6, "ПРЕДЛОЖИТЬ КАРТУ", plan, `<div class="shots">
    ${shot(scene({ ink: "alia", seat: "А", zone: "ask", extra: carry(36, 22) }), "несу к нему", ["у него висит", "c-hot"])}
    ${shot(scene({ ink: "alia", seat: "А", zone: "hot", n: 8, extra: `<div class="arrow" style="left:40px;top:2px">▼</div>` }), "смах вниз", ["принял", "c-yes"])}
    ${shot(scene({ ink: "alia", seat: "А", zone: "decline", extra: carry(36, 26) + `<div class="arrow" style="left:40px;top:2px">▲</div>` }), "смах вверх", ["отклонил", "c-bad"])}
  </div>`),
  slide(7, "СОСТОЯНИЯ ЗОНЫ", plan, `<div class="shots" style="flex-wrap:wrap;row-gap:12px">
    ${shot(scene({ ink: "alia", seat: "А" }), "скрыта", ["", "c-no"])}
    ${shot(scene({ ink: "alia", seat: "А", zone: "hint" }), "подсказка", ["", "c-yes"])}
    ${shot(scene({ ink: "alia", seat: "А", zone: "hot" }), "горит", ["", "c-hot"])}
  </div><div class="shots" style="margin-top:12px">
    ${shot(scene({ ink: "alia", seat: "А", zone: "ask" }), "ждёт ответа", ["мигает", "c-hot"])}
    ${shot(scene({ ink: "alia", seat: "А", zone: "decline" }), "отклонил", ["красная тряска", "c-bad"])}
    ${shot(scene({ ink: "alia", seat: "А", tab: false, lock: true }), "нельзя", ["ничего", "c-no"])}
  </div>`),
];
document.getElementById("slides").innerHTML = slides.join("");
/** ЯЗЫЧОК — тот же рисунок, что в игре (`drawTab` в table3d/src/scene.ts): плоский край к стопке, скруглённый наружу, плашка, две карты веером, число. */
function drawTab(cv) {
  const count = Number(cv.dataset.n), lit = cv.dataset.lit === "1", c = cv.getContext("2d"), W = cv.width, H = cv.height, r = H * 0.42, line = H * 0.08;
  const T = { black: "#0b0704", ink: "#f5ead0" }, BAR = { plateHi: "#25321f", plateLo: "#16210f", goldHi: "#f8d885", goldLo: "#b08a26" };
  c.clearRect(0, 0, W, H);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, H - r); c.quadraticCurveTo(W, H, W - r, H); c.lineTo(r, H); c.quadraticCurveTo(0, H, 0, H - r); c.closePath();
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, lit ? BAR.goldHi : BAR.plateHi); g.addColorStop(1, lit ? BAR.goldLo : BAR.plateLo);
  c.fillStyle = g; c.fill(); c.lineJoin = "round"; c.lineWidth = line; c.strokeStyle = T.black; c.stroke();
  const ink = lit ? T.ink : BAR.goldHi, cy = H * 0.5;
  for (const [dx, a] of [[-0.05, -0.28], [0.05, 0.2]]) { c.save(); c.translate(W * 0.2 + dx * W, cy); c.rotate(a); c.fillStyle = ink; c.strokeStyle = T.black; c.lineWidth = line * 0.7; c.beginPath(); c.roundRect(-H * 0.17, -H * 0.27, H * 0.34, H * 0.54, H * 0.05); c.fill(); c.stroke(); c.restore(); }
  c.fillStyle = lit ? T.black : T.ink; c.textBaseline = "middle"; c.textAlign = "left"; c.font = `${Math.round(H * 0.5)}px Tiny5, monospace`; c.fillText(String(count), W * 0.38, cy + H * 0.03);
}
document.fonts.load("40px Tiny5").then(() => { document.querySelectorAll("canvas.tabc").forEach(drawTab); gvInit(); const draw = () => document.querySelectorAll("img[data-gv]").forEach((im) => { if (!im.src.startsWith("data:")) im.src = gvShot(JSON.parse(im.dataset.gv)); }); GV.onBack = draw; if (GV.back.image) draw(); });

</script>
</body>
</html>
