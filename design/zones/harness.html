<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>harness — настоящая сцена игры для снимков стенда</title>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0a1511; }
  #stage { position: relative; width: 390px; height: 844px; overflow: hidden; }
  body.live { overflow: hidden; height: 100vh; }
  body.live #stage { position: absolute; width: 820px; height: 820px; left: 50%; top: 50%; margin: -410px 0 0 -410px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// СЦЕНА ИГРЫ ДЛЯ СНИМКОВ. Здесь нет ничего нарисованного руками: подтягивается НАСТОЯЩИЙ `scene.ts` и локальный стол с dev-сервера игры (порт 9590, только читаем), стол приводится в нужное состояние теми же
// намерениями, что у игрока, и `shoot.mjs` снимает кадр. Страница стенда потом показывает эти снимки — один в один как в игре.
const GAME = "http://localhost:9590", HOST = "http://localhost:2591";
globalThis.__TABLE_HOST__ = HOST;
await document.fonts.load("20px Tiny5");
const { mountScene } = await import(`${GAME}/src/scene.ts`);
const { localTable } = await import(`${GAME}/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/localStore.ts`);
const q = new URLSearchParams(location.search);
if (q.has("live")) document.body.classList.add("live");
const table = localTable({ freeChair: true }), store = table.view("me");
const scene = mountScene(document.getElementById("stage"), store);
window.__scene = scene; window.__store = store; window.__table = table;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
/** Сложить `n` карт в руку этого стула: сперва из колоды, потом из своей руки (бесхозный стул принимает от любого). */
function stackAt(chair, n) {
  for (let i = 0; i < n; i++) {
    const s = store.state, deck = s.piles[0].cards, mine = s.chairs.find((c) => c.owner === store.me.key).hand;
    const id = deck.length ? deck.at(-1).id : mine.at(-1).id, hand = s.chairs.find((c) => c.id === chair).hand.length;
    store.send({ t: "grab", id }); store.send({ t: "drop", id, to: { in: "hand", chair, i: hand } });
  }
}
window.__setup = async (spec) => {
  scene.setCamMode(spec.mode ?? "orbit");
  for (const [chair, n] of Object.entries(spec.stacks ?? {})) stackAt(chair, n);
  for (const [i, c] of (spec.felt ?? []).entries()) {
    const mine = store.state.chairs.find((x) => x.owner === store.me.key).hand;
    const id = mine[i].id;
    store.send({ t: "grab", id }); store.send({ t: "drop", id, to: { in: "felt", x: c.x, y: c.y, up: c.up, angle: c.angle ?? 0 } });
    if (store.state.felt.find((f) => f.id === id)?.up !== c.up) store.send({ t: "turn", id });
  }
  if (spec.all) {
    const alia = table.view("alia");
    for (const c of [...alia.state.chairs.find((x) => x.owner === alia.me.key).hand]) { alia.send({ t: "grab", id: c.id }); alia.send({ t: "drop", id: c.id, to: { in: "deck", pile: "deck" } }); }
    const ids = [];
    for (const p of store.state.piles) for (const c of p.cards) ids.push(c.id);
    for (const ch of store.state.chairs) for (const c of ch.hand) ids.push(c.id);
    store.send({ t: "gather", ids: ids.slice(0, spec.all.n), side: "down", to: { x: spec.all.x, y: spec.all.y, angle: 0 } });
  }
  if (spec.pile) {
    const ids = store.state.piles[0].cards.slice(-spec.pile.n).map((c) => c.id);
    store.send({ t: "gather", ids, side: "down", to: { x: spec.pile.x, y: spec.pile.y, angle: 0 } });
  }
  await wait(200);
  scene.setOrbitZoom(spec.zoom ?? 0.85);
  if (spec.look) { const ch = store.state.chairs.find((c) => c.id === spec.look); scene.turnBy(ch.angle + (spec.far ? 180 : 0) - scene.azimuth()); }
  if (spec.turn) scene.turnBy(spec.turn);
  if (spec.centre) {
    const idOf = () => store.state.chairs.find((c) => c.id === spec.centre).hand[0].id;
    await wait(900); const x0 = scene.test.screenOf(idOf()).x; scene.turnBy(5); await wait(700); const x1 = scene.test.screenOf(idOf()).x, k = (x1 - x0) / 5;
    scene.turnBy(k ? -(x1 - 195) / k : 0); await wait(900);
  }
  await wait(1200);
  return true;
};
window.__ready = true;
if (q.has("live")) {
  await window.__setup({ mode: "top", felt: [{ up: true, x: -1.9, y: 1.2, angle: -12 }, { up: false, x: 1.9, y: 1.2, angle: 10 }], all: { n: 34, x: 0, y: -0.5 } });
}
</script>
</body>
</html>
