<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>harness — настоящая сцена игры для снимков стенда</title>
<link href="/@fs/Users/giyers/Desktop/crossade-deck/design/zones/fonts/tiny5.css" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0a1511; }
  #stage { position: relative; width: 390px; height: 844px; overflow: hidden; }
  body.live { overflow: hidden; height: 100vh; }
  #zone { position: absolute; display: none; border-radius: 10px; pointer-events: none; z-index: 5; box-sizing: border-box; }
  #zone.hint { display: block; border: 2px dashed #7fd1b9; opacity: .85; }
  #zone.hot { display: block; border: 3px solid #7fd1b9; background: rgba(127,209,185,.28); }
  #zone.ask { display: block; border: 3px solid #f2c14e; background: rgba(242,193,78,.18); animation: pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  #bar { position: absolute; left: 8px; top: 8px; z-index: 9; display: flex; gap: 6px; font: 400 12px 'Tiny5', monospace; }
  #bar button, #ans button { font: 400 12px "Tiny5", monospace; padding: 4px 8px; border: 0; background: #3a2a1d; color: #f5ead0; box-shadow: 0 0 0 2px #0b0704; cursor: pointer; }
  #bar button.on { background: #f2c14e; color: #0b0704; }
  #say { position: absolute; z-index: 9; transform: translate(-50%, 0); font: 400 12px 'Tiny5', monospace; color: #f5ead0; background: #3a2a1d; padding: 3px 8px; box-shadow: 0 0 0 2px #0b0704; pointer-events: none; white-space: nowrap; display: none; }
  #ans { position: absolute; z-index: 9; transform: translate(-50%, 0); display: none; gap: 6px; }
  body.live #stage { position: absolute; width: 820px; height: 820px; left: 50%; top: 50%; margin: -410px 0 0 -410px; }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="zcv" style="position:absolute;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5"></canvas><div id="zone" style="display:none"></div><div id="say"></div><div id="bar"></div><div id="dbg" style="position:absolute;left:6px;right:6px;bottom:4px;z-index:9;font:10px/1.25 monospace;color:#f5ead0;background:rgba(0,0,0,.55);padding:2px 5px;pointer-events:none;white-space:pre-wrap"></div>
<script type="module">
// СЦЕНА ИГРЫ ДЛЯ СНИМКОВ. Здесь нет ничего нарисованного руками: подтягивается НАСТОЯЩИЙ `scene.ts` и локальный стол с dev-сервера игры (порт 9590, только читаем), стол приводится в нужное состояние теми же
// намерениями, что у игрока, и `shoot.mjs` снимает кадр. Страница стенда потом показывает эти снимки — один в один как в игре.
const GAME = location.port === "9590" ? location.origin : "http://localhost:9590", HOST = `http://${location.hostname}:2591`;
globalThis.__TABLE_HOST__ = HOST;
// По http (телефон ходит на стенд по адресу в сети) у браузера нет `crypto.randomUUID` — только в защищённом контексте.
if (!crypto.randomUUID) crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
await document.fonts.load("20px Tiny5");
const { mountScene } = await import(`${GAME}/src/scene.ts`);
const { localTable } = await import(`${GAME}/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/localStore.ts`);
const q = new URLSearchParams(location.search);
if (q.has("live")) document.body.classList.add("live");
const table = localTable({ freeChair: true }), store = table.view("me");
const scene = mountScene(document.getElementById("stage"), store);
window.__scene = scene; window.__store = store; window.__table = table;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
/** Сложить `n` карт в руку этого стула: сперва из колоды, потом из своей руки (бесхозный стул принимает от любого). */
function stackAt(chair, n) {
  for (let i = 0; i < n; i++) {
    const s = store.state, deck = s.piles[0].cards, mine = s.chairs.find((c) => c.owner === store.me.key).hand;
    const id = deck.length ? deck.at(-1).id : mine.at(-1).id, hand = s.chairs.find((c) => c.id === chair).hand.length;
    store.send({ t: "grab", id }); store.send({ t: "drop", id, to: { in: "hand", chair, i: hand } });
  }
}
window.__setup = async (spec) => {
  scene.setCamMode(spec.mode ?? "orbit");
  if (spec.noHands) for (const c of store.state.chairs) store.send({ t: "flag", chair: c.id, flag: "reject", on: true });
  for (const [chair, n] of Object.entries(spec.stacks ?? {})) stackAt(chair, n);
  for (const [i, c] of (spec.felt ?? []).entries()) {
    const mine = store.state.chairs.find((x) => x.owner === store.me.key).hand;
    const id = mine[i].id;
    store.send({ t: "grab", id }); store.send({ t: "drop", id, to: { in: "felt", x: c.x, y: c.y, up: c.up, angle: c.angle ?? 0 } });
    if (store.state.felt.find((f) => f.id === id)?.up !== c.up) store.send({ t: "turn", id });
  }
  if (spec.all) {
    const alia = table.view("alia");
    for (const c of [...alia.state.chairs.find((x) => x.owner === alia.me.key).hand]) { alia.send({ t: "grab", id: c.id }); alia.send({ t: "drop", id: c.id, to: { in: "deck", pile: "deck" } }); }
    const ids = [];
    for (const p of store.state.piles) for (const c of p.cards) ids.push(c.id);
    for (const ch of store.state.chairs) for (const c of ch.hand) ids.push(c.id);
    store.send({ t: "gather", ids: ids.slice(0, spec.all.n), side: "down", to: { x: spec.all.x, y: spec.all.y, angle: 0 } });
  }
  if (spec.pile) {
    const ids = store.state.piles[0].cards.slice(-spec.pile.n).map((c) => c.id);
    store.send({ t: "gather", ids, side: "down", to: { x: spec.pile.x, y: spec.pile.y, angle: 0 } });
  }
  await wait(200);
  scene.setOrbitZoom(spec.zoom ?? 0.85);
  if (spec.look) { const ch = store.state.chairs.find((c) => c.id === spec.look); scene.turnBy(ch.angle + (spec.far ? 180 : 0) - scene.azimuth()); }
  if (spec.turn) scene.turnBy(spec.turn);
  if (spec.centre) {
    const idOf = () => store.state.chairs.find((c) => c.id === spec.centre).hand[0].id;
    await wait(900); const x0 = scene.test.screenOf(idOf()).x; scene.turnBy(5); await wait(700); const x1 = scene.test.screenOf(idOf()).x, k = (x1 - x0) / 5;
    scene.turnBy(k ? -(x1 - 195) / k : 0); await wait(900);
  }
  await wait(1200);
  return true;
};
window.__ready = true;
if (q.has("live")) {
  window.__live = true;
  await window.__setup({ mode: "top", noHands: true, felt: [{ up: true, x: -1.9, y: 1.9, angle: -12 }, { up: false, x: 1.9, y: 1.9, angle: 10 }], all: { n: 34, x: 0, y: 0.8 } });
  // Без стула у меня нет «своей руки»: ниже её границы игра кладёт карту в руку, а стенду нужен только стол.
  store.send({ t: "stand" }); scene.test.setPileSnap(false); await wait(500);
}

if (q.has("live")) {
  // ПРИЁМКА СТОПКИ — предложение для стенда: игра сама карту в стопку кладёт всегда, поэтому здесь поверх настоящей игры подсветка и «апрув» ведутся этой страницей.
  const stage = document.getElementById("stage"), zone = document.getElementById("zone"), say = document.getElementById("say"), bar = document.getElementById("bar");
  const waiting = [];
  let restRect = null, policy = "accept", finger = null, pid = 1, frozen = false, inside = false, note = "", noteAt = 0;
  for (const [k, t] of [["accept", "принимает"], ["refuse", "не принимает"], ["ask", "нужен апрув"]]) {
    const b = document.createElement("button"); b.textContent = t; b.dataset.p = k; if (k === policy) b.className = "on";
    b.onclick = () => { policy = k; for (const x of bar.children) x.className = x.dataset.p === k ? "on" : ""; };
    bar.append(b);
  }
  const pileRect = () => {
    const p = store.state.piles.find((x) => x.id !== "deck"); if (!p) return null;
    // Место стопки берётся с нижней карты и запоминается, пока ничего не несут: верхнюю потянули — подсветка за ней не бежит.
    if (!scene.test.draggingId() || !restRect || restRect.id !== p.id) { const at = scene.test.screenOf(p.cards[0].id); restRect = { id: p.id, x: at.x, y: at.y, w: 76, h: 104 }; }
    return restRect;
  };
  // Над стопкой — и над её ждущими картами: они веером шире самой стопки, и бросить назад на любую из них значит бросить на стопку.
  // «Над стопкой» — ровно по решению игры (`aim`): иначе у игры зона шире моей рамки, и бросок рядом со стопкой клал карту в неё мимо апрува.
  const hit = (r) => { if (!finger) return false; const a = scene.aim(finger.x, finger.y); return (a.in === "deck" && a.pile === restRect?.id) || waiting.some((id) => { const c = scene.test.screenOf(id); return c && Math.abs(finger.x - c.x) < 38 && Math.abs(finger.y - c.y) < 52; }); };
  addEventListener("pointermove", (e) => { pid = e.pointerId; if (e.isTrusted) finger = { x: e.clientX, y: e.clientY }; }, true);
  const fire = (type, x, y) => dispatchEvent(new PointerEvent(type, { pointerId: pid, clientX: x, clientY: y, bubbles: true, isPrimary: true, pointerType: "mouse", buttons: type === "pointerup" ? 0 : 1 }));
  /** Карты, что ждут ответа: висят над стопкой, покачиваются, каждая в своей позе; реально лежат на сукне сбоку. */
  // Ждущие карты — в ряд, слева направо; последняя справа и выше всех (по Z к камере). Шаг по высоте больше размаха покачивания, чтобы они не менялись местами.
  const settle = () => waiting.forEach((id, i) => scene.test.floatCard(id, restRect.id, (i - (waiting.length - 1) / 2) * 1.05, -1.4, 0.12 + 0.22 * i, [-3, 2, -2, 3][i % 4], store.state.felt.find((c) => c.id === id)?.up ?? true));
  addEventListener("pointerup", (e) => {
    const id = scene.test.draggingId();
    if (!e.isTrusted || !id) return;
    const r = pileRect(); if (!r || !hit(r) || store.state.piles.some((p) => p.id === restRect?.id && p.cards.some((c) => c.id === id))) return;
    if (policy === "refuse") { e.stopImmediatePropagation(); fire("pointermove", r.x, r.y + r.h); fire("pointerup", r.x, r.y + r.h); }
    if (policy === "ask") {
      e.stopImmediatePropagation();
      const px = r.x + 100 < innerWidth - 40 ? r.x + 100 : r.x - 100, py = r.y + 75;
      fire("pointermove", px, py); fire("pointerup", px, py);
      waiting.splice(waiting.filter((w) => scene.test.screenOf(w).x < finger.x).length, 0, id); settle();
    }
  }, true);

  // ЗАПИСЬ СЕССИИ: всё, что видит игра при нажатии, отпускании и изменении стопки, уходит пачками на приёмник (`rec.py`, порт 9589) — по ней разбираются баги, которых не видно глазами.
  const sid = Date.now().toString(36), buf = [];
  const rec = (k, d) => buf.push(JSON.stringify({ t: Math.round(performance.now()), k, ...d }));
  const flush = () => { if (!buf.length) return; const body = buf.splice(0).join("\n"); fetch(`http://${location.hostname}:9589/log?sid=${sid}`, { method: "POST", body, keepalive: true }).catch(() => {}); };
  setInterval(flush, 700); addEventListener("pagehide", () => { if (buf.length) navigator.sendBeacon(`http://${location.hostname}:9589/log?sid=${sid}`, new Blob([buf.splice(0).join("\n")], { type: "text/plain" })); });
  rec("start", { ua: navigator.userAgent, w: innerWidth, h: innerHeight });
  const snap = () => { const t = scene.test, s = store.state, pl = s.piles.find((x) => x.id === restRect?.id); return { n: pl?.cards.length, top: pl?.cards.at(-1)?.id, locks: s.locks, drag: t.draggingId(), wait: waiting.length, policy, felt: s.felt.length }; };
  for (const ty of ["pointerdown", "pointerup", "pointercancel"]) addEventListener(ty, (e) => {
    const t = scene.test, id = t.cardAt(e.clientX, e.clientY), s = store.state;
    rec(ty, { x: Math.round(e.clientX), y: Math.round(e.clientY), trusted: e.isTrusted, ptr: e.pointerType, hit: id, picks: id ? !!s.picks[id] : null, ...snap() });
    if (ty === "pointerdown") setTimeout(() => rec("after-down-250ms", snap()), 250);
    if (ty === "pointerup") for (const ms of [100, 400, 1200]) setTimeout(() => rec(`after-up-${ms}ms`, snap()), ms);
  }, true);
  // Кадры во время жеста: где палец и где несомая карта на экране (и сколько мс между кадрами) — видно, откуда карта прилетает и не залипает ли страница.
  addEventListener("error", (e) => rec("error", { msg: String(e.message).slice(0, 200) }));
  addEventListener("unhandledrejection", (e) => rec("rejection", { msg: String(e.reason).slice(0, 200) }));
  { let last = performance.now(), n = 0, down = null; addEventListener("pointerdown", (e) => { if (e.isTrusted) down = scene.test.cardAt(e.clientX, e.clientY); }, true); addEventListener("pointerup", () => { setTimeout(() => { down = null; }, 600); }, true);
    const frame = () => { const now = performance.now(), id = scene.test.draggingId() ?? down; if (id) { const a = scene.test.screenOf(id), tg = scene.test.cardTarget(id); if (n++ % 2 === 0) rec("frame", { dt: Math.round(now - last), card: a ? [Math.round(a.x), Math.round(a.y)] : null, tgt: tg ? tg.map((v) => Math.round(v * 100) / 100) : null, drag: !!scene.test.draggingId(), finger: finger ? [Math.round(finger.x), Math.round(finger.y)] : null, id }); } else n = 0; last = now; requestAnimationFrame(frame); }; requestAnimationFrame(frame); }
  { const send = store.send.bind(store); store.send = (m) => { rec("send", { m: JSON.parse(JSON.stringify(m)) }); return send(m); }; }
  // ОТЛАДКА ВЗЯТИЯ: что видит игра в момент нажатия — по этой строке видно, почему карту не берёт.
  addEventListener("pointerdown", (e) => {
    if (!e.isTrusted) return;
    const t = scene.test, id = t.cardAt(e.clientX, e.clientY), s = store.state, pl = s.piles.find((x) => x.id === restRect?.id);
    const line = `down hit=${id ?? "—"} ${id && pl ? (pl.cards.at(-1)?.id === id ? "TOP" : pl.cards.some((c) => c.id === id) ? "под верхней" : "не в стопке") : ""} lock=${id ? (s.locks[id] ?? "нет") : "-"} pick=${id ? !!s.picks[id] : "-"} n=${pl?.cards.length}`;
    const el = document.getElementById("dbg"); el.textContent = line;
    setTimeout(() => { el.textContent = line + ` → drag=${t.draggingId() ?? "нет"}`; }, 250);
  }, true);
  window.__dbg = () => ({ finger, waiting: [...waiting], drag: scene.test.draggingId(), r: pileRect() });
  const tick = () => {
    const r = pileRect(), did0 = scene.test.draggingId(), own = !!did0 && store.state.piles.some((p) => p.id === restRect?.id && p.cards.some((c) => c.id === did0)), drag = did0 && !own, frozen = waiting.length > 0;
    // Карту забрали пальцем — запрос отозван: она больше не висит, остальные перестраиваются.
    const back = waiting.indexOf(did0);
    if (back >= 0) { waiting.splice(back, 1); scene.test.floatCard(did0, null); settle(); note = "запрос отозван"; noteAt = performance.now(); }
    let deny = false, pend = false, st = "", msg = note && performance.now() - noteAt < 1200 ? note : "";
    if (r && drag && policy !== "refuse") {
      const over = hit(r);
      if (policy === "ask") { st = "hint"; if (over) msg = "нужен апрув"; if (!over && inside) { msg = "запрос отозван"; note = msg; noteAt = performance.now(); } inside = over; }
      else st = over ? "hot" : "hint";
    } else inside = false;
    if (r && drag && policy === "refuse" && hit(r)) { deny = true; msg = "сюда нельзя"; }
    if (frozen) { st = ""; pend = true; msg = ""; }
    zone.className = st;
    // Подсветка — на сукне ПОД колодой, как в Tabletop Simulator: рисуется отдельным слоем, из него вырезаны сама колода и несомая карта.
    const PW = 64, PH = 90, cv = document.getElementById("zcv"), dpr = devicePixelRatio || 1;
    if (cv.width !== Math.round(innerWidth * dpr) || cv.height !== Math.round(innerHeight * dpr)) { cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); }
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
    if (r && st) {
      const rr = (x, y, w, h, k) => { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, k); };
      // Апрув от обычной приёмки цветом и миганием не отличается: свечение одно (мятное, ровное), разница — в поведении карты.
      const pulse = 1, col = "127,209,185";
      // Свечение по периметру колоды: сама форма колоды светится наружу (тень), потом её тело вырезается — остаётся только ореол.
      const blur = st === "hint" ? 12 : 20, passes = st === "hint" ? 2 : 3;
      g.globalAlpha = (st === "hint" ? 0.7 : 1) * pulse; g.shadowColor = `rgb(${col})`; g.shadowBlur = blur; g.fillStyle = `rgb(${col})`;
      for (let i = 0; i < passes; i++) { rr(r.x, r.y, PW, PH, 6); g.fill(); }
      g.shadowBlur = 0; g.globalAlpha = 1;
      g.globalCompositeOperation = "destination-out"; g.fillStyle = "#000";
      rr(r.x, r.y, PW, PH, 6); g.fill();
      const held = scene.test.draggingId();
      for (const did of [...waiting, ...(held ? [held] : [])]) {
        const at = scene.test.screenOf(did), cw = scene.test.cardWidth(did), dz = scene.test.depthOf(did);
        const k = (stage.clientHeight / 2 / Math.tan(25 * Math.PI / 180)) / dz, w = cw * k + 2, h = cw * 1.4 * k + 2, an = did === held ? (scene.test.heldAngle() ?? 0) * Math.PI / 180 : 0;
        g.save(); g.translate(at.x, at.y); g.rotate(an); g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 8); g.fill(); g.restore();
      }
      g.globalCompositeOperation = "source-over";
    }
    // «Ждёт апрува» — не свечение (оно у приёмки): от каждой висящей карты к стопке тянется пунктирная нить, а над картами — табличка с бегущими точками, как в нашем HUD.
    if (r && pend) {
      g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
      const marks = waiting.map((id) => { const a = scene.test.screenOf(id); return a ? { x: a.x, y: a.y } : null; }).filter(Boolean);
      g.strokeStyle = "rgba(245,234,208,.75)"; g.lineWidth = 2; g.setLineDash([3, 4]);
      for (const m of marks) { g.beginPath(); g.moveTo(m.x, m.y + 44); g.lineTo(r.x + (m.x - r.x) * 0.3, r.y - r.h / 2 + 4); g.stroke(); }
      g.setLineDash([]);
      const cx = marks.length ? marks.reduce((q, m) => q + m.x, 0) / marks.length : r.x, top = marks.length ? Math.min(...marks.map((m) => m.y)) - 62 : r.y - r.h / 2 - 22;
      const W = 46, H = 18, bx = cx - W / 2, by = top - H / 2;
      g.fillStyle = "#0b0704"; g.fillRect(bx - 3, by - 3, W + 6, H + 6); g.fillStyle = "#3a2a1d"; g.fillRect(bx, by, W, H);
      const ph = Math.floor(performance.now() / 280) % 3;
      for (let i = 0; i < 3; i++) { g.fillStyle = i === ph ? "#f5ead0" : "rgba(245,234,208,.3)"; g.fillRect(bx + 9 + i * 12, by + 6, 6, 6); }
    }
    // Запретная стопка: знак «нельзя» (круг с чертой) над колодой, цвета бумаги — не свечение и не красный (красный — цвет игрока). Лежит под несомой картой, как и вся подсветка.
    if (r && deny) {
      g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; g.lineCap = "round";
      const ix = r.x, iy = r.y - r.h / 2 - 16, ir = 13, d = 9;
      g.strokeStyle = "#0b0704"; g.lineWidth = 8; g.beginPath(); g.arc(ix, iy, ir, 0, Math.PI * 2); g.moveTo(ix - d, iy - d); g.lineTo(ix + d, iy + d); g.stroke();
      g.strokeStyle = "#f5ead0"; g.lineWidth = 4; g.beginPath(); g.arc(ix, iy, ir, 0, Math.PI * 2); g.moveTo(ix - d, iy - d); g.lineTo(ix + d, iy + d); g.stroke();
      const held = scene.test.draggingId();
      if (held) {
        const at = scene.test.screenOf(held), cw = scene.test.cardWidth(held), dz = scene.test.depthOf(held), k = (stage.clientHeight / 2 / Math.tan(25 * Math.PI / 180)) / dz, w = cw * k + 2, h = cw * 1.4 * k + 2;
        g.globalCompositeOperation = "destination-out"; g.fillStyle = "#000"; g.save(); g.translate(at.x, at.y); g.rotate((scene.test.heldAngle() ?? 0) * Math.PI / 180); g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 8); g.fill(); g.restore(); g.globalCompositeOperation = "source-over";
      }
    }
    zone.style.clipPath = "none";
    if (r) { Object.assign(zone.style, { left: r.x - r.w / 2 + "px", top: r.y - r.h / 2 + "px", width: r.w + "px", height: r.h + "px" }); Object.assign(say.style, { left: r.x + "px", top: r.y - r.h / 2 - 24 - (frozen ? 80 : 0) - (deny ? 32 : 0) + "px", display: msg ? "block" : "none" }); say.textContent = msg; }
    requestAnimationFrame(tick);
  };
  tick();
}
</script>
</body>
</html>
