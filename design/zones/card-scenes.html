<style>
  :root { --panel: #3a2a1d; --well: #1c120b; --ink: #f5ead0; --wood: #6b4d2c; --black: #0b0704; --gold: #f2c14e; --goldLight: #f8d885; --goldDark: #b08a26; }

<body>
<div class="page">

    <div class="plate"><div class="head"><div class="n">1</div><div class="t">ВИД СВЕРХУ</div><div class="who" id="who-top"></div></div><div class="lag"><span>пинг</span><input type="range" id="lag-top" min="0" max="1000" step="50" value="0"><b id="lagv-top">0 мс</b></div><div class="lag"><span>дрожание</span><input type="range" id="jit-top" min="0" max="500" step="25" value="0"><b id="jitv-top">0 мс</b></div><div class="frame" id="f-top"><div class="stage" id="s-top"></div></div></div>

  <div class="plate" id="feel"><div class="head"><div class="n">4</div><div class="t">ЗВУК И ВИБРАЦИЯ</div></div><div id="feel-body"></div></div>
  <div class="plate" id="rules"><div class="head"><div class="n">3</div><div class="t">ПРАВИЛА КАРТЫ</div></div><div id="rules-body"></div></div>
</div>
<script type="module">
// ЭТА ЖЕ СЦЕНА СТЕНДА (`harness.html`), ДВАЖДЫ. Настоящий `scene.ts` и один локальный стол с dev-сервера игры (порт 9590): я смотрю сверху, Алия — от первого лица, поэтому всё, что делают в одной сцене (взяли карту, бросили, карты ждут апрува), сразу видно в другой. Приёмка стопки (принимает / не принимает / нужен апрув) — та же, что на стенде, общая для обеих.
globalThis.__TABLE_HOST__ = `http://${location.hostname}:2591`;
if (!crypto.randomUUID) crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
await document.fonts.load("20px Tiny5");
const { mountScene } = await import("/src/scene.ts");
const { localTable } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/localStore.ts");
// ИГРОКИ — только управление и доступы: ни места, ни тела на сцене. Сцена смотрит из места «своего» наблюдателя (камера стоит), а двигает карты тот игрок, кого выбрали у сцены.
const PLAYERS = [
  { key: "blue", name: "Синий", ink: "#4a8fe0" },
  { key: "red", name: "Красный", ink: "#e0483f" },
  { key: "green", name: "Зелёный", ink: "#59b36a" },
  { key: "yellow", name: "Жёлтый", ink: "#f2c14e" },
];
const table = localTable({ players: PLAYERS, cards: 1 });
const views = Object.fromEntries(PLAYERS.map((p) => [p.key, table.view(p.key)]));
const me = views.blue, alia = views.red;
const viewpointOf = { top: "blue", first: "red" };
const controller = { top: "blue", first: "blue" };
const CTL_KEYS = new Set(["body", "say", "shoot", "mic", "log", "rtc", "askStickers", "watch"]);
const { carryOf } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/tape.ts");
const lat = { top: 0, first: 0 }, jit = { top: 0, first: 0 };
// ЖИВОЙ НОСИТЕЛЬ КАРТ: что несёт палец в одной сцене, доходит до другой пакетами, как через сервер: каждое слово едет `пинг отправителя + пинг получателя` и ещё случайное «дрожание»;
// слова доходят по порядку (как по сокету), поэтому задержавшиеся слова приходят пачкой, а между ними пауза — карта у соседа стоит, потом прыгает.
const sendAt = { top: 0, first: 0 };
const inbox = { top: null, first: null }, lastAt = { top: 0, first: 0 }, hear = { top: [], first: [] };
const note = (who, out) => {
  const other = who === "top" ? "first" : "top";
  const at = Math.max(lastAt[other] + 1, performance.now() + lat[who] + lat[other] + Math.random() * (jit[who] + jit[other]));
  lastAt[other] = at;
  setTimeout(() => { inbox[other] = { out, at: performance.now() }; for (const l of hear[other]) l(); }, at - performance.now());
};
/** Что сцена `who` знает о соседе: последнее дошедшее до неё слово; замолчал дольше 400 мс — считается, что карту отпустили. */
const heard = (who) => { const e = inbox[who]; return e && e.out && performance.now() - e.at < 400 ? e.out : null; };
/** Хранилище сцены: читает стол из места наблюдателя, а намерения шлёт от имени выбранного игрока, через пинг сцены. */
const OUT = new Set(["send", "command"]);
const asPlayer = (viewpoint, which) => { const other = which === "top" ? "first" : "top"; return new Proxy(viewpoint, { get: (t, k) => {
  if (k === "send") return (intent) => { if (intent.t === "drop" || intent.t === "unpick") note(which, null); const at = Math.max(sendAt[which] + 1, performance.now() + lat[which] + Math.random() * jit[which]); sendAt[which] = at; setTimeout(() => views[controller[which]].send(intent), at - performance.now()); };
  if (k === "actor") return views[controller[which]].me;
  if (k === "command") return (c) => setTimeout(() => views[controller[which]].command(c), lat[which] + Math.random() * jit[which]);
  if (k === "carry") return (out) => note(which, out);
  if (k === "onChange") return (l) => { hear[which].push(l); viewpoint.onChange(l); };
  if (k === "carries") { const out = heard(which); const c = out ? carryOf(viewpoint.state, out.id, controller[other] !== viewpoint.me.key ? controller[other] : views[viewpointOf[other]].me.key, out.over) : null; return c ? [{ ...c, ...(out.flip ? { flip: out.flip } : {}), ...(out.tilt ? { tilt: out.tilt } : {}) }] : []; }
  if (CTL_KEYS.has(k)) return (...a) => views[controller[which]][k](...a);
  return Reflect.get(t, k, t);
} }); };const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);

// СТЕНД: у кадра свой размер сцены (`SW`×`SH`), в кадре видна только середина — стола с кромкой и стульев не видно.
const sizeStage = (s, w, h, fw, fh) => Object.assign(s.style, { width: w + "px", height: h + "px", left: (fw - w) / 2 + "px", top: (fh - h) / 2 + "px" });
const FW = $("f-top").clientWidth, FH = 300;
sizeStage($("s-top"), 820, 820, FW, FH);
sizeStage($("s-first"), 1000, 1000, FW, FH);
await wait(200);
const top = mountScene($("s-top"), asPlayer(me, "top")), first = mountScene($("s-first"), asPlayer(alia, "first"));
top.setCamMode("top"); first.setCamMode("head");
top.setFigures(false); first.setFigures(false);
top.test.setPileSnap(false); first.test.setPileSnap(false);
top.test.setBareTable(true); first.test.setBareTable(true);
top.test.setNeckFree(true); first.test.setNeckFree(true);
await wait(800);

// СТОЛ: одна карта на сукне, больше ничего. Опустевшая колода убирается со стола совсем: ни зоны приёмки, ни язычка.
{
  const pile = me.state.piles[0], id = pile.cards.at(-1).id;
  me.send({ t: "grab", id }); me.send({ t: "drop", id, to: { in: "felt", x: 0, y: 0.8, up: true, angle: -8 } });
  if (me.state.felt.find((f) => f.id === id)?.up !== true) me.send({ t: "turn", id });
  me.send({ t: "deckForever", pile: pile.id, on: false });
}
await wait(600);
// Рука наблюдателей не принимает карты: карта над её зоной остаётся на столе.
for (const key of ["blue", "red"]) views[key].send({ t: "flag", chair: views[key].state.chairs.find((c) => c.owner === key).id, flag: "reject", on: true });
await wait(900);
// Сдвиг кадра первого лица: центр сцены (карта или колода) — в кадр. Считаем, когда камера встала: на медленном телефоне она ещё едет, и сдвиг по первому замеру выходил неверным.
{
  const id = me.state.felt[0].id;
  let prev = null, still = 0;
  for (let i = 0; i < 80 && still < 6; i++) { const a = first.test.screenOf(id); still = prev && Math.hypot(a.x - prev.x, a.y - prev.y) < 0.4 ? still + 1 : 0; prev = a; await wait(100); }
  const at = first.test.screenOf(id), st = $("s-first").getBoundingClientRect();
  $("s-first").style.left = (FW / 2 - (at.x - st.left)) + "px"; $("s-first").style.top = (FH * 0.42 - (at.y - st.top)) + "px";
}
await wait(300);

for (const f of document.querySelectorAll(".frame")) f.classList.add("ready");
{ const { addFullscreen } = await import("./frameFull.js"); window.__full = { top: addFullscreen($("f-top"), $("s-top")), first: addFullscreen($("f-first"), $("s-first")) }; }

// ЗВУК И ВИБРАЦИЯ СЦЕН: те же файлы звуков, что у стола в игре, плюс синтез; каждое движение карты озвучено и вибрирует (`feel.ts`). Ручки подбирают звук на слух;
// переключатель 🔊 у каждой сцены глушит звук и вибрацию этой сцены.
{
  const { tableSound } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/sound.ts");
  const { tableHaptic } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/haptic.ts");
  const { tableFeel, FEEL_KINDS, FEEL_NAMES } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/feel.ts");
  const sound = tableSound(), haptic = tableHaptic(), feel = tableFeel(sound, haptic);
  window.__feel = feel; window.__sound = sound;
  const live = { top: true, first: true };
  top.onFeel((e) => { if (live.top) feel.play(e); });
  first.onFeel((e) => { if (live.first) feel.play(e); });
  for (const which of ["top", "first"]) {
    const b = document.createElement("button"); b.className = "mute"; b.textContent = "🔊"; b.title = "звук и вибрация этой сцены";
    b.style.cssText = "width:22px;height:22px;border:0;padding:0;background:#3a2a1d;color:#f5ead0;box-shadow:0 0 0 2px #0b0704;cursor:pointer;font-size:12px";
    b.onclick = () => { live[which] = !live[which]; b.textContent = live[which] ? "🔊" : "🔇"; };
    $("who-" + which).append(b);
  }
  const body = $("feel-body");
  const head = document.createElement("div"); head.className = "fhead";
  const mk = (label, get, set) => { const b = document.createElement("button"); const paint = () => { b.classList.toggle("on", get()); b.textContent = label + ": " + (get() ? "ДА" : "НЕТ"); }; b.onclick = () => { set(!get()); feel.save(); paint(); }; paint(); head.append(b); };
  mk("Звук", () => feel.prefs.sound, (v) => { feel.prefs.sound = v; });
  mk("Вибрация", () => feel.prefs.vibe, (v) => { feel.prefs.vibe = v; });
  const vol = document.createElement("label"); vol.style.cssText = "display:flex;align-items:center;gap:8px;flex:1 1 100%;order:3";
  vol.innerHTML = '<span style="width:74px;flex:none;color:#cdbf9d">громкость</span><input type="range" min="0" max="100" step="10" style="flex:1;min-width:0;accent-color:#f2c14e;height:28px"><b style="font-weight:400;width:48px;text-align:right;flex:none"></b>';
  const vr = vol.querySelector("input"), vb = vol.querySelector("b");
  vr.value = sound.prefs.volume; vb.textContent = sound.prefs.volume;
  vr.oninput = () => { sound.prefs.volume = +vr.value; vb.textContent = vr.value; sound.save(); };
  head.append(vol);
  const copy = document.createElement("button"); copy.textContent = "Копировать пресет"; copy.onclick = () => { navigator.clipboard?.writeText(feel.exportPreset()); copy.textContent = "Скопировано"; setTimeout(() => (copy.textContent = "Копировать пресет"), 1200); };
  const rst = document.createElement("button"); rst.textContent = "Сбросить всё"; rst.onclick = () => { feel.reset(); feel.save(); render(); };
  head.append(copy, rst);
  body.append(head);
  const list = document.createElement("div"); body.append(list);
  const slider = (label, min, max, step, get, set, fmt) => {
    const l = document.createElement("div"); l.className = "fs"; l.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><b></b>`;
    const r = l.querySelector("input"), v = l.querySelector("b");
    r.value = get(); v.textContent = fmt(get());
    r.oninput = () => { set(+r.value); v.textContent = fmt(+r.value); feel.save(); };
    return l;
  };
  function render() {
    list.replaceChildren();
    for (const kind of FEEL_KINDS) {
      const spec = feel.preset[kind], ev = document.createElement("div"); ev.className = "fev"; ev.dataset.kind = kind;
      const top = document.createElement("div"); top.className = "ft";
      const name = document.createElement("div"); name.className = "fl"; name.textContent = FEEL_NAMES[kind];
      const play = document.createElement("button"); play.textContent = "▶ сильно"; play.title = "послушать при полной силе"; play.onclick = () => feel.play({ kind, energy: 1 });
      const weak = document.createElement("button"); weak.textContent = "▷ слабо"; weak.title = "послушать при малой силе"; weak.onclick = () => feel.play({ kind, energy: 0.2 });
      top.append(name, play, weak);
      ev.append(top,
        slider("громкость", 0, 2, 0.05, () => spec.gain, (v) => { spec.gain = v; }, (v) => v.toFixed(2)),
        slider("тон", 0.4, 2, 0.02, () => spec.rate, (v) => { spec.rate = v; }, (v) => v.toFixed(2)),
        slider("вибрация", 0, 120, 2, () => spec.vibe[0] ?? 0, (v) => { spec.vibe = v ? [v, ...spec.vibe.slice(1)] : []; }, (v) => v + " мс"));
      list.append(ev);
    }
  }
  render();
}
// ПРАВИЛА КАРТЫ: для каждого запрета — «все» и цветные флажки игроков (отмечены — им нельзя); внизу — показывать ли отказ. Ставит админ (синий).
{
  const id = me.state.felt[0].id;
  const rules = () => me.state.cardRules?.[id] ?? { lift: [], move: [], turn: [], rotate: [], notice: { lift: false, move: false, turn: false, rotate: false } };
  const send = (intent) => views.blue.send({ t: "cardRule", id, ...intent });
  const body = $("rules-body"), paints = [];
  for (const [rule, label] of [["lift", "Нельзя поднять"], ["move", "Нельзя перемещать по столу (поднять и перевернуть можно, вернётся на место)"], ["turn", "Нельзя перевернуть"], ["rotate", "Нельзя вращать (угол остаётся прежним; поднять и переместить не мешает)"]]) {
    const row = document.createElement("div"); row.className = "rrow"; row.dataset.rule = rule;
    const lab = document.createElement("div"); lab.className = "rl"; lab.textContent = label;
    const chips = document.createElement("div"); chips.className = "rc";
    const all = document.createElement("button"); all.className = "all"; all.textContent = "все"; all.title = "всем игрокам";
    all.onclick = () => { const full = PLAYERS.every((pl) => rules()[rule].includes(pl.key)); for (const pl of PLAYERS) if (rules()[rule].includes(pl.key) === full) send({ rule, who: pl.key, on: !full }); };
    chips.append(all);
    const show = document.createElement("button"); show.className = "tg"; show.dataset.show = rule; show.title = "показывать «нельзя» при отказе (тряска, контур возврата)";
    show.onclick = () => send({ rule: "notice", who: rule, on: !rules().notice[rule] });
    const mine = {};
    for (const pl of PLAYERS) {
      const b = document.createElement("button"); b.style.setProperty("--c", pl.ink); b.title = pl.name; b.dataset.k = pl.key;
      b.onclick = () => send({ rule, who: pl.key, on: !rules()[rule].includes(pl.key) });
      chips.append(b); mine[pl.key] = b;
    }
    chips.append(show);
    row.append(lab, chips); body.append(row);
    paints.push(() => { const r = rules()[rule]; show.classList.toggle("on", rules().notice[rule]); show.textContent = rules().notice[rule] ? "показ: ДА" : "показ: НЕТ"; for (const pl of PLAYERS) mine[pl.key].classList.toggle("on", r.includes(pl.key)); all.classList.toggle("on", PLAYERS.every((pl) => r.includes(pl.key))); });
  }
  const paint = () => paints.forEach((f) => f());
  me.onChange(paint); paint();
}
// Камера включена всегда: ничего не блокируется.
// ВЫБОР ИГРОКА У КАЖДОЙ СЦЕНЫ: по умолчанию синий; смена не трогает камеру.
for (const which of ["top", "first"]) {
  const box = $("who-" + which);
  for (const pl of PLAYERS) {
    const b = document.createElement("button"); b.title = pl.name; b.style.setProperty("--c", pl.ink); b.style.setProperty("--ink", "#f5ead0"); b.dataset.k = pl.key;
    if (pl.key === controller[which]) b.className = "on";
    b.onclick = () => { controller[which] = pl.key; for (const x of box.children) x.className = x.dataset.k === pl.key ? "on" : ""; };
    box.append(b);
  }
  // Сброс камеры этой сцены: вернуть, как при загрузке (камеру можно утащить случайным свайпом).
  const r = document.createElement("button"); r.textContent = "↺"; r.title = "камера в исходное"; r.style.cssText = "width:22px;height:22px;border:0;padding:0;background:#3a2a1d;color:#f5ead0;box-shadow:0 0 0 2px #0b0704;font:inherit;cursor:pointer";
  r.onclick = () => { (which === "top" ? top : first).home(); };
  box.append(r);
}
window.__top = top; window.__first = first; window.__me = me; window.__alia = alia; window.__ready = true;
</script>
