<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Стопки — приёмка (сцены)</title>
<link href="/@fs/Users/giyers/Desktop/crossade-deck/design/zones/fonts/tiny5.css" rel="stylesheet">
<style>
  :root { --panel: #3a2a1d; --well: #1c120b; --ink: #f5ead0; --wood: #6b4d2c; --black: #0b0704; --gold: #f2c14e; --goldLight: #f8d885; --goldDark: #b08a26; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0d2118; color: var(--ink); font: 400 13px/1.3 'Tiny5', monospace; }
  .page { width: min(100vw, 480px); margin: 0 auto; padding: 14px 12px 40px; }
  h1 { margin: 4px 2px 12px; font-weight: 400; font-size: 18px; }
  .plate { background: linear-gradient(var(--panel), var(--well)); margin: 0 0 22px; padding: 12px 10px 10px;
    box-shadow: 0 -2px 0 0 var(--black), 0 2px 0 0 var(--black), -2px 0 0 0 var(--black), 2px 0 0 0 var(--black), inset 0 0 0 2px var(--wood), 0 6px 0 0 rgba(11,7,4,.6); }
  .head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .head .n { width: 22px; height: 22px; background: linear-gradient(var(--goldLight), var(--goldDark)); color: var(--black); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--black); }
  .head .t { font-size: 15px; letter-spacing: .3px; }
  .frame { position: relative; width: 100%; height: 300px; overflow: hidden; border-radius: 10px; background: #0a1511; box-shadow: 0 0 0 3px var(--wood), 0 0 0 5px var(--black); touch-action: none; }
  .stage { position: absolute; }
  .zcv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .say { position: absolute; z-index: 9; transform: translate(-50%, 0); font: 400 12px 'Tiny5', monospace; color: var(--ink); background: var(--panel); padding: 3px 8px; box-shadow: 0 0 0 2px var(--black); pointer-events: none; white-space: nowrap; display: none; }
  #bar { display: flex; gap: 6px; margin: 0 0 12px; font: 400 12px 'Tiny5', monospace; }
  #bar button { font: inherit; padding: 5px 9px; border: 0; background: var(--panel); color: var(--ink); box-shadow: 0 0 0 2px var(--black); cursor: pointer; }
  #bar button.on { background: var(--gold); color: var(--black); }
</style>
</head>
<body>
<div class="page">
  <h1>СТОПКИ — ПРИЁМКА</h1>
  <div id="bar"></div>
  <div class="plate"><div class="head"><div class="n">1</div><div class="t">ВИД СВЕРХУ</div></div><div class="frame" id="f-top"><div class="stage" id="s-top"></div></div></div>
  <div class="plate"><div class="head"><div class="n">2</div><div class="t">ВИД ОТ ПЕРВОГО ЛИЦА</div></div><div class="frame" id="f-first"><div class="stage" id="s-first"></div></div></div>
</div>
<script type="module">
// ЭТА ЖЕ СЦЕНА СТЕНДА (`harness.html`), ДВАЖДЫ. Настоящий `scene.ts` и один локальный стол с dev-сервера игры (порт 9590): я смотрю сверху, Алия — от первого лица, поэтому всё, что делают в одной сцене (взяли карту, бросили, карты ждут апрува), сразу видно в другой. Приёмка стопки (принимает / не принимает / нужен апрув) — та же, что на стенде, общая для обеих.
globalThis.__TABLE_HOST__ = `http://${location.hostname}:2591`;
if (!crypto.randomUUID) crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
await document.fonts.load("20px Tiny5");
const { mountScene } = await import("/src/scene.ts");
const { localTable } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/localStore.ts");
const table = localTable({ freeChair: true }), me = table.view("me"), alia = table.view("alia");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);

// СТЕНД: у кадра свой размер сцены (`SW`×`SH`), в кадре видна только середина — стола с кромкой и стульев не видно.
const sizeStage = (s, w, h, fw, fh) => Object.assign(s.style, { width: w + "px", height: h + "px", left: (fw - w) / 2 + "px", top: (fh - h) / 2 + "px" });
const FW = $("f-top").clientWidth, FH = 300;
sizeStage($("s-top"), 820, 820, FW, FH);
sizeStage($("s-first"), 760, 760, FW, FH);
await wait(200);
const top = mountScene($("s-top"), me), first = mountScene($("s-first"), alia);
top.setCamMode("top"); first.setCamMode("head");
top.setFigures(false); first.setFigures(false);
top.test.setPileSnap(false); first.test.setPileSnap(false);
top.test.setBareTable(true); first.test.setBareTable(true);
await wait(800);

// СТОЛ: колода 34 и две карты (лицом и рубашкой) на сукне.
const mine = me.state.chairs.find((c) => c.owner === me.me.key).hand;
[{ up: true, x: -1.9, y: 1.7, angle: -12 }, { up: false, x: 1.9, y: 1.7, angle: 10 }].forEach((c, i) => {
  const id = mine[i].id;
  me.send({ t: "grab", id }); me.send({ t: "drop", id, to: { in: "felt", x: c.x, y: c.y, up: c.up, angle: c.angle } });
  if (me.state.felt.find((f) => f.id === id)?.up !== c.up) me.send({ t: "turn", id });
});
for (const c of [...alia.state.chairs.find((x) => x.owner === alia.me.key).hand]) { alia.send({ t: "grab", id: c.id }); alia.send({ t: "drop", id: c.id, to: { in: "deck", pile: "deck" } }); }
{
  const ids = [];
  for (const ch of me.state.chairs) for (const c of ch.hand) ids.push(c.id);
  me.send({ t: "gather", ids, side: "down", to: { pile: "deck" } });
  me.send({ t: "deckMove", pile: "deck", x: 0, y: 0.3, angle: 0 });
}
await wait(600);
me.send({ t: "stand" });
alia.send({ t: "flag", chair: alia.state.chairs.find((c) => c.owner === alia.me.key).id, flag: "reject", on: true });
first.zoomBy(2.2);
await wait(900);
// Сдвиг кадра первого лица: колода — в середину кадра.
{
  const pile = me.state.piles[0], at = first.test.screenOf(pile.cards[0].id), st = $("s-first").getBoundingClientRect(), fr = $("f-first").getBoundingClientRect();
  $("s-first").style.left = (FW / 2 - (at.x - st.left)) + "px"; $("s-first").style.top = (FH * 0.42 - (at.y - st.top)) + "px";
  void fr;
}
await wait(300);

// В первом лице камеру крутить нельзя: касание пустого места (кроме карт и язычка) до сцены не доходит.
for (const type of ["pointerdown", "touchstart"]) $("s-first").addEventListener(type, (e) => {
  const x = e.clientX ?? e.touches?.[0]?.clientX, y = e.clientY ?? e.touches?.[0]?.clientY;
  const pid = me.state.piles[0]?.id, tab = pid ? first.test.tabInfo(pid)?.screen : null;
  if (first.test.cardAt(x, y) || (tab && Math.abs(tab.x - x) < 42 && Math.abs(tab.y - y) < 30)) return;
  e.stopImmediatePropagation(); e.preventDefault();
}, true);
$("s-first").addEventListener("wheel", (e) => { e.stopImmediatePropagation(); e.preventDefault(); }, { capture: true, passive: false });

// ПРИЁМКА СТОПКИ — общая для обеих сцен.
let policy = "accept", finger = null, pid = 1, note = "", noteAt = 0;
const waiting = [];
const bar = $("bar");
for (const [k, t] of [["accept", "принимает"], ["refuse", "не принимает"], ["ask", "нужен апрув"]]) {
  const b = document.createElement("button"); b.textContent = t; b.dataset.p = k; if (k === policy) b.className = "on";
  b.onclick = () => { policy = k; for (const x of bar.children) x.className = x.dataset.p === k ? "on" : ""; };
  bar.append(b);
}
const pileId = () => me.state.piles[0]?.id;
const views = [
  { name: "top", scene: top, frame: $("f-top"), flip: 1, rest: null, inside: false },
  { name: "first", scene: first, frame: $("f-first"), flip: -1, rest: null, inside: false },
];
for (const v of views) {
  v.cv = document.createElement("canvas"); v.cv.className = "zcv"; v.frame.append(v.cv);
  v.say = document.createElement("div"); v.say.className = "say"; v.frame.append(v.say);
  v.stage = v.frame.firstElementChild;
}
const draggingView = () => views.find((v) => v.scene.test.draggingId());
const restOf = (v) => {
  const p = me.state.piles.find((x) => x.id === pileId()); if (!p) return null;
  if (!v.scene.test.draggingId() || !v.rest || v.rest.id !== p.id) { const at = v.scene.test.screenOf(p.cards[0].id); v.rest = { id: p.id, x: at.x, y: at.y, w: 76, h: 104 }; }
  return v.rest;
};
const hit = (v) => { if (!finger) return false; const a = v.scene.aim(finger.x, finger.y); return (a.in === "deck" && a.pile === pileId()) || waiting.some((id) => { const c = v.scene.test.screenOf(id); return c && Math.abs(finger.x - c.x) < 38 && Math.abs(finger.y - c.y) < 52; }); };
const fire = (type, x, y) => dispatchEvent(new PointerEvent(type, { pointerId: pid, clientX: x, clientY: y, bubbles: true, isPrimary: true, pointerType: "mouse", buttons: type === "pointerup" ? 0 : 1 }));
// Ждущие карты — в ряд над стопкой (по столу, одинаково для обеих сцен); последняя справа и выше. В первом лице порядок слева направо зеркален: стол смотрят с другой стороны.
const settle = () => { for (const v of views) waiting.forEach((id, i) => v.scene.test.floatCard(id, pileId(), v.flip * (i - (waiting.length - 1) / 2) * 1.05, -1.4, 0.12 + 0.22 * i, [-3, 2, -2, 3][i % 4], me.state.felt.find((c) => c.id === id)?.up ?? true)); };
addEventListener("pointermove", (e) => { pid = e.pointerId; if (e.isTrusted) finger = { x: e.clientX, y: e.clientY }; }, true);
addEventListener("pointerup", (e) => {
  const v = draggingView(); if (!e.isTrusted || !v) return;
  const id = v.scene.test.draggingId(), r = restOf(v);
  if (!r || !hit(v) || me.state.piles.some((p) => p.id === r.id && p.cards.some((c) => c.id === id))) return;
  if (policy === "refuse") { e.stopImmediatePropagation(); fire("pointermove", r.x, r.y + r.h); fire("pointerup", r.x, r.y + r.h); }
  if (policy === "ask") {
    e.stopImmediatePropagation();
    const fl = v.frame.getBoundingClientRect(), px = r.x + 100 < fl.right - 40 ? r.x + 100 : r.x - 100, py = r.y + 75;
    fire("pointermove", px, py); fire("pointerup", px, py);
    waiting.splice(waiting.filter((w) => v.scene.test.screenOf(w).x < finger.x).length, 0, id); settle();
  }
}, true);

const cut = (g, v, id, held) => {
  const t = v.scene.test, at = t.screenOf(id), cw = t.cardWidth(id), dz = t.depthOf(id), k = (v.stage.clientHeight / 2 / Math.tan(t.fovDeg() * Math.PI / 360)) / dz, w = cw * k + 2, h = cw * 1.4 * k + 2;
  g.save(); g.translate(at.x, at.y); g.rotate(held ? (t.heldAngle() ?? 0) * Math.PI / 180 : 0); g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 8); g.fill(); g.restore();
};
const tick = () => {
  const dv = draggingView();
  // Карту забрали пальцем — запрос отозван.
  if (dv) { const id = dv.scene.test.draggingId(), i = waiting.indexOf(id); if (i >= 0) { waiting.splice(i, 1); for (const v of views) v.scene.test.floatCard(id, null); settle(); note = "запрос отозван"; noteAt = performance.now(); } }
  for (const v of views) {
    const r = restOf(v), t = v.scene.test, did = t.draggingId(), fl = v.frame.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    const own = !!did && me.state.piles.some((p) => p.id === r?.id && p.cards.some((c) => c.id === did));
    const drag = !!did && !own, frozen = waiting.length > 0;
    let pend = false, deny = false, st = "", msg = note && performance.now() - noteAt < 1200 ? note : "";
    const over = r && drag ? hit(v) : false;
    if (r && drag && policy !== "refuse") {
      if (policy === "ask") { st = "hint"; if (over) msg = "нужен апрув"; if (!over && v.inside) { msg = "запрос отозван"; note = msg; noteAt = performance.now(); } v.inside = over; } else st = over ? "hot" : "hint";
    } else v.inside = false;
    if (r && drag && policy === "refuse" && over) { deny = true; msg = "сюда нельзя"; }
    if (frozen) { st = ""; pend = true; msg = ""; }
    // Подсветка и знаки — отдельным слоем над сценой; из него вырезаны колода, висящие карты и несомая карта: они лежат поверх.
    if (v.cv.width !== Math.round(fl.width * dpr) || v.cv.height !== Math.round(fl.height * dpr)) { v.cv.width = Math.round(fl.width * dpr); v.cv.height = Math.round(fl.height * dpr); }
    const g = v.cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, -fl.left * dpr, -fl.top * dpr); g.clearRect(fl.left, fl.top, fl.width, fl.height);
    const k0 = r ? (v.stage.clientHeight / 2 / Math.tan(t.fovDeg() * Math.PI / 360)) / t.depthOf(me.state.piles[0].cards[0].id) : 1, PW = 1.17 * k0 * 0.99, PH = PW * 1.4;
    const rr = (x, y, w, h, k) => { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, k); };
    if (r && st) {
      const blur = st === "hint" ? 12 : 20, passes = st === "hint" ? 2 : 3;
      g.globalAlpha = st === "hint" ? 0.7 : 1; g.shadowColor = "rgb(127,209,185)"; g.shadowBlur = blur; g.fillStyle = "rgb(127,209,185)";
      for (let i = 0; i < passes; i++) { rr(r.x, r.y, PW, PH, 6); g.fill(); }
      g.shadowBlur = 0; g.globalAlpha = 1; g.globalCompositeOperation = "destination-out"; g.fillStyle = "#000"; rr(r.x, r.y, PW, PH, 6); g.fill();
      for (const id of waiting) cut(g, v, id, false); if (did) cut(g, v, did, true);
      g.globalCompositeOperation = "source-over";
    }
    if (r && pend) {
      const marks = waiting.map((id) => t.screenOf(id)).filter(Boolean), cx = marks.length ? marks.reduce((q, m) => q + m.x, 0) / marks.length : r.x, topY = marks.length ? Math.min(...marks.map((m) => m.y)) - 62 : r.y - PH / 2 - 22;
      const W = 46, H = 18, bx = cx - W / 2, by = topY - H / 2;
      g.fillStyle = "#0b0704"; g.fillRect(bx - 3, by - 3, W + 6, H + 6); g.fillStyle = "#3a2a1d"; g.fillRect(bx, by, W, H);
      const ph = Math.floor(performance.now() / 280) % 3;
      for (let i = 0; i < 3; i++) { g.fillStyle = i === ph ? "#f5ead0" : "rgba(245,234,208,.3)"; g.fillRect(bx + 9 + i * 12, by + 6, 6, 6); }
    }
    if (r && deny) {
      g.lineCap = "round"; const ix = r.x, iy = r.y - PH / 2 - 16, ir = 13, d = 9;
      g.strokeStyle = "#0b0704"; g.lineWidth = 8; g.beginPath(); g.arc(ix, iy, ir, 0, Math.PI * 2); g.moveTo(ix - d, iy - d); g.lineTo(ix + d, iy + d); g.stroke();
      g.strokeStyle = "#f5ead0"; g.lineWidth = 4; g.beginPath(); g.arc(ix, iy, ir, 0, Math.PI * 2); g.moveTo(ix - d, iy - d); g.lineTo(ix + d, iy + d); g.stroke();
      g.globalCompositeOperation = "destination-out"; g.fillStyle = "#000"; if (did) cut(g, v, did, true); g.globalCompositeOperation = "source-over";
    }
    if (r) { Object.assign(v.say.style, { left: r.x - fl.left + "px", top: r.y - fl.top - PH / 2 - 24 - (frozen ? 80 : 0) - (deny ? 32 : 0) + "px", display: msg ? "block" : "none" }); v.say.textContent = msg; }
  }
  requestAnimationFrame(tick);
};
tick();
window.__top = top; window.__first = first; window.__me = me; window.__alia = alia; window.__ready = true;
</script>
</body>
</html>
