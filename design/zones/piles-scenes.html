<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Стопки — приёмка (сцены)</title>
<link href="/@fs/Users/giyers/Desktop/crossade-deck/design/zones/fonts/tiny5.css" rel="stylesheet">
<style>
  :root { --panel: #3a2a1d; --well: #1c120b; --ink: #f5ead0; --wood: #6b4d2c; --black: #0b0704; --gold: #f2c14e; --goldLight: #f8d885; --goldDark: #b08a26; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0d2118; color: var(--ink); font: 400 13px/1.3 'Tiny5', monospace; }
  .page { width: min(100vw, 480px); margin: 0 auto; padding: 14px 12px 40px; }
  h1 { margin: 4px 2px 12px; font-weight: 400; font-size: 18px; }
  .plate { background: linear-gradient(var(--panel), var(--well)); margin: 0 0 22px; padding: 12px 10px 10px;
    box-shadow: 0 -2px 0 0 var(--black), 0 2px 0 0 var(--black), -2px 0 0 0 var(--black), 2px 0 0 0 var(--black), inset 0 0 0 2px var(--wood), 0 6px 0 0 rgba(11,7,4,.6); }
  .head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .head .n { width: 22px; height: 22px; background: linear-gradient(var(--goldLight), var(--goldDark)); color: var(--black); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--black); }
  .head .t { font-size: 15px; letter-spacing: .3px; }
  .view { position: relative; width: 100%; height: 390px; overflow: hidden; border-radius: 10px; background: #0a1511; box-shadow: 0 0 0 3px var(--wood), 0 0 0 5px var(--black); touch-action: none; }
  .view > .stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>СТОПКИ — ПРИЁМКА</h1>
  <div class="plate"><div class="head"><div class="n">1</div><div class="t">ВИД СВЕРХУ</div></div><div class="view"><div class="stage" id="top"></div></div></div>
  <div class="plate"><div class="head"><div class="n">2</div><div class="t">ВИД ОТ ПЕРВОГО ЛИЦА</div></div><div class="view"><div class="stage" id="first"></div></div></div>
</div>
<script type="module">
// ДВЕ СЦЕНЫ НА ОДНОМ СТОЛЕ. Подтягивается настоящий `scene.ts` и локальный стол с dev-сервера игры (порт 9590): стол один, у него два «зрителя» — я (вид сверху) и Алия (вид от первого лица) — поэтому всё, что делают в одной сцене, сразу видно в другой. Тел и рук нет: на столе колода и две карты.
globalThis.__TABLE_HOST__ = `http://${location.hostname}:2591`;
if (!crypto.randomUUID) crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
await document.fonts.load("20px Tiny5");
const { mountScene } = await import("/src/scene.ts");
const { localTable } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/localStore.ts");
const table = localTable({ freeChair: true }), me = table.view("me"), alia = table.view("alia");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
await wait(300);
const top = mountScene(document.getElementById("top"), me);
const first = mountScene(document.getElementById("first"), alia);
top.setCamMode("top"); first.setCamMode("head");
top.setFigures(false); first.setFigures(false);
top.test.setPileSnap(false); first.test.setPileSnap(false);
await wait(800);
// Стол: две карты на сукне (лицом и рубашкой) и колода из остальных.
const mine = me.state.chairs.find((c) => c.owner === me.me.key).hand;
[{ up: true, x: -1.8, y: 0.7, angle: -12 }, { up: false, x: 1.8, y: 0.7, angle: 10 }].forEach((c, i) => {
  const id = mine[i].id;
  me.send({ t: "grab", id }); me.send({ t: "drop", id, to: { in: "felt", x: c.x, y: c.y, up: c.up, angle: c.angle } });
  if (me.state.felt.find((f) => f.id === id)?.up !== c.up) me.send({ t: "turn", id });
});
for (const c of [...alia.state.chairs.find((x) => x.owner === alia.me.key).hand]) { alia.send({ t: "grab", id: c.id }); alia.send({ t: "drop", id: c.id, to: { in: "deck", pile: "deck" } }); }
{
  // Всё, что лежит в руках, — в ту же колоду: остаётся одна стопка из 34 карт.
  const ids = [];
  for (const ch of me.state.chairs) for (const c of ch.hand) ids.push(c.id);
  me.send({ t: "gather", ids, side: "down", to: { pile: "deck" } });
}
await wait(600);
me.send({ t: "stand" });
alia.send({ t: "flag", chair: alia.state.chairs.find((c) => c.owner === alia.me.key).id, flag: "reject", on: true });
first.zoomBy(2.2);
await wait(900);
// В первом лице камеру крутить нельзя: касание пустого места (кроме карт и язычков) до сцены не доходит.
const stageFirst = document.getElementById("first");
for (const type of ["pointerdown", "touchstart"]) stageFirst.addEventListener(type, (e) => {
  const x = e.clientX ?? e.touches?.[0]?.clientX, y = e.clientY ?? e.touches?.[0]?.clientY;
  if (first.test.cardAt(x, y) || first.pickAt?.(x, y)) return;
  e.stopImmediatePropagation(); e.preventDefault();
}, true);
stageFirst.addEventListener("wheel", (e) => { e.stopImmediatePropagation(); e.preventDefault(); }, { capture: true, passive: false });
window.__top = top; window.__first = first; window.__me = me; window.__alia = alia;
window.__ready = true;
</script>
</body>
</html>
