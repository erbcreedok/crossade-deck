<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Стопки — приёмка (сцены)</title>
<link href="/@fs/Users/giyers/Desktop/crossade-deck/design/zones/fonts/tiny5.css" rel="stylesheet">
<style>
  :root { --panel: #3a2a1d; --well: #1c120b; --ink: #f5ead0; --wood: #6b4d2c; --black: #0b0704; --gold: #f2c14e; --goldLight: #f8d885; --goldDark: #b08a26; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0d2118; color: var(--ink); font: 400 13px/1.3 'Tiny5', monospace; }
  .page { width: min(100vw, 480px); margin: 0 auto; padding: 14px 12px 40px; }
  h1 { margin: 4px 2px 12px; font-weight: 400; font-size: 18px; }
  .plate { background: linear-gradient(var(--panel), var(--well)); margin: 0 0 22px; padding: 12px 10px 10px;
    box-shadow: 0 -2px 0 0 var(--black), 0 2px 0 0 var(--black), -2px 0 0 0 var(--black), 2px 0 0 0 var(--black), inset 0 0 0 2px var(--wood), 0 6px 0 0 rgba(11,7,4,.6); }
  .head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .head .n { width: 22px; height: 22px; background: linear-gradient(var(--goldLight), var(--goldDark)); color: var(--black); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--black); }
  .head .t { font-size: 15px; letter-spacing: .3px; }
  .who { margin-left: auto; display: flex; gap: 6px; }
  .who button { width: 22px; height: 22px; border: 0; padding: 0; background: var(--c); box-shadow: 0 0 0 2px var(--black); opacity: .55; cursor: pointer; }
  .who button.on { opacity: 1; box-shadow: 0 0 0 2px var(--black), 0 0 0 4px var(--ink); }
  .lag { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 12px; }
  .lag input { flex: 1; accent-color: var(--gold); }
  .lag b { font-weight: 400; min-width: 52px; text-align: right; }
  .frame { opacity: 0; transition: opacity .35s; position: relative; width: 100%; height: 300px; overflow: hidden; border-radius: 10px; background: #0a1511; box-shadow: 0 0 0 3px var(--wood), 0 0 0 5px var(--black); touch-action: none; }
  .frame.ready { opacity: 1; }
  .stage { position: absolute; }
  .zcv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .say { position: absolute; z-index: 9; transform: translate(-50%, 0); font: 400 12px 'Tiny5', monospace; color: var(--ink); background: var(--panel); padding: 3px 8px; box-shadow: 0 0 0 2px var(--black); pointer-events: none; white-space: nowrap; display: none; }
  #bar { display: flex; gap: 6px; margin: 0 0 12px; font: 400 12px 'Tiny5', monospace; }
  #bar button { font: inherit; padding: 5px 9px; border: 0; background: var(--panel); color: var(--ink); box-shadow: 0 0 0 2px var(--black); cursor: pointer; }
  #bar button.on { background: var(--gold); color: var(--black); }
</style>
</head>
<body>
<div class="page">
  <h1>СТОПКИ — ПРИЁМКА</h1>
  <div id="bar"></div>
  <div class="plate"><div class="head"><div class="n">1</div><div class="t">ВИД СВЕРХУ</div><div class="who" id="who-top"></div></div><div class="lag"><span>пинг</span><input type="range" id="lag-top" min="0" max="1000" step="50" value="0"><b id="lagv-top">0 мс</b></div><div class="frame" id="f-top"><div class="stage" id="s-top"></div></div></div>
  <div class="plate"><div class="head"><div class="n">2</div><div class="t">ВИД ОТ ПЕРВОГО ЛИЦА</div><div class="who" id="who-first"></div></div><div class="lag"><span>пинг</span><input type="range" id="lag-first" min="0" max="1000" step="50" value="0"><b id="lagv-first">0 мс</b></div><div class="frame" id="f-first"><div class="stage" id="s-first"></div></div></div>
</div>
<script type="module">
// ЭТА ЖЕ СЦЕНА СТЕНДА (`harness.html`), ДВАЖДЫ. Настоящий `scene.ts` и один локальный стол с dev-сервера игры (порт 9590): я смотрю сверху, Алия — от первого лица, поэтому всё, что делают в одной сцене (взяли карту, бросили, карты ждут апрува), сразу видно в другой. Приёмка стопки (принимает / не принимает / нужен апрув) — та же, что на стенде, общая для обеих.
globalThis.__TABLE_HOST__ = `http://${location.hostname}:2591`;
if (!crypto.randomUUID) crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
await document.fonts.load("20px Tiny5");
const { mountScene } = await import("/src/scene.ts");
const { localTable } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/localStore.ts");
// ИГРОКИ — только управление и доступы: ни места, ни тела на сцене. Сцена смотрит из места «своего» наблюдателя (камера стоит), а двигает карты тот игрок, кого выбрали у сцены.
const PLAYERS = [
  { key: "blue", name: "Синий", ink: "#4a8fe0" },
  { key: "red", name: "Красный", ink: "#e0483f" },
  { key: "green", name: "Зелёный", ink: "#59b36a" },
  { key: "yellow", name: "Жёлтый", ink: "#f2c14e" },
];
const table = localTable({ players: PLAYERS });
const views = Object.fromEntries(PLAYERS.map((p) => [p.key, table.view(p.key)]));
const me = views.blue, alia = views.red;
const controller = { top: "blue", first: "blue" };
const CTL_KEYS = new Set(["body", "say", "shoot", "mic", "log", "rtc", "askStickers", "watch"]);
const { carryOf } = await import("/@fs/Users/giyers/Desktop/crossade-deck/server/table-client/tape.ts");
const lat = { top: 0, first: 0 };
// ЖИВОЙ НОСИТЕЛЬ КАРТ: что несёт палец в одной сцене, видно в другой, пока карту несут (поток `carry` идёт через шину страницы, как через сервер), и с задержкой, заданной ползунком у обеих сцен.
const bus = { top: [], first: [] };
const hear = { top: [], first: [] };
const note = (who, out) => {
  const h = bus[who]; h.push({ t: performance.now(), out }); while (h.length > 80) h.shift();
  // Сосед перерисует нести-карту, когда слово до него дойдёт.
  const other = who === "top" ? "first" : "top";
  setTimeout(() => { for (const l of hear[other]) l(); }, lat[who] + lat[other]);
};
/** Что сцена `who` видит у соседа: его последнее слово, дошедшее до неё (задержка = пинг отправителя + пинг получателя). */
const heard = (who, other) => { const h = bus[other], at = performance.now() - lat[other] - lat[who]; let last = null; for (const e of h) if (e.t <= at) last = e; return last && last.out && at - last.t < 300 ? last.out : null; };
/** Хранилище сцены: читает стол из места наблюдателя, а намерения шлёт от имени выбранного игрока, через пинг сцены. */
const OUT = new Set(["send", "command"]);
const asPlayer = (viewpoint, which) => { const other = which === "top" ? "first" : "top"; return new Proxy(viewpoint, { get: (t, k) => {
  if (k === "send") return (intent) => { if (intent.t === "drop" || intent.t === "unpick") note(which, null); setTimeout(() => views[controller[which]].send(intent), lat[which]); };
  if (k === "command") return (c) => setTimeout(() => views[controller[which]].command(c), lat[which]);
  if (k === "carry") return (out) => note(which, out);
  if (k === "onChange") return (l) => { hear[which].push(l); viewpoint.onChange(l); };
  if (k === "carries") { const out = heard(which, other); const c = out ? carryOf(viewpoint.state, out.id, "remote:" + other, out.over) : null; return c ? [c] : []; }
  if (CTL_KEYS.has(k)) return (...a) => views[controller[which]][k](...a);
  return Reflect.get(t, k, t);
} }); };const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);

// СТЕНД: у кадра свой размер сцены (`SW`×`SH`), в кадре видна только середина — стола с кромкой и стульев не видно.
const sizeStage = (s, w, h, fw, fh) => Object.assign(s.style, { width: w + "px", height: h + "px", left: (fw - w) / 2 + "px", top: (fh - h) / 2 + "px" });
const FW = $("f-top").clientWidth, FH = 300;
sizeStage($("s-top"), 820, 820, FW, FH);
sizeStage($("s-first"), 1000, 1000, FW, FH);
await wait(200);
const top = mountScene($("s-top"), asPlayer(me, "top")), first = mountScene($("s-first"), asPlayer(alia, "first"));
top.setCamMode("top"); first.setCamMode("head");
top.setFigures(false); first.setFigures(false);
top.test.setPileSnap(false); first.test.setPileSnap(false);
top.test.setBareTable(true); first.test.setBareTable(true);
await wait(800);

// СТОЛ: две карты (лицом и рубашкой) на сукне и колода из остальных 34; других стопок нет.
[{ up: true, x: -1.9, y: 1.7, angle: -12 }, { up: false, x: 1.9, y: 1.7, angle: 10 }].forEach((c) => {
  const id = me.state.piles[0].cards.at(-1).id;
  me.send({ t: "grab", id }); me.send({ t: "drop", id, to: { in: "felt", x: c.x, y: c.y, up: c.up, angle: c.angle } });
  if (me.state.felt.find((f) => f.id === id)?.up !== c.up) me.send({ t: "turn", id });
});
me.send({ t: "deckMove", pile: me.state.piles[0].id, x: 0, y: 0.3, angle: 0 });
await wait(600);
// Рука наблюдателей не принимает карты: карта над её зоной остаётся на столе.
for (const key of ["blue", "red"]) views[key].send({ t: "flag", chair: views[key].state.chairs.find((c) => c.owner === key).id, flag: "reject", on: true });
await wait(900);
// Сдвиг кадра первого лица: колода — в середину кадра.
{
  const pile = me.state.piles[0], at = first.test.screenOf(pile.cards[0].id), st = $("s-first").getBoundingClientRect(), fr = $("f-first").getBoundingClientRect();
  $("s-first").style.left = (FW / 2 - (at.x - st.left)) + "px"; $("s-first").style.top = (FH * 0.42 - (at.y - st.top)) + "px";
  void fr;
}
await wait(300);

top.test.setCamLocked(true); first.test.setCamLocked(true);
for (const f of document.querySelectorAll(".frame")) f.classList.add("ready");
// Камера: по умолчанию её крутить нельзя — касание пустого места (кроме карт и язычка колоды) до сцены не доходит, колесо и щипок тоже. Тумблер «камера» в панели включает управление камерой на обеих сценах.
let cameraOn = false;
for (const [el, sc] of [[$("s-top"), top], [$("s-first"), first]]) {
  for (const type of ["pointerdown", "touchstart"]) el.addEventListener(type, (e) => {
    if (cameraOn) return;
    const x = e.clientX ?? e.touches?.[0]?.clientX, y = e.clientY ?? e.touches?.[0]?.clientY;
    const pid = me.state.piles[0]?.id, tab = pid ? sc.test.tabInfo(pid)?.screen : null;
    if (sc.test.cardAt(x, y) || (tab && Math.abs(tab.x - x) < 42 && Math.abs(tab.y - y) < 30)) return;
    e.stopImmediatePropagation(); e.preventDefault();
  }, true);
  el.addEventListener("wheel", (e) => { if (cameraOn) return; e.stopImmediatePropagation(); e.preventDefault(); }, { capture: true, passive: false });
}

// ПРИЁМКА СТОПКИ — модуль игры (`table3d/src/pileAccept.ts`), общий для обеих сцен: страница его только подключает.
const { mountPileAccept } = await import("/src/pileAccept.ts");
const acc = mountPileAccept({ table: me, views: [{ scene: top, host: $("s-top"), frame: $("f-top") }, { scene: first, host: $("s-first"), frame: $("f-first"), flip: -1 }] });
const bar = $("bar");
for (const [k, t] of [["accept", "принимает"], ["refuse", "не принимает"], ["ask", "нужен апрув"]]) {
  const b = document.createElement("button"); b.textContent = t; b.dataset.p = k; if (k === acc.policy()) b.className = "on";
  b.onclick = () => { acc.setPolicy(k); for (const x of bar.children) if (x.dataset.p) x.className = x.dataset.p === k ? "on" : ""; };
  bar.append(b);
}
const camBtn = document.createElement("button"); camBtn.textContent = "камера: выкл"; camBtn.style.marginLeft = "auto"; camBtn.onclick = () => { cameraOn = !cameraOn; top.test.setCamLocked(!cameraOn); first.test.setCamLocked(!cameraOn); camBtn.textContent = cameraOn ? "камера: вкл" : "камера: выкл"; camBtn.className = cameraOn ? "on" : ""; };
bar.append(camBtn);
for (const which of ["top", "first"]) { const el = $("lag-" + which); el.oninput = () => { lat[which] = Number(el.value); $("lagv-" + which).textContent = el.value + " мс"; }; }
// ВЫБОР ИГРОКА У КАЖДОЙ СЦЕНЫ: по умолчанию синий; смена не трогает камеру.
for (const which of ["top", "first"]) {
  const box = $("who-" + which);
  for (const pl of PLAYERS) {
    const b = document.createElement("button"); b.title = pl.name; b.style.setProperty("--c", pl.ink); b.style.setProperty("--ink", "#f5ead0"); b.dataset.k = pl.key;
    if (pl.key === controller[which]) b.className = "on";
    b.onclick = () => { controller[which] = pl.key; for (const x of box.children) x.className = x.dataset.k === pl.key ? "on" : ""; };
    box.append(b);
  }
}
window.__top = top; window.__first = first; window.__me = me; window.__alia = alia; window.__ready = true;
</script>
</body>
</html>
