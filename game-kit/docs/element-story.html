<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game-kit · Elements/Element — story blueprint</title>

<style>
:root{
  --app-bg:#f6f9fc; --sidebar:#fff; --panel:#fff; --canvas:#f6f9fc;
  --border:#e6ecf0; --border-2:#d9e0e6;
  --text:#2e3438; --muted:#5c6870; --faint:#8a949c;
  --accent:#1ea7fd; --accent-weak:#e3f3ff;
  --code-bg:#f7fafc; --code-text:#30404d;
  --good:#66bf3c; --warn:#e69d00; --bad:#ff4400; --purple:#a284ff;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --app-bg:#1b1c1d; --sidebar:#222425; --panel:#1b1c1d; --canvas:#171819;
    --border:#333537; --border-2:#2b2d2e;
    --text:#c9cdcf; --muted:#8b9297; --faint:#6b7378;
    --accent:#1ea7fd; --accent-weak:#12303f;
    --code-bg:#0e1414; --code-text:#a7b6c2;
  }
}
:root[data-theme="light"]{
  --app-bg:#f6f9fc; --sidebar:#fff; --panel:#fff; --canvas:#f6f9fc;
  --border:#e6ecf0; --border-2:#d9e0e6; --text:#2e3438; --muted:#5c6870; --faint:#8a949c;
  --accent-weak:#e3f3ff; --code-bg:#f7fafc; --code-text:#30404d;
}
:root[data-theme="dark"]{
  --app-bg:#1b1c1d; --sidebar:#222425; --panel:#1b1c1d; --canvas:#171819;
  --border:#333537; --border-2:#2b2d2e; --text:#c9cdcf; --muted:#8b9297; --faint:#6b7378;
  --accent-weak:#12303f; --code-bg:#0e1414; --code-text:#a7b6c2;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--text);background:var(--app-bg);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
code,pre{font-family:var(--mono)}

.app{display:grid;grid-template-columns:238px 1fr;height:100vh;height:100dvh;overflow:hidden}

/* ---------- sidebar ---------- */
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--border);
  font-weight:800;letter-spacing:.2px}
.sb-brand .logo{width:22px;height:22px;border-radius:5px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-size:13px}
.sb-brand small{font-weight:600;color:var(--faint);font-size:11px}
.sb-search{margin:10px;padding:6px 9px;border:1px solid var(--border-2);border-radius:5px;
  color:var(--faint);font-size:12px;display:flex;justify-content:space-between}
.sb-search kbd{border:1px solid var(--border-2);border-radius:3px;padding:0 4px;font-size:10px}
.tree{overflow:auto;padding:2px 8px 20px;flex:1}
.tree .root{display:flex;align-items:center;gap:6px;padding:5px 6px;font-weight:800;
  color:var(--text);cursor:default;margin-top:6px}
.tree .grp{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 20px;color:var(--muted);
  cursor:default;font-weight:600}
.tree .story{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 38px;color:var(--muted);
  cursor:pointer;border-radius:5px;width:100%;text-align:left;background:none;border:0;font:inherit}
.tree .story:hover{background:var(--code-bg);color:var(--text)}
.tree .story.on{background:var(--accent);color:#fff}
.tree .ic{width:13px;height:13px;flex:none;opacity:.85;font-size:11px}
.tree .story.on .ic{filter:brightness(3)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:auto}
.story.on .dot{background:#fff}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--border);
  background:var(--panel);flex-wrap:wrap}
.tb-tab{padding:5px 11px;border-radius:5px;border:0;background:none;font:inherit;font-weight:700;
  color:var(--muted);cursor:pointer}
.tb-tab.on{background:var(--accent-weak);color:var(--accent)}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 8px}
.tb-tool{width:28px;height:26px;border-radius:5px;border:0;background:none;color:var(--muted);
  cursor:pointer;font-size:14px}
.tb-tool:hover{background:var(--code-bg);color:var(--text)}
.tb-spacer{flex:1}
.tb-glob{display:flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--border-2);
  border-radius:5px;color:var(--muted);font-size:11px;cursor:pointer;font-weight:600}
.tb-glob b{color:var(--text)}

.stage{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}

/* canvas view */
.canvas-wrap{background:var(--canvas);flex:1;min-height:200px;position:relative;overflow:auto;
  background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px;
  display:grid;place-items:center;align-content:center;padding:30px}
.addons{border-top:1px solid var(--border);background:var(--panel);flex:0 0 auto;
  height:42%;min-height:200px;display:flex;flex-direction:column}
.sheet-handle{display:none}
.mobilebar,.backdrop{display:none}
.addons-tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--border);
  flex:0 0 auto;height:41px}
.ad-tab{padding:6px 11px;border:0;background:none;font:inherit;font-weight:700;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.ad-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.ad-tab .badge{background:var(--accent);color:#fff;border-radius:20px;font-size:10px;padding:0 6px;font-weight:800}
.addons-body{height:calc(100% - 41px);overflow:auto;padding:12px 14px}

/* docs view */
.docs{padding:34px 40px 90px;max-width:920px;margin:0 auto;width:100%}
.docs h1{font-size:30px;margin:0 0 4px;letter-spacing:-.4px}
.docs .lede{color:var(--muted);font-size:15px;margin:0 0 8px}
.docs h2{font-size:19px;margin:40px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.docs h3{font-size:13px;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.docs p{margin:9px 0}
.docs ul{margin:8px 0;padding-left:20px}
.docs li{margin:4px 0}
.pathchip{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);
  background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:2px 8px;margin-bottom:14px}

/* args table */
table{border-collapse:collapse;width:100%;font-size:12.5px}
.args th{text-align:left;color:var(--faint);font-weight:700;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--border)}
.args td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.args tr:last-child td{border-bottom:0}
.args .nm{font-family:var(--mono);color:var(--accent);font-weight:600;white-space:nowrap}
.args .ds{color:var(--muted)}
.tog{width:34px;height:19px;border-radius:20px;background:var(--border-2);position:relative;
  cursor:pointer;border:0;transition:background .12s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;transition:left .12s}
.tog.on{background:var(--accent)}
.tog.on::after{left:17px}
select.mini{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--border-2);
  border-radius:5px;background:var(--panel);color:var(--text)}
input.mini{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--border-2);
  border-radius:5px;background:var(--panel);color:var(--text);width:100%;max-width:150px}
/* atom sub-argument rows: revealed only while the atom is on */
.args tr.sub td{border-bottom:1px solid var(--border);background:var(--code-bg)}
.args tr.sub td.snm{padding-left:22px;position:relative;font-family:var(--mono);
  color:var(--muted);white-space:nowrap;font-size:11.5px}
.args tr.sub td.snm::before{content:"└";position:absolute;left:8px;color:var(--faint)}
.args tr.sub .req{color:var(--warn);font-weight:700;margin-left:4px}
.args tr.sub td.shelp{color:var(--faint);font-size:11px;line-height:1.45}
.args tr.sub.last td{border-bottom:2px solid var(--border-2)}

/* actions log */
.log{font-family:var(--mono);font-size:12px}
.log .row{padding:5px 8px;border-bottom:1px solid var(--border);display:flex;gap:10px}
.log .row:hover{background:var(--code-bg)}
.log .ev{color:var(--accent);font-weight:600}
.log .pl{color:var(--muted)}
.log .empty{color:var(--faint);padding:8px}

/* interactions steps */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:8px 8px 8px 34px;border-bottom:1px solid var(--border)}
.steps li::before{content:counter(s);position:absolute;left:8px;top:8px;width:19px;height:19px;
  border-radius:50%;background:var(--accent-weak);color:var(--accent);font-weight:800;font-size:11px;
  display:grid;place-items:center}
.steps li.pass::before{content:"✓";background:var(--good);color:#fff}
.steps li.fail::before{content:"!";background:var(--bad);color:#fff}

/* cards / callouts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--border);border-radius:8px;padding:13px 15px;background:var(--panel)}
.card h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
.card .atoms{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.7}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;
  background:var(--code-bg);border:1px solid var(--border);color:var(--code-text);margin:1px}
.tag.core{border-color:var(--accent);color:var(--accent)}
pre.code{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;
  overflow:auto;font-size:12.5px;color:var(--code-text);line-height:1.6}
pre.code .c{color:var(--faint)}
pre.code .k{color:var(--accent)}
.callout{border-left:3px solid var(--accent);background:var(--accent-weak);border-radius:0 8px 8px 0;
  padding:10px 14px;margin:12px 0;font-size:12.5px}
.scroll{overflow-x:auto}

/* verdict chips */
.v{font-weight:800;font-size:11px;padding:1px 7px;border-radius:20px;white-space:nowrap}
.v.ok{background:rgba(102,191,60,.16);color:var(--good)}
.v.wn{background:rgba(230,157,0,.16);color:var(--warn)}
.v.bd{background:rgba(255,68,0,.16);color:var(--bad)}

/* test plan */
.layer{border:1px solid var(--border);border-radius:9px;margin:12px 0;overflow:hidden}
.layer > summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;align-items:center;
  gap:11px;font-weight:700;background:var(--panel)}
.layer > summary::-webkit-details-marker{display:none}
.layer > summary::before{content:"▸";color:var(--faint);transition:.15s}
.layer[open] > summary::before{transform:rotate(90deg)}
.layer .kind{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;
  border-radius:5px;border:1px solid var(--border-2);color:var(--muted)}
.layer .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.layer .body{padding:4px 16px 14px;border-top:1px solid var(--border);font-size:12.5px}
.layer .tool{color:var(--faint);font-size:11.5px;margin:8px 0 2px}
.gwt{list-style:none;padding:0;margin:6px 0}
.gwt li{padding:7px 0 7px 0;border-bottom:1px dashed var(--border)}
.gwt li:last-child{border-bottom:0}
.gwt .id{font-family:var(--mono);font-size:10.5px;color:var(--purple);display:block;margin-bottom:2px}
.gwt b.g{color:var(--muted);font-weight:700}
.gwt b.w{color:var(--accent);font-weight:700}
.gwt b.t{color:var(--good);font-weight:700}
.summ{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;padding:14px;border:1px solid var(--border);
  border-radius:9px;background:var(--code-bg)}
.summ div{display:flex;flex-direction:column}
.summ .num{font-size:22px;font-weight:800;color:var(--text)}
.summ .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ---------- the mock canvas element ---------- */
.stagearea{display:flex;flex-direction:column;align-items:center;gap:18px}
/* NO fixed size here: width/height are written inline from the footprint. */
.elbox{position:relative;display:grid;place-items:center}
.elshadow{position:absolute;border-radius:12px;background:rgba(20,30,40,.30);
  pointer-events:none;transition:.16s}
.el{border-radius:12px;position:relative;transition:.16s;
  display:grid;place-items:center;color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center}
.el.bare{border:2px dashed var(--border-2);background:transparent}
.el.bounded{border:1px solid var(--border-2)}
.el.faced{background:linear-gradient(150deg,#fff,#eef4f8);border:1px solid #cdd7de;color:#2e3438}
:root[data-theme="dark"] .el.faced{background:linear-gradient(150deg,#2b2f31,#212425);border-color:#3a3f42;color:#c9cdcf}
@media(prefers-color-scheme:dark){.el.faced{background:linear-gradient(150deg,#2b2f31,#212425);border-color:#3a3f42;color:#c9cdcf}}
.el.drag{cursor:grab}
.derived{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.derived b{color:var(--muted);font-weight:600}
.lockchip{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--muted);
  border:1px solid var(--border-2);border-radius:20px;padding:1px 7px;white-space:nowrap}
.args td code{color:var(--accent)}
.el.sel{outline:2px dashed var(--purple);outline-offset:4px}
/* debug layers — the VIEWER's plane; the node knows nothing about them */
.dbg{position:absolute;pointer-events:none}
.dbg-box{border:1px solid var(--accent);opacity:.75}
.dbg-hit{border:1px dashed var(--good);background:rgba(102,191,60,.10)}
.dbg-sil{border:1px solid var(--purple);background:rgba(162,132,255,.14);border-radius:44%}
.dbg-at{width:9px;height:9px;border-radius:50%;background:var(--bad);
  box-shadow:0 0 0 3px rgba(255,68,0,.22)}
.dbg-z{width:2px;background:repeating-linear-gradient(to bottom,var(--warn) 0 4px,transparent 4px 8px);
  left:50%;bottom:-2px;position:absolute}
.dbg-slots{background:
  repeating-linear-gradient(to right,transparent 0 48%,var(--border-2) 48% 52%,transparent 52% 100%),
  repeating-linear-gradient(to bottom,transparent 0 48%,var(--border-2) 48% 52%,transparent 52% 100%)}
.planehd{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
  padding:10px 10px 4px;font-weight:800}
.staterow{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 10px}
.stbtn{border:1px solid var(--border-2);background:var(--panel);color:var(--muted);border-radius:20px;
  padding:4px 11px;font:inherit;font-size:12px;cursor:pointer;font-family:var(--mono)}
.stbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stbtn.happens{border-style:dashed}
.derivedtbl td{padding:6px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px}
.derivedtbl .cls{color:var(--faint);font-size:11px}
.inspector{font-family:var(--mono);font-size:12px;padding:4px 2px}
.inode{border-left:2px solid var(--border);padding:6px 0 8px 10px;margin-bottom:4px}
.inode.isroot{border-left-color:var(--accent)}
.ihd{font-weight:800;color:var(--text);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.il{display:flex;gap:10px;padding:1px 0}
.ik{color:var(--muted);min-width:82px}
.iv{color:var(--text)}
.ic{color:var(--faint);font-size:11px}
/* ---- Container scene: ONE node with children. A slot is an address, so there is
       nothing to draw for an empty one — only the children exist. ---- */
.cbox{position:relative;border:1px solid var(--border-2);border-radius:12px;background:var(--code-bg)}
.kid{position:absolute;border-radius:6px;border:1px solid #cdd7de;background:linear-gradient(150deg,#fff,#eef4f8);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:#2e3438;
  transition:left .16s,top .16s,transform .16s;box-shadow:0 4px 10px -4px rgba(20,30,40,.35)}
:root[data-theme="dark"] .kid{background:linear-gradient(150deg,#2b2f31,#212425);border-color:#3a3f42;color:#c9cdcf}
@media(prefers-color-scheme:dark){.kid{background:linear-gradient(150deg,#2b2f31,#212425);border-color:#3a3f42;color:#c9cdcf}}
.kid.phantom{background:none;border:1px dashed var(--accent);box-shadow:none}
.kid.lift{box-shadow:0 14px 26px -8px rgba(20,30,40,.5);z-index:5}
.armring{position:absolute;inset:4px;border:2px dashed var(--accent);border-radius:10px;pointer-events:none}
.overbadge{position:absolute;right:8px;bottom:8px;background:var(--accent);color:#fff;border-radius:20px;
  padding:2px 9px;font-family:var(--mono);font-size:11px;font-weight:800}
.el .corner{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;
  border-width:0 26px 26px 0;border-color:transparent var(--border-2) transparent transparent;
  border-top-right-radius:12px;display:none}
.el.flip .corner{display:block}
.el .val{position:absolute;top:8px;left:10px;font-size:22px;font-weight:800;font-family:var(--sans);display:none}
.el .val.suit{bottom:8px;left:auto;right:10px;top:auto;font-size:16px}
.el.valued .val{display:block}
.el .label{position:absolute;bottom:10px;left:0;right:0;font-family:var(--sans);font-weight:700;
  font-size:12px;color:var(--text);display:none}
.el.labeled .label{display:block}
.el .eye{position:absolute;top:7px;right:9px;font-size:13px;display:none}
.el.private .eye{display:block}
.el.action{outline:2px solid var(--accent);outline-offset:2px}
.el .slots{position:absolute;inset:14px;display:none;grid-template-columns:1fr 1fr;gap:6px}
.el.container .slots{display:grid}
.el .slots i{border:1px dashed var(--border-2);border-radius:5px}
.elcaption{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;max-width:560px}
.elcaption b{color:var(--text)}
.activeatoms{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:400px}

/* ============ MOBILE — Storybook-style single column + bottom sheet ============ */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  /* sidebar → full-height slide-in overlay */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:330px;z-index:60;
    transform:translateX(-106%);transition:transform .22s ease;box-shadow:8px 0 40px rgba(0,0,0,.28)}
  .sidebar.open{transform:none}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.on{opacity:1;pointer-events:auto}
  .main{padding-bottom:54px}
  .toolbar{position:sticky;top:0;z-index:20}
  /* addons → bottom sheet */
  .addons{position:fixed;left:0;right:0;bottom:54px;top:auto;height:72vh;height:72dvh;
    max-height:72vh;max-height:72dvh;z-index:55;display:flex;flex-direction:column;overflow:hidden;
    transform:translateY(112%);transition:transform .24s ease;border-radius:14px 14px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,.28)}
  .addons.sheet-open{transform:none}
  .sheet-handle{display:grid;place-items:center;height:24px;cursor:pointer;flex:0 0 auto}
  .sheet-handle::before{content:"";width:42px;height:4px;border-radius:3px;background:var(--border-2)}
  .addons-tabs{flex:0 0 auto}
  /* explicit height so Safari doesn't zero a flex child inside a fixed column */
  .addons-body{flex:none;height:calc(72vh - 66px);height:calc(72dvh - 66px);
    overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
  /* bottom navigation bar */
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;height:54px;z-index:58;
    background:var(--panel);border-top:1px solid var(--border);align-items:center;padding:0 10px;gap:8px}
  .mobilebar button{flex:0 0 auto;border:1px solid var(--border-2);background:var(--panel);
    color:var(--text);border-radius:8px;padding:8px 13px;font:inherit;font-weight:700;
    display:flex;align-items:center;gap:6px;cursor:pointer}
  .mobilebar .prim{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mobilebar .title{flex:1;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docs{padding:26px 18px 90px}
  .grid2{grid-template-columns:1fr}
}
</style>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sb-brand"><span class="logo">🃏</span>game-kit <small>catalog</small></div>

<script>
// ============================================================
//  TREE — the whole catalog (plan structure) so the sidebar
//  reads like a real Storybook. ONE story is fully authored as
//  the blueprint: Elements/Core/Element.
// ============================================================
const TREE = [
  // Read top to bottom: it is a ladder, not a table of contents. Start explains what the
  // world is made of; Atoms adds one capability at a time; Elements shows assemblies.
  ["Start", [
    ["Basics", ["Node ◆","Root ◆"]],
  ]],
  ["Atoms", [
    ["Place",  ["Bounded ◆","Transformable","Tiltable","Oriented","Placeable"]],
    ["Look",   ["Surfaced ◆","Skinnable","ShadowCaster"]],
    ["Act",    ["Draggable","Flippable","Spinnable","Actionable","Focusable","Grip"]],
    ["Hold",   ["Container ◆","Acceptor"]],
    ["Data",   ["Valued","Labeled","Owned","Private"]],
    ["Root-only", ["Lit","Viewable","Seated"]],
  ]],
  ["Elements", [
    ["Assembled", ["Card","Piece","Chip","Bottle","Zone","Button"]],
    ["Controls",  ["Text","Icon","Toggle","Input","Indicator","Menu"]],
    ["Set",       ["Catalog","Skin","Box","Reconcile","Merge","Sort"]],
  ]],
  ["Canvas", [
    ["Surface", ["Tabletop","Zone override"]],
    ["Camera",  ["Pan-zoom-rotate","Auto-fit","Viewpoints","Gesture arbitration"]],
    ["Frames",  ["Orientation & light"]],
    ["Seats",   ["Seating","Viewpoint per seat"]],
  ]],
  ["HUD", [
    ["Regions", ["Edge docks","Safe-area","Relocation","Pins"]],
  ]],
];

const SCENES = {
  "Start/Basics/Node ◆": "Node",
  "Start/Basics/Root ◆": "Root",
  "Atoms/Place/Bounded ◆": "Bounded",
  "Atoms/Look/Surfaced ◆": "Surfaced",
  "Atoms/Hold/Container ◆": "Container",
};
const RICH = "Start/Basics/Node ◆";

// ---- render sidebar ----
const tree = document.getElementById("tree");
let html = "";
for (const [root, groups] of TREE){
  html += `<div class="root">📦 ${root}</div>`;
  for (const [grp, stories] of groups){
    html += `<div class="grp">📁 ${grp}</div>`;
    for (const st of stories){
      const path = `${root}/${grp}/${st}`;
      const rich = path in SCENES;
      html += `<button class="story ${rich?'on':''}" data-path="${path}">`+
        `<span class="ic">${rich?'◆':'▪'}</span>${st.replace(' ◆','')}`+
        `${rich?'<span class="dot"></span>':''}</button>`;
    }
  }
}
tree.innerHTML = html;
tree.addEventListener("click", e=>{
  const b = e.target.closest(".story"); if(!b) return;
  document.querySelectorAll(".tree .story").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  setSidebar(false);                         // mobile: pick a story → close the overlay
  const name = b.dataset.path.split("/").pop().replace(" ◆","");
  document.getElementById("mbTitle").textContent = name;
  const s = SCENES[b.dataset.path];
  if(!s) stub(b.dataset.path);
  else {
    scene = s; curAd = 0;
    // The Container scene is ABOUT the atom, so the atom is on. Bounded comes with it:
    // a container without a box has children and no frame to lay them out in.
    // Each rung of the ladder turns on exactly its own atom — that is what it is about.
    if(s === "Bounded")   state.bounded = true;
    if(s === "Surfaced"){ state.bounded = true; state.surfaced = true; }
    if(s === "Container"){ state.container = true; state.surfaced = true; }
    mount();
  }
});

// ============================================================
//  Node / Element — the two load-bearing scenes.
//
//  THREE PLANES (CANONS.md §"Три ПЛОСКОСТИ стори"), never mixed into one list:
//    Spec   — atom fields. The ONLY thing that is a control.
//    State  — what HAPPENS to the thing. Cannot be authored, so it is not an arg.
//    Viewer — how the onlooker looks. Never travels the wire.
//
//  `Element` is not a type and not a subclass: it is the PREDICATE "a Node that has
//  Bounded". Switching Bounded off does not grey anything out — the atoms that stood on
//  it disappear together with their fields.
//
//  Two names that are easy to get wrong:
//    Surfaced — the atom that DRAWS a face (`surface` = a registry record).
//    Viewable — the CAMERA atom. It belongs to a root, never to an element.
// ============================================================

// [key, name, requires, what it grants]
const ATOMS = [
  ["bounded","Bounded",null,"the box: hit area, layout slot and shadow silhouette are measured from it. Draws NOTHING by itself."],
  ["transformable","Transformable",null,"at · z — where it sits and how high above the table."],
  ["tiltable","Tiltable","transformable","angle — its own tilt. Truth, the same for everyone."],
  ["oriented","Oriented",null,"orientation: world | viewer. Not set → taken from the owner."],
  ["placeable","Placeable","bounded","can be put INTO a container: needs a footprint to occupy a slot."],
  ["surfaced","Surfaced",["bounded","container"],"a registry record draws the face. Frame, fill, radius, colour live IN the record + theme tokens."],
  ["skinnable","Skinnable","surfaced","skin is a VALUE on the element; a reskin rewrites it."],
  ["shadowcaster","ShadowCaster","bounded","casts a shadow. Direction, lift and who-casts belong to others."],
  ["draggable","Draggable","bounded","can be picked up; flies home when the acceptor says no."],
  ["flippable","Flippable","surfaced","far side: back / same / mirror / alt."],
  ["spinnable","Spinnable","bounded","spins with a random outcome (a bottle)."],
  ["private","Private",null,"excluded from another viewer's picture ENTIRELY — not merely face-down."],
  ["valued","Valued",null,"typed values the rules read off it."],
  ["labeled","Labeled",null,"a locale key, never raw text."],
  ["owned","Owned",null,"remembers its box — recall of one's own, reconcile."],
  ["container","Container",null,"holds children at slot-addresses. A canvas is exactly this."],
  ["acceptor","Acceptor","container","decides who is let in — an AcceptRule as data."],
  ["actionable","Actionable","bounded","responds to a press."],
  ["focusable","Focusable","bounded","takes focus; operable without a pointer."],
];
const state = Object.fromEntries(ATOMS.map(a=>[a[0],false]));

// SCENE: "Node" hides Bounded and everything that stands on it — that IS the difference.
let scene = "Element";

// ---- PLANE 2: State. Only rest/lifted/held can be authored (`pose`); the rest happen.
const WHERE = ["rest","lifted","held","drag","flying","settling"];
const AUTHORABLE = new Set(["rest","lifted","held"]);
const FLAGS = ["selected","focused","concealed","frozen"];
let where = "rest";
const flags = Object.fromEntries(FLAGS.map(f=>[f,false]));
// Breathing is a SEPARATE axis from pose: it is decoration, it never feeds z — otherwise
// the shadow breathes in size under a thing that is not actually moving (client2 elevation.ts:21).
let idleOn = false;

// ---- PLANE 3: Viewer. Nothing here is state and nothing travels.
let viewer = "owner";                 // owner | other — without it Private is undemonstrable
let hudUnit = 46;                     // the HUD etalon in px; the user may override it
const LAYERS = { hit:false, box:true, silhouette:false, at:false, zladder:false, slots:false };
const LAYER_LABEL = { hit:"hit area", box:"footprint box", silhouette:"silhouette",
                      at:"point at", zladder:"z ladder", slots:"slots" };

// ---- The OWNER node: an ordinary node with ordinary field names. There is no `parent.*`
//      in the model — these are another node's fields, shown so inheritance is visible.
const owner = { angle:0, z:0, orientation:"world" };

// A minimal element to open on: a place that draws something and casts a shadow.
["bounded","transformable","surfaced","shadowcaster"].forEach(k=>state[k]=true);

let actions = [];

// ---- Per-atom arguments: an atom that carries configuration reveals its
//      controls when it is on. `req` marks an argument the atom cannot omit.
const ATOM_ARGS = {
  bounded: [
    ["shape","shape",true,["rect","circle","poly"],
      "a footprint is not always a rectangle — an air-hockey puck is a circle, a board piece may be a polygon"],
    ["size","size",true,["1 × 1","1 × 1.4","1 × 1.7","2.5 × 3.5","2.8 × 4"],
      "the element's OWN size, in units. Default comes stamped from the set record at birth"],
    ["bounds","bounds?",false,["— (equals size)","tighter · 0.8×","looser · 1.2×"],
      "an instance override of size. Not set → size is used; this is the only way one card differs from its record"],
  ],
  surfaced: [
    ["record","surface record",true,["cardFace","chipFace","pieceGlyph","discFace","zonePlate","buttonPlate"],
      "WHICH registry record draws it — the only argument. Its params (frame, fill, radius) live in the record + theme, never as fields"],
    ["fit","fit",false,["contain","cover","repeat","original","fitX","fitY"],
      "how the surface fills the box when the art's proportion differs from the size"],
    ["align","align",false,["center","top","bottom","left","right"],
      "where it sits inside the box once fitted"],
  ],
  transformable: [
    ["z","z",false,["0 — resting","1 — lifted","2 — dragged","3 — over everything"],
      "z is the SOURCE; lift, scale and the shadow are its CONSEQUENCES. Adds up the tree. Stack thickness is layout, not z"],
    ["at","at",false,["resolved by the owner's layout (derive)","kept pose — travels the wire (keep)","stamped by the zone (stamp)"],
      "in a container position is not authored: the layout resolves it. Only a `keep` pose puts `at` on the wire"],
  ],
  tiltable: [
    ["angle","angle (own)",false,["0°","15°","45°","90°"],
      "the element's OWN tilt — truth, shared by everyone. Adds up the tree; the shadow does NOT inherit it"],
    ["snap","snap",false,["none","15°","45°","90°"],
      "where the tilt settles when released"],
  ],
  oriented: [
    ["orientation","orientation",false,["— (inherit from owner)","world","viewer"],
      "world: turned relative to the TABLE. viewer: always 0° to your camera (a billboard). Not set → the owner's value"],
  ],
  skinnable: [
    ["skin","skin",false,["classic","gilded","pixel"],
      "a VALUE on the element, not a type: a reskin rewrites it and touches no entity"],
  ],
  shadowcaster: [
    ["from","from",true,["footprint","silhouette"],
      "a knight needs its CONTOUR, a card is happy with its box. Footprint ≠ silhouette, and both are needed"],
    ["_dir","direction",false,null,
      "root only — <code>Lit{ light: world | viewer }</code>. One light per table; per-element light does not exist"],
    ["_lift","lift · scale",false,null,
      "consequences of <code>z</code> (elevation law). Zoom is not height, and never derives lift"],
    ["_cast","who casts",false,null,
      "<code>cast: group | each</code> — a parameter of the owner's layout"],
  ],
  spinnable: [
    ["turns","turns",false,["1–3","2–5","5–12"],
      "the random outcome is the point: a bottle, a wheel"],
  ],
  owned: [
    ["box","box",true,["box:d1","box:d2"],
      "which owned instance it came from. Two boxes of the same set are DIFFERENT boxes: this is what recalls one's own"],
  ],
  focusable: [],
  placeable: [],
  acceptor: [
    ["accept","accept",true,["anything","only-cards","only-checkers","chesslike","nothing"],
      "a rule over the incoming element's traits + state — one mechanism for zone, container and drop"],
  ],
  draggable: [
    ["trail","trail",false,["none","ink trail"],
      "the seed of 'a pen that writes while dragging' — off for cards, on for a marker"],
    ["onReject","on reject",false,["fly home","stay where dropped"],
      "what happens when the acceptor says no; flying home is what makes an optimistic drop reversible"],
  ],
  flippable: [
    ["reverse","reverse",true,["back","same","mirror","alt"],
      "back = hidden (cards) · same (chips) · mirror (chess) · alt = other visible face (checker→king)"],
    ["axis","axis",false,["y (left↔right)","x (top↔bottom)"],
      "which way the 180° turn goes"],
  ],
  private: [
    ["access","access",false,["owner only","named viewers","table"],
      "who the element is projected to; everyone else never receives it"],
  ],
  valued: [
    ["vocab","values",true,["rank + suit","denomination","custom keys"],
      "the vocabulary rules read off the element — not free text"],
  ],
  labeled: [
    ["key","locale key",true,["element.button","zone.hand","action.deal"],
      "a key into the locale table, never a raw string"],
  ],
  actionable: [
    ["command","on press",true,["ready","deal","clearPlay","custom…"],
      "the command emitted when pressed; absent atom → no press at all"],
  ],
  // Fields are exactly the canon block (CANONS.md §"Контейнер"). Note what is NOT here:
  // `interactive` was one of four names for `grab`; `cast` belongs to the layout registry
  // entry (place + indexAt + cast), because who casts is known by whoever placed them.
  container: [
    ["layout","layout",true,["deckStack","fan","row","grid","free"],
      "a registry entry: place(i,n,ctx) → pose AND indexAt(point,n,ctx) → i. Both directions, because only the layout knows its geometry"],
    ["hot","hot?",false,["— (silent)","phantom","lift","arm"],
      "the answer under the finger. NO FIELD = the container says nothing"],
    ["maxGaps","· maxGaps",false,["3 then a badge","1","none"],
      "a SHOW limit, not a capacity: a zone may accept twenty and draw three. Capacity is a rule"],
    ["grab","grab?",false,["— (nothing leaves)","one","top","above"],
      "the single question: what leaves from under the finger. No `split` — that difference lives in carry and in the target"],
    ["intent","intent?",false,["— (plain drag)","swipe = shuffle"],
      "how a gesture over this container is READ before anything moves"],
    ["occupied","occupied?",false,["reject","capture","merge","swap"],
      "what becomes of whoever already sits in the slot. NOT the AcceptRule's business — the rule only says who may enter"],
    ["keeps","keeps?",false,["— (everything allowed)","drag only","flip only"],
      "which of a child's capabilities work INSIDE. No field = all; the shape mirrors `bounds` — presence narrows"],
    ["facing","facing?",false,["— (inherit)","own:up · others:same","own:down · others:back"],
      "one facet of the pose, not a family of its own"],
  ],
};
// arg state: default = the first option of each arg (read-only rows carry no options)
const argState = {};
for(const [atom,args] of Object.entries(ATOM_ARGS))
  for(const a of args) if(a[3]) argState[atom+"."+a[0]] = a[3][0];

// NO PRESETS HERE. Card / Piece / Chip / Zone / Button live in Elements/Assembled/*.
// A preset in the base scene teaches "compose like a card" instead of teaching to compose.

const ATOM = k => ATOMS.find(a=>a[0]===k);
// A requirement says what an atom LACKS, not who its parent in a hierarchy is — so it can be
// an ALTERNATIVE. Surfaced needs an AREA, and an area comes either from an own size (Bounded)
// or from the extent of the content (Container). That is why a canvas can be Surfaced with no
// Bounded at all; demanding Bounded here would outlaw the tabletop.
const reqOf = k => { const r = ATOM(k)?.[2]; return r == null ? [] : (Array.isArray(r) ? r : [r]); };
const reqLabel = k => reqOf(k).map(r=>ATOM(r)[1]).join(" or ");
// An atom exists only if its requirements are satisfied — ANY of the alternatives is enough.
// Missing → the atom is ABSENT with its fields, not disabled: negation flags do not exist.
function has(k){
  if(!state[k]) return false;
  if(!inScene(k)) return false;
  const req = reqOf(k);
  return req.length === 0 || req.some(has);
}
// Which atoms this rung of the ladder is allowed to show at all.
function inScene(k){
  if(scene === "Node")    return !dependsOn(k,"bounded") && !dependsOn(k,"container");
  if(scene === "Bounded") return !dependsOn(k,"surfaced") && k !== "surfaced";
  return true;
}
// Does k stand on `root`, directly or through a chain (following ANY alternative)?
function dependsOn(k, root){
  if(k === root) return true;
  return reqOf(k).some(r=>dependsOn(r, root));
}
// Toggled on by the author but silently absent because a requirement is off.
const starved = k => state[k] && !has(k) && inScene(k);

function caps(){
  return ATOMS.filter(a=>has(a[0])).map(a=>{
    const req = (ATOM_ARGS[a[0]]||[]).find(x=>x[2] && x[3]);
    return req ? `${a[1]}(${argState[a[0]+"."+req[0]]})` : a[1];
  });
}

// ---- RESOLVE. Inherited values are NOT stored on the node and never travel: they come
//      from the context that walks down the tree, and they are read AT APPLY TIME.
//      Four classes, and there is no fifth (CANONS.md §"Поля: типы, единицы и класс наследования").
function resolve(){
  const own = {
    z:     has("transformable") ? parseInt(argState["transformable.z"]) : 0,
    angle: has("tiltable")      ? parseInt(argState["tiltable.angle"])  : 0,
    orientation: has("oriented") ? argState["oriented.orientation"] : "— (inherit from owner)",
  };
  const inheritedOrientation = own.orientation.startsWith("—");
  return {
    z:     { value: own.z + owner.z, own: own.z, from: owner.z, cls:"adds up" },
    angle: { value: own.angle + owner.angle, own: own.angle, from: owner.angle, cls:"adds up" },
    orientation: { value: inheritedOrientation ? owner.orientation : own.orientation,
                   inherited: inheritedOrientation, cls:"from owner" },
    unit:  { value: hudUnit, cls:"root only" },
  };
}

// Footprint in screen px — from the element's OWN size field times the etalon. Never a constant.
function footprintPx(){
  if(!has("bounded")) return null;
  const [w,h] = argState["bounded.size"].split("×").map(s=>parseFloat(s));
  const k = argState["bounded.bounds"].startsWith("tighter") ? 0.8
          : argState["bounded.bounds"].startsWith("looser")  ? 1.2 : 1;
  const src = k === 1 ? `size ${w}×${h} unit × ${hudUnit}px`
                      : `bounds ${k}× overrides size ${w}×${h} unit`;
  return { w: w*hudUnit*k, h: h*hudUnit*k, shape: argState["bounded.shape"], src };
}

function conflicts(){
  const n = [];
  // A starved atom is the loudest thing the story can say: it was asked for and is not there.
  ATOMS.filter(a=>starved(a[0])).forEach(a=>
    n.push(["bad",`${a[1]} needs ${reqLabel(a[0])} — without it the atom does not exist at all (not "disabled").`]));
  if(has("draggable") && !has("placeable")) n.push(["warn","Draggable without Placeable — it can be picked up but no container will take it."]);
  if(has("valued") && !has("surfaced")) n.push(["warn","Valued without Surfaced — values exist but are invisible; rules still read them."]);
  if(has("private") && !has("surfaced")) n.push(["warn","Private without a face — nothing to withhold."]);
  if(has("shadowcaster") && !has("transformable")) n.push(["warn","ShadowCaster without Transformable — z lives there; with no z the shadow can never lift."]);
  if(has("bounded") && !has("surfaced")) n.push(["ok","Bounded without Surfaced: a place that draws NOTHING. Turn on a debug layer to see it — that is the point."]);
  if(!caps().length) n.push(["warn","No atoms — a bare Node: an id and a place in the tree. That is VALID."]);
  return n;
}

// One short line each, capped: the canvas belongs to the node, not to prose.
function argInsights(){
  const out = [], r = resolve();
  if(has("flippable")) out.push(({
    "back":"reverse: back — the FACE is hidden; the thing itself is still on the table for everyone",
    "same":"reverse: same — both sides identical: flipping shows nothing new",
    "mirror":"reverse: mirror — the far side is the mirror image",
    "alt":"reverse: alt — the far side is a DIFFERENT visible face",
  })[argState["flippable.reverse"]]);
  if(has("private")) out.push(`Private — the node is absent from the other viewer's picture entirely. Switch viewer to see.`);
  if(has("transformable") || has("tiltable"))
    out.push(`z ${r.z.own}+${r.z.from}=${r.z.value} · angle ${r.angle.own}°+${r.angle.from}°=${r.angle.value}° — both ADD up the tree`);
  if(has("shadowcaster")) out.push(`shadow from ${argState["shadowcaster.from"]} — silhouette turns with the angle, the offset does not`);
  if(scene === "Node") out.unshift("nothing is drawn, and nothing is missing — a node is an id and a place. Open the inspector to see it");
  if(scene === "Container"){
    out.length = 0;   // in this scene the container's own laws are what matters
    const L = LAYOUTS[argState["container.layout"]];
    out.push(`ONE node with ${kids} children — a slot is an ADDRESS, so an 8×8 board is one node, not 64`);
    out.push(`cast <b>${L.cast}</b> — ${L.cast==="group"?"the pile casts a single silhouette":"every child casts its own"}; the layout knows, because the layout placed them`);
    if(argState["container.grab"].startsWith("—"))
      out.push(`no <b>grab</b> → nothing leaves from under the finger, and the gesture passes UP the tree by itself — a draught follows, it is not declared`);
    else out.push(`grab <b>${argState["container.grab"]}</b> — the carry inherits the SOURCE layout, and what happens to it is the TARGET's occupied/accept`);
  }
  return out.filter(Boolean).slice(0,3);
}
// ============================================================
//  LAYOUT REGISTRY — the contract runs BOTH ways:
//    place(i, n, box)      → where child i rests
//    indexAt(pt, n, box)   → which index a point means
//  The inverse is not a convenience: only the layout knows its own geometry, and a fan
//  answers differently from a row. `cast` lives here too — who casts the shadow is known
//  by whoever placed them, so it is a property of the layout, not a field of the container.
// ============================================================
const CELL = { w: 34, h: 48 };
const LAYOUTS = {
  // Thickness is expressed through `at` — NEVER through z. Putting a card on the pile
  // must not move the shadow one pixel.
  deckStack: { cast:"group", addr:"none",
    place:(i,n,b)=>({ x: b.w/2 + i*1.1, y: b.h/2 - i*1.3, rot:0 }),
    indexAt:()=> Math.max(0,0) },                       // a pile answers with its top only
  fan: { cast:"each", addr:"after",
    place:(i,n,b)=>{ const spread=Math.min(26, 150/Math.max(1,n)); const c=(n-1)/2;
      const a=(i-c)*spread*0.06; return { x:b.w/2+(i-c)*spread, y:b.h/2+Math.abs(i-c)*3, rot:a*18 }; },
    indexAt:(p,n,b)=>{ const spread=Math.min(26,150/Math.max(1,n)); const c=(n-1)/2;
      return clampIx(Math.round((p.x-b.w/2)/spread + c), n); } },
  row: { cast:"each", addr:"after",
    place:(i,n,b)=>{ const step=Math.min(CELL.w+6, (b.w-16)/Math.max(1,n)); const c=(n-1)/2;
      return { x:b.w/2+(i-c)*step, y:b.h/2, rot:0 }; },
    indexAt:(p,n,b)=>{ const step=Math.min(CELL.w+6,(b.w-16)/Math.max(1,n)); const c=(n-1)/2;
      return clampIx(Math.round((p.x-b.w/2)/step + c), n); } },
  grid: { cast:"each", addr:"coord",
    place:(i,n,b)=>{ const cols=4, cw=b.w/cols, ch=CELL.h+8;
      return { x: (i%cols)*cw + cw/2, y: Math.floor(i/cols)*ch + ch/2 + 6, rot:0 }; },
    indexAt:(p,n,b)=>{ const cols=4, cw=b.w/cols, ch=CELL.h+8;
      return clampIx(Math.floor(p.y/ch)*cols + Math.min(cols-1,Math.floor(p.x/cw)), n); } },
  // The only layout a child can escape from — so clamping is a parameter HERE, not a
  // field on the container (four layouts out of five have nothing to clamp).
  free: { cast:"each", addr:"none",
    place:(i,n,b)=>({ x: 30 + ((i*67)%Math.max(1,b.w-60)), y: 28 + ((i*43)%Math.max(1,b.h-56)), rot:(i*37)%40-20 }),
    indexAt:()=> -1 },
};
const clampIx = (i,n)=> Math.max(0, Math.min(n, i));

// Children are STATE, not spec — so they live in the State plane, next to the drag payload.
let kids = 5;        // how many children the container holds
let payload = 0;     // the drag load hovering over it: a LIST of 1..M, never a single card
let hoverIx = null;  // where indexAt says the finger is

// ============================================================
//  inspect(root, ctx) — the ONE door the inspector goes through.
//  The panel never reaches into engine internals and never writes its own tree walk:
//  that is a guaranteed drift. It is a pure function over the same data the renderer
//  uses, so a guard can assert the panel shows nothing the model does not have.
// ============================================================
function inspect(){
  const r = resolve();
  const own = [], derived = [];
  if(has("bounded")){
    own.push(["size", argState["bounded.size"] + " unit", "own"]);
    if(!argState["bounded.bounds"].startsWith("—")) own.push(["bounds", argState["bounded.bounds"], "own · overrides size"]);
    own.push(["shape", argState["bounded.shape"], "own"]);
  }
  if(has("surfaced")){
    own.push(["surface", '"'+argState["surfaced.record"]+'"', "own"]);
    own.push(["fit", argState["surfaced.fit"], "from owner"]);
  }
  if(has("container")) own.push(["layout", argState["container.layout"], "own"]);
  if(has("owned")) own.push(["box", argState["owned.box"], "own"]);
  derived.push(["z", r.z.value, `own ${r.z.own} + owner ${r.z.from}`, r.z.cls]);
  derived.push(["angle", r.angle.value+"°", `own ${r.angle.own}° + owner ${r.angle.from}°`, r.angle.cls]);
  derived.push(["orientation", r.orientation.value, r.orientation.inherited?"← owner":"set here", r.orientation.cls]);
  const fp = footprintPx();
  derived.push(["at", fp?"centred":"—", "← the owner's layout (derive · not sent)", "derive"]);

  const node = { id:"node:a3f", atoms: caps(), own, derived,
                 starved: ATOMS.filter(a=>starved(a[0])).map(a=>`${a[1]} (needs ${reqLabel(a[0])})`),
                 state: { where, idle:idleOn, flags:FLAGS.filter(f=>flags[f]) },
                 children: scene==="Container" ? kids : 0 };
  // A root is a node that nobody places: no Placeable, and it cannot have one.
  const rootNode = { id:"CanvasRoot", atoms:["Container(center)"], own:[["layout","center","own"]],
                     derived:[["extent","from content","derived — a root has no size of its own"]],
                     starved:[], state:{}, children: 1, isRoot:true };
  return scene === "Root"
    ? [rootNode, { id:"node:b71", atoms:[], own:[], derived:[], starved:[], state:{}, children:0 },
                 { id:"node:c02", atoms:["Bounded(rect)"], own:[["size","1 × 1 unit","own"]], derived:[], starved:[], state:{}, children:0 }]
    : [rootNode, node];
}

function logAct(ev, pl){ actions.unshift([ev,pl]); if(actions.length>40)actions.pop(); if(curAd===1)paintAddon(); }

function elMock(){
  const r = resolve();
  // PLANE 3 first: Private means the node is ABSENT from the other viewer's picture. Not
  // face-down, not dimmed — gone. This is the only way to tell it apart from reverse:back.
  if(has("private") && viewer === "other")
    return `<div class="elbox" style="width:220px;height:120px;border:1px dashed var(--border-2);
      border-radius:12px;display:grid;place-items:center;color:var(--faint);font-family:var(--mono);
      font-size:11px;text-align:center;padding:10px">Private · viewer = other<br>the node is not in this
      picture at all<br>(not face-down — absent)</div>
    <div class="derived">nothing is sent to this viewer</div>`;

  const cls = ["el"];
  cls.push(has("surfaced") ? "faced" : "bare");
  if(has("draggable")) cls.push("drag");
  if(has("flippable")) cls.push("flip");
  if(has("valued")) cls.push("valued");
  if(has("labeled")) cls.push("labeled");
  if(has("private")) cls.push("private");
  if(has("actionable")) cls.push("action");
  if(has("container")) cls.push("container");
  if(flags.selected) cls.push("sel");

  const fp = footprintPx();
  // No Bounded → the node has no size of its own. It still EXISTS: a place in the tree.
  const box = fp ? `width:${fp.w}px;height:${fp.h}px` : `width:120px;height:78px`;
  const radius = fp && fp.shape === "circle" ? "border-radius:50%;" : "";
  const ang = r.angle.value, z = r.z.value;

  // Everything below is a CONSEQUENCE of z — the elevation law, in one place.
  const lift  = z * 6;
  const scale = 1 + z * 0.03;
  const inner = has("container")
    ? `<div class="slots"><i></i><i></i><i></i><i></i></div>`
    : (!has("surfaced") ? (has("bounded") ? "" : "node<br>· id ·") : "");

  // Shadow: silhouette from the footprint, offset from the root light (viewer frame here —
  // a constant screen offset), size and blur from z. A SIBLING, never a child of the
  // rotated node, so it does not inherit the rotation.
  const silhouette = has("shadowcaster") && argState["shadowcaster.from"] === "silhouette";
  const shadow = (has("shadowcaster") && fp) ? `<div class="elshadow" style="
      width:${fp.w}px;height:${fp.h}px;${radius}
      ${silhouette ? `transform:translate(${4+z*3}px,${5+z*4}px) scale(${scale}) rotate(${ang}deg);`
                   : `transform:translate(${4+z*3}px,${5+z*4}px) scale(${scale});`}
      filter:blur(${5+z*4}px);opacity:${0.32 - z*0.04};"></div>` : "";

  // Debug layers — the viewer's plane. The node knows nothing about them.
  const L = [];
  if(LAYERS.box && fp) L.push(`<div class="dbg dbg-box" style="${box};${radius}"></div>`);
  if(LAYERS.hit && fp) L.push(`<div class="dbg dbg-hit" style="width:${fp.w+16}px;height:${fp.h+16}px;${radius}"></div>`);
  if(LAYERS.silhouette && fp) L.push(`<div class="dbg dbg-sil" style="width:${fp.w*0.72}px;height:${fp.h*0.88}px;${radius}"></div>`);
  if(LAYERS.at) L.push(`<div class="dbg dbg-at"></div>`);
  if(LAYERS.zladder) L.push(`<div class="dbg dbg-z" style="height:${Math.max(2,lift)}px"></div>`);
  if(LAYERS.slots && has("container")) L.push(`<div class="dbg dbg-slots" style="${box}"></div>`);

  return `<div class="elbox" style="${box}">
    ${shadow}
    <div class="${cls.join(' ')}" style="${box};${radius}transform:translateY(${-lift}px) rotate(${ang}deg) scale(${scale})">
      <span class="corner"></span>
      <span class="val">7</span><span class="val suit">♠</span>
      <span class="eye">🚫</span>
      <span class="label">label</span>
      ${inner}
    </div>
    ${L.join('')}
  </div>
  <div class="derived">footprint: <b>${fp ? `${Math.round(fp.w)}×${Math.round(fp.h)} px · ${fp.shape} — ${fp.src}`
    : "none — no Bounded. This is a Node, not an Element."}</b></div>`;
}

// The Container scene: the first one with MORE THAN ONE node. Everything the two base
// scenes could only fake — a real owner, `at` resolved by a layout, phantoms — is real here.
function containerMock(){
  const L = LAYOUTS[argState["container.layout"]];
  const box = { w: 300, h: 180 };
  const hot = argState["container.hot"];
  const maxGaps = argState["container.maxGaps"].startsWith("3") ? 3
                : argState["container.maxGaps"] === "1" ? 1 : 0;
  // Spreading is not a mechanic and not an animation: the container simply lays out n+m and
  // the phantoms stand at indexAt(finger). The springs are a consequence, not a feature.
  const shown = Math.min(payload, maxGaps);
  const over  = payload - shown;
  const n = kids + (hot === "phantom" ? shown : 0);
  const ix = hoverIx === null ? null : clampIx(hoverIx, kids);

  const cells = [];
  for(let i=0, k=0; i<n; i++){
    const isPhantom = hot === "phantom" && ix !== null && i >= ix && i < ix + shown;
    const p = L.place(i, n, box);
    const lifted = hot === "lift" && ix === i;
    cells.push(`<div class="kid ${isPhantom?'phantom':''} ${lifted?'lift':''}" style="
      left:${p.x}px;top:${p.y}px;width:${CELL.w}px;height:${CELL.h}px;
      transform:translate(-50%,-50%) rotate(${p.rot}deg) scale(${lifted?1.12:1})">${isPhantom?'':(++k)}</div>`);
  }
  const armed = hot === "arm" ? `<div class="armring"></div>` : "";
  const badge = over > 0 ? `<div class="overbadge">+${over}</div>` : "";

  return `<div class="cbox" id="cbox" style="width:${box.w}px;height:${box.h}px">
      ${armed}${cells.join('')}${badge}
    </div>
    <div class="derived">
      layout <b>${argState["container.layout"]}</b> · cast <b>${L.cast}</b> ·
      slot address <b>${L.addr === "coord" ? "coordinate (e4)" : L.addr === "after" ? "neighbour (after: id)" : "none"}</b><br>
      indexAt(finger) = <b>${ix === null ? "— move the pointer over the box" : ix}</b> ·
      children <b>${kids}</b> (state) · payload <b>${payload}</b>${over>0?` · ${shown} gaps drawn, ${over} behind a badge`:""}
    </div>`;
}

function renderCanvas(){
  const notes = conflicts();
  const capList = caps();
  stage.innerHTML = `
    <div class="canvas-wrap">
      <div class="stagearea">
        ${scene === "Container" ? containerMock() : elMock()}
        <div class="activeatoms">
          ${capList.length? capList.map(c=>`<span class="tag core">${c}</span>`).join('')
            : `<span class="tag">Element { id } — and nothing else</span>`}
        </div>
        <div class="elcaption">
          ${notes.length
            ? notes.map(x=>`<div style="color:var(--${x[0]==='bad'?'bad':'warn'})">▲ ${x[1]}</div>`).join('')
            : `<b>Valid composition.</b> The element can do exactly what its atoms add — no more, no less.`}
          ${argInsights().map(t=>`<div style="color:var(--muted)">· ${t}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="addons${sheetOpen?' sheet-open':''}">
      <div class="sheet-handle" id="sheetHandle"></div>
      <div class="addons-tabs">
        <button class="ad-tab ${curAd===6?'on':''}" data-ad="6">Inspector <span class="badge">${inspect().length}</span></button>
        <button class="ad-tab ${curAd===0?'on':''}" data-ad="0">Controls <span class="badge">${ATOMS.filter(a=>inScene(a[0])).length+ATOMS.filter(a=>has(a[0])).reduce((s,a)=>s+((ATOM_ARGS[a[0]]||[]).length),0)}</span></button>
        <button class="ad-tab ${curAd===4?'on':''}" data-ad="4">State</button>
        <button class="ad-tab ${curAd===5?'on':''}" data-ad="5">Derived</button>
        <button class="ad-tab ${curAd===1?'on':''}" data-ad="1">Actions <span class="badge">${actions.length}</span></button>
        <button class="ad-tab ${curAd===2?'on':''}" data-ad="2">Interactions</button>
        <button class="ad-tab ${curAd===3?'on':''}" data-ad="3">Elsewhere <span class="badge">5</span></button>
      </div>
      <div class="addons-body" id="adbody"></div>
    </div>`;
  paintAddon();
  // indexAt is only demonstrable if a real pointer asks it — that is the whole point of
  // the layout answering in two directions.
  const cb = document.getElementById("cbox");
  if(cb){
    const L = LAYOUTS[argState["container.layout"]];
    cb.onpointermove = e=>{
      const r = cb.getBoundingClientRect();
      const i = L.indexAt({x:e.clientX-r.left, y:e.clientY-r.top}, kids, {w:r.width,h:r.height});
      if(i !== hoverIx){ hoverIx = i; renderCanvas(); }
    };
    cb.onpointerleave = ()=>{ if(hoverIx!==null){ hoverIx=null; renderCanvas(); } };
  }
  document.querySelectorAll(".ad-tab").forEach(t=>t.onclick=()=>{curAd=+t.dataset.ad;renderCanvas();});
  const h = document.getElementById("sheetHandle");
  if(h) h.onclick=()=>{ sheetOpen=false; syncSheet(); };
}

function paintAddon(){
  const b = document.getElementById("adbody"); if(!b) return;
  if(curAd===0){
    // PLANE 1 — Spec. Every row here is a FIELD. Nothing else may live in this tab.
    const rowFor = a=>{
      const on = has(a[0]), req = reqOf(a[0]);
      const note = starved(a[0])
        ? `<span class="lockchip" style="border-color:var(--bad);color:var(--bad)">needs ${reqLabel(a[0])}</span>` : "";
      const main = `<tr>
        <td class="nm">${a[1]}${req.length?`<span class="derived" style="display:block">└ requires ${reqLabel(a[0])}</span>`:""}</td>
        <td class="ds">${a[3]} ${note}</td>
        <td><button class="tog ${on?'on':''}" data-k="${a[0]}"></button></td></tr>`;
      const args = ATOM_ARGS[a[0]];
      if(!on || !args || !args.length) return main;
      const subs = args.map((ar,i)=>{
        const last = i===args.length-1 ? "last" : "";
        const nm = `<td class="snm">${ar[1]}${ar[2]?'<span class="req" title="required">*</span>':''}</td>`;
        // a row with no options is a POINTER at the real owner, not a control
        if(!ar[3]) return `<tr class="sub ${last}">${nm}<td class="shelp">${ar[4]}</td>
          <td><span class="lockchip">elsewhere</span></td></tr>`;
        const key = a[0]+"."+ar[0];
        const opts = ar[3].map(o=>`<option ${o===argState[key]?'selected':''}>${o}</option>`).join('');
        return `<tr class="sub ${last}">${nm}<td class="shelp">${ar[4]}</td>
          <td><select class="mini aarg" data-key="${key}">${opts}</select></td></tr>`;
      }).join('');
      return main+subs;
    };
    // In the Node scene Bounded and everything standing on it are not merely off — they are
    // not part of the scene at all. That IS the difference between the two scenes.
    const rows = ATOMS.filter(a=>inScene(a[0])).map(rowFor).join('');
    b.innerHTML = `<table class="args"><thead><tr><th>Atom (field)</th><th>What it grants</th><th>Control</th></tr></thead><tbody>
      ${rows}
    </tbody></table>
    <div class="planehd">owner node — another node's fields, shown so inheritance is visible</div>
    <table class="args"><tbody>
      <tr><td class="nm">angle</td><td class="ds">adds to the element's own angle</td>
        <td><select class="mini ownr" data-k="angle">${[0,15,45,90].map(v=>`<option ${v===owner.angle?'selected':''}>${v}</option>`).join('')}</select></td></tr>
      <tr><td class="nm">z</td><td class="ds">adds to the element's own z</td>
        <td><select class="mini ownr" data-k="z">${[0,1,2].map(v=>`<option ${v===owner.z?'selected':''}>${v}</option>`).join('')}</select></td></tr>
      <tr><td class="nm">orientation</td><td class="ds">taken by the element when it does not set its own</td>
        <td><select class="mini ownr" data-k="orientation">${["world","viewer"].map(v=>`<option ${v===owner.orientation?'selected':''}>${v}</option>`).join('')}</select></td></tr>
    </tbody></table>
    <div style="padding:8px 10px;color:var(--faint);font-size:11px">
      <span class="req" style="color:var(--warn);font-weight:700">*</span> required — the atom cannot exist without it.
      &nbsp;·&nbsp; <span class="lockchip">elsewhere</span> authored on another object — the help text names which.
      &nbsp;·&nbsp; There is no <code>parent.*</code>: the owner's fields are ordinary fields of another node.</div>`;
    b.querySelectorAll(".tog").forEach(t=>t.onclick=()=>{
      const k=t.dataset.k; state[k]=!state[k];
      logAct(state[k]?"atomAdded":"atomRemoved", `{ atom: "${ATOM(k)[1]}" }`);
      logAct("composed", `{ caps: [${caps().join(", ")}] }`);
      renderCanvas();
    });
    b.querySelectorAll(".aarg").forEach(s=>s.onchange=()=>{
      argState[s.dataset.key] = s.value;
      const [atom,arg] = s.dataset.key.split(".");
      logAct("fieldChanged", `{ atom: "${ATOM(atom)[1]}", ${arg}: "${s.value}" }`);
      renderCanvas();
    });
    b.querySelectorAll(".ownr").forEach(s=>s.onchange=()=>{
      const k = s.dataset.k;
      owner[k] = k === "orientation" ? s.value : parseInt(s.value);
      logAct("ownerChanged", `{ ${k}: "${owner[k]}" } — the element inherits, it is not told`);
      renderCanvas();
    });
  } else if(curAd===4){
    // PLANE 2 — State. Not fields: you cannot author `drag`.
    b.innerHTML = `
      <div class="planehd">where the node is — only rest / lifted / held can be authored (pose)</div>
      <div class="staterow">${WHERE.map(w=>`<button class="stbtn ${w===where?'on':''} ${AUTHORABLE.has(w)?'':'happens'}" data-w="${w}">${w}${AUTHORABLE.has(w)?'':' ·'}</button>`).join('')}</div>
      <div class="planehd">flags</div>
      <div class="staterow">${FLAGS.map(f=>`<button class="stbtn ${flags[f]?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
      ${scene === "Container" ? `
      <div class="planehd">children — STATE, not spec: the config is authored, the contents are not</div>
      <div class="staterow">
        <button class="stbtn" data-kids="-1">−</button>
        <span class="stbtn on">${kids} children</span>
        <button class="stbtn" data-kids="1">+</button>
      </div>
      <div class="planehd">drag payload — a LIST (1..M), never a single card</div>
      <div class="staterow">
        <button class="stbtn" data-pay="-1">−</button>
        <span class="stbtn ${payload?'on':''}">${payload} carried</span>
        <button class="stbtn" data-pay="1">+</button>
        <span class="derived" style="align-self:center">the container lays out <b>n+m</b> and phantoms stand at <b>indexAt(finger)</b> — spreading is a layout, not a mechanic</span>
      </div>` : ""}
      <div class="planehd">idle breathing — a SEPARATE axis from pose</div>
      <div class="staterow">
        <button class="stbtn ${idleOn?'on':''}" data-idle="1">idle ${idleOn?'on':'off'}</button>
        <span class="derived" style="align-self:center">decoration only: it never feeds <b>z</b>, or the shadow would breathe in size under a thing that is not moving</span>
      </div>
      <div style="padding:4px 10px 14px;color:var(--faint);font-size:11px">
        A dashed chip HAPPENS to the node (finger, flight, layout) — it is not a field, and it is
        not in the spec. That is why State is its own plane.</div>`;
    b.querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>{
      where = x.dataset.w; logAct("stateChanged", `{ where: "${where}"${AUTHORABLE.has(where)?'':' — happens, not authored'} }`); renderCanvas(); });
    b.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>{
      const f=x.dataset.f; flags[f]=!flags[f]; logAct("flagToggled", `{ ${f}: ${flags[f]} }`); renderCanvas(); });
    b.querySelector("[data-idle]").onclick=()=>{ idleOn=!idleOn; logAct("idleToggled", `{ idle: ${idleOn} } — not z`); renderCanvas(); };
    b.querySelectorAll("[data-kids]").forEach(x=>x.onclick=()=>{
      kids = Math.max(0, Math.min(16, kids + (+x.dataset.kids)));
      logAct("childrenChanged", `{ n: ${kids} } — state, never spec`); renderCanvas(); });
    b.querySelectorAll("[data-pay]").forEach(x=>x.onclick=()=>{
      payload = Math.max(0, Math.min(6, payload + (+x.dataset.pay)));
      logAct("payloadChanged", `{ els: ${payload} } — a list, so n+m needs no special case`); renderCanvas(); });
  } else if(curAd===6){
    // The node tree with parameters. On Node and Root nothing is drawn at all, so this
    // panel is not a convenience — it is the only way those scenes are scenes.
    const rows = inspect().map((n,i)=>{
      const lines = [];
      if(n.atoms.length) lines.push(`<div class="il"><span class="ik">atoms</span><span class="iv">${n.atoms.join(" · ")}</span></div>`);
      else lines.push(`<div class="il"><span class="ik">atoms</span><span class="iv" style="color:var(--faint)">none — an id and a place, and that is valid</span></div>`);
      n.own.forEach(([k,v,c])=>lines.push(`<div class="il"><span class="ik">${k}</span><span class="iv">${v}</span><span class="ic">${c}</span></div>`));
      n.derived.forEach(([k,v,how,c])=>lines.push(`<div class="il"><span class="ik">${k}</span><span class="iv">${v}</span><span class="ic">${how}${c?" · "+c:""}</span></div>`));
      if(n.starved.length) lines.push(`<div class="il"><span class="ik" style="color:var(--bad)">absent</span><span class="iv" style="color:var(--bad)">${n.starved.join(" · ")}</span></div>`);
      if(n.state && Object.keys(n.state).length){
        const st = [n.state.where, n.state.idle?"idle":null, ...(n.state.flags||[])].filter(Boolean).join(" · ");
        if(st) lines.push(`<div class="il"><span class="ik">state</span><span class="iv">${st}</span><span class="ic">happens · not authored</span></div>`);
      }
      return `<div class="inode ${n.isRoot?'isroot':''}" style="margin-left:${i?18:0}px">
        <div class="ihd">${n.isRoot?"▣":"▪"} ${n.id}${n.children?` <span class="ic">· ${n.children} child${n.children>1?"ren":""}</span>`:""}
          ${n.isRoot?'<span class="lockchip">root · nobody places it</span>':''}</div>
        ${lines.join("")}</div>`;
    }).join("");
    b.innerHTML = `<div class="inspector">${rows}</div>
      <div style="padding:10px;color:var(--faint);font-size:11px">
        One door: <code>inspect(root, ctx)</code> — a pure function over the same data the renderer uses.
        The panel never walks the tree itself, so it cannot drift; a guard asserts it shows nothing the
        model does not have.</div>`;
  } else if(curAd===5){
    // Makes the inheritance law visible instead of documented.
    const r = resolve();
