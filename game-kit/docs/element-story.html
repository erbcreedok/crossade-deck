// Each scene documents ITS OWN law. One shared body would say "an Element has only an id",
// which is the definition of a Node — exactly the confusion these scenes exist to end.
const DOC_HEAD = {
  Node: `
    <div class="pathchip">Elements / Core / Node</div>
    <h1>Node — an id, a place in the tree, and nothing else</h1>
    <p class="lede">A <code>Node</code> is the base of everything: an opaque <code>id</code> and a position
      among other nodes. It is not abstract and not a stub — a bare node is a valid node. Everything else
      is an atom: a composable interface with its own fields, methods and events.</p>

    <h2>What it is</h2>
    <p>In client2 a thing on the table was a closed union <code>card | piece | chip | widget</code>: a new
      kind meant editing the union and chasing <code>switch</code> statements across eight files. Here there
      is no kind and no base class. Behaviour reads <code>caps(node, ctx)</code>, never a "sort".</p>
    <pre class="code"><span class="c">// the whole base — this is not a simplification, it is the definition:</span>
interface Node { id: string }

<span class="c">// atoms that need no box live directly on a node:</span>
const marker = compose(
  <span class="k">Transformable</span>(),   <span class="c">// at · z  (angle lives in Tiltable, which requires this)</span>
  <span class="k">Valued</span>({ team: "blue" }),
  <span class="k">Private</span>(),        <span class="c">// excluded from another viewer's picture entirely</span>
)
<span class="c">// systems ask for a CAPABILITY, never a type:</span>
if (<span class="k">caps</span>(node).has(Tiltable)) node.rotateTo(15)  <span class="c">// no atom → no method, not "disabled"</span></pre>

    <div class="callout"><b>Not everything is a node.</b> A slot is an ADDRESS, a spreading gap is a layout
      phantom, a shadow is a layer, a camera is a way of looking — none of them has an <code>id</code>.
      A <b>transaction</b> is not a node either, and not a descendant of one: asking it for its
      <code>z</code> or its shadow is meaningless. It stands ABOVE nodes and uses them.</div>`,

  Root: `
    <div class="pathchip">Start / Basics / Root</div>
    <h1>Root — the storage is just a node</h1>
    <p class="lede">There is no separate "storage" entity. Every node hangs off a root, so the root IS the
      storage — an ordinary node with <code>Container</code>. Nothing stands above the roots, so no word
      was needed for "the thing that holds them".</p>

    <h2>A root is a node that nobody places</h2>
    <p>It has no <code>Placeable</code> — and cannot have one: <code>Placeable</code> requires
      <code>Bounded</code>, and a root has no size of its own (its extent comes from its content). That is
      also why a root can never become someone's child: it would stop being a root.</p>
    <pre class="code">const root = <span class="k">node</span>()          <span class="c">// an id and a place in the tree — nothing else</span>
<span class="k">mount</span>(view, root)                <span class="c">// empty on screen, and that is correct</span>

root.add(<span class="k">node</span>(Bounded({ size: { w: 1, h: 1 } })))   <span class="c">// room taken, 0 pixels</span>
root.<span class="k">byId</span>(id)                    <span class="c">// a DERIVED index over the tree, not a second store</span></pre>

    <div class="callout"><b>There are exactly two roots, and one difference.</b> The camera transforms
      <code>CanvasRoot</code> and does not touch <code>HudRoot</code>. That is the anchor law in full —
      there is no <code>anchor</code> field, belonging to a root IS the answer. And "Canvas" is that
      camera-driven root, not some separate storage.</div>

    <div class="callout"><b>Pixels live in the HOST, not in a node.</b> A node knows units. The host owns
      the <code>view</code> (the <code>HTMLCanvasElement</code> — never called <code>canvas</code> in code),
      its size and the resize observer, and it computes the HUD etalon as a fraction of the viewport and
      puts it into the <code>ResolveContext</code>. <code>pixi.js</code> is imported in exactly one file.</div>

    <div class="callout"><b>What gets rendered is decided by the TREE, not by a list.</b> A node under the
      mounted root that has <code>Surfaced</code> is drawn; one without it exists all the same and is
      visible only to the inspector.</div>`,

  Bounded: `
    <div class="pathchip">Elements / Core / Bounded</div>
    <h1>Bounded — a place that draws nothing</h1>
    <p class="lede">Add one atom to a node and it starts occupying room. Not a pixel is painted: a box is
      a place, and painting is a different atom's business. Everything you see here is an inspector layer.</p>

    <h2>Why the box, and why a square</h2>
    <p>Without a footprint three different things are undefined at once, and each belongs to someone else:
      the <b>hit area</b> (the finger), the <b>silhouette</b> (the shadow), and the <b>slot</b> the owner's
      layout reserves. That is why so many atoms name it as their requirement.</p>
    <p>It is a square only because the default is <code>rect{ w: 1, h: 1 }</code> in table units — nothing
      about a node is square by nature. Shapes are <code>rect | circle | poly</code>; an air-hockey puck is
      a circle, and its hit area and shadow follow the circle, while the layout still reserves a bounding box.</p>
    <pre class="code">const place = compose(
  <span class="k">Bounded</span>({ size: { w: 1, h: 1 } }),   <span class="c">// units, never pixels — the etalon turns them into px</span>
)
<span class="c">// an instance may differ from what its set record stamped at birth:</span>
compose(place, <span class="k">Bounded</span>({ bounds: { w: 0.8, h: 0.8 } }))  <span class="c">// bounds overrides size</span>

<span class="c">// atoms that name it as their requirement are simply absent without it:</span>
without(node, Bounded).<span class="k">Draggable</span>   <span class="c">// undefined — never a "disabled" error</span></pre>

    <div class="callout"><b>«Element» is a word, not a definition.</b> A thing on the table is called an
      element in speech, and that is the name of the catalog root — but there is no <code>isElement()</code>
      in the code and no Element type. Systems ask for the atom they need (<code>Bounded</code> for a hit
      test, <code>Surfaced</code> for drawing); a category with no independent use is a word we retire.</div>

    <div class="callout"><b>The hit area is derived, not declared.</b> There is no <code>hit</code> field:
      it is <code>max(box, the input theme's touch minimum)</code>. Otherwise a 1×1 chip would be unhittable
      on a phone while a card of the same game was fine. Overlapping expansions are settled by the nearer
      centre.</div>`,

  Surfaced: `
    <div class="pathchip">Elements / Core / Surfaced</div>
    <h1>Surfaced — the border is not a field</h1>
    <p class="lede">The same square as one rung below, now visible. Nothing about the node changed: an atom
      was added that names a <b>registry record</b>, and the record paints. Swap the record and the border
      is gone while the box stays exactly where it was.</p>

    <h2>Why the border lives in the record</h2>
    <p>Frame, fill, radius and colour are parameters of the <code>surface</code> entry plus theme tokens —
      they never appear as fields on a node. A <code>borderRadius?: number</code> turning up in a spec is
      the sign that the registry was bypassed. That is the whole reason a surface is a registry and not
      a set of properties.</p>
    <pre class="code">compose(
  <span class="k">Bounded</span>({ size: { w: 1, h: 1 } }),
  <span class="k">Surfaced</span>({ surface: "plate", fit: "contain" }),  <span class="c">// a NAME, not a picture</span>
)
<span class="c">// registry entry — this is where the border actually lives:</span>
surfaces.plate = { stroke: theme.line, width: 1, radius: theme.radius.m }</pre>

    <div class="callout"><b>A surface needs an AREA, not a box.</b> Its requirement is
      <code>Bounded</code> <b>or</b> <code>Container</code>: an own size, or the extent of the content.
      That is why the canvas — a tabletop with a surface and no footprint of its own — is legal. Demanding
      <code>Bounded</code> here would outlaw it.</div>

    <div class="callout"><b>Two names that collide, and must not.</b> <code>Surfaced</code> draws a face.
      <code>Viewable</code> is the <b>camera</b> atom (<code>camera</code>, <code>viewpoints</code>,
      <code>focusOn</code>, <code>fitAll</code>) and exists only on a root. This scene once called the first
      one "Viewable" — which is exactly why its toggle had nothing to configure.</div>`,

  Container: `
    <div class="pathchip">Capabilities / Container / Layout</div>
    <h1>Container — a slot is an address, not an element</h1>
    <p class="lede">A chessboard is <b>one</b> node with a grid layout, not 64 entities. A cell has no
      identity — it is a coordinate. Otherwise the state would hold, and the wire would carry, 64 empty
      elements: paying for something that does not exist.</p>

    <h2>The layout answers in BOTH directions</h2>
    <p>A layout is a registry entry, and it owes two functions, not one. The inverse is not a convenience:
      only the layout knows its own geometry, and a fan answers a point differently from a row. Who casts
      the shadow lives here too — the one who placed them knows.</p>
    <pre class="code">Container {
  layout:    RegistryRef   <span class="c">// place(i,n,ctx) → pose  AND  indexAt(point,n,ctx) → i  AND  cast</span>
  hot?:      RegistryRef   <span class="c">// the answer under the finger; NO FIELD = it stays silent</span>
  grab?:     RegistryRef   <span class="c">// one | top | above; NO FIELD = nothing can be taken</span>
  intent?:   RegistryRef   <span class="c">// how a gesture is READ (a swipe over a deck = a shuffle)</span>
  occupied?: RegistryRef   <span class="c">// what becomes of whoever already sits there</span>
  keeps?:    Capability[]  <span class="c">// which of a child's capabilities work inside; no field = all</span>
  children:  ElementRef[]  <span class="c">// STATE, not spec</span>
}</pre>

    <div class="callout"><b>Spreading is not a mechanic.</b> The load is always a LIST, the container lays
      out <code>n+m</code>, and the phantoms stand at <code>indexAt(finger)</code>. Neighbours moving apart
      is a consequence of that, not a feature — and the gap stays open while a request is pending because
      the phantom is pinned to its <code>after</code>.</div>

    <div class="callout"><b>A draught follows, it is never declared.</b> There is no
      <code>interactive: "none"</code> and no <code>transparent</code>: a child without <code>grab</code>
      simply does not eat the gesture, so hit-testing walks up the tree and the owner gets it.</div>`,
};

function renderDocs(){
  stage.innerHTML = `<div class="docs">
    ${DOC_HEAD[scene]}

    <div class="callout"><b>Capability by presence.</b> No <code>Draggable</code> atom — the node is not
      pickable. Not "picking is forbidden": <b>the method is absent</b>. Negation flags
      (<code>disabled</code>, <code>interactive:"none"</code>) do not exist in the model.</div>

    <h2>Atoms — the whole set, and what each requires</h2>
    <div class="scroll"><table class="args"><thead><tr><th>Atom</th><th>Requires</th><th>What it adds</th></tr></thead>
      <tbody>${ATOMS.map(a=>`<tr><td class="nm">${a[1]}</td>
        <td class="ds">${reqLabel(a[0])||"—"}</td><td class="ds">${a[3]}</td></tr>`).join('')}</tbody>
    </table></div>

    <h2>Four classes of inheritance — and there is no fifth</h2>
    <p>A field name alone is not enough. Until a field declares its class, every call site works it out
      again — that is how <code>z</code> argued with the shadow three times and <code>angle</code> lived
      in two atoms at once. A field with no declared class fails the source-scan.</p>
    <div class="scroll"><table class="args"><thead>
      <tr><th>class</th><th>fields</th><th>override</th></tr></thead><tbody>
      <tr><td class="nm">own</td><td class="ds"><code>size</code>, <code>bounds</code>, <code>surface</code>, <code>values</code>, <code>label</code>, <code>box</code></td><td class="ds">never inherited; no value → no field</td></tr>
      <tr><td class="nm">from owner</td><td class="ds"><code>orientation</code>, <code>fit</code>, <code>skin</code></td><td class="ds">set it on the child</td></tr>
      <tr><td class="nm">adds up</td><td class="ds"><code>z</code>, <code>angle</code></td><td class="ds">cannot be cancelled, only added to — and the shadow does NOT inherit the angle</td></tr>
      <tr><td class="nm">root only</td><td class="ds"><code>light</code>, <code>camera</code>, HUD <code>unit</code></td><td class="ds">the field does not exist on a child</td></tr>
    </tbody></table></div>
    <div class="callout"><b>Nothing inherited is stored or sent.</b> It arrives through
      <code>ResolveContext { unit, chain, config }</code> and is read AT APPLY TIME. There is no
      <code>parent.*</code> in the model: an owner's fields are ordinary fields of another node.</div>

    <h2>Atom interplay & conflicts</h2>
    <p>Atoms are not independent: some require others, some override a third. Below are the meaningful pairs
      (not the full cross-product — it grows as a product and is not needed). Each row is a test case, and is
      the oracle for the state-matrix layer.</p>
    <div class="scroll"><table class="args"><thead>
      <tr><th>Pair / condition</th><th>Expected behavior</th><th>Model verdict</th></tr></thead><tbody>
      <tr><td class="nm">Draggable × ¬Bounded</td><td class="ds">no footprint → hit area undefined; the atom does not exist</td><td><span class="v bd">requirement → absent</span></td></tr>
      <tr><td class="nm">Tiltable × ¬Transformable</td><td class="ds">an angle with no place to be at</td><td><span class="v bd">requirement → absent</span></td></tr>
      <tr><td class="nm">Draggable × ¬Placeable</td><td class="ds">pickable, but no container will take it</td><td><span class="v wn">legal but pointless</span></td></tr>
      <tr><td class="nm">Flippable × ¬Surfaced</td><td class="ds">the far side has nothing to show</td><td><span class="v bd">requirement → absent</span></td></tr>
      <tr><td class="nm">Valued × ¬Surfaced</td><td class="ds">values read by rules, but not drawn</td><td><span class="v wn">legal but mute</span></td></tr>
      <tr><td class="nm">ShadowCaster × ¬Transformable</td><td class="ds">z lives there; with no z the shadow can never lift</td><td><span class="v wn">legal but flat</span></td></tr>
      <tr><td class="nm">Bounded × ¬Surfaced</td><td class="ds">a place that occupies room and draws nothing — visible only via a debug layer</td><td><span class="v ok">valid and useful</span></td></tr>
      <tr><td class="nm">Container × Acceptor</td><td class="ds">holds children AND decides who is let in — this is a ZONE</td><td><span class="v ok">standard composition</span></td></tr>
      <tr><td class="nm">Private × reverse:back</td><td class="ds">two DIFFERENT hidings: back hides the face, Private removes the node from the picture</td><td><span class="v ok">orthogonal, both needed</span></td></tr>
      <tr><td class="nm">Viewable on an element</td><td class="ds">Viewable is the camera atom — an element is never looked THROUGH</td><td><span class="v bd">category error → forbid</span></td></tr>
      <tr><td class="nm">any atom × ¬requirement</td><td class="ds">the atom is ABSENT with its fields — never "disabled"</td><td><span class="v bd">negation flags do not exist</span></td></tr>
    </tbody></table></div>

    <h2>Test plan</h2>
    <p>Organized as a testing pyramid so a failure localizes: every case carries a stable id
      (<code>scope.scenario.condition</code>) and a Given / When / Then. When something breaks later, the
      failing id names the scenario and the state.</p>
    <div class="summ">
      <div><span class="num">${TCOUNT}</span><span class="lab">cases · this story</span></div>
      <div><span class="num">${TESTS.length}</span><span class="lab">layers</span></div>
      <div><span class="num">2¹⁹</span><span class="lab">atom space, swept by closure</span></div>
      <div><span class="num">4</span><span class="lab">themes × viewports snapshotted</span></div>
    </div>
    ${TESTS.map((L,i)=>`
      <details class="layer" ${i===0?'open':''}>
        <summary><span class="kind">${L[0].split(" · ")[0]}</span>${L[0].includes(" · ")?'<span style="color:var(--muted);font-weight:600">'+L[0].split(" · ")[1]+'</span>':''}<span class="cnt">${L[2]} cases</span></summary>
        <div class="body">
          <div class="tool">tooling: ${L[1]}</div>
          <ul class="gwt">${L[3].map(t=>`<li>
            <span class="id">${t[0]}</span>
            <b class="g">Given</b> ${t[1]}. <b class="w">When</b> ${t[2]}. <b class="t">Then</b> ${t[3]}.
          </li>`).join('')}</ul>
        </div>
      </details>`).join('')}

    <div class="callout">This is the BLUEPRINT for one story's form. Each of the ~62 catalog stories gets the
      same sections: a Canvas mock · Controls / Actions / Interactions · Docs (what it is · use cases ·
      interplay · pseudo-code · a layered test plan). The test layers shown here are the template; per story
      the concrete cases change, the layers do not. Every other story is a stub right now, and that is marked
      honestly.</div>
  </div>`;
}

  document.body.appendChild(menu);
  menu.querySelectorAll("input").forEach(i=>i.onchange=()=>{
    LAYERS[i.dataset.l]=i.checked; syncGlobals(); if(curTab===0) renderCanvas();
  });
  const close = e=>{ if(!menu.contains(e.target) && e.target.id!=="layersBtn"){ menu.remove(); document.removeEventListener("pointerdown",close);} };
  setTimeout(()=>document.addEventListener("pointerdown",close),0);
};

syncGlobals();
mount();
</script>
