# Локальная проверка / прод без туннеля: `docker compose up -d --build`.
#
# Две независимые части, и они друг о друге не знают: сервер (Colyseus, :2567) и ХАБ —
# статическая страница, с которой запускаются игры (:8080). Адреса сервера в хаб не
# прошиваются вовсе: он ни с чем не разговаривает, игра грузится ленивым чанком в той же
# странице. Поэтому и build-аргументов у него нет, и образ один на все окружения.
services:
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "2567:2567"
    volumes:
      - server-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  hub:
    build:
      context: .
      dockerfile: deploy/hub.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  # Аккаунты (server/data/accounts.json) — единственное, что должно пережить
  # пересоздание контейнера. Комнаты и партии живут только в памяти процесса.
  server-data:
