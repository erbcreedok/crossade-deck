# Тесты на каждый пуш; на main — ещё и сборка образов в GHCR.
#
# Почему сборка вызывается ОТСЮДА, а не отдельным workflow: гейт «после зелёных тестов»
# выражается только внутри одного запуска (`needs:`). Два независимых workflow стартовали бы
# параллельно, и в реестр уехал бы образ, который никто не проверял. Вызов reusable-workflow
# (`uses:`) эту связь сохраняет, а файл при этом остаётся коротким.
#
# Выкатки здесь НЕТ намеренно. Раньше пуш в main уезжал прямо на прод; теперь main производит
# АРТЕФАКТ, а куда его поставить — отдельное решение: Actions → Выкатка (.github/workflows/deploy.yml)
# или `IMAGE_TAG=... scripts/deploy.sh` с ноутбука. Ценой лишнего клика прод перестаёт меняться
# сам по себе, а откат становится выкаткой прошлого тега, а не revert'ом.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Сервер — тесты и типы
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # тот же, что в Dockerfile: расхождение ловилось бы только на проде
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  client:
    name: Клиент — тесты, типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Сборка тоже проверка: она падает на том, что не ловят ни тесты, ни tsc
      # (например, импорт, который есть только в dev-режиме).
      - run: npx vite build

  client2:
    name: Клиент v2 — тесты, типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Сборка в prod-режиме — та же, что уедет в образ (base=/v2/). Ловит то, что не видят тесты/tsc.
      - run: npx vite build
      # Сторибук ломается САМ по себе — своим конфигом, своими стори, своим docgen'ом, — и
      # обычной сборкой клиента это не ловится. Без этого шага поломка всплывала бы только
      # на main, при сборке образа, то есть после мержа.
      - run: npm run build-storybook

  images:
    name: Образы в GHCR
    # client2 в гейте наравне с остальными: он едет и в web-образ (на /v2/), и в storybook.
    needs: [server, client, client2]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
