# Тесты на каждый пуш; на main — ещё и сборка образов в GHCR.
#
# Почему сборка вызывается ОТСЮДА, а не отдельным workflow: гейт «после зелёных тестов»
# выражается только внутри одного запуска (`needs:`). Два независимых workflow стартовали бы
# параллельно, и в реестр уехал бы образ, который никто не проверял. Вызов reusable-workflow
# (`uses:`) эту связь сохраняет, а файл при этом остаётся коротким.
#
# Цепочка на main: тесты → образы в GHCR → выкатка прода. Выкатка при этом вынесена в
# ОТДЕЛЬНЫЙ workflow и вызывается по неизменяемому тегу — не ради лишнего файла, а потому что
# ровно этот же workflow дёргается руками с любым другим тегом. Из чего и получается откат:
# выкатить прошлый образ, а не revert'ить и пересобирать.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Сервер — тесты и типы
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # тот же, что в Dockerfile: расхождение ловилось бы только на проде
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  client:
    name: Клиент — тесты, типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Сборка тоже проверка: она падает на том, что не ловят ни тесты, ни tsc
      # (например, импорт, который есть только в dev-режиме).
      - run: npx vite build

  client2:
    name: Клиент v2 — тесты, типы и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Сборка в prod-режиме — та же, что уедет в образ (base=/v2/). Ловит то, что не видят тесты/tsc.
      - run: npx vite build
      # Сторибук ломается САМ по себе — своим конфигом, своими стори, своим docgen'ом, — и
      # обычной сборкой клиента это не ловится. Без этого шага поломка всплывала бы только
      # на main, при сборке образа, то есть после мержа.
      - run: npm run build-storybook

  images:
    name: Образы в GHCR
    # client2 в гейте наравне с остальными: он едет и в web-образ (на /v2/), и в storybook.
    needs: [server, client, client2]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      # Для витрины сторибука на Pages — reusable-workflow не может расширить права сам.
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml

  deploy:
    name: Выкатка прода
    needs: images
    permissions:
      contents: read
      packages: read
    # По НЕИЗМЕНЯЕМОМУ тегу (sha-<коммит>), а не по «main»: подвижный указатель к моменту
    # выкатки мог бы уже показывать на следующую сборку, и уехало бы не то, что проверяли.
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.images.outputs.tag }}
      environment: prod
    secrets: inherit
